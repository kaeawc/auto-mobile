version: 2.1

# AutoMobile — CircleCI is used ONLY for macOS/iOS runners.
#
# Everything else (Node/TypeScript, Android/Gradle, Python, docs) stays on
# GitHub Actions, where it runs free and fast on Linux. CircleCI exists here for
# one reason: AutoMobile is a public repo, so GitHub-hosted macOS minutes are
# free but capped at 5 CONCURRENT macOS jobs, and the per-PR iOS matrix competes
# for that cap. Running iOS build/test on CircleCI's macOS executor adds
# parallel lanes.
#
# DYNAMIC CONFIG (setup workflow): this file is a cheap Linux "setup" pipeline.
# The path-filtering job diffs PR branches against main and continues to
# .circleci/continue_config.yml, whose workflows run only when iOS sources (or the
# Prototype Simulator's overlay-agent inputs) changed. Post-merge Swift coverage
# has a separate parameter-gated path, triggered by GitHub Actions only for
# coverage-input changes. Other pushes never spin up a macOS executor.
# This replaces the old `halt_if_no_ios_changes`, which ran AFTER a full macOS checkout and
# therefore still billed macOS minutes for every push. The heavier macOS jobs
# live in continue_config.yml.
#
# ── REQUIRED ONE-TIME PROJECT SETTING ────────────────────────────────────────
# CircleCI → Project Settings → Advanced → "Enable dynamic config using setup
# workflows" MUST be ON, or CircleCI rejects this `setup: true` config. There is
# no config-file equivalent; it is a dashboard toggle.
# ─────────────────────────────────────────────────────────────────────────────
#
# Budget: CircleCI's open-source plan includes ~30,000 macOS credits/month
# (~150 macOS minutes at ~200 credits/min); paid overflow is ~$0.12-0.24/min.
# With path filtering on PRs and an explicit post-merge trigger, only relevant
# pushes reach the macOS lanes; everything else costs a few Linux seconds.
# Concurrency is the other ceiling: the Free plan runs 1 macOS job at a time
# (pricing page; the open-source credits page says 2 per organization), versus 5
# on GitHub-hosted. docs/design-docs/ci/circleci-macos-migration.md (#10887) has
# the sourced numbers and what the full macOS move would cost.

setup: true

parameters:
  run-swift-coverage-main:
    type: boolean
    default: false

orbs:
  # Latest stable at time of writing. The filter job's base-revision/config-path/
  # mapping interface used below is unchanged across the 1.x–3.x line.
  path-filtering: circleci/path-filtering@3.0.0
  continuation: circleci/continuation@2.0.1

jobs:
  detect-ios-changes:
    docker:
      - image: cimg/base:current
    environment:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      # CircleCI's native `checkout` ignores GIT_LFS_SKIP_SMUDGE (git-lfs does not
      # honor its skip switches under checkout-index, git-lfs#4858), so it kept
      # downloading LFS objects and failed once the repository's LFS budget ran out.
      # This replaces it with a plain git clone that never invokes git-lfs.
      # Keep the command identical to `checkout_without_lfs` in continue_config.yml
      # (the policy test enforces it).
      - run:
          name: "Checkout without Git LFS"
          command: |
            set -euo pipefail
            # Neutralize the lfs filter so no git operation in this job invokes git-lfs.
            git config --global filter.lfs.process ""
            git config --global filter.lfs.smudge ""
            git config --global filter.lfs.clean ""
            git config --global filter.lfs.required false
            # Public repo: clone over HTTPS so no checkout SSH key is needed. Blobless
            # keeps it cheap; the default branch (main) comes along for path-filtering.
            git clone --filter=blob:none --no-checkout \
              "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .
            # Fetch the exact commit so fork PR heads (not on any origin branch) resolve.
            git fetch --filter=blob:none origin "${CIRCLE_SHA1}"
            git checkout --force --detach "${CIRCLE_SHA1}"
            # Fail loudly if any LFS-tracked path holds real content instead of a pointer.
            git ls-files -z ':(attr:filter=lfs)' | while IFS= read -r -d '' path; do
              if ! head -c 40 "${path}" | grep -q '^version https://git-lfs'; then
                echo "LFS content was downloaded for ${path}; checkout must stay LFS-free" >&2
                exit 1
              fi
            done
      - path-filtering/set-parameters:
          base-revision: main
          config-path: .circleci/continue_config.yml
          # Mirror GitHub's filter-ios paths (ios/**, scripts/ios/**,
          # .swiftformat, .swiftlint.yml) plus .circleci/** so config changes
          # revalidate. Keep this in sync with `filter-ios` in pull_request.yml.
          # The run-prototype-simulator lines gate the advisory "Prototype Simulator"
          # (overlay agent smoke) workflow on its own inputs: the overlay agent, its
          # smoke script and driver, and the TypeScript the driver imports.
          # run-webrtc (#10887) is the glob-for-glob regex translation of
          # pull_request.yml's filter-webrtc list (plus continue_config.yml itself);
          # XCTestRunner Simulator Tests is not mirrored (nightly/label on GitHub, #10895);
          # test/scripts/circleciMacosMigrationPolicy.test.ts fails on any drift.
          # Comments cannot go inside the mapping block itself; the orb reads
          # every line.
          mapping: |
            ios/.* run-ios true
            scripts/ios/.* run-ios true
            \.swiftformat run-ios true
            \.swiftlint\.yml run-ios true
            \.circleci/.* run-ios true
            ios/overlay-agent/.* run-prototype-simulator true
            scripts/ios/overlay-agent-.* run-prototype-simulator true
            scripts/ios/run_with_timeout\.sh run-prototype-simulator true
            src/features/overlay/overlaySpec\.ts run-prototype-simulator true
            src/features/overlay/overlayValidation\.ts run-prototype-simulator true
            src/features/overlay/ios/.* run-prototype-simulator true
            src/utils/SystemTimer\.ts run-prototype-simulator true
            test/bats/overlay-agent-smoke\.bats run-prototype-simulator true
            \.circleci/continue_config\.yml run-prototype-simulator true
            src/features/webrtc/.* run-webrtc true
            src/features/screen-stream/.* run-webrtc true
            src/server/webrtcStreamManager\.ts run-webrtc true
            src/daemon/webrtc[^/]* run-webrtc true
            src/daemon/videoStreamSocket[^/]* run-webrtc true
            src/daemon/videoStreamFraming\.ts run-webrtc true
            src/daemon/daemonFiles\.ts run-webrtc true
            src/daemon/socketServer/.* run-webrtc true
            examples/mediamtx/.* run-webrtc true
            test/integration/mediamtxWebRtcPublisher\.integration\.test\.ts run-webrtc true
            test/integration/webrtcDeviceCapture\.integration\.test\.ts run-webrtc true
            test/helpers/captureStageTimeline\.ts run-webrtc true
            test/helpers/whepSubscriptionRecovery\.ts run-webrtc true
            test/helpers/webrtcDeviceCaptureHelpers\.ts run-webrtc true
            test/bats/mediamtx-webrtc-integration\.bats run-webrtc true
            scripts/webrtc/.* run-webrtc true
            android/video-server/.* run-webrtc true
            ios/screen-capture/.* run-webrtc true
            \.github/workflows/pull_request\.yml run-webrtc true
            \.github/workflows/merge\.yml run-webrtc true
            \.circleci/continue_config\.yml run-webrtc true
      - path-filtering/generate-config
      - continuation/continue:
          configuration_path: /tmp/generated-config.yml
          parameters: /tmp/pipeline-parameters.json

  continue-swift-coverage-main:
    docker:
      - image: cimg/base:current
    environment:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      # Keep this checkout identical to `checkout_without_lfs` in continue_config.yml.
      - run:
          name: "Checkout without Git LFS"
          command: |
            set -euo pipefail
            # Neutralize the lfs filter so no git operation in this job invokes git-lfs.
            git config --global filter.lfs.process ""
            git config --global filter.lfs.smudge ""
            git config --global filter.lfs.clean ""
            git config --global filter.lfs.required false
            # Public repo: clone over HTTPS so no checkout SSH key is needed. Blobless
            # keeps it cheap; the default branch (main) comes along for path-filtering.
            git clone --filter=blob:none --no-checkout \
              "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .
            # Fetch the exact commit so fork PR heads (not on any origin branch) resolve.
            git fetch --filter=blob:none origin "${CIRCLE_SHA1}"
            git checkout --force --detach "${CIRCLE_SHA1}"
            # Fail loudly if any LFS-tracked path holds real content instead of a pointer.
            git ls-files -z ':(attr:filter=lfs)' | while IFS= read -r -d '' path; do
              if ! head -c 40 "${path}" | grep -q '^version https://git-lfs'; then
                echo "LFS content was downloaded for ${path}; checkout must stay LFS-free" >&2
                exit 1
              fi
            done
      - run:
          name: "Select post-merge Swift coverage"
          command: echo '{"run-swift-coverage-main":true}' > /tmp/swift-coverage-parameters.json
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: /tmp/swift-coverage-parameters.json

workflows:
  detect-ios-changes:
    jobs:
      # Runs on a small Linux executor. Computes the changed-file set vs main
      # (merge-base) and sets the `run-ios` pipeline parameter, then continues to
      # continue_config.yml.
      #
      # `branches: ignore: main` excludes post-merge main builds entirely. On the
      # base branch the orb's merge-base equals HEAD, and path-filtering's
      # `same-base-run` default (true) then falls back to diffing HEAD~1..HEAD —
      # which would re-run every merged iOS change on macOS after the PR already
      # validated it. Skipping main restores the old "halt on base branch" and
      # protects the limited macOS budget.
      #
      - detect-ios-changes:
          filters:
            branches:
              ignore: main

  swift-coverage-main:
    when: << pipeline.parameters.run-swift-coverage-main >>
    jobs:
      - continue-swift-coverage-main:
          filters:
            branches:
              only: main
