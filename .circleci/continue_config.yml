version: 2.1

# Continuation config for the CircleCI macOS/iOS lanes. Reached from
# .circleci/config.yml (the setup pipeline) when path filtering set `run-ios` or
# `run-prototype-simulator`, or the post-merge coverage trigger set
# `run-swift-coverage-main`. See its header
# for the why, the budget, and the REQUIRED dynamic-config project setting.
#
# Scope: ios-swift-packages and ios-xcode-build mirror the same-named jobs in
# .github/workflows/pull_request.yml — the ones feeding the required "iOS Build"
# gate. ios-playground-tests mirrors the design-system Playground tests that used
# to run on GitHub Actions; they were moved here to free a concurrent macOS slot
# on GitHub (throughput) and stay advisory (simulator tests must not gate merges,
# per repo policy), so this job's CircleCI check is NOT a required status check.
# All jobs call the SAME repo scripts, so build logic stays single-sourced.
#
# prototype-simulator (the "Prototype Simulator" check) is the overlay agent's
# per-runtime simulator smoke test, moved here from GitHub Actions. It is advisory
# like ios-playground-tests: keep it OFF the branch-protection required list.
#
# Signing: the scripts only sign when IOS_SIGNING_ENABLED / MACOS_SIGNING_ENABLED
# are "true" (derived from cert-secret presence). No secrets are configured on
# CircleCI, so these build unsigned — correct for a simulator build+test lane.
# The `ios` executor pins both flags to "false" so a project-level environment
# variable added later can never turn signing on in a pull-request lane. Signing
# belongs only in a restricted context attached to main/tag-filtered workflows
# (#10887, docs/design-docs/ci/circleci-macos-migration.md); no workflow in this
# file references a context.
#
# #10887 migration mirrors (job `name:`s match the GitHub job names so the status
# reads `ci/circleci: <GitHub name>`): "Build Root SPM Package" and "iOS Device
# Capture to WHEP". They run ALONGSIDE the GitHub jobs until the owner flips the
# gates; see the migration doc. XCTestRunner Simulator Tests is deliberately NOT
# mirrored: GitHub runs it nightly and on PRs only with the `run-ios-sim` label
# (#10895), so a PR-triggered CircleCI run would re-add the cost that was cut.

parameters:
  run-ios:
    type: boolean
    default: false
  # Set by path filtering in config.yml from the same paths as pull_request.yml's
  # filter-webrtc (iOS Device Capture to WHEP). The GitHub label/title/body opt-ins
  # are invisible to CircleCI path filtering.
  run-webrtc:
    type: boolean
    default: false
  run-swift-coverage-main:
    type: boolean
    default: false
  # Set by path filtering in config.yml when the overlay agent's smoke inputs change.
  run-prototype-simulator:
    type: boolean
    default: false

executors:
  ios:
    macos:
      # Match the Xcode pinned by pull_request.yml. Verify the exact image is
      # offered at https://circleci.com/developer/machine/image/xcode and adjust.
      xcode: "26.5"
    # m4pro.medium is the ONLY macOS class available on the Free plan (all
    # Free-plan macOS jobs run on it since 2025-11-10) and it is ~200 credits/min.
    # Apple-silicon classes take NO `macos.` prefix (that prefix is only on the
    # legacy m1/Intel classes, e.g. macos.m1.medium.gen1). Do NOT use m1/m2 — they
    # reached end-of-life 2026-02-16 and are rejected as invalid resource classes.
    resource_class: m4pro.medium
    environment:
      GIT_LFS_SKIP_SMUDGE: "1"
      IOS_SIGNING_ENABLED: "false"
      MACOS_SIGNING_ENABLED: "false"

commands:
  # CircleCI's native `checkout` ignores GIT_LFS_SKIP_SMUDGE (git-lfs does not
  # honor its skip switches under checkout-index, git-lfs#4858), so it kept
  # downloading LFS objects and failed once the repository's LFS budget ran out.
  # This replaces it with a plain git clone that never invokes git-lfs.
  # Keep the command identical to detect-ios-changes in config.yml (the policy
  # test enforces it); the setup job cannot share this file's commands.
  checkout_without_lfs:
    steps:
      - run:
          name: "Checkout without Git LFS"
          command: |
            set -euo pipefail
            # Neutralize the lfs filter so no git operation in this job invokes git-lfs.
            git config --global filter.lfs.process ""
            git config --global filter.lfs.smudge ""
            git config --global filter.lfs.clean ""
            git config --global filter.lfs.required false
            # Public repo: clone over HTTPS so no checkout SSH key is needed. Blobless
            # keeps it cheap; the default branch (main) comes along for path-filtering.
            git clone --filter=blob:none --no-checkout \
              "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .
            # Fetch the exact commit so fork PR heads (not on any origin branch) resolve.
            git fetch --filter=blob:none origin "${CIRCLE_SHA1}"
            git checkout --force --detach "${CIRCLE_SHA1}"
            # Fail loudly if any LFS-tracked path holds real content instead of a pointer.
            git ls-files -z ':(attr:filter=lfs)' | while IFS= read -r -d '' path; do
              if ! head -c 40 "${path}" | grep -q '^version https://git-lfs'; then
                echo "LFS content was downloaded for ${path}; checkout must stay LFS-free" >&2
                exit 1
              fi
            done

  restore_spm_cache:
    steps:
      - run:
          name: "Compute SwiftPM cache key"
          command: cat ios/*/Package.swift > /tmp/spm-lock.txt
      - restore_cache:
          keys:
            - spm-v1-{{ checksum "/tmp/spm-lock.txt" }}
            - spm-v1-

  install_bun:
    steps:
      - run:
          name: "Install Bun"
          # Pin to package.json's packageManager so CircleCI runs the same Bun as GitHub.
          command: |
            bun_version="$(jq -r '.packageManager | sub("^bun@"; "")' package.json)"
            curl -fsSL https://bun.sh/install | bash -s "bun-v${bun_version}"
            echo 'export PATH="${HOME}/.bun/bin:${PATH}"' >> "${BASH_ENV}"

  # Mirror of .github/actions/setup-auto-mobile-npm-package: Bun, ripgrep,
  # dependencies, a turbo build, and the global `auto-mobile` install.
  setup_auto_mobile_npm_package:
    steps:
      - install_bun
      - run:
          name: "Install ripgrep"
          command: |
            if ! command -v rg >/dev/null 2>&1; then
              bash .github/actions/setup-ripgrep/install-ripgrep.sh --install-dir "${HOME}/.local/bin"
              echo 'export PATH="${HOME}/.local/bin:${PATH}"' >> "${BASH_ENV}"
            fi
      - run:
          name: "Install dependencies"
          command: bash scripts/ci/install-bun-deps.sh
      - run:
          name: "Build AutoMobile"
          environment:
            TURBO_TELEMETRY_DISABLED: "1"
            TURBO_NO_UPDATE_NOTIFIER: "1"
            DO_NOT_TRACK: "1"
            NO_COLOR: "1"
          command: bunx turbo run build --output-logs=errors-only
      - run:
          name: "Globally Install AutoMobile"
          command: bun add -g .

jobs:
  ios-swift-packages:
    executor: ios
    steps:
      - checkout_without_lfs
      - restore_spm_cache
      - run:
          name: "Report toolchain"
          command: xcodebuild -version && swift --version
      - run:
          name: "Resolve Swift package dependencies"
          command: |
            for package in ios/screen-capture ios/network-filter ios/highlight-core ios/auto-mobile-sdk ios/control-proxy ios/XCTestRunner; do
              (cd "${package}" && swift package resolve)
            done
      # Part of the required "iOS Build" roll-up on GitHub, so the CircleCI mirror
      # must enforce it too before it can feed that gate (#10887).
      - run:
          name: "Check iOS SDK public API baseline"
          command: |
            if ! bash scripts/ios/api-dump.sh --check; then
              echo "Update the iOS SDK API baseline: scripts/ios/api-dump.sh > ios/auto-mobile-sdk/api/auto-mobile-sdk.api" >&2
              exit 1
            fi
      - run:
          name: "Build Swift packages"
          command: ./scripts/ios/swift-build.sh
      - run:
          name: "Test Swift packages"
          command: ./scripts/ios/swift-test.sh
      - save_cache:
          key: spm-v1-{{ checksum "/tmp/spm-lock.txt" }}
          paths:
            - ~/Library/Caches/org.swift.swiftpm
            - ios/auto-mobile-sdk/.build
            - ios/control-proxy/.build
            - ios/screen-capture/.build
            - ios/XCTestRunner/.build

  ios-xcode-build:
    executor: ios
    steps:
      - checkout_without_lfs
      - run:
          name: "Install XcodeGen"
          # CircleCI's macOS image has a non-writable /usr/local/share, which the
          # script's default prefix can't create. The script honors an override,
          # so install into $HOME/.local and persist that on PATH (via CircleCI's
          # $BASH_ENV) for the drift-check and build steps that follow.
          command: |
            export XCODEGEN_PREFIX="${HOME}/.local"
            ./scripts/ios/install-xcodegen.sh
            echo 'export PATH="${HOME}/.local/bin:${PATH}"' >> "${BASH_ENV}"
      - run:
          name: "Check XcodeGen project drift"
          command: ./scripts/ios/xcodegen-drift-check.sh --all
      - run:
          name: "Ensure iOS Simulator runtime"
          command: ./scripts/ios/ensure-simulator-runtime.sh
      - run:
          name: "Build Xcode projects (iOS Simulator)"
          command: ./scripts/ios/xcode-build.sh

  # Design-system Playground tests (colour/contrast/typography/shape, #5102),
  # moved off GitHub Actions to free a concurrent macOS slot there. Simulator
  # tests are advisory (must not gate merges), so this job's status check must
  # stay OFF the branch-protection required list.
  ios-playground-tests:
    executor: ios
    steps:
      - checkout_without_lfs
      - restore_spm_cache
      - run:
          name: "Ensure iOS Simulator runtime"
          command: ./scripts/ios/ensure-simulator-runtime.sh
      - run:
          name: "Run Playground tests"
          command: ./scripts/ios/xcode-test.sh Playground

  swift-code-coverage:
    executor: ios
    steps:
      - checkout_without_lfs
      - restore_spm_cache
      - run:
          name: "Resolve Swift coverage dependencies"
          command: cd ios/control-proxy && swift package resolve
      - run:
          name: "Generate Swift Coverage Badge"
          command: bash scripts/coverage/generate-swift-coverage.sh
      - store_artifacts:
          path: coverage/swift-coverage-badge.json

  # "Prototype Simulator": per-runtime smoke test for the iOS overlay agent (#10569).
  # Injection depends on simulator dyld behaviour and each runtime's Swift runtime, so
  # a new Xcode or runtime can break it silently. Each matrix leg boots ONE fresh
  # simulator, used serially and deleted afterwards. Advisory: simulator tests must not
  # gate merges, so this check stays OFF the required list.
  # Run locally on a Mac: bash scripts/ios/overlay-agent-smoke.sh 26
  prototype-simulator:
    parameters:
      ios:
        type: string
        description: "iOS runtime version passed to overlay-agent-smoke.sh (26 matches 26.x)."
    executor: ios
    steps:
      - checkout_without_lfs
      - run:
          name: "Report toolchain"
          command: xcodebuild -version && xcrun simctl list runtimes iOS
      - install_bun
      - run:
          name: "Install dependencies"
          command: bash scripts/ci/install-bun-deps.sh
      - run:
          name: "Ensure iOS Simulator runtime"
          command: ./scripts/ios/ensure-simulator-runtime.sh
      - run:
          name: "Run overlay agent smoke test (iOS << parameters.ios >>)"
          # Exit 3 (runtime missing) fails the leg: the image is expected to ship the
          # runtime, so a vanished runtime is an image change worth seeing.
          command: bash scripts/ios/overlay-agent-smoke.sh "<< parameters.ios >>"
          no_output_timeout: 20m
      - store_artifacts:
          path: scratch/overlay-agent-smoke
          destination: overlay-agent-smoke-ios-<< parameters.ios >>

  # Mirror of pull_request.yml → "Build Root SPM Package" (GitHub: 20 min cap).
  # The root manifest declares swift-tools-version 6.3, so it needs Xcode 26.5.
  ios-spm-root-package-build:
    executor: ios
    steps:
      - checkout_without_lfs
      - restore_spm_cache
      - run:
          name: "Resolve root Swift package dependencies"
          command: swift package resolve
          no_output_timeout: 10m
      - run:
          name: "Build root Package.swift"
          command: |
            SECONDS=0
            swift build -c release 2>&1
            echo "build took ${SECONDS}s"
          no_output_timeout: 15m

  # Mirror of pull_request.yml → "iOS Device Capture to WHEP" (GitHub: 35 min cap).
  # The capture loop, retry and reap logic stay identical to GitHub's step.
  ios-device-webrtc:
    executor: ios
    steps:
      - checkout_without_lfs
      - setup_auto_mobile_npm_package
      - run:
          name: "Ensure iOS Simulator runtime"
          command: ./scripts/ios/ensure-simulator-runtime.sh
      - run:
          name: "Build iOS capture prerequisites"
          no_output_timeout: 20m
          command: |
            brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
            test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" || brew install --cask google-chrome
            (cd ios/screen-capture && swift package resolve)
            SECONDS=0
            (cd ios/screen-capture && swift build)
            echo "build took ${SECONDS}s"
      - run:
          name: "Boot and activate iOS Simulator"
          no_output_timeout: 12m
          command: |
            result="$(bun run src/index.ts --boot-device --platform ios --create-if-missing --timeout-ms 600000)"
            simulator_udid="$(printf '%s' "${result}" | jq -r '.deviceId')"
            if [[ -z "${simulator_udid}" || "${simulator_udid}" == "null" ]]; then
              echo "AutoMobile product boot returned no deviceId." >&2
              exit 1
            fi
            echo "export AUTOMOBILE_IOS_SIMULATOR_UDID=\"${simulator_udid}\"" >> "${BASH_ENV}"
            if pgrep -x Simulator >/dev/null; then
              killall Simulator
              for _ in {1..30}; do
                pgrep -x Simulator >/dev/null || break
                sleep 1
              done
              if pgrep -x Simulator >/dev/null; then
                echo "Simulator.app did not exit before activation." >&2
                exit 1
              fi
            fi
            open -a Simulator --args -CurrentDeviceUDID "${simulator_udid}"
            helper_path="${PWD}/ios/screen-capture/.build/debug/screen-capture-helper"
            simulator_name="$(xcrun simctl list devices --json | jq -r --arg udid "${simulator_udid}" \
              '[.devices[][] | select(.udid == $udid) | .name] | first // empty')"
            if [[ -z "${simulator_name}" ]]; then
              echo "Could not resolve the selected Simulator name." >&2
              exit 1
            fi
            simulator_window_ready=0
            for _ in {1..30}; do
              simulator_windows="$("${helper_path}" --list-simulators 2>/dev/null || true)"
              if printf '%s' "${simulator_windows}" | jq -e --arg name "${simulator_name}" \
                '.windows | map(select((.title // "") | ascii_downcase | contains($name | ascii_downcase))) | length == 1' \
                >/dev/null; then
                simulator_window_ready=1
                break
              fi
              sleep 1
            done
            if [[ "${simulator_window_ready}" != "1" ]]; then
              echo "Selected Simulator window did not become discoverable by ScreenCaptureKit." >&2
              exit 1
            fi
      - run:
          name: "Run iOS device capture integration"
          no_output_timeout: 20m
          environment:
            AUTOMOBILE_WEBRTC_DEVICE_INTEGRATION: "1"
            AUTOMOBILE_WEBRTC_DEVICE_PLATFORM: ios
            AUTOMOBILE_IOS_SIMULATOR_WINDOW_TIMEOUT_MS: "15000"
          command: |
            set -uo pipefail
            export AUTOMOBILE_IOS_SCREEN_CAPTURE_HELPER="${PWD}/ios/screen-capture/.build/debug/screen-capture-helper"
            source ./scripts/ios/run_with_timeout.sh

            reap_before_retry() {
              pkill -f "index.js --daemon-mode" 2>/dev/null || true
              pkill -x mediamtx 2>/dev/null || true
              pkill -f "remote-debugging-port=9222" 2>/dev/null || true
              sleep 2
              pkill -KILL -x mediamtx 2>/dev/null || true
              pkill -KILL -f "index.js --daemon-mode" 2>/dev/null || true
              if [ -n "${AUTOMOBILE_IOS_SIMULATOR_UDID:-}" ]; then
                if ! run_with_timeout 10 xcrun simctl bootstatus "${AUTOMOBILE_IOS_SIMULATOR_UDID}" -b >/dev/null 2>&1; then
                  echo "Simulator did not report booted within 10s after cleanup; skipping reboot (best-effort re-verify only, #7605)." >&2
                fi
              fi
              for _ in $(seq 1 15); do
                lsof -nP -iTCP:8889 -sTCP:LISTEN >/dev/null 2>&1 || return 0
                sleep 1
              done
              echo "Port 8889 still bound after cleanup; skipping retry to avoid a guaranteed conflict." >&2
              return 1
            }

            attempts=2
            for attempt in $(seq 1 "${attempts}"); do
              echo "iOS device capture integration (attempt ${attempt}/${attempts})"
              bun run test:integration:webrtc-device && rc=0 || rc=$?
              if [ "${rc}" -eq 0 ]; then
                if [ "${attempt}" -gt 1 ]; then
                  echo "iOS device capture passed on retry (transient ScreenCaptureKit flake)."
                fi
                exit 0
              fi
              echo "iOS device capture attempt ${attempt} failed (exit ${rc})."
              if [ "${attempt}" -lt "${attempts}" ]; then
                echo "Reaping MediaMTX / daemon / Chrome before one retry."
                reap_before_retry || exit 1
              fi
            done
            echo "iOS device capture failed after ${attempts} attempts."
            exit 1
      - run:
          name: "Explain WebRTC device results"
          when: always
          command: bash scripts/webrtc/explain-device-results.sh ios || true
      - run:
          name: "Collect screen-capture-helper crash reports"
          when: always
          command: bash scripts/webrtc/collect-helper-crash-reports.sh scratch/webrtc-device-integration || true
      - store_artifacts:
          path: scratch/webrtc-device-integration
          destination: ios-webrtc-device-artifacts

workflows:
  ios-macos:
    # Gate the whole workflow on the parameter path-filtering set. When false
    # (no iOS changes) the workflow has no jobs and no macOS executor is used.
    when: << pipeline.parameters.run-ios >>
    jobs:
      - ios-swift-packages
      - ios-xcode-build
      - ios-playground-tests
      - ios-spm-root-package-build:
          name: "Build Root SPM Package"

  # #10887 mirror gated on its own GitHub path filter. No contexts: this runs
  # on fork PRs, which must never see secrets.
  ios-webrtc-macos:
    when: << pipeline.parameters.run-webrtc >>
    jobs:
      - ios-device-webrtc:
          name: "iOS Device Capture to WHEP"

  swift-coverage-main:
    when: << pipeline.parameters.run-swift-coverage-main >>
    jobs:
      - swift-code-coverage

  prototype-simulator:
    when: << pipeline.parameters.run-prototype-simulator >>
    jobs:
      - prototype-simulator:
          name: "Prototype Simulator iOS << matrix.ios >>"
          matrix:
            parameters:
              # One leg per iOS runtime. Add a version here (e.g. "27") once the
              # `ios` executor's Xcode image ships that runtime.
              ios: ["26"]
