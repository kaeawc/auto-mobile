#file: noinspection YAMLSchemaValidation
name: "android-emulator"
description: "Run Android Emulator with AVD snapshot caching for optimized CI performance"
inputs:
  shell:
    description: "The shell to use for any steps that use shells"
    default: "bash"
    required: "true"
  script:
    description: "Script to execute once Android Emulator is ready"
    example: "./gradlew tests"
    required: "true"
  api_level:
    description: "Android API level"
    example: "35"
    default: "35"
    required: "true"
  arch:
    description: "CPU architecture"
    default: "x86_64"
    required: "true"
  avd-name:
    description: "AVD name created by the snapshot-preparation action"
    default: "test"
    required: "true"
  profile:
    description: "Hardware profile ID passed to avdmanager"
    default: ""
    required: "false"
  windowed:
    description: "Run the emulator with a display server for resize-display support"
    default: "false"
    required: "false"
  target:
    description: "System image target"
    default: "google_apis"
    required: "true"
  working-directory:
    description: "Working directory"
    default: "./"
    required: "true"
  accessibility-apk-path:
    description: "Optional path to CtrlProxy APK to install before running the script"
    default: ""
    required: "false"
  gradle-home-directory:
    description: "The directory to use for Gradle User Home"
    default: ""
    required: "false"
  release-keystore-base64:
    description: "Base64 encoded release keystore for signing"
    required: false
    default: ""
  release-keystore-password:
    description: "Password for the release keystore"
    required: false
    default: ""
  release-key-alias:
    description: "Key alias in the release keystore"
    required: false
    default: ""
  release-key-password:
    description: "Password for the key in the release keystore"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: "zulu"
        java-version: "21"

    - name: Set Gradle User Home
      shell: ${{ inputs.shell }}
      run: |
        gradle_home="${{ inputs.gradle-home-directory }}"
        if [ -z "$gradle_home" ]; then
          gradle_home="$HOME/.gradle"
        fi
        gradle_home="${gradle_home/#\~/$HOME}"
        echo "GRADLE_USER_HOME=$gradle_home" >> $GITHUB_ENV
        echo "Using GRADLE_USER_HOME=$gradle_home"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Verify Java version
      shell: ${{ inputs.shell }}
      run: |
        java -version
        java -XshowSettings:properties -version 2>&1 | awk -F= '/java.specification.version/ {gsub(/ /,"",$2); if ($2+0 < 21) {print "Java 21+ is required"; exit 1}}'

    # GitHub-hosted Ubuntu images ship an Android SDK; Namespace runner images
    # do not, so install one only when no SDK root resolves.
    - name: Detect Android SDK
      id: android-sdk
      shell: ${{ inputs.shell }}
      run: |
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -n "$sdk_root" ] && [ -d "$sdk_root" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Android SDK
      if: steps.android-sdk.outputs.present != 'true'
      uses: android-actions/setup-android@v3

    - name: Record Android SDK root
      shell: ${{ inputs.shell }}
      run: |
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        echo "Using Android SDK at $sdk_root"
        echo "ANDROID_EMULATOR_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

    - name: Enable KVM group perms
      shell: ${{ inputs.shell }}
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Free disk space for emulator
      shell: ${{ inputs.shell }}
      run: |
        echo "Disk space before cleanup:"
        df -h

        # Remove large pre-installed tools that aren't needed
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost

        echo ""
        echo "Disk space after cleanup:"
        df -h

    - name: AVD cache
      uses: actions/cache@v5
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
          ${{ env.ANDROID_EMULATOR_SDK_ROOT }}/system-images/*
        key: avd-${{ runner.os }}-${{ inputs.avd-name }}-${{ inputs.profile != '' && format('{0}-', inputs.profile) || '' }}${{ inputs.api_level }}-${{ inputs.arch }}-${{ inputs.target }}
        restore-keys: |
          avd-${{ runner.os }}-${{ inputs.avd-name }}-${{ inputs.profile != '' && format('{0}-', inputs.profile) || '' }}${{ inputs.api_level }}-${{ inputs.arch }}-
          avd-${{ runner.os }}-${{ inputs.avd-name }}-${{ inputs.profile != '' && format('{0}-', inputs.profile) || '' }}${{ inputs.api_level }}-
          avd-${{ runner.os }}-${{ inputs.avd-name }}-${{ inputs.profile != '' && format('{0}-', inputs.profile) || '' }}

    - name: Create AVD and generate snapshot for caching
      id: avd-create
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2.35.0
      with:
        api-level: ${{ inputs.api_level }}
        arch: ${{ inputs.arch }}
        target: ${{ inputs.target }}
        avd-name: ${{ inputs.avd-name }}
        profile: ${{ inputs.profile }}
        force-avd-creation: false
        emulator-options: ${{ inputs.windowed == 'true' && '-gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none' || '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none' }}
        disable-animations: false
        script: |
          echo "=========================================="
          echo "AVD CREATION DEBUG"
          echo "=========================================="
          echo "Emulator version: $(emulator -version 2>/dev/null || echo 'unknown')"
          echo "Android SDK tools location: $ANDROID_HOME"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME not found"
          echo "AVD directory: $ANDROID_AVD_HOME"
          ls -la "$ANDROID_AVD_HOME" 2>/dev/null || echo "ANDROID_AVD_HOME not found"
          echo ""
          echo "Generated AVD snapshot for caching."

    - name: Surface AVD Creation Diagnostics
      if: failure() && steps.avd-create.outcome == 'failure'
      shell: ${{ inputs.shell }}
      env:
        SYSTEM_IMAGE_RELATIVE_PATH: system-images/android-${{ inputs.api_level }}/${{ inputs.target }}/${{ inputs.arch }}
      run: |
        set +e
        diagnostics_dir="${{ github.workspace }}/android-emulator-diagnostics/avd-create"
        bash "${{ github.workspace }}/scripts/android/collect-emulator-diagnostics.sh" "$diagnostics_dir" "AVD creation failed before emulator test attempts."
        timeout -k 2 10 ls -la "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/$SYSTEM_IMAGE_RELATIVE_PATH" > "$diagnostics_dir/system-image-state.txt" 2>&1
        bash "${{ github.workspace }}/scripts/android/print-emulator-diagnostics.sh" "$diagnostics_dir" "AVD creation failed; captured diagnostics follow:"
        exit 0

    - name: Setup Release Keystore
      if: ${{ inputs.release-keystore-base64 != '' }}
      shell: ${{ inputs.shell }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        mkdir -p keystore
        echo "${{ inputs.release-keystore-base64 }}" | base64 -d > keystore/release.keystore
        echo "RELEASE_KEYSTORE_PATH=keystore/release.keystore" >> $GITHUB_ENV
        echo "RELEASE_KEYSTORE_PASSWORD=${{ inputs.release-keystore-password }}" >> $GITHUB_ENV
        echo "RELEASE_KEY_ALIAS=${{ inputs.release-key-alias }}" >> $GITHUB_ENV
        echo "RELEASE_KEY_PASSWORD=${{ inputs.release-key-password }}" >> $GITHUB_ENV

    # The AVD-creation step above is the only place the third-party action runs,
    # and it is skipped on an AVD cache hit -- which is also the only thing that
    # installs the SDK `emulator` package and puts it on PATH. Every step below
    # runs outside that action, so the SDK has to be resolved explicitly here or
    # the product boot flow cannot find the emulator binary (issue #4237).
    - name: Ensure Android emulator SDK is resolvable
      shell: ${{ inputs.shell }}
      run: "${{ github.workspace }}/scripts/android/ensure-emulator-sdk.sh"

    # The third-party action above owns SDK/AVD/snapshot preparation only. The
    # product owns every actual emulator launch and readiness probe below.
    - name: Boot and test Emulator (Attempt 1)
      id: emulator-attempt-1
      continue-on-error: true
      shell: ${{ inputs.shell }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        export AUTOMOBILE_EMULATOR_ARGS='${{ inputs.windowed == 'true' && '["-no-snapshot-save","-gpu","swiftshader_indirect","-noaudio","-no-boot-anim","-camera-back","none"]' || '["-no-snapshot-save","-no-window","-gpu","swiftshader_indirect","-noaudio","-no-boot-anim","-camera-back","none"]' }}'
        export AUTOMOBILE_BOOT_PROGRESS=true
        export AUTOMOBILE_EMULATOR_DIAGNOSTICS_DIR="${{ github.workspace }}/android-emulator-diagnostics/attempt-1"
        "${{ github.workspace }}/scripts/android/boot-emulator.sh" --avd-name "${{ inputs.avd-name }}"
        "${{ github.workspace }}/scripts/android/run-emulator-tests.sh" "${{ inputs.accessibility-apk-path }}" "${{ inputs.script }}" || {
          test_status=$?
          "${{ github.workspace }}/scripts/android/collect-emulator-diagnostics.sh" \
            "${AUTOMOBILE_EMULATOR_DIAGNOSTICS_DIR}" \
            "run-emulator-tests.sh failed with exit code ${test_status}."
          exit "${test_status}"
        }

    # Runner-health timeouts are the remaining sampled flake class. Keep the
    # existing bounded retry, but make its first failure inspectable before it
    # consumes another boot budget (Android CI analysis, 2026-09-13).
    - name: Surface Emulator Diagnostics Before Retry
      if: steps.emulator-attempt-1.outcome == 'failure'
      shell: ${{ inputs.shell }}
      run: |
        bash "${{ github.workspace }}/scripts/android/print-emulator-diagnostics.sh" "${{ github.workspace }}/android-emulator-diagnostics/attempt-1" "First emulator attempt failed; captured diagnostics follow:"

    - name: Reset AutoMobile Daemon Before Retry
      if: steps.emulator-attempt-1.outcome == 'failure'
      shell: ${{ inputs.shell }}
      run: "${{ github.workspace }}/scripts/android/reset-daemon-before-retry.sh"

    - name: Boot and test Emulator (Retry)
      id: emulator-attempt-2
      if: steps.emulator-attempt-1.outcome == 'failure'
      shell: ${{ inputs.shell }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Starting emulator retry attempt 2."
        export AUTOMOBILE_EMULATOR_ARGS='${{ inputs.windowed == 'true' && '["-no-snapshot-save","-gpu","swiftshader_indirect","-noaudio","-no-boot-anim","-camera-back","none"]' || '["-no-snapshot-save","-no-window","-gpu","swiftshader_indirect","-noaudio","-no-boot-anim","-camera-back","none"]' }}'
        export AUTOMOBILE_BOOT_PROGRESS=true
        export AUTOMOBILE_EMULATOR_DIAGNOSTICS_DIR="${{ github.workspace }}/android-emulator-diagnostics/attempt-2"
        "${{ github.workspace }}/scripts/android/boot-emulator.sh" --avd-name "${{ inputs.avd-name }}"
        "${{ github.workspace }}/scripts/android/run-emulator-tests.sh" "${{ inputs.accessibility-apk-path }}" "${{ inputs.script }}" || {
          test_status=$?
          "${{ github.workspace }}/scripts/android/collect-emulator-diagnostics.sh" \
            "${AUTOMOBILE_EMULATOR_DIAGNOSTICS_DIR}" \
            "run-emulator-tests.sh failed with exit code ${test_status}."
          exit "${test_status}"
        }

    - name: Surface Emulator Diagnostics After Retry
      if: always() && steps.emulator-attempt-2.outcome == 'failure'
      shell: ${{ inputs.shell }}
      run: |
        bash "${{ github.workspace }}/scripts/android/print-emulator-diagnostics.sh" "${{ github.workspace }}/android-emulator-diagnostics/attempt-2" "Emulator retry failed; captured diagnostics follow:"

    - name: Verify Emulator Tests Passed
      if: always()
      shell: ${{ inputs.shell }}
      run: |
        if [[ "${{ steps.emulator-attempt-1.outcome }}" == "success" ]]; then
          echo "✓ Emulator tests passed on first attempt"
          exit 0
        elif [[ "${{ steps.emulator-attempt-2.outcome }}" == "success" ]]; then
          echo "✓ Emulator tests passed on retry (infrastructure flakiness detected)"
          exit 0
        else
          echo "✗ Emulator tests failed after retry"
          exit 1
        fi

    - name: Upload Emulator Diagnostics
      if: always() && (steps.emulator-attempt-1.outcome == 'failure' || steps.avd-create.outcome == 'failure')
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: android-emulator-diagnostics-${{ github.job }}
        path: android-emulator-diagnostics/
        if-no-files-found: ignore
        retention-days: 7
