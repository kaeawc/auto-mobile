#file: noinspection YAMLSchemaValidation
name: "android-emulator"
description: "Run Android Emulator with AVD snapshot caching for optimized CI performance"
inputs:
  shell:
    description: "The shell to use for any steps that use shells"
    default: "bash"
    required: "true"
  script:
    description: "Script to execute once Android Emulator is ready"
    example: './gradlew tests'
    required: "true"
  api_level:
    description: "Android API level"
    example: "35"
    default: "35"
    required: "true"
  arch:
    description: "CPU architecture"
    default: "x86_64"
    required: "true"
  target:
    description: "System image target"
    default: "google_apis"
    required: "true"
  working-directory:
    description: "Working directory"
    default: "./"
    required: "true"
  accessibility-apk-path:
    description: "Optional path to accessibility service APK to install before running the script"
    default: ""
    required: "false"

runs:
  using: "composite"
  steps:
    - name: Enable KVM group perms
      shell: ${{ inputs.shell }}
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: AVD cache
      uses: actions/cache@v4
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-${{ runner.os }}-${{ inputs.api_level }}-${{ inputs.arch }}-${{ inputs.target }}

    - name: Create AVD and generate snapshot for caching
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2.30.0
      with:
        api-level: ${{ inputs.api_level }}
        arch: ${{ inputs.arch }}
        target: ${{ inputs.target }}
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: |
          echo "=========================================="
          echo "AVD CREATION DEBUG"
          echo "=========================================="
          echo "Emulator version: $(emulator -version 2>/dev/null || echo 'unknown')"
          echo "Android SDK tools location: $ANDROID_HOME"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME not found"
          echo "AVD directory: $ANDROID_AVD_HOME"
          ls -la "$ANDROID_AVD_HOME" 2>/dev/null || echo "ANDROID_AVD_HOME not found"
          echo ""
          echo "Generated AVD snapshot for caching."

    - name: Run Emulator
      uses: reactivecircus/android-emulator-runner@v2.30.0
      with:
        api-level: ${{ inputs.api_level }}
        arch: ${{ inputs.arch }}
        target: ${{ inputs.target }}
        script: |
          set -x
          echo "=========================================="
          echo "EMULATOR SETUP DEBUG START"
          echo "=========================================="
          echo "Current shell: $SHELL"
          echo "Current user: $(whoami)"
          echo "Current directory: $(pwd)"
          echo "Working directory input: '${{ inputs.working-directory }}'"
          echo "Script to run: '${{ inputs.script }}'"
          echo "Accessibility APK path input: '${{ inputs.accessibility-apk-path }}'"
          echo ""
          echo "Environment variables:"
          env | grep -E "(ANDROID|ADB|PATH|SHELL|HOME)" | sort
          echo ""
          echo "Checking adb availability..."
          which adb || echo "adb not found in PATH"
          adb --version || echo "adb version check failed"
          echo ""
          echo "Listing connected devices..."
          adb devices || echo "adb devices failed"
          echo ""
          echo "=========================================="
          echo "ACCESSIBILITY APK INSTALLATION"
          echo "=========================================="
          APK_PATH="${{ inputs.accessibility-apk-path }}"
          echo "APK_PATH variable set to: '$APK_PATH'"
          echo "Expected path: accessibility-service/build/outputs/apk/debug/accessibility-service-debug.apk"
          echo ""
          if [ -n "$APK_PATH" ]; then
            echo "APK_PATH is not empty, proceeding with checks..."
            echo "Current working directory: $(pwd)"
            echo "Checking if file exists: $APK_PATH"
            echo ""

            if [ ! -f "$APK_PATH" ]; then
              echo "ERROR: Accessibility APK not found at '$APK_PATH'"
              echo ""
              echo "Current directory structure:"
              ls -la
              echo ""
              echo "Accessibility service directory:"
              ls -la accessibility-service/ 2>/dev/null || echo "  (directory not found)"
              echo ""
              echo "Build outputs directory:"
              ls -la accessibility-service/build/outputs/ 2>/dev/null || echo "  (directory not found)"
              echo ""
              echo "APK directory:"
              ls -la accessibility-service/build/outputs/apk/ 2>/dev/null || echo "  (directory not found)"
              echo ""
              echo "Debug APK directory:"
              ls -la accessibility-service/build/outputs/apk/debug/ 2>/dev/null || echo "  (directory not found)"
              echo ""
              echo "Parent directory of APK:"
              ls -la "$(dirname "$APK_PATH")" 2>/dev/null || echo "  (directory not found: $(dirname "$APK_PATH"))"
              exit 1
            else
              echo "SUCCESS: APK file found at $APK_PATH"
              echo ""
              echo "File details:"
              ls -lh "$APK_PATH"
              file "$APK_PATH"
              echo ""
              echo "Installing accessibility service APK..."
              echo "Running: adb install -r '$APK_PATH'"
              adb install -r "$APK_PATH"
              APK_INSTALL_EXIT=$?
              echo ""
              echo "adb install exit code: $APK_INSTALL_EXIT"
              if [ $APK_INSTALL_EXIT -ne 0 ]; then
                echo "ERROR: APK installation failed with exit code $APK_INSTALL_EXIT"
                exit $APK_INSTALL_EXIT
              fi
              echo "SUCCESS: APK installed successfully"
            fi
          else
            echo "APK_PATH is empty, skipping APK installation"
          fi
          echo ""
          echo "=========================================="
          echo "RUNNING TEST SCRIPT"
          echo "=========================================="
          echo "Working directory: ${{ inputs.working-directory }}"
          echo "About to execute: ${{ inputs.script }}"
          echo "=========================================="
          set +x
          ${{ inputs.script }}
        working-directory: ${{ inputs.working-directory }}
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
