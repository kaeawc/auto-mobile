name: "ci-build-android-control-proxy"
description: >-
  Shared body of the "Build CtrlProxy APK" job. pull_request.yml and merge.yml each keep the job (its name, runs-on, needs, if gating, timeout and working directory, which are what the required status check context is built from) and call this action after checking out, so the two cannot drift (#11872).
inputs:
  gradle-encryption-key:
    description: "Gradle encryption key; composite actions cannot read secrets directly."
    required: true
  release-keystore-base64:
    description: "Release keystore (base64); a secret passed in by the caller."
    required: false
  release-keystore-password:
    description: "Release keystore password; a secret passed in by the caller."
    required: false
  release-key-alias:
    description: "Release key alias; a secret passed in by the caller."
    required: false
  release-key-password:
    description: "Release key password; a secret passed in by the caller."
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/gradle-task-run
      with:
        # JVM Consumer Checks compiles the release variant as its own PR
        # signal, concurrently with the emulator lane (#11578).
        gradle-tasks: ":control-proxy:assembleDebug :video-server:d8Dex"
        gradle-project-directory: "android"
        gradle-home-directory: "~/.gradle/${{ github.job }}"
        reuse-configuration-cache: true
        gradle-encryption-key: ${{ inputs.gradle-encryption-key }}
        release-keystore-base64: ${{ inputs.release-keystore-base64 }}
        release-keystore-password: ${{ inputs.release-keystore-password }}
        release-key-alias: ${{ inputs.release-key-alias }}
        release-key-password: ${{ inputs.release-key-password }}
    - name: "Upload CtrlProxy APK"
      uses: actions/upload-artifact@v6
      with:
        name: control-proxy-apk
        path: android/control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
    - name: "Upload video-server jar"
      uses: actions/upload-artifact@v6
      with:
        name: video-server-jar
        path: android/video-server/build/libs/automobile-video.jar
