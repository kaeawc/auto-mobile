name: "ci-build-desktop-core"
description: >-
  Shared body of the "Build Desktop Core Module" job. pull_request.yml and
  merge.yml each keep the job (its name, runs-on, needs and if gating, which
  are what the required status check context is built from) and call this
  action after checking out, so the two cannot drift (#11872).
inputs:
  gradle-encryption-key:
    description: "Gradle encryption key; composite actions cannot read secrets directly."
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/gradle-task-run
      with:
        gradle-tasks: ":desktop-core:build -x test"
        gradle-project-directory: "android"
        gradle-home-directory: "~/.gradle/${{ github.job }}"
        reuse-configuration-cache: true
        gradle-encryption-key: ${{ inputs.gradle-encryption-key }}
