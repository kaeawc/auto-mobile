name: "ci-ide-plugin-unit-tests"
description: >-
  Shared body of the "Run IDE Plugin Unit Tests" job. Call after checkout from
  both pull_request.yml and merge.yml; the job name, runs-on and gating stay on
  the caller job so the required status check context is unchanged (#11872).
inputs:
  gradle-encryption-key:
    description: "Gradle encryption key; composite actions cannot read secrets directly."
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/gradle-task-run
      with:
        gradle-tasks: "test"
        gradle-project-directory: "android/ide-plugin"
        gradle-home-directory: "~/.gradle/${{ github.job }}"
        reuse-configuration-cache: true
        gradle-encryption-key: ${{ inputs.gradle-encryption-key }}

    - name: "Upload Test Results"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: ide-plugin-test-results
        path: android/ide-plugin/build/reports/tests/test/
