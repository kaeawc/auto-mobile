#file: noinspection YAMLSchemaValidation
name: "setup-ripgrep"
description: "Install ripgrep by downloading pre-built binaries. Skips if already installed."
inputs:
  version:
    description: "ripgrep version to install (default: RIPGREP_VERSION in ripgrep_version.sh, the only version with pinned checksums)"
    default: ""
    required: false
  install-dir:
    description: "Directory to install ripgrep binary"
    default: ""
    required: false

runs:
  using: "composite"
  steps:
    - name: "Check if ripgrep is already installed"
      id: check-rg
      shell: bash
      run: |
        if command -v rg >/dev/null 2>&1; then
          echo "ripgrep is already installed: $(rg --version | head -1)"
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "ripgrep not found, will install"
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    # Restore the checksum-verified release archive so a GitHub release outage
    # cannot fail the job once ripgrep is cached. The key follows the file that
    # holds the version and checksums; install-ripgrep.sh re-verifies the
    # archive's SHA-256 after restore and after download (#17624).
    - name: "Cache pinned ripgrep download"
      if: steps.check-rg.outputs.installed != 'true'
      uses: actions/cache@v5
      with:
        path: ~/.cache/auto-mobile/tools/ripgrep
        key: tool-download-ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-ripgrep/ripgrep_version.sh') }}

    - name: "Install ripgrep"
      if: steps.check-rg.outputs.installed != 'true'
      shell: bash
      run: |
        "${{ github.action_path }}/install-ripgrep.sh" \
          ${VERSION:+--version "$VERSION"} \
          ${INSTALL_DIR:+--install-dir "$INSTALL_DIR"}
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ inputs.install-dir }}

    - name: "Add to GITHUB_PATH (Unix)"
      if: steps.check-rg.outputs.installed != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        install_dir="${{ inputs.install-dir }}"
        if [ -z "$install_dir" ]; then
          install_dir="$HOME/.local/bin"
        fi
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: "Add to GITHUB_PATH (Windows)"
      if: steps.check-rg.outputs.installed != 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        install_dir="${{ inputs.install-dir }}"
        if [ -z "$install_dir" ]; then
          install_dir="$USERPROFILE/.local/bin"
        fi
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: "Verify installation"
      if: steps.check-rg.outputs.installed != 'true'
      shell: bash
      run: |
        # Give PATH a moment to update
        export PATH="$HOME/.local/bin:$USERPROFILE/.local/bin:$PATH"
        rg --version
