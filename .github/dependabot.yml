# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
      time: "13:00"
      timezone: "UTC"
    # Limit the number of open pull requests to avoid overwhelming maintainers
    open-pull-requests-limit: 10
    # Set versioning strategy appropriate for a library/package
    versioning-strategy: "increase-if-necessary"
    groups:
      # sharp ships libvips as a separately-linked native matrix (top-level
      # `sharp` + every `@img/sharp-*` platform binary). Bump them together in
      # one PR so a partial update can never split the matrix — validated safe
      # under Bun on macOS + Linux (arm64/x64) at 0.35.3; see
      # docs/design-docs/image-backend.md.
      sharp:
        patterns:
          - "sharp"
          - "@img/sharp-*"
    ignore:
      # These top-level entries are transitive pins hoisted to a single copy by
      # scripts/release/pin-runtime-deps.ts (issue #5421), NOT packages our code
      # bumps directly. Their real consumers (jimp plugins, utif2, xml2js) lock
      # them to an older major, so a Dependabot major bump only leaves a dead
      # duplicate copy and reddens the pinned runtime-graph check. Block the
      # incompatible majors; in-range patches remain welcome.
      #
      #   zod        — ~15 @jimp/plugin-* need ^3.23.8 (v3 API); our MCP schemas
      #                use the v4 API via the `zod/v4` subpath. zod@3.25.x serves
      #                both from one copy.
      #   file-type  — @jimp/core needs ^21.3.3
      #   mime       — @jimp/core needs "3"
      #   pako       — utif2 needs ^1.0.11
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "file-type"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pako"
        update-types: ["version-update:semver-major"]
      # sax is a build-only hoist pin for the nested xml2js@0.5.0 (under
      # parse-bmfont-xml); any minor/major bump un-hoists it into a bundled dep
      # that test/packaging/runtimeGraphPinning.test.ts forbids, with zero
      # runtime effect. Allow only patch updates to the pinned 1.4.x line.
      - dependency-name: "sax"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  # Android Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The published JUnit runner/test-plan artifacts intentionally keep their
      # Kotlin stdlib consumer floor on Kotlin 2.2.x.
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib"
        versions: ["[2.3,)"]
  # iOS Swift Package Manager dependencies
  - package-ecosystem: "swift"
    directory: "/ios/XCTestService"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ios"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "swift"
    directory: "/ios/XCTestRunner"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ios"
    commit-message:
      prefix: "chore(deps)"
