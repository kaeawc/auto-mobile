name: "AAOS Emulator Smoke (Advisory)"

# Advisory nightly Android Automotive OS emulator lane (#16746). Not in the green-main
# ruleset and nothing depends on it. Runs nightly, on dispatch, and on a pull request only
# when labelled `run-aaos`. Uses the non-Play userdebug `android-automotive` API 34 ext9
# image so vehicle driving state can be injected, and creates the AVD through startDevice
# createIfMissing so provisioning is exercised too.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      break-assertion:
        description: "Swap in an impossible assertion to check the failure summary"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'run-aaos') && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  aaos-emulator-smoke:
    name: "AAOS Emulator Smoke (Advisory)"
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'kaeawc/auto-mobile') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-aaos') && (github.event.action != 'labeled' || github.event.label.name == 'run-aaos'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Free disk space for emulator"
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: "Enable KVM group perms"
        uses: ./.github/actions/enable-kvm

      - name: "Ensure Android emulator SDK"
        run: bash scripts/android/ensure-emulator-sdk.sh

      - name: "Install emulator runtime libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64 libgl1 libnss3 libxkbfile1 libx11-xcb1

      - uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Run AAOS smoke"
        env:
          AAOS_SMOKE_OUT_DIR: "${{ github.workspace }}/scratch/aaos-smoke"
          AAOS_SMOKE_BREAK_ASSERTION: "${{ inputs.break-assertion && '1' || '0' }}"
        run: bash scripts/ci/aaos-smoke/run-aaos-smoke.sh

      - name: "Upload AAOS smoke artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aaos-emulator-smoke
          path: |
            scratch/aaos-smoke/
            !scratch/aaos-smoke/db/
          if-no-files-found: warn
          retention-days: 14
