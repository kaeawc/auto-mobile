name: "Build CtrlProxy iOS IPA"

on:
  workflow_call:
    outputs:
      sha256:
        description: "SHA256 checksum of the built IPA"
        value: ${{ jobs.build.outputs.sha256 }}
      runner_sha256:
        description: "SHA256 checksum of the CtrlProxyUITests-Runner binary"
        value: ${{ jobs.build.outputs.runner_sha256 }}

jobs:
  build:
    name: "Build CtrlProxy iOS IPA"
    runs-on: macos-26
    outputs:
      sha256: ${{ steps.checksum.outputs.ipa_sha256 }}
      runner_sha256: ${{ steps.checksum.outputs.runner_sha256 }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Cache Ruby gems"
        uses: actions/cache@v5
        with:
          path: ~/.gem
          key: gems-xcpretty-${{ runner.os }}

      - name: "Install xcpretty"
        run: gem install xcpretty

      - name: "Build CtrlProxy iOS IPA"
        id: checksum
        run: ./scripts/ios/ctrl-proxy-create-ipa.sh --output /tmp/control-proxy.ipa

      - name: "Upload CtrlProxy iOS IPA"
        uses: actions/upload-artifact@v6
        with:
          name: ctrl-proxy-ios-ipa
          path: /tmp/control-proxy.ipa
          retention-days: 7
