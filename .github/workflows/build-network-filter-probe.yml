name: "Build Network Filter Identity Probe"

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Commit or tag to build; defaults to the caller SHA"
        required: false
        type: string
        default: ""
      upload-artifact:
        description: "Whether to upload the notarized probe archive as a workflow artifact"
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        description: "How long to retain the uploaded probe artifact"
        required: false
        type: number
        default: 7
    secrets:
      MACOS_DEVELOPER_ID_CERT_BASE64:
        required: true
      MACOS_DEVELOPER_ID_CERT_PASSWORD:
        required: true
      MACOS_KEYCHAIN_PASSWORD:
        required: true
      MACOS_DEVELOPER_ID_SIGNING_IDENTITY:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
      APPLE_NOTARY_PRIVATE_KEY_BASE64:
        required: true
      MACOS_NETWORK_FILTER_CONTROLLER_PROFILE_BASE64:
        required: true
      MACOS_NETWORK_FILTER_PROVIDER_PROFILE_BASE64:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: "Build notarized Network Filter identity probe"
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          lfs: false
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Install macOS Developer ID certificate"
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-macos-signing-keychain.sh

      - name: "Write provisioning profiles and App Store Connect API key"
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          MACOS_NETWORK_FILTER_CONTROLLER_PROFILE_BASE64: ${{ secrets.MACOS_NETWORK_FILTER_CONTROLLER_PROFILE_BASE64 }}
          MACOS_NETWORK_FILTER_PROVIDER_PROFILE_BASE64: ${{ secrets.MACOS_NETWORK_FILTER_PROVIDER_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CONTROLLER_PROFILE="${RUNNER_TEMP}/network-filter-controller.provisionprofile"
          PROVIDER_PROFILE="${RUNNER_TEMP}/network-filter-provider.provisionprofile"
          KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
          printf '%s' "${MACOS_NETWORK_FILTER_CONTROLLER_PROFILE_BASE64}" | base64 --decode > "${CONTROLLER_PROFILE}"
          printf '%s' "${MACOS_NETWORK_FILTER_PROVIDER_PROFILE_BASE64}" | base64 --decode > "${PROVIDER_PROFILE}"
          printf '%s' "${APPLE_NOTARY_PRIVATE_KEY_BASE64}" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${CONTROLLER_PROFILE}" "${PROVIDER_PROFILE}" "${KEY_PATH}"
          printf 'MACOS_PROBE_CONTROLLER_PROFILE=%s\n' "${CONTROLLER_PROFILE}" >> "${GITHUB_ENV}"
          printf 'MACOS_PROBE_PROVIDER_PROFILE=%s\n' "${PROVIDER_PROFILE}" >> "${GITHUB_ENV}"
          printf 'APPLE_NOTARY_KEY_PATH=%s\n' "${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: "Build, sign, and notarize Network Filter identity probe"
        env:
          MACOS_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
          MACOS_DEVELOPER_ID_TEAM_ID: CEZH89E7MT
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/ios/build-network-filter-probe.sh signed

      - name: "Stage notarized probe archive"
        run: |
          set -euo pipefail
          artifact="$(find scratch -type f -name probe-stapled.zip -print -quit)"
          if [[ -z "${artifact}" ]]; then
            echo "The signed probe build did not produce probe-stapled.zip" >&2
            exit 1
          fi
          cp "${artifact}" "${RUNNER_TEMP}/network-filter-identity-probe.zip"

      - name: "Upload notarized Network Filter identity probe"
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v6
        with:
          name: network-filter-identity-probe
          path: ${{ runner.temp }}/network-filter-identity-probe.zip
          retention-days: ${{ inputs.artifact-retention-days }}
