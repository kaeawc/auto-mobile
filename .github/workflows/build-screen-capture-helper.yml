name: "Build Screen Capture Helper"

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Commit or tag to build; defaults to the caller SHA"
        required: false
        type: string
        default: ""
      upload-artifact:
        description: "Whether to upload the built archive as a workflow artifact"
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        description: "How long to retain the uploaded helper artifact"
        required: false
        type: number
        default: 7
    secrets:
      MACOS_DEVELOPER_ID_CERT_BASE64:
        required: true
      MACOS_DEVELOPER_ID_CERT_PASSWORD:
        required: true
      MACOS_KEYCHAIN_PASSWORD:
        required: true
      MACOS_DEVELOPER_ID_SIGNING_IDENTITY:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
      APPLE_NOTARY_PRIVATE_KEY_BASE64:
        required: true
    outputs:
      sha256:
        description: "SHA256 checksum of the notarized screen-capture-helper archive"
        value: ${{ jobs.build.outputs.sha256 }}

jobs:
  build:
    name: "Build notarized ScreenCaptureKit helper"
    runs-on: macos-26
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          lfs: false
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Install macOS Developer ID certificate"
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-macos-signing-keychain.sh

      - name: "Write App Store Connect API key"
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
          printf '%s' "${APPLE_NOTARY_PRIVATE_KEY_BASE64}" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          echo "APPLE_NOTARY_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: "Build, sign, and notarize ScreenCaptureKit helper"
        env:
          MACOS_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/ios/build-screen-capture-helper-release.sh /tmp/screen-capture-helper-macos-universal.zip

      - name: "Calculate helper archive SHA256"
        id: checksum
        run: |
          # pipefail so a failing shasum is not masked by a succeeding cut (#4684).
          set -euo pipefail
          SHA256=$(shasum -a 256 /tmp/screen-capture-helper-macos-universal.zip | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          echo "screen-capture-helper SHA256: ${SHA256}"

      - name: "Upload notarized ScreenCaptureKit helper"
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v6
        with:
          name: screen-capture-helper
          path: /tmp/screen-capture-helper-macos-universal.zip
          retention-days: ${{ inputs.artifact-retention-days }}
