name: "Build video-server jar"

# Builds the persistent on-device H.264 encoder DEX (`automobile-video.jar`,
# #3776) via `./gradlew :video-server:test :video-server:d8Dex` and uploads it as a CI artifact.
# Shared by nightly.yml (drift detection → checksum PR) and release.yml (attach
# to the GitHub release), so both compute the sha256 from the SAME build — a
# divergent build would record a nightly sha the release cannot reproduce (the
# #3784 failure class). Reproducibility rests on the pinned toolchain: JDK 21
# (installed by the gradle-task-run composite) + buildToolsVersion from
# libs.versions, exactly as the CtrlProxy APK build.
on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Commit or tag to build; defaults to the caller SHA"
        required: false
        type: string
        default: ""
      upload-artifact:
        description: "Whether to upload the built jar as a workflow artifact"
        required: false
        type: boolean
        default: true
      verify-reproducible:
        description: >-
          When true, rebuild the jar from a clean tree and fail if the second
          build's sha256 differs from the first. Release/prepare set this to
          guarantee the recorded checksum is reproducible; nightly leaves it off
          to save a build.
        required: false
        type: boolean
        default: false
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: true
    outputs:
      sha256:
        description: "SHA256 checksum of the built automobile-video.jar"
        value: ${{ jobs.build.outputs.sha256 }}

jobs:
  build:
    name: "Build video-server jar"
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          lfs: false
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":video-server:test :video-server:d8Dex"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/build-video-server-jar"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Calculate jar SHA256"
        id: checksum
        run: |
          # pipefail so a failing sha256sum is not masked by a succeeding cut (#4684).
          set -euo pipefail
          JAR_PATH="android/video-server/build/libs/automobile-video.jar"
          SHA256=$(sha256sum "$JAR_PATH" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "video-server jar SHA256: $SHA256"

      - name: "Verify reproducible build"
        if: ${{ inputs.verify-reproducible }}
        run: |
          # pipefail so a failing sha256sum is not masked by a succeeding cut — an
          # empty SECOND_SHA would otherwise read as a reproducibility failure (#4684).
          set -euo pipefail
          JAR_PATH="android/video-server/build/libs/automobile-video.jar"
          FIRST_SHA="${{ steps.checksum.outputs.sha256 }}"
          # Clean the module output and rebuild from scratch. A byte-identical
          # sha across two independent d8 runs is what lets a nightly-recorded
          # checksum be verified against the release-built jar (#3784 class).
          ./android/gradlew -p android :video-server:clean
          rm -f "$JAR_PATH"
          ./android/gradlew -p android :video-server:d8Dex
          SECOND_SHA=$(sha256sum "$JAR_PATH" | cut -d' ' -f1)
          echo "First build:  $FIRST_SHA"
          echo "Second build: $SECOND_SHA"
          if [ "$FIRST_SHA" != "$SECOND_SHA" ]; then
            echo "ERROR: video-server jar build is not reproducible."
            echo "Two clean builds of the same commit produced different sha256."
            exit 1
          fi
          echo "Reproducible: two clean builds produced an identical sha256."

      - name: "Copy jar to /tmp"
        run: cp android/video-server/build/libs/automobile-video.jar /tmp/automobile-video.jar

      - name: "Upload video-server jar"
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v6
        with:
          name: video-server-jar
          path: /tmp/automobile-video.jar
          retention-days: 7
