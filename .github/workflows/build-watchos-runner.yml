name: "Build watchOS Runner"

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Commit or tag to build; defaults to the caller SHA"
        required: false
        type: string
        default: ""
      upload-artifact:
        description: "Whether to upload the runner archive"
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        description: "How long to retain the runner archive"
        required: false
        type: number
        default: 7
    outputs:
      sha256:
        description: "SHA256 checksum of the watchOS runner archive"
        value: ${{ jobs.build.outputs.sha256 }}
  # Manual build check outside a release; it uploads nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build watchOS Runner"
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          lfs: false
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Ensure watchOS platform support"
        run: xcodebuild -downloadPlatform watchOS

      - name: "Build watchOS runner archive"
        id: checksum
        run: bash scripts/ios/build-simulator-runner-release.sh --platform watchos --output /tmp/watchos-runner-macos.zip

      - name: "Upload watchOS runner archive"
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v6
        with:
          name: watchos-runner
          path: /tmp/watchos-runner-macos.zip
          retention-days: ${{ inputs.artifact-retention-days }}
