name: "Darling Experiment"

# Experiment: how much of AutoMobile's macOS-only CI can run on a Linux
# runner under Darling (https://docs.darlinghq.org)? Follows the working
# setup proven in kaeawc/spectra#452: Darling's releases ship prebuilt
# Ubuntu 24.04 (noble) amd64 debs, and the minimal CLI package closure
# installs in about a minute — no source build, no cache. Keep the runner
# pinned to ubuntu-24.04 to match the debs. Darling has been
# userspace-only (darlingserver) since 2022, so no kernel module is needed
# on hosted runners.
#
# What this job probes per run (see scripts/ci/darling-smoke.sh):
#   - Darling boots and reports Darwin on a hosted runner
#   - our pinned Mach-O CLI tools (XcodeGen, SwiftLint) run under it,
#     including the real xcodegen-drift-check.sh gate
# It deliberately does NOT install Xcode: xcodebuild ships only with Apple's
# Xcode/CLT, which Apple licenses for use on Apple-branded hardware only.
# The optional dispatch input below lets a person supply their own archive
# for at-your-own-risk experimentation (scripts/ci/darling-xcodebuild-probe.sh);
# never wire that into default CI.

on:
  workflow_dispatch:
    inputs:
      darling-debs-url:
        description: "URL of the darlinghq/darling release debs zip (noble/amd64)"
        required: false
        type: string
        default: "https://github.com/darlinghq/darling/releases/download/v0.1.20260608/debs_20260608.zip"
      darling-debs-sha256:
        description: "SHA256 of the debs zip (release assets are mutable; pin the bytes)"
        required: false
        type: string
        default: "27469ef3932da2e91dd7fb34b70e3628a3e54b7af9fb5480051f44af35eca1fd"
      xcode-archive-url:
        description: >-
          OPTIONAL tar archive of YOUR OWN extracted Xcode.app or
          CommandLineTools to attempt xcodebuild with. Apple's EULA restricts
          these tools to Apple hardware; supplying this is your call and your
          responsibility. Leave empty to skip (default).
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/darling-experiment.yml"
      - "scripts/ci/darling-*.sh"

permissions:
  contents: read

concurrency:
  group: darling-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darling-smoke:
    name: "Darling smoke (experimental)"
    runs-on: ubuntu-24.04
    # Experimental by definition: report signal without blocking anything.
    continue-on-error: true
    timeout-minutes: 60
    env:
      DARLING_DEBS_URL: ${{ inputs.darling-debs-url || 'https://github.com/darlinghq/darling/releases/download/v0.1.20260608/debs_20260608.zip' }}
      DARLING_DEBS_SHA256: ${{ inputs.darling-debs-sha256 || '27469ef3932da2e91dd7fb34b70e3628a3e54b7af9fb5480051f44af35eca1fd' }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: "Install Darling from release debs"
        run: ./scripts/ci/darling-install.sh "$DARLING_DEBS_URL" "$DARLING_DEBS_SHA256"

      - name: "Run Darling smoke probes"
        run: ./scripts/ci/darling-smoke.sh

      - name: "Attempt xcodebuild (self-supplied Xcode; see licensing note)"
        if: github.event_name == 'workflow_dispatch' && inputs.xcode-archive-url != ''
        env:
          DARLING_XCODE_ARCHIVE_URL: ${{ inputs.xcode-archive-url }}
        run: ./scripts/ci/darling-xcodebuild-probe.sh

      - name: "Upload probe logs"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: darling-experiment-logs
          path: scratch/darling/
          if-no-files-found: ignore
          retention-days: 14
