name: "Xcode 27.2 (Advisory)"

# Advisory Xcode 27.2 build of the tvOS, watchOS and visionOS runners on the hosted
# `xcode-27` image (#18363). The package and project builds this lane used to repeat now
# run in the required pull_request.yml jobs on the same pin, so only the runner builds,
# which no PR job covers, stay here (#18816). This workflow is a separate run, so its jobs
# are not in the green-main ruleset and cannot delay or fail a required check. Xcode 27.1
# is the image default, so the job selects 27.2 explicitly and fails if another is active.

on:
  pull_request:
    paths:
      - ".github/workflows/ios-xcode-27-2.yml"
      - ".github/actions/ensure-ios-simulator-runtime/**"
      - "ios/**"
      - "scripts/ios/**"
      - "Package.swift"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-xcode-27-2.yml"
      - ".github/actions/ensure-ios-simulator-runtime/**"
      - "ios/**"
      - "scripts/ios/**"
      - "Package.swift"
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: "27.2"

jobs:
  simulator-runners:
    name: "Build ${{ matrix.platform.name }} Runner (Xcode 27.2, Advisory)"
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: "tvOS", id: "tvos" }
          - { name: "watchOS", id: "watchos" }
          - { name: "visionOS", id: "visionos" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: "Select Xcode 27.2"
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: "Verify Xcode 27.2 is active"
        run: |
          xcodebuild -version
          active="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          if [[ "${active}" != "${XCODE_VERSION}" && "${active}" != "${XCODE_VERSION}".* ]]; then
            echo "::error::Expected Xcode ${XCODE_VERSION}, but Xcode ${active} is active."
            exit 1
          fi
          swift --version

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Ensure ${{ matrix.platform.name }} platform support"
        run: xcodebuild -downloadPlatform "${{ matrix.platform.name }}"

      # Build check only: the release workflows still build and upload the archives.
      - name: "Build ${{ matrix.platform.name }} runner archive"
        env:
          PLATFORM_ID: ${{ matrix.platform.id }}
        run: |
          output="${RUNNER_TEMP}/${PLATFORM_ID}-runner-macos.zip"
          if [[ "${PLATFORM_ID}" == "tvos" ]]; then
            bash scripts/ios/build-tvos-runner-release.sh --output "${output}"
          else
            bash scripts/ios/build-simulator-runner-release.sh --platform "${PLATFORM_ID}" --output "${output}"
          fi
