  # =============================================================================
  # Swift Code Coverage
  # =============================================================================

  swift-code-coverage:
    name: "Swift Code Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 2

      - name: "Check for Swift coverage changes"
        id: filter-swift
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'scripts/ios/**'
              - 'scripts/coverage/**'
              - '.swiftformat'
              - '.swiftlint.yml'

      - name: "Run Swift coverage on CircleCI and download badge"
        if: steps.filter-swift.outputs.ios == 'true'
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        run: |
          set -euo pipefail
          api='https://circleci.com/api/v2'
          project='project/gh/kaeawc/auto-mobile'
          if [[ -z "$CIRCLECI_TOKEN" ]]; then
            echo '::error::CIRCLECI_TOKEN is required to run Swift coverage on CircleCI' >&2
            exit 1
          fi
          pipeline_id="$(curl -fsS -X POST "$api/$project/pipeline" \
            -H "Circle-Token: $CIRCLECI_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"branch":"main","parameters":{"run-swift-coverage-main":true}}' \
            | jq -er '.id')"
          echo "CircleCI pipeline: $pipeline_id"

          job_number=''
          for attempt in {1..80}; do
            workflows="$(curl -fsS --retry 3 --retry-delay 5 \
              -H "Circle-Token: $CIRCLECI_TOKEN" \
              "$api/pipeline/$pipeline_id/workflow")"
            while IFS= read -r workflow_id; do
              jobs="$(curl -fsS --retry 3 --retry-delay 5 \
                -H "Circle-Token: $CIRCLECI_TOKEN" \
                "$api/workflow/$workflow_id/job")"
              job="$(jq -c '[.items[]? | select(.name == "swift-code-coverage")] | first // empty' <<< "$jobs")"
              if [[ -n "$job" ]]; then
                status="$(jq -r '.status' <<< "$job")"
                job_number="$(jq -r '.job_number // empty' <<< "$job")"
                echo "CircleCI Swift coverage job $job_number: $status (poll $attempt/80)"
                break
              fi
            done < <(jq -r '.items[]?.id' <<< "$workflows")

            if [[ -n "$job_number" ]]; then
              case "$status" in
                success) break ;;
                running|queued|pending|not_running|on_hold|blocked) ;;
                *) echo "::error::CircleCI Swift coverage job $job_number ended with status $status" >&2; exit 1 ;;
              esac
            fi
            if (( attempt == 80 )); then
              echo '::error::Timed out waiting for the CircleCI Swift coverage job' >&2
              exit 1
            fi
            sleep 30
          done

          bash scripts/ci/fetch-circleci-swift-badge.sh \
            "$api" "$project" "$job_number" coverage/swift-coverage-badge.json

      - name: "Upload Swift Coverage Badge"
        if: steps.filter-swift.outputs.ios == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: swift-coverage-badge
          path: coverage/swift-coverage-badge.json
          retention-days: 90

  # =============================================================================
  # MCP Context Baselines
  # =============================================================================

  benchmark-context-thresholds:
    name: "Benchmark MCP Context Baselines"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Context Baseline Benchmark"
        id: benchmark
        run: |
          # Create reports directory
          mkdir -p reports

          # Run benchmark and capture exit code
          bun run benchmark-context --output reports/context-benchmark.json || echo "FAILED=true" >> $GITHUB_ENV

          # Always preserve the report file even if benchmark failed
          exit 0

      - name: "Upload Benchmark Report"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: context-benchmark-report
          path: reports/context-benchmark.json
          retention-days: 90

      - name: "Check Benchmark Result"
        if: always()
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::MCP context benchmark failed - one or more configured thresholds were exceeded"
            cat reports/context-benchmark.json
            exit 1
          fi
          echo "::notice::MCP context baseline benchmark completed"

  # =============================================================================
  # Auto-update README Test Count Badges
  # =============================================================================

  update-readme-badges:
    name: "Update README Test Count Badges"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize badge pushes so two merges can't race to push a badge commit to
    # main at once (issue #3590). cancel-in-progress:false lets a queued run wait
    # rather than drop the update; the run recomputes counts from scratch anyway.
    concurrency:
      group: update-readme-badges
      cancel-in-progress: false
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0 # Full history so the badge commit push to main isn't rejected as a shallow update
          token: ${{ secrets.AUTO_MOBILE_PR_TOKEN }}

      - name: "Commit and push badge update to main"
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # AUTO_MOBILE_PR_TOKEN is an admin actor and bypasses the green-main
          # ruleset, so the script pushes straight to main with no PR or status
          # checks. It re-syncs to origin/main and regenerates the badge each
          # attempt (exiting cleanly when counts are unchanged), so a concurrent
          # push can never leave a conflicted rebase.
          bash scripts/push-readme-badges.sh
