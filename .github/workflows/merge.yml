name: "On Merge"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  checks: write
  security-events: write
  pull-requests: write
  contents: write
  packages: write

jobs:
  build-desktop-core:
    name: "Build Desktop Core Module"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-core:build -x test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  desktop-core-unit-tests:
    name: "Run Desktop Core Unit Tests"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: build-desktop-core
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-core:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-core-test-results
          path: android/desktop-core/build/reports/tests/test/

      # Screenshot comparisons fail with pixel diffs that are only inspectable
      # as images -- the HTML test report above carries the stack trace but not
      # the rendering. See issue #3913.
      - name: "Upload Screenshot Diffs"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-core-screenshot-diffs
          path: android/desktop-core/build/reports/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  build-ide-plugin:
    name: "Build IDE Plugin"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/ide-plugin
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "build -x test"
          gradle-project-directory: "android/ide-plugin"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Build Plugin ZIP"
        shell: bash
        working-directory: android/ide-plugin
        run: |
          ./gradlew buildPlugin --stacktrace --continue

      - name: "Verify Plugin"
        shell: bash
        working-directory: android/ide-plugin
        run: |
          ./gradlew verifyPlugin --stacktrace --continue

      - name: "Upload IDE Plugin ZIP"
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: ide-plugin-zip
          path: android/ide-plugin/build/distributions/*.zip

  ide-plugin-unit-tests:
    name: "Run IDE Plugin Unit Tests"
    # Disabled with IDE plugin build on merge cleanup.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: build-ide-plugin
    defaults:
      run:
        working-directory: android/ide-plugin
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "test"
          gradle-project-directory: "android/ide-plugin"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ide-plugin-test-results
          path: android/ide-plugin/build/reports/tests/test/

  build-desktop-app:
    name: "Build Desktop App (${{ matrix.os }})"
    # Disabled: desktop app merge validation is expensive and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-app:build -x test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}-${{ matrix.os }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          malloc-replacement: ${{ runner.os == 'Linux' && 'jemalloc' || 'none' }}

  desktop-app-unit-tests:
    name: "Run Desktop App Unit Tests"
    # Disabled with desktop app merge cleanup.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: build-desktop-app
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-app:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-app-test-results
          path: android/desktop-app/build/reports/tests/test/

  validate-xml:
    name: "Validate XML"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Run XMLStarlet"
        shell: "bash"
        run: |
          sudo apt-get update
          sudo apt-get install xmlstarlet
          scripts/xml/validate_xml.sh

  ktfmt:
    name: "ktfmt"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Pin the JDK so ktfmt output is deterministic and matches local dev
      # (the project targets Java 21), rather than depending on whatever JDK the
      # runner image ships by default.
      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: "Run ktfmt"
        shell: "bash"
        run: |
          INSTALL_KTFMT_WHEN_MISSING=true ONLY_TOUCHED_FILES=false scripts/ktfmt/validate_ktfmt.sh

  oxfmt:
    name: "oxfmt"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        run: bun install --frozen-lockfile

      - name: "Run oxfmt"
        run: bun run format:check

  # The full-tree backstop. PRs run detekt scoped to the modules they changed
  # (pull_request.yml), which cannot see a violation introduced in a *consumer*
  # of a changed module -- this unscoped post-merge run is what catches that.
  # Its own job rather than a step in ktfmt so it does not serialize behind a
  # 20-second format check, and so it can reuse the Gradle caches.
  detekt:
    name: "Detekt"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "detektMain detektTest"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          # Configuration-cache reuse is deliberately OFF here (#5332), matching
          # the PR-CI Detekt job in pull_request.yml. A restored config-cache
          # entry intermittently evaluated the Metro Gradle plugin classpath under
          # a stale JVM context ("Dependency requires at least JVM runtime version
          # 21. This build uses a Java 17 JVM."), failing ~2min with a generic
          # exit 1 and NO `.kt` annotations. On this post-merge backstop that flake
          # reddens main. Disabling reuse removes it deterministically; the Gradle
          # BUILD cache (the real speed win) stays on. Guarded by
          # test/bats/detekt-config-cache-disabled.bats.
          reuse-configuration-cache: false
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Detekt Reports"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports
          path: android/**/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

  validate-shell-scripts:
    name: "Validate Shell Scripts"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Run ShellCheck"
        shell: "bash"
        run: |
          scripts/shellcheck/validate_shell_scripts.sh

      - name: "Validate stdlib-first conventions"
        shell: "bash"
        run: |
          scripts/conventions/validate-stdlib-first.sh

  bats-tests:
    timeout-minutes: 10
    name: "BATS Shell Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Pure network/disk (`brew install bats-core` on macOS, a source install on
      # Linux) and independent of the Bun setup below, which only writes
      # node_modules. Background it so the two overlap, then re-sync at the
      # barrier before `bats test/bats/`, the sole consumer of both. Mechanism
      # per #3779. shellcheck is installed here too: the markdown-bash gate
      # (validate-markdown-bash.bats, #4118) is the first bats-tested script that
      # shells out to the real shellcheck binary — every other shell validator
      # scans with grep — and the macOS runner image does not ship shellcheck, so
      # without this the whole suite mysteriously failed (#4801). The step name is
      # pinned to "Install BATS" by test/scripts/batsInstallHoist.test.ts (#4126).
      - name: "Install BATS"
        shell: bash
        background: true
        id: install-bats
        run: |
          if command -v bats &>/dev/null; then
            echo "bats already installed: $(bats --version)"
          elif command -v brew &>/dev/null; then
            brew install bats-core
          else
            # Ubuntu apt 'bats' is the old sstephenson/bats which doesn't
            # capture stderr in run output. Install bats-core from source.
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
            sudo /tmp/bats-core/install.sh /usr/local
          fi
          if command -v shellcheck &>/dev/null; then
            echo "shellcheck already installed: $(shellcheck --version | awk '/^version:/{print $2}')"
          elif command -v brew &>/dev/null; then
            brew install shellcheck
          else
            echo "shellcheck missing and no package manager to install it" >&2
            exit 1
          fi

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Stays in the foreground: it appends node_modules/.bin to $GITHUB_PATH.
      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - wait: install-bats

      - name: "Run BATS Unit Tests"
        shell: bash
        env:
          # The macOS runner has three shared cores; shell-heavy files can be
          # descheduled behind their parallel peers despite no real I/O.
          AUTOMOBILE_BATS_MAX_FILE_SECONDS: "240"
          AUTOMOBILE_BATS_UNIT_BUDGET_SECONDS: "420"
        run: scripts/ci/run-bats.sh unit

  bats-integration-tests:
    timeout-minutes: 10
    name: "BATS Integration Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Install BATS"
        shell: bash
        run: |
          if command -v bats &>/dev/null; then
            echo "bats already installed: $(bats --version)"
          elif command -v brew &>/dev/null; then
            brew install bats-core
          else
            git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
            sudo /tmp/bats-core/install.sh /usr/local
          fi
          if command -v shellcheck &>/dev/null; then
            echo "shellcheck already installed"
          elif command -v brew &>/dev/null; then
            brew install shellcheck
          else
            echo "shellcheck missing and no package manager to install it" >&2
            exit 1
          fi

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - name: "Run BATS Integration Tests"
        shell: bash
        run: scripts/ci/run-bats.sh integration

  # Always exercise the real publisher contract and Android/iOS capture-to-WHEP
  # paths post-merge. PRs run these only when WebRTC is in play; here they are
  # unconditional backstops.
  webrtc-integration-test:
    name: "WebRTC Publisher Integration (MediaMTX)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Install FFmpeg and verify a browser is present"
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          if ! command -v google-chrome >/dev/null 2>&1 \
            && ! command -v chromium >/dev/null 2>&1 \
            && ! command -v chromium-browser >/dev/null 2>&1; then
            echo "::error::No Chrome/Chromium found on the runner; the WHEP decode step needs one"
            exit 1
          fi

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Stays in the foreground: it appends node_modules/.bin to $GITHUB_PATH.
      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - name: "Cache MediaMTX binary"
        uses: actions/cache@v4
        with:
          path: scratch/mediamtx
          key: mediamtx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/webrtc/run-mediamtx-publisher-integration.sh') }}

      - name: "Run MediaMTX WebRTC publisher integration test"
        shell: bash
        run: bun run test:integration:webrtc-mediamtx

  android-device-webrtc:
    name: "Android Device Capture to WHEP"
    needs: build-android-control-proxy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      - name: "Download video-server jar"
        uses: actions/download-artifact@v7
        with:
          name: video-server-jar
          path: android/video-server/build/libs

      - name: "Install Chrome for WHEP decoding"
        run: |
          sudo apt-get update
          sudo apt-get install --yes google-chrome-stable || sudo apt-get install --yes chromium-browser

      - uses: ./.github/actions/android-emulator
        with:
          script: |
            cd "$GITHUB_WORKSPACE"
            AUTOMOBILE_WEBRTC_DEVICE_INTEGRATION=1 \
            AUTOMOBILE_WEBRTC_DEVICE_PLATFORM=android \
            AUTOMOBILE_ANDROID_H264_DEVICE_ID=emulator-5554 \
            AUTOMOBILE_VIDEO_SERVER_JAR="$GITHUB_WORKSPACE/android/video-server/build/libs/automobile-video.jar" \
            AUTOMOBILE_REQUIRE_VIDEO_SERVER=1 \
              bun run test:integration:webrtc-device
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk

      - name: "Explain WebRTC device results"
        if: always()
        continue-on-error: true
        run: bash scripts/webrtc/explain-device-results.sh android

      - name: "Upload WebRTC device artifacts"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: android-webrtc-device-artifacts-${{ github.run_attempt }}
          path: scratch/webrtc-device-integration/
          if-no-files-found: ignore
          retention-days: 7

  ios-device-webrtc:
    name: "iOS Device Capture to WHEP"
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Build iOS capture prerequisites"
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" || brew install --cask google-chrome
          (cd ios/screen-capture && swift build)

      - name: "Boot and activate iOS Simulator"
        run: |
          result="$(bun run src/index.ts --boot-device --platform ios --create-if-missing --timeout-ms 600000)"
          simulator_udid="$(printf '%s' "${result}" | jq -r '.deviceId')"
          if [[ -z "${simulator_udid}" || "${simulator_udid}" == "null" ]]; then
            echo "::error::AutoMobile product boot returned no deviceId." >&2
            exit 1
          fi
          if pgrep -x Simulator >/dev/null; then
            killall Simulator
            for _ in {1..30}; do
              pgrep -x Simulator >/dev/null || break
              sleep 1
            done
            if pgrep -x Simulator >/dev/null; then
              echo "::error::Simulator.app did not exit before activation." >&2
              exit 1
            fi
          fi
          open -a Simulator --args -CurrentDeviceUDID "${simulator_udid}"
          helper_path="${GITHUB_WORKSPACE}/ios/screen-capture/.build/debug/screen-capture-helper"
          simulator_name="$(xcrun simctl list devices --json | jq -r --arg udid "${simulator_udid}" \
            '[.devices[][] | select(.udid == $udid) | .name] | first // empty')"
          if [[ -z "${simulator_name}" ]]; then
            echo "::error::Could not resolve the selected Simulator name." >&2
            exit 1
          fi
          simulator_window_ready=0
          for _ in {1..30}; do
            simulator_windows="$("${helper_path}" --list-simulators 2>/dev/null || true)"
            if printf '%s' "${simulator_windows}" | jq -e --arg name "${simulator_name}" \
              '.windows | map(select((.title // "") | ascii_downcase | contains($name | ascii_downcase))) | length == 1' \
              >/dev/null; then
              simulator_window_ready=1
              break
            fi
            sleep 1
          done
          if [[ "${simulator_window_ready}" != "1" ]]; then
            echo "::error::Selected Simulator window did not become discoverable by ScreenCaptureKit." >&2
            exit 1
          fi

      - name: "Run iOS device capture integration"
        env:
          AUTOMOBILE_WEBRTC_DEVICE_INTEGRATION: "1"
          AUTOMOBILE_WEBRTC_DEVICE_PLATFORM: ios
          AUTOMOBILE_IOS_SCREEN_CAPTURE_HELPER: ${{ github.workspace }}/ios/screen-capture/.build/debug/screen-capture-helper
          AUTOMOBILE_IOS_SIMULATOR_WINDOW_TIMEOUT_MS: "15000"
        run: |
          set -uo pipefail

          reap_before_retry() {
            pkill -f "index.js --daemon-mode" 2>/dev/null || true
            pkill -x mediamtx 2>/dev/null || true
            pkill -f "remote-debugging-port=9222" 2>/dev/null || true
            sleep 2
            pkill -KILL -x mediamtx 2>/dev/null || true
            pkill -KILL -f "index.js --daemon-mode" 2>/dev/null || true
            for _ in $(seq 1 15); do
              lsof -nP -iTCP:8889 -sTCP:LISTEN >/dev/null 2>&1 || return 0
              sleep 1
            done
            echo "::error::Port 8889 still bound after cleanup; skipping retry to avoid a guaranteed conflict." >&2
            return 1
          }

          attempts=2
          for attempt in $(seq 1 "${attempts}"); do
            echo "::group::iOS device capture integration (attempt ${attempt}/${attempts})"
            bun run test:integration:webrtc-device && rc=0 || rc=$?
            echo "::endgroup::"
            if [ "${rc}" -eq 0 ]; then
              if [ "${attempt}" -gt 1 ]; then
                echo "iOS device capture passed on retry (transient macos-26 ScreenCaptureKit flake)."
              fi
              exit 0
            fi
            echo "iOS device capture attempt ${attempt} failed (exit ${rc})."
            if [ "${attempt}" -lt "${attempts}" ]; then
              echo "Reaping MediaMTX / daemon / Chrome before one retry."
              reap_before_retry || exit 1
            fi
          done
          echo "iOS device capture failed after ${attempts} attempts."
          exit 1

      - name: "Explain WebRTC device results"
        if: always()
        continue-on-error: true
        run: bash scripts/webrtc/explain-device-results.sh ios

      - name: "Upload WebRTC device artifacts"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ios-webrtc-device-artifacts-${{ github.run_attempt }}
          path: scratch/webrtc-device-integration/
          if-no-files-found: ignore
          retention-days: 7

  validate-mkdocs-nav:
    name: "Validate MkDocs Navigation"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        shell: "bash"
        run: scripts/ci/install-bun-deps.sh

      - name: "Validate MkDocs Navigation"
        shell: "bash"
        run: |
          scripts/validate_mkdocs_nav.sh

  validate-claude-plugin:
    name: "Validate Claude Plugin"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Validate Claude Plugin"
        shell: "bash"
        run: |
          scripts/claude/validate_plugin.sh

  validate-documentation-links:
    name: "Validate Documentation Links"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Create contributing file"
        shell: "bash"
        run: |
          touch docs/contributing.md

      - name: "Install Lychee"
        shell: "bash"
        run: |
          scripts/lychee/install_lychee.sh

      - name: "Validate Links"
        shell: "bash"
        # Lychee routes github.com links through the GitHub API (not throttled
        # HTTP scraping) when GITHUB_TOKEN is set, which prevents the mass
        # request timeouts we hit against the repo's own issue/actions links.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/lychee/validate_lychee.sh

  installer-minimal:
    name: "Installer Minimal (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    env:
      # ffmpeg is a large, slow install (it has timed out this job) and video
      # recording is not exercised here — skip it.
      AUTOMOBILE_INSTALL_SKIP_FFMPEG: "true"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          # Disabled on merge cleanup: >1 minute and not required for release/docs publishing.
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Run Installer (minimal)"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          set +e
          bash ./scripts/install.sh --preset minimal --non-interactive 2>&1 | tee ci-logs/installer.log
          install_status=${PIPESTATUS[0]}
          set -e
          echo "INSTALL_EXIT_CODE=${install_status}" >> "$GITHUB_ENV"
          exit 0

      - name: "Run Uninstaller"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          bash ./scripts/uninstall.sh --all --force 2>&1 | tee ci-logs/uninstaller.log
          uninstall_status=${PIPESTATUS[0]}
          set -e
          echo "UNINSTALL_EXIT_CODE=${uninstall_status}" >> "$GITHUB_ENV"
          exit 0

      - name: "Upload Logs"
        if: env.INSTALL_EXIT_CODE != '0' || env.UNINSTALL_EXIT_CODE != '0' || failure()
        uses: actions/upload-artifact@v6
        with:
          name: installer-minimal-${{ matrix.os }}-logs
          path: ci-logs/
          retention-days: 7

      - name: "Fail on error"
        if: env.INSTALL_EXIT_CODE != '0' || env.UNINSTALL_EXIT_CODE != '0'
        shell: bash
        run: |
          echo "Installer exit code: ${INSTALL_EXIT_CODE:-0}"
          echo "Uninstaller exit code: ${UNINSTALL_EXIT_CODE:-0}"
          exit 1

  node-unit-tests:
    name: "Node Unit Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 2

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - name: "Run complete unit lane"
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
          AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS: "720"
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            unset AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS
          fi
          bash scripts/test-ts.sh unit

      - name: "Enforce 100ms budget for merged unit tests"
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUN_TEST_TIMING_BASE_REF: HEAD^
          # Source-affected selection and its isolated offender reruns must not
          # inherit the short command wall limit used by a single unit shard.
          AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS: "720"
        run: bash scripts/validate-bun-test-timings.sh

  node-host-integration-tests:
    name: "Node Host Integration Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - name: "Run host integration lane"
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
          AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS: "900"
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            unset AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS
          fi
          bash scripts/test-ts.sh integration

      - name: "Run stress lane"
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
          AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS: "300"
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            unset AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS
          fi
          bash scripts/test-ts.sh stress

  mcp-build-and-test:
    name: "Node TypeScript Build and Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          # Disabled on merge cleanup: flaky timeout in Bun tests and not required for release/docs publishing.
          # - windows-latest
          # Disabled on merge cleanup: expensive and not required for release/docs publishing.
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Cache Turborepo"
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ matrix.os }}-

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Lint"
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run lint --output-logs=errors-only --log-order=grouped

      - name: "Run Build"
        shell: bash
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run build --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-build-${{ matrix.os }}.log"

      - name: "Upload Build/Test Logs"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mcp-build-test-logs-${{ matrix.os }}
          path: ci-logs/*.log
          retention-days: 7

  # =============================================================================
  # iOS Build and Test Jobs
  # =============================================================================

  ios-swift-build:
    name: "Build Swift Packages (${{ matrix.config.name }})"
    # Disabled: merge-only iOS validation is expensive and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ${{ matrix.config.runner }}
    env:
      IOS_SIGNING_ENABLED: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 15", runner: "macos-14", xcode: "15.4" }
          - { name: "Xcode 26", runner: "macos-26", xcode: "26.0" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Install macOS Developer ID certificate"
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-macos-signing-keychain.sh

      - name: "Install iOS signing certificate"
        if: ${{ env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-signing-keychain.sh

      - name: "Build Swift Packages"
        env:
          MACOS_SIGNING_ENABLED: ${{ env.MACOS_SIGNING_ENABLED }}
          MACOS_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
          MACOS_DEVELOPER_ID_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_ID_TEAM_ID }}
          MACOS_SIGNING_STRICT: ${{ env.MACOS_SIGNING_ENABLED }}
          IOS_SIGNING_ENABLED: ${{ env.IOS_SIGNING_ENABLED }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_SIGNING_TEAM_ID: ${{ secrets.IOS_SIGNING_TEAM_ID }}
          IOS_SIGNING_STRICT: ${{ env.IOS_SIGNING_ENABLED }}
        run: ./scripts/ios/swift-build.sh

  ios-swift-test:
    name: "Test Swift Packages (${{ matrix.config.name }})"
    # Disabled with iOS merge cleanup.
    if: ${{ false }}
    runs-on: ${{ matrix.config.runner }}
    needs: ios-swift-build
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 15", runner: "macos-14", xcode: "15.4" }
          - { name: "Xcode 26", runner: "macos-26", xcode: "26.0" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Test Swift Packages"
        run: ./scripts/ios/swift-test.sh

  ios-xcodegen:
    name: "Generate Xcode Projects"
    # Disabled with iOS merge cleanup.
    if: ${{ false }}
    runs-on: macos-26
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Generate Xcode Projects"
        run: ./scripts/ios/xcodegen-generate.sh

  ios-xcode-build:
    name: "Build Xcode Projects (${{ matrix.config.name }})"
    runs-on: ${{ matrix.config.runner }}
    needs: ios-xcodegen
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 15", runner: "macos-14", xcode: "15.4" }
          - { name: "Xcode 26", runner: "macos-26", xcode: "26.5" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Generate Xcode Projects"
        run: ./scripts/ios/xcodegen-generate.sh

      - name: "Build Xcode Projects"
        run: ./scripts/ios/xcode-build.sh

  # =============================================================================
  # Android Build and Test Jobs
  # =============================================================================

  junit-runner-unit-tests:
    name: "Run JUnit Runner Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      # Only run unit tests without Emulator
      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junit-runner:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

  junit-runner-kotlin-consumer-compatibility:
    name: "JUnit Runner Kotlin Consumer Compatibility"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Install JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: "Validate Kotlin 2.2 consumer compatibility"
        run: bash scripts/android/validate-junit-runner-kotlin-consumer.sh

      - name: "Upload Compatibility Logs"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-kotlin-consumer-compatibility-logs
          path: scratch/junit-runner-kotlin-consumer/logs/
          if-no-files-found: ignore

  sdk-debug-inspector-consumer:
    name: "SDK Debug Inspector Consumer"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Publish both SDK variants to the local Maven repo and prove a Maven
      # consumer's debug build receives the storage-inspection providers that
      # ship in the debug variant only (#5714), while release packages none.
      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":auto-mobile-sdk:publishToMavenLocal"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Verify published debug inspection providers"
        run: bash scripts/android/validate-sdk-debug-inspector-consumer.sh --skip-publish

  # The two emulator jobs below stay disabled on merge (runner-heavy, ~15 min
  # each) and run nightly instead. That left the CI emulator boot path with no
  # main-push signal at all: #4199 broke it and main stayed green (#4237). This
  # job is the cheap half of that signal -- it proves the product boot flow can
  # resolve the emulator binary on a runner where the third-party
  # emulator-runner action never executed, which is exactly the state an AVD
  # cache hit produces. It boots nothing and takes ~2 minutes.
  android-emulator-sdk-preflight:
    name: "Verify Android Emulator SDK Resolution"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Verify the emulator SDK resolves for the product boot flow"
        shell: "bash"
        run: scripts/android/verify-emulator-sdk-resolution.sh

  # Test isolation issue resolved in #107 and #109
  # Re-enabled in #110
  junit-runner-emulator-tests:
    name: "Run JUnit Runner Emulator Tests"
    # Disabled on merge: low signal and runner-heavy. Runs nightly instead
    # (see nightly.yml). PRs cover the TS<->device path via the iOS simulator
    # integration tripwire (pull_request.yml native_integration filter).
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-android-control-proxy
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      # Run AutoMobile tests that require emulator
      - uses: ./.github/actions/android-emulator
        with:
          script: "./gradlew :junit-runner:test"
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-emulator-test-results
          path: android/junit-runner/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "JUnit Runner Emulator Test Report"
          report_paths: "**/build/test-results/**/*.xml"

  playground-automobile-emulator-tests:
    name: "Run Playground Automobile Emulator Tests"
    # Disabled on merge: low signal and runner-heavy. Runs nightly instead
    # (see nightly.yml).
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-android-control-proxy
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      # Run AutoMobile tests that require emulator
      - uses: ./.github/actions/android-emulator
        with:
          script: "./gradlew :playground:app:test --stacktrace"
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playground-automobile-emulator-test-results
          path: android/playground/app/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "Playground Automobile Emulator Test Report"
          report_paths: "**/build/test-results/**/*.xml"

  android-control-proxy-unit-tests:
    name: "Run CtrlProxy Unit Tests"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":control-proxy:testDebugUnitTest"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

  build-junit-runner-library:
    name: "Build JUnitRunner Library"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junitRunner:assemble"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Store AAR"
        uses: actions/upload-artifact@v6
        with:
          name: aar
          path: core/build/outputs/aar/core-debug.aar

  build-android-control-proxy:
    name: "Build CtrlProxy APK"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":control-proxy:assembleDebug :video-server:d8Dex"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload CtrlProxy APK"
        uses: actions/upload-artifact@v6
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug/control-proxy-debug.apk

      - name: "Upload video-server jar"
        uses: actions/upload-artifact@v6
        with:
          name: video-server-jar
          path: android/video-server/build/libs/automobile-video.jar

  build-playground-app:
    name: "Build Playground App"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":playground:app:assembleDebug"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Store Sample APK"
        uses: actions/upload-artifact@v6
        if: success() # Only upload if build succeeded
        with:
          name: playground-app-apk
          path: android/playground/app/build/outputs/apk/debug/playground-app-debug.apk

