  # =============================================================================
  # TypeScript Code Coverage
  # =============================================================================

  ts-code-coverage:
    name: "TypeScript Code Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Tests with Coverage"
        run: bash scripts/ci/run-ts-coverage.sh

      - name: "Recover Coverage if needed"
        run: bash scripts/ci/verify-ts-coverage-output.sh

      - name: "Generate Coverage Badge"
        run: bash scripts/coverage/generate-badge.sh coverage/lcov.info coverage/ts-coverage-badge.json "TS coverage" "3178C6"

      - name: "Upload Coverage Badge"
        uses: actions/upload-artifact@v6
        with:
          name: ts-coverage-badge
          path: coverage/ts-coverage-badge.json
          retention-days: 90

  # =============================================================================
  # Kotlin Code Coverage
  # =============================================================================

  kotlin-code-coverage:
    name: "Kotlin Code Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junit-runner:test :junit-runner:jacocoTestReport :control-proxy:testDebugUnitTest :control-proxy:createDebugUnitTestCoverageReport :auto-mobile-sdk:testDebugUnitTest :auto-mobile-sdk:createDebugUnitTestCoverageReport :test-plan-validation:test :test-plan-validation:jacocoTestReport :protocol:test :protocol:jacocoTestReport :video-server:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Generate Kotlin Coverage Badge"
        run: bash scripts/coverage/generate-kotlin-badge.sh

      - name: "Upload Kotlin Coverage Badge"
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-coverage-badge
          path: coverage/kotlin-coverage-badge.json
          retention-days: 90

  # =============================================================================
  # Swift Code Coverage
  # =============================================================================

  swift-code-coverage:
    name: "Swift Code Coverage"
    runs-on: macos-14
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode 15.4"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: "Generate Swift Coverage Badge"
        run: bash scripts/coverage/generate-swift-coverage.sh

      - name: "Upload Swift Coverage Badge"
        uses: actions/upload-artifact@v6
        with:
          name: swift-coverage-badge
          path: coverage/swift-coverage-badge.json
          retention-days: 90

  deploy-docs:
    name: "Deploy Documentation"
    runs-on: ubuntu-latest
    needs: [kotlin-code-coverage, swift-code-coverage]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0  # Fetch full history for git-revision-date-localized plugin
          token: ${{ secrets.GITHUB_TOKEN }}

      # Independent of each other: setup-uv fetches a standalone binary and
      # never reads the Python toolchain. Both are joined before `uv sync`.
      - name: "Setup Python"
        uses: actions/setup-python@v6
        background: true
        id: setup-python
        with:
          python-version: '3.11'

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7
        background: true
        id: setup-uv
        with:
          enable-cache: true

      - wait: [setup-python, setup-uv]

      - name: "Install MkDocs and dependencies"
        working-directory: scripts/github
        run: uv sync

      - name: "Build documentation"
        run: scripts/github/deploy_pages.py build

      # Distinct artifacts landing on distinct filenames, so they overlap. They
      # must stay AFTER "Build documentation" -- mkdocs regenerates/cleans
      # site/, which would delete a badge that landed early.
      - name: "Download Kotlin Coverage Badge"
        uses: actions/download-artifact@v7
        background: true
        id: dl-kotlin-badge
        with:
          name: kotlin-coverage-badge
          path: site

      - name: "Download Swift Coverage Badge"
        uses: actions/download-artifact@v7
        background: true
        id: dl-swift-badge
        with:
          name: swift-coverage-badge
          path: site

      - wait: [dl-kotlin-badge, dl-swift-badge]

      - name: "Setup Pages"
        uses: actions/configure-pages@v5

      - name: "Upload artifact"
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

  # =============================================================================
  # MCP Context Baselines
  # =============================================================================

  benchmark-context-thresholds:
    name: "Benchmark MCP Context Baselines"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Context Baseline Benchmark"
        id: benchmark
        run: |
          # Create reports directory
          mkdir -p reports

          # Run benchmark and capture exit code
          bun run benchmark-context --output reports/context-benchmark.json || echo "FAILED=true" >> $GITHUB_ENV

          # Always preserve the report file even if benchmark failed
          exit 0

      - name: "Upload Benchmark Report"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: context-benchmark-report
          path: reports/context-benchmark.json
          retention-days: 90

      - name: "Check Benchmark Result"
        if: always()
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::MCP context benchmark failed - one or more configured thresholds were exceeded"
            cat reports/context-benchmark.json
            exit 1
          fi
          echo "::notice::MCP context baseline benchmark completed"

  # =============================================================================
  # Auto-update README Test Count Badges
  # =============================================================================

  update-readme-badges:
    name: "Update README Test Count Badges"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize badge pushes so two merges can't race to push a badge commit to
    # main at once (issue #3590). cancel-in-progress:false lets a queued run wait
    # rather than drop the update; the run recomputes counts from scratch anyway.
    concurrency:
      group: update-readme-badges
      cancel-in-progress: false
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0  # Full history so the badge commit push to main isn't rejected as a shallow update
          token: ${{ secrets.AUTO_MOBILE_PR_TOKEN }}

      - name: "Commit and push badge update to main"
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # AUTO_MOBILE_PR_TOKEN is an admin actor and bypasses the green-main
          # ruleset, so the script pushes straight to main with no PR or status
          # checks. It re-syncs to origin/main and regenerates the badge each
          # attempt (exiting cleanly when counts are unchanged), so a concurrent
          # push can never leave a conflicted rebase.
          bash scripts/push-readme-badges.sh
