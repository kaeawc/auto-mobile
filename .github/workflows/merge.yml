name: "On Merge"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  checks: write
  security-events: write
  pull-requests: write
  contents: write
  packages: write

jobs:
  build-desktop-core:
    name: "Build Desktop Core Module"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-core:build -x test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  desktop-core-unit-tests:
    name: "Run Desktop Core Unit Tests"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: build-desktop-core
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-core:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-core-test-results
          path: android/desktop-core/build/reports/tests/test/

      # Screenshot comparisons fail with pixel diffs that are only inspectable
      # as images -- the HTML test report above carries the stack trace but not
      # the rendering. See issue #3913.
      - name: "Upload Screenshot Diffs"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-core-screenshot-diffs
          path: android/desktop-core/build/reports/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  build-ide-plugin:
    name: "Build IDE Plugin"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/ide-plugin
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "build -x test"
          gradle-project-directory: "android/ide-plugin"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Build Plugin ZIP"
        shell: bash
        working-directory: android/ide-plugin
        run: |
          ./gradlew buildPlugin --stacktrace --continue

      - name: "Verify Plugin"
        shell: bash
        working-directory: android/ide-plugin
        run: |
          ./gradlew verifyPlugin --stacktrace --continue

      - name: "Upload IDE Plugin ZIP"
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: ide-plugin-zip
          path: android/ide-plugin/build/distributions/*.zip

  ide-plugin-unit-tests:
    name: "Run IDE Plugin Unit Tests"
    # Disabled with IDE plugin build on merge cleanup.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: build-ide-plugin
    defaults:
      run:
        working-directory: android/ide-plugin
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "test"
          gradle-project-directory: "android/ide-plugin"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ide-plugin-test-results
          path: android/ide-plugin/build/reports/tests/test/

  build-desktop-app:
    name: "Build Desktop App (${{ matrix.os }})"
    # Disabled: desktop app merge validation is expensive and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-app:build -x test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}-${{ matrix.os }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          malloc-replacement: ${{ runner.os == 'Linux' && 'jemalloc' || 'none' }}

  desktop-app-unit-tests:
    name: "Run Desktop App Unit Tests"
    # Disabled with desktop app merge cleanup.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: build-desktop-app
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-app:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-app-test-results
          path: android/desktop-app/build/reports/tests/test/

  validate-xml:
    name: "Validate XML"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Run XMLStarlet"
        shell: "bash"
        run: |
          sudo apt-get update
          sudo apt-get install xmlstarlet
          scripts/xml/validate_xml.sh

  ktfmt:
    name: "ktfmt"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Pin the JDK so ktfmt output is deterministic and matches local dev
      # (the project targets Java 21), rather than depending on whatever JDK the
      # runner image ships by default.
      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: "Run ktfmt"
        shell: "bash"
        run: |
          INSTALL_KTFMT_WHEN_MISSING=true ONLY_TOUCHED_FILES=false scripts/ktfmt/validate_ktfmt.sh

  # The full-tree backstop. PRs run detekt scoped to the modules they changed
  # (pull_request.yml), which cannot see a violation introduced in a *consumer*
  # of a changed module -- this unscoped post-merge run is what catches that.
  # Its own job rather than a step in ktfmt so it does not serialize behind a
  # 20-second format check, and so it can reuse the Gradle caches.
  detekt:
    name: "Detekt"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "detektMain detektTest"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Detekt Reports"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports
          path: android/**/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

  validate-shell-scripts:
    name: "Validate Shell Scripts"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Run ShellCheck"
        shell: "bash"
        run: |
          scripts/shellcheck/validate_shell_scripts.sh

      - name: "Validate stdlib-first conventions"
        shell: "bash"
        run: |
          scripts/conventions/validate-stdlib-first.sh

  bats-tests:
    name: "BATS Shell Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Pure network/disk (`brew install bats-core` on macOS, a source install on
      # Linux) and independent of the Bun setup below, which only writes
      # node_modules. Background it so the two overlap, then re-sync at the
      # barrier before `bats test/bats/`, the sole consumer of both. Mechanism
      # per #3779. shellcheck is installed here too: the markdown-bash gate
      # (validate-markdown-bash.bats, #4118) is the first bats-tested script that
      # shells out to the real shellcheck binary — every other shell validator
      # scans with grep — and the macOS runner image does not ship shellcheck, so
      # without this the whole suite mysteriously failed (#4801). The step name is
      # pinned to "Install BATS" by test/scripts/batsInstallHoist.test.ts (#4126).
      - name: "Install BATS"
        shell: bash
        background: true
        id: install-bats
        run: |
          if command -v bats &>/dev/null; then
            echo "bats already installed: $(bats --version)"
          elif command -v brew &>/dev/null; then
            brew install bats-core
          else
            # Ubuntu apt 'bats' is the old sstephenson/bats which doesn't
            # capture stderr in run output. Install bats-core from source.
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
            sudo /tmp/bats-core/install.sh /usr/local
          fi
          if command -v shellcheck &>/dev/null; then
            echo "shellcheck already installed: $(shellcheck --version | awk '/^version:/{print $2}')"
          elif command -v brew &>/dev/null; then
            brew install shellcheck
          else
            echo "shellcheck missing and no package manager to install it" >&2
            exit 1
          fi

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Stays in the foreground: it appends node_modules/.bin to $GITHUB_PATH.
      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - wait: install-bats

      - name: "Run BATS Tests"
        run: bats test/bats/

  # Always exercise the real WHIP publisher contract post-merge on main:
  # FFmpeg H.264 -> WebRtcPublisher -> MediaMTX -> headless-Chrome WHEP decode.
  # On PRs this runs only when WebRTC is in play (pull_request.yml); here it is
  # unconditional so the publisher contract is verified on every merge.
  webrtc-integration-test:
    name: "WebRTC Publisher Integration (MediaMTX)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Install FFmpeg and verify a browser is present"
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          if ! command -v google-chrome >/dev/null 2>&1 \
            && ! command -v chromium >/dev/null 2>&1 \
            && ! command -v chromium-browser >/dev/null 2>&1; then
            echo "::error::No Chrome/Chromium found on the runner; the WHEP decode step needs one"
            exit 1
          fi

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Stays in the foreground: it appends node_modules/.bin to $GITHUB_PATH.
      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - name: "Cache MediaMTX binary"
        uses: actions/cache@v4
        with:
          path: scratch/mediamtx
          key: mediamtx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/webrtc/run-mediamtx-publisher-integration.sh') }}

      - name: "Run MediaMTX WebRTC publisher integration test"
        shell: bash
        run: bun run test:integration:webrtc-mediamtx

  validate-mkdocs-nav:
    name: "Validate MkDocs Navigation"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: "Install Bun dependencies"
        shell: "bash"
        run: scripts/ci/install-bun-deps.sh

      - name: "Validate MkDocs Navigation"
        shell: "bash"
        run: |
          scripts/validate_mkdocs_nav.sh

  validate-claude-plugin:
    name: "Validate Claude Plugin"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Validate Claude Plugin"
        shell: "bash"
        run: |
          scripts/claude/validate_plugin.sh

  validate-documentation-links:
    name: "Validate Documentation Links"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Create contributing file"
        shell: "bash"
        run: |
          touch docs/contributing.md

      - name: "Install Lychee"
        shell: "bash"
        run: |
          scripts/lychee/install_lychee.sh

      - name: "Validate Links"
        shell: "bash"
        run: |
          scripts/lychee/validate_lychee.sh

  installer-minimal:
    name: "Installer Minimal (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          # Disabled on merge cleanup: >1 minute and not required for release/docs publishing.
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Run Installer (minimal)"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          set +e
          bash ./scripts/install.sh --preset minimal --non-interactive 2>&1 | tee ci-logs/installer.log
          install_status=${PIPESTATUS[0]}
          set -e
          echo "INSTALL_EXIT_CODE=${install_status}" >> "$GITHUB_ENV"
          exit 0

      - name: "Run Uninstaller"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          bash ./scripts/uninstall.sh --all --force 2>&1 | tee ci-logs/uninstaller.log
          uninstall_status=${PIPESTATUS[0]}
          set -e
          echo "UNINSTALL_EXIT_CODE=${uninstall_status}" >> "$GITHUB_ENV"
          exit 0

      - name: "Upload Logs"
        if: env.INSTALL_EXIT_CODE != '0' || env.UNINSTALL_EXIT_CODE != '0' || failure()
        uses: actions/upload-artifact@v6
        with:
          name: installer-minimal-${{ matrix.os }}-logs
          path: ci-logs/
          retention-days: 7

      - name: "Fail on error"
        if: env.INSTALL_EXIT_CODE != '0' || env.UNINSTALL_EXIT_CODE != '0'
        shell: bash
        run: |
          echo "Installer exit code: ${INSTALL_EXIT_CODE:-0}"
          echo "Uninstaller exit code: ${UNINSTALL_EXIT_CODE:-0}"
          exit 1

  installer-development:
    name: "Installer Development (${{ matrix.os }})"
    # Disabled: very slow and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Build source CLI for installer diagnostics"
        uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Run Installer (development)"
        id: run-installer-development
        shell: bash
        continue-on-error: true
        env:
          # Keep this disabled-job definition aligned with the PR installer lane.
          AUTOMOBILE_DAEMON_STARTUP_TIMEOUT_MS: "30000"
          AUTOMOBILE_STARTUP_BENCHMARK: "1"
          AUTOMOBILE_STARTUP_BENCHMARK_OUTPUT: "${{ github.workspace }}/ci-logs/installer-daemon-startup.json"
          AUTOMOBILE_STARTUP_BENCHMARK_LABEL: "installer-development-${{ matrix.os }}"
          AUTOMOBILE_CLI_PATH: "${{ github.workspace }}/dist/src/index.js"
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          set +e
          bash ./scripts/install.sh --contributor --preset development --non-interactive 2>&1 | tee ci-logs/installer.log
          install_status=${PIPESTATUS[0]}
          set -e
          mkdir -p ci-logs/daemon-logs
          if [[ -d "${HOME}/.auto-mobile/logs" ]]; then
            cp -R "${HOME}/.auto-mobile/logs/." ci-logs/daemon-logs/ || true
          else
            echo "No daemon logs directory was created" > ci-logs/daemon-logs/README.txt
          fi
          : > ci-logs/ctrl-proxy-cache-state.txt
          for cache_path in "${TMPDIR:-/tmp}"/auto-mobile-prefetch-* "${HOME}/.automobile/ctrl-proxy-ios"; do
            [[ -e "${cache_path}" ]] || continue
            printf '%s\n' "=== ${cache_path} ===" >> ci-logs/ctrl-proxy-cache-state.txt
            find "${cache_path}" -maxdepth 2 -mindepth 0 -print >> ci-logs/ctrl-proxy-cache-state.txt 2>&1 || true
          done
          echo "INSTALL_EXIT_CODE=${install_status}" >> "$GITHUB_ENV"
          echo "install_exit_code=${install_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "Verify runtime dependencies"
        if: steps.run-installer-development.outputs.install_exit_code == '0'
        run: ./scripts/ci/verify-runtime-deps.sh

      - name: "Build from source"
        if: steps.run-installer-development.outputs.install_exit_code == '0'
        shell: bash
        run: |
          export PATH="${HOME}/.bun/bin:${PATH}"
          bun install --frozen-lockfile
          bunx turbo run build --output-logs=errors-only

      - name: "Daemon lifecycle (start → health → doctor → stop)"
        if: steps.run-installer-development.outputs.install_exit_code == '0'
        run: ./scripts/ci/daemon-lifecycle.sh

      - name: "Upload Logs"
        if: steps.run-installer-development.outputs.install_exit_code != '0' || failure()
        uses: actions/upload-artifact@v6
        with:
          name: installer-development-${{ matrix.os }}-logs
          path: ci-logs/
          retention-days: 7

      - name: "Fail on error"
        if: steps.run-installer-development.outputs.install_exit_code != '0'
        shell: bash
        run: |
          echo "Installer exit code: ${{ steps.run-installer-development.outputs.install_exit_code }}"
          exit 1

  mcp-build-and-test:
    name: "Node TypeScript Build and Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          # Disabled on merge cleanup: flaky timeout in Bun tests and not required for release/docs publishing.
          # - windows-latest
          # Disabled on merge cleanup: expensive and not required for release/docs publishing.
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Cache Turborepo"
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ matrix.os }}-

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Lint"
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run lint --output-logs=errors-only --log-order=grouped

      - name: "Run Build"
        shell: bash
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run build --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-build-${{ matrix.os }}.log"

      - name: "Run Tests"
        shell: bash
        env:
          # Force AdbClient into test mode on Windows to prevent adb daemon startup
          AUTOMOBILE_TEST_MODE: ${{ matrix.os == 'windows-latest' && 'true' || '' }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run test --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-test-${{ matrix.os }}.log"

      - name: "Upload Build/Test Logs"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mcp-build-test-logs-${{ matrix.os }}
          path: ci-logs/*.log
          retention-days: 7

  # =============================================================================
  # iOS Build and Test Jobs
  # =============================================================================

  ios-swift-build:
    name: "Build Swift Packages (${{ matrix.config.name }})"
    # Disabled: merge-only iOS validation is expensive and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ${{ matrix.config.runner }}
    env:
      IOS_SIGNING_ENABLED: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 15", runner: "macos-14", xcode: "15.4" }
          - { name: "Xcode 26", runner: "macos-26", xcode: "26.0" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Install macOS Developer ID certificate"
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-macos-signing-keychain.sh

      - name: "Install iOS signing certificate"
        if: ${{ env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-signing-keychain.sh

      - name: "Build Swift Packages"
        env:
          MACOS_SIGNING_ENABLED: ${{ env.MACOS_SIGNING_ENABLED }}
          MACOS_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
          MACOS_DEVELOPER_ID_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_ID_TEAM_ID }}
          MACOS_SIGNING_STRICT: ${{ env.MACOS_SIGNING_ENABLED }}
          IOS_SIGNING_ENABLED: ${{ env.IOS_SIGNING_ENABLED }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_SIGNING_TEAM_ID: ${{ secrets.IOS_SIGNING_TEAM_ID }}
          IOS_SIGNING_STRICT: ${{ env.IOS_SIGNING_ENABLED }}
        run: ./scripts/ios/swift-build.sh

  ios-swift-test:
    name: "Test Swift Packages (${{ matrix.config.name }})"
    # Disabled with iOS merge cleanup.
    if: ${{ false }}
    runs-on: ${{ matrix.config.runner }}
    needs: ios-swift-build
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 15", runner: "macos-14", xcode: "15.4" }
          - { name: "Xcode 26", runner: "macos-26", xcode: "26.0" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Test Swift Packages"
        run: ./scripts/ios/swift-test.sh

  ios-xcodegen:
    name: "Generate Xcode Projects"
    # Disabled with iOS merge cleanup.
    if: ${{ false }}
    runs-on: macos-26
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Generate Xcode Projects"
        run: ./scripts/ios/xcodegen-generate.sh

  ios-xcode-build:
    name: "Build Xcode Projects (${{ matrix.config.name }})"
    runs-on: ${{ matrix.config.runner }}
    needs: ios-xcodegen
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 15", runner: "macos-14", xcode: "15.4" }
          - { name: "Xcode 26", runner: "macos-26", xcode: "26.5" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Generate Xcode Projects"
        run: ./scripts/ios/xcodegen-generate.sh

      - name: "Build Xcode Projects"
        run: ./scripts/ios/xcode-build.sh

  # =============================================================================
  # Android Build and Test Jobs
  # =============================================================================

  junit-runner-unit-tests:
    name: "Run JUnit Runner Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      # Only run unit tests without Emulator
      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junit-runner:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

  junit-runner-kotlin-consumer-compatibility:
    name: "JUnit Runner Kotlin Consumer Compatibility"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Install JDK"
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: "Validate Kotlin 2.2 consumer compatibility"
        run: bash scripts/android/validate-junit-runner-kotlin-consumer.sh

      - name: "Upload Compatibility Logs"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-kotlin-consumer-compatibility-logs
          path: scratch/junit-runner-kotlin-consumer/logs/
          if-no-files-found: ignore

  # The two emulator jobs below stay disabled on merge (runner-heavy, ~15 min
  # each) and run nightly instead. That left the CI emulator boot path with no
  # main-push signal at all: #4199 broke it and main stayed green (#4237). This
  # job is the cheap half of that signal -- it proves the product boot flow can
  # resolve the emulator binary on a runner where the third-party
  # emulator-runner action never executed, which is exactly the state an AVD
  # cache hit produces. It boots nothing and takes ~2 minutes.
  android-emulator-sdk-preflight:
    name: "Verify Android Emulator SDK Resolution"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Verify the emulator SDK resolves for the product boot flow"
        shell: "bash"
        run: scripts/android/verify-emulator-sdk-resolution.sh

  # Test isolation issue resolved in #107 and #109
  # Re-enabled in #110
  junit-runner-emulator-tests:
    name: "Run JUnit Runner Emulator Tests"
    # Disabled on merge: low signal and runner-heavy. Runs nightly instead
    # (see nightly.yml). PRs cover the TS<->device path via the iOS simulator
    # integration tripwire (pull_request.yml native_integration filter).
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-android-control-proxy
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      # Run AutoMobile tests that require emulator
      - uses: ./.github/actions/android-emulator
        with:
          script: "./gradlew :junit-runner:test"
          working-directory: './android/'
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-emulator-test-results
          path: android/junit-runner/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "JUnit Runner Emulator Test Report"
          report_paths: '**/build/test-results/**/*.xml'

  playground-automobile-emulator-tests:
    name: "Run Playground Automobile Emulator Tests"
    # Disabled on merge: low signal and runner-heavy. Runs nightly instead
    # (see nightly.yml).
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-android-control-proxy
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      # Run AutoMobile tests that require emulator
      - uses: ./.github/actions/android-emulator
        with:
          script: "./gradlew :playground:app:test --stacktrace"
          working-directory: './android/'
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playground-automobile-emulator-test-results
          path: android/playground/app/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "Playground Automobile Emulator Test Report"
          report_paths: '**/build/test-results/**/*.xml'

  android-control-proxy-unit-tests:
    name: "Run CtrlProxy Unit Tests"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":control-proxy:testDebugUnitTest"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

  build-junit-runner-library:
    name: "Build JUnitRunner Library"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junitRunner:assemble"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Store AAR"
        uses: actions/upload-artifact@v6
        with:
          name: aar
          path: core/build/outputs/aar/core-debug.aar

  build-android-control-proxy:
    name: "Build CtrlProxy APK"
    # Disabled: only needed for disabled emulator merge jobs.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":control-proxy:assembleDebug"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload CtrlProxy APK"
        uses: actions/upload-artifact@v6
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug/control-proxy-debug.apk

  build-playground-app:
    name: "Build Playground App"
    # Disabled: consistently >1 minute on merge and not required for release/docs publishing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":playground:app:assembleDebug"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Store Sample APK"
        uses: actions/upload-artifact@v6
        if: success()  # Only upload if build succeeded
        with:
          name: playground-app-apk
          path: android/playground/app/build/outputs/apk/debug/playground-app-debug.apk

  publish-android-libraries-snapshot:
    name: "Publish Android Libraries Snapshot"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - validate-xml
      - ktfmt
      # detekt used to be a step inside the ktfmt job, so this list covered it
      # transitively. It is its own job now -- without this entry, Android
      # library snapshots would publish to Maven Central with detekt red.
      - detekt
      - validate-shell-scripts
      - validate-claude-plugin
      - validate-mkdocs-nav
      - validate-documentation-links
      - mcp-build-and-test
      - junit-runner-kotlin-consumer-compatibility
      - junit-runner-unit-tests
      - benchmark-context-thresholds
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME || vars.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD || vars.MAVEN_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME || vars.MAVEN_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD || vars.MAVEN_PASSWORD }}
      SIGNING_IN_MEMORY_KEY: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY || vars.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
      SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD || vars.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
      SIGNING_IN_MEMORY_KEY_ID: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID || vars.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Read library version"
        id: library-version
        shell: bash
        run: |
          # Read VERSION_NAME from gradle.properties (single source of truth)
          version=$(grep -E '^VERSION_NAME=' android/gradle.properties | cut -d'=' -f2)
          if [ -z "$version" ]; then
            echo "Could not find VERSION_NAME in android/gradle.properties" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Library version: $version"

      - name: "Verify Maven Central credentials"
        if: ${{ endsWith(steps.library-version.outputs.version, '-SNAPSHOT') }}
        shell: bash
        run: |
          if [ -z "$MAVEN_USERNAME" ] || [ -z "$MAVEN_PASSWORD" ]; then
            echo "Missing MAVEN_USERNAME or MAVEN_PASSWORD for snapshot publish." >&2
            exit 1
          fi

      - name: "Export signing credentials"
        if: ${{ endsWith(steps.library-version.outputs.version, '-SNAPSHOT') }}
        shell: bash
        run: |
          if [ -n "$SIGNING_IN_MEMORY_KEY" ]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey=$SIGNING_IN_MEMORY_KEY" >> "$GITHUB_ENV"
          fi
          if [ -n "$SIGNING_IN_MEMORY_KEY_PASSWORD" ]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=$SIGNING_IN_MEMORY_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$SIGNING_IN_MEMORY_KEY_ID" ]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyId=$SIGNING_IN_MEMORY_KEY_ID" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/gradle-task-run
        if: ${{ endsWith(steps.library-version.outputs.version, '-SNAPSHOT') }}
        with:
          gradle-tasks: ":test-plan-validation:publish :junit-runner:publish :auto-mobile-sdk:publish"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Skip snapshot publish (non-snapshot version)"
        if: ${{ !endsWith(steps.library-version.outputs.version, '-SNAPSHOT') }}
        run: |
          echo "Skipping publish. Version is ${{ steps.library-version.outputs.version }}."

