name: "Nightly"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write
  # mikepenz/action-junit-report (emulator test report steps) creates a check run.
  checks: write

jobs:
  # Nightly schedules no GitHub-hosted macOS job (#11010). The macOS BATS / Node
  # lanes, the Xcode 26.5 / 26.6 Swift Packages and Build Xcode Projects sweeps,
  # XCTestRunner Thread Sanitizer and XCTestRunner Simulator Tests run on CircleCI's
  # `nightly-macos` workflow (.circleci/continue_config.yml), started by a scheduled
  # pipeline. build-ctrl-proxy-ios-ipa below is the release IPA workflow (out of
  # scope: release/signing workflows stay on GitHub).

  # Advisory and independent, following auto-advance-race-guard.
  node-randomized-unit-tests:
    name: "Node Randomized Unit Tests (Advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      # Local repro: AUTOMOBILE_TEST_MODE=true AUTOMOBILE_UNIT_RANDOM_SEED=N bash scripts/test-ts.sh unit
      # Executes bun test --randomize --seed=N <files> using the canonical unit file list.
      - name: "Run randomized unit lane"
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
          AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS: "720"
          AUTOMOBILE_UNIT_RANDOM_SEED: ${{ github.run_number }}
        run: bash scripts/test-ts.sh unit

  # Advisory canary for the Bun 1.4 upgrade (scratch/bun-14-upgrade.md, step 1).
  # Every other job stays pinned to 1.3.14; this one runs the full unit and
  # integration suites on the newer runtime. No downstream job depends on it.
  node-bun-14-canary:
    name: "Node Tests on Bun 1.4 (Advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Setup Bun 1.4"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      # Both lanes always run so one failure does not hide the other; the step
      # still fails (advisory) when either lane fails.
      - name: "Run unit and integration lanes on Bun 1.4"
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
        run: |
          mkdir -p scratch/bun-14-canary
          summary=scratch/bun-14-canary/summary.md
          {
            echo "# Bun 1.4 canary"
            echo
            echo "- bun: $(bun --version)"
            echo "- commit: ${GITHUB_SHA}"
            echo
          } > "$summary"
          failed=0
          for lane in unit integration; do
            case "$lane" in
              unit) wall=720 ;;
              integration) wall=900 ;;
            esac
            set +e
            AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS="$wall" bash scripts/test-ts.sh "$lane" \
              2>&1 | tee "scratch/bun-14-canary/${lane}.log"
            status="${PIPESTATUS[0]}"
            set -e
            echo "- ${lane}: exit ${status}" >> "$summary"
            if [[ "$status" -ne 0 ]]; then failed=1; fi
          done
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: "Upload Bun 1.4 canary summary"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bun-14-canary
          path: |
            scratch/bun-14-canary/
            scratch/test-ts-unit-shards/**
            scratch/timing-unit-reports/**
          if-no-files-found: ignore
          retention-days: 7

  # Opt-in diagnostic only: like the foldable lane, this cannot fail Nightly.
  # No downstream job depends on its result; guard findings remain visible here.
  auto-advance-race-guard:
    name: "Auto-Advance Race Guard"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - name: "Run auto-advance race guard"
        shell: bash
        run: bash scripts/ci/auto-advance-race-guard.sh

  build-control-proxy-apk:
    uses: ./.github/workflows/build-control-proxy-apk.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

  build-ctrl-proxy-ios-ipa:
    uses: ./.github/workflows/build-ctrl-proxy-ios-ipa.yml

  build-video-server-jar:
    uses: ./.github/workflows/build-video-server-jar.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  update-sha256:
    name: "Update SHA256 Checksums"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-control-proxy-apk, build-ctrl-proxy-ios-ipa, build-video-server-jar]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          # Full history so the direct push to main isn't rejected as a shallow
          # update, and the admin token so it bypasses the green-main ruleset.
          fetch-depth: 0
          token: ${{ secrets.AUTO_MOBILE_PR_TOKEN }}

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Download APK artifact"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: /tmp

      - name: "Download IPA artifact"
        uses: actions/download-artifact@v7
        with:
          name: ctrl-proxy-ios-ipa
          path: /tmp

      - name: "Download video-server jar artifact"
        uses: actions/download-artifact@v7
        with:
          name: video-server-jar
          path: /tmp

      - name: "Verify APK SHA256"
        run: bash scripts/ci/verify-transit-sha256.sh /tmp/control-proxy-debug.apk "${{ needs.build-control-proxy-apk.outputs.sha256 }}"

      - name: "Verify IPA SHA256"
        run: bash scripts/ci/verify-transit-sha256.sh /tmp/control-proxy.ipa "${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}"

      - name: "Verify video-server jar SHA256"
        run: bash scripts/ci/verify-transit-sha256.sh /tmp/automobile-video.jar "${{ needs.build-video-server-jar.outputs.sha256 }}"

      - name: "Get current SHA256 values from source"
        id: current
        run: |
          # Read each field from the dedicated NIGHTLY_CHECKSUM_ENTRY via the
          # typed module reader — the single
          # source of truth also used by verify-artifact-sha256.sh +
          # verify-release-integrity.sh (which read registry[0]). Nightly must
          # compare against — and later overwrite — the nightly slot, NEVER a
          # tagged registry entry: writing main-built shas onto a tagged entry
          # makes "latest" verify the immutable published asset against a
          # main-built sha (#3784). Anchoring on the quoted `version: "nightly"`
          # line also skips the `ReleaseChecksumEntry` interface declarations
          # (`apkSha256: string;`) that precede the registry (#3784).
          RELEASE_TS="src/constants/release.ts"
          APK_CURRENT=$(bun scripts/read-release-registry.ts apkSha256 "$RELEASE_TS" nightly)
          IPA_CURRENT=$(bun scripts/read-release-registry.ts ipaSha256 "$RELEASE_TS" nightly)
          RUNNER_CURRENT=$(bun scripts/read-release-registry.ts runnerSha256 "$RELEASE_TS" nightly)
          VIDEO_JAR_CURRENT=$(bun scripts/read-release-registry.ts videoJarSha256 "$RELEASE_TS" nightly)
          echo "apk_sha256=$APK_CURRENT" >> $GITHUB_OUTPUT
          echo "ipa_sha256=$IPA_CURRENT" >> $GITHUB_OUTPUT
          echo "runner_sha256=$RUNNER_CURRENT" >> $GITHUB_OUTPUT
          echo "video_jar_sha256=$VIDEO_JAR_CURRENT" >> $GITHUB_OUTPUT
          echo "Current APK SHA256: ${APK_CURRENT:-(empty)}"
          echo "Current IPA SHA256: ${IPA_CURRENT:-(empty)}"
          echo "Current iOS runner SHA256: ${RUNNER_CURRENT:-(empty)}"
          echo "Current video-server jar SHA256: ${VIDEO_JAR_CURRENT:-(empty)}"

      - name: "Check if updates needed"
        id: check
        run: |
          NEW_APK="${{ needs.build-control-proxy-apk.outputs.sha256 }}"
          OLD_APK="${{ steps.current.outputs.apk_sha256 }}"
          NEW_IPA="${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}"
          OLD_IPA="${{ steps.current.outputs.ipa_sha256 }}"
          NEW_RUNNER="${{ needs.build-ctrl-proxy-ios-ipa.outputs.runner_sha256 }}"
          OLD_RUNNER="${{ steps.current.outputs.runner_sha256 }}"
          NEW_VIDEO_JAR="${{ needs.build-video-server-jar.outputs.sha256 }}"
          OLD_VIDEO_JAR="${{ steps.current.outputs.video_jar_sha256 }}"

          APK_CHANGED="false"
          IPA_CHANGED="false"
          RUNNER_CHANGED="false"
          VIDEO_JAR_CHANGED="false"

          if [ "$NEW_APK" != "$OLD_APK" ]; then
            APK_CHANGED="true"
            echo "APK SHA256 changed"
            echo "  Previous: ${OLD_APK:-(empty)}"
            echo "  New:      $NEW_APK"
          else
            echo "APK SHA256 unchanged"
          fi

          if [ "$NEW_IPA" != "$OLD_IPA" ]; then
            IPA_CHANGED="true"
            echo "IPA SHA256 changed"
            echo "  Previous: ${OLD_IPA:-(empty)}"
            echo "  New:      $NEW_IPA"
          else
            echo "IPA SHA256 unchanged"
          fi

          # The runner binary lives inside the IPA, so a runner change usually
          # also changes the IPA sha — but detect it independently so an empty
          # or stale runner sha (e.g. a registry entry cut before the runner-sha
          # wiring) is backfilled even when the IPA is byte-identical.
          if [ "$NEW_RUNNER" != "$OLD_RUNNER" ]; then
            RUNNER_CHANGED="true"
            echo "iOS runner SHA256 changed"
            echo "  Previous: ${OLD_RUNNER:-(empty)}"
            echo "  New:      $NEW_RUNNER"
          else
            echo "iOS runner SHA256 unchanged"
          fi

          if [ "$NEW_VIDEO_JAR" != "$OLD_VIDEO_JAR" ]; then
            VIDEO_JAR_CHANGED="true"
            echo "video-server jar SHA256 changed"
            echo "  Previous: ${OLD_VIDEO_JAR:-(empty)}"
            echo "  New:      $NEW_VIDEO_JAR"
          else
            echo "video-server jar SHA256 unchanged"
          fi

          echo "apk_changed=$APK_CHANGED" >> $GITHUB_OUTPUT
          echo "ipa_changed=$IPA_CHANGED" >> $GITHUB_OUTPUT
          echo "runner_changed=$RUNNER_CHANGED" >> $GITHUB_OUTPUT
          echo "video_jar_changed=$VIDEO_JAR_CHANGED" >> $GITHUB_OUTPUT

          if [ "$APK_CHANGED" = "true" ] || [ "$IPA_CHANGED" = "true" ] || [ "$RUNNER_CHANGED" = "true" ] || [ "$VIDEO_JAR_CHANGED" = "true" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
          fi

      - name: "Build commit subject"
        if: steps.check.outputs.needed == 'true'
        id: pr-title
        run: |
          APK_CHANGED="${{ steps.check.outputs.apk_changed }}"
          IPA_CHANGED="${{ steps.check.outputs.ipa_changed }}"
          RUNNER_CHANGED="${{ steps.check.outputs.runner_changed }}"

          # These become the commit subject of the direct-to-main push below. They
          # are ALSO matched EXACTLY by the sha256-only PR classifier in
          # pull_request.yml, which still skips heavy CI for hand-opened checksum
          # PRs — keep these strings verbatim. When the video-server jar also
          # changed it is reflected in the commit body table below; only the
          # jar-ONLY case gets its own subject.
          if [ "$APK_CHANGED" = "true" ] && [ "$IPA_CHANGED" = "true" ] && [ "$RUNNER_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy APK, iOS IPA, and iOS runner SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$APK_CHANGED" = "true" ] && [ "$IPA_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy APK and CtrlProxy iOS IPA SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$APK_CHANGED" = "true" ] && [ "$RUNNER_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy APK and CtrlProxy iOS runner SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$IPA_CHANGED" = "true" ] && [ "$RUNNER_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy iOS IPA and iOS runner SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$APK_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy APK SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy iOS runner SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$IPA_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy iOS IPA SHA256" >> "$GITHUB_OUTPUT"
          else
            # Only the video-server jar changed (no CtrlProxy artifact did).
            echo "title=chore: update video-server jar SHA256" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commit and push SHA256 update to main"
        if: steps.check.outputs.needed == 'true'
        shell: bash
        env:
          APK_SHA256_CHECKSUM: ${{ needs.build-control-proxy-apk.outputs.sha256 }}
          IOS_CTRL_PROXY_SHA256_CHECKSUM: ${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}
          IOS_CTRL_PROXY_RUNNER_SHA256: ${{ needs.build-ctrl-proxy-ios-ipa.outputs.runner_sha256 }}
          VIDEO_JAR_SHA256: ${{ needs.build-video-server-jar.outputs.sha256 }}
          RELEASE_CONSTANTS_COMMIT_MESSAGE: |
            ${{ steps.pr-title.outputs.title }}

            The nightly build produced artifacts with updated SHA256 checksums.

            | Artifact | Previous | New | Changed |
            |----------|----------|-----|---------|
            | **APK** | `${{ steps.current.outputs.apk_sha256 || '(empty)' }}` | `${{ needs.build-control-proxy-apk.outputs.sha256 }}` | ${{ steps.check.outputs.apk_changed == 'true' && 'Yes' || 'No' }} |
            | **IPA** | `${{ steps.current.outputs.ipa_sha256 || '(empty)' }}` | `${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}` | ${{ steps.check.outputs.ipa_changed == 'true' && 'Yes' || 'No' }} |
            | **iOS Runner** | `${{ steps.current.outputs.runner_sha256 || '(empty)' }}` | `${{ needs.build-ctrl-proxy-ios-ipa.outputs.runner_sha256 }}` | ${{ steps.check.outputs.runner_changed == 'true' && 'Yes' || 'No' }} |
            | **video-server jar** | `${{ steps.current.outputs.video_jar_sha256 || '(empty)' }}` | `${{ needs.build-video-server-jar.outputs.sha256 }}` | ${{ steps.check.outputs.video_jar_changed == 'true' && 'Yes' || 'No' }} |

            Checksums change when source in `android/control-proxy/src/`,
            `android/video-server/src/`, or `ios/control-proxy/`, the build
            configuration, or the dependency/SDK versions change.

            Auto-generated by the `nightly` workflow.
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # AUTO_MOBILE_PR_TOKEN is an admin actor and bypasses the green-main
          # ruleset, so this lands on main with no PR — no external code review
          # is spent on a machine-generated constant bump, and there is no
          # auto-merge to wedge. The script re-syncs to origin/main and
          # regenerates from scratch each attempt, so a concurrent push can
          # never leave a conflicted tree.
          bash scripts/push-release-constants.sh

  # =============================================================================
  # Foldable posture integration tests
  # =============================================================================
  # The APK is reused from the build-control-proxy-apk job above.
  foldable-posture-tests:
    name: "Foldable Posture (${{ matrix.profile }})"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    needs: build-control-proxy-apk
    strategy:
      fail-fast: false
      matrix:
        # Resizable AVD ignores fold/posture/hinge commands (setPosture read-back
        # fails; #8947, nightly run 37090697468). Re-add resizable to this list
        # once the AVD or a preset-only tool path exists to re-enable it.
        profile: [pixel_10_pro_fold]
    env:
      AUTOMOBILE_FOLDABLE_LANE: "1"
      AUTOMOBILE_FOLDABLE_PROFILE: ${{ matrix.profile }}
      AUTOMOBILE_FOLDABLE_DEVICE_ID: emulator-5554
      AUTOMOBILE_DATA_DIR: ${{ github.workspace }}/scratch/foldable-lane/data
      AUTOMOBILE_DB_DIR: ${{ github.workspace }}/scratch/foldable-lane/db
      AUTOMOBILE_LOG_DIR: ${{ github.workspace }}/scratch/foldable-lane/logs
      # The runner's only daemon uses these dirs; release-session may act on it (#11252).
      AUTOMOBILE_ALLOW_SHARED_DAEMON_NAMESPACE: "1"
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      # Android recording streams screenrecord through FFmpeg on the host.
      - name: "Install FFmpeg for recording"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      - name: "Start display server for Resizable emulator"
        if: matrix.profile == 'resizable'
        shell: bash
        run: |
          command -v Xvfb
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/foldable-xvfb.log" 2>&1 &
          for attempt in {1..20}; do
            if test -S /tmp/.X11-unix/X99; then
              break
            fi
            sleep 0.25
          done
          test -S /tmp/.X11-unix/X99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: "Prepare foldable emulator SDK and libraries"
        run: bash scripts/android/prepare-foldable-emulator.sh "$AUTOMOBILE_FOLDABLE_PROFILE"

      - uses: ./.github/actions/android-emulator
        with:
          api_level: "36"
          target: google_apis
          avd-name: foldable-${{ matrix.profile }}
          profile: ${{ matrix.profile }}
          windowed: ${{ matrix.profile == 'resizable' }}
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          script: |
            cd "$GITHUB_WORKSPACE"
            mkdir -p scratch/foldable-lane
            export AUTOMOBILE_CTRL_PROXY_APK_PATH="$GITHUB_WORKSPACE/android/control-proxy/build/outputs/apk/debug/control-proxy-debug.apk"
            if bun test test/integration/foldablePostureRoundTrip.integration.test.ts > scratch/foldable-lane/test.log 2>&1; then
              cat scratch/foldable-lane/test.log
            else
              cat scratch/foldable-lane/test.log
              exit 1
            fi

      - name: "Diagnose foldable emulator shared libraries"
        if: always()
        continue-on-error: true
        run: bash scripts/android/prepare-foldable-emulator.sh --check-emulator-libs

      - name: "Upload foldable diagnostics, screenshots and recordings"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: foldable-posture-${{ matrix.profile }}
          path: |
            scratch/foldable-lane/
            android-emulator-diagnostics/
          if-no-files-found: ignore

  # =============================================================================
  # Android emulator integration tests
  # =============================================================================
  # Moved off PR and merge (low signal, runner-heavy). The APK is reused from the
  # build-control-proxy-apk job above.
  junit-runner-emulator-tests:
    name: "Run JUnit Runner Emulator Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-control-proxy-apk
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      - uses: ./.github/actions/android-emulator
        with:
          script: "./gradlew :junit-runner:test"
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-emulator-test-results
          path: android/junit-runner/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "JUnit Runner Emulator Test Report"
          report_paths: "**/build/test-results/**/*.xml"

  playground-automobile-emulator-tests:
    name: "Run Playground Automobile Emulator Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-control-proxy-apk
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      - uses: ./.github/actions/android-emulator
        with:
          script: "./gradlew :playground:app:test --stacktrace"
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playground-automobile-emulator-test-results
          path: android/playground/app/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "Playground Automobile Emulator Test Report"
          report_paths: "**/build/test-results/**/*.xml"

  # =============================================================================
  # Android on-device H.264 capture integration tests (bun)
  # =============================================================================
  # These two integration suites (issues #3775 / #3776) are env-gated
  # (AUTOMOBILE_ANDROID_H264_INTEGRATION / AUTOMOBILE_PERSISTENT_ENCODER_INTEGRATION)
  # and are therefore SKIPPED by the normal `turbo run test` / coverage jobs. They
  # cover the one seam the unit suites structurally cannot: the real
  # `adb exec-out screenrecord --output-format=h264` command and the persistent
  # on-device encoder against a live emulator. Nightly is the only place they run.
  android-h264-integration-tests:
    name: "Android H264 Capture Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-video-server-jar
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download video-server jar"
        uses: actions/download-artifact@v7
        with:
          name: video-server-jar
          path: artifacts

      - uses: ./.github/actions/android-emulator
        with:
          working-directory: "./android/"
          # cwd inside run-emulator-tests.sh is ./android/, so hop back to the repo
          # root before invoking bun. The persistent-encoder suite resolves the DEX
          # from AUTOMOBILE_VIDEO_SERVER_JAR (the artifact downloaded above).
          script: |
            cd "$GITHUB_WORKSPACE"
            AUTOMOBILE_ANDROID_H264_INTEGRATION=1 \
            AUTOMOBILE_ANDROID_H264_DEVICE_ID=emulator-5554 \
              bun test test/integration/androidH264SourceDevice.integration.test.ts
            AUTOMOBILE_PERSISTENT_ENCODER_INTEGRATION=1 \
            AUTOMOBILE_ANDROID_H264_DEVICE_ID=emulator-5554 \
            AUTOMOBILE_VIDEO_SERVER_JAR="$GITHUB_WORKSPACE/artifacts/automobile-video.jar" \
              bun test test/integration/persistentEncoderH264SourceDevice.integration.test.ts
