name: "Nightly"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write
  # mikepenz/action-junit-report (emulator test report steps) creates a check run.
  checks: write

jobs:
  build-control-proxy-apk:
    uses: ./.github/workflows/build-control-proxy-apk.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

  build-ctrl-proxy-ios-ipa:
    uses: ./.github/workflows/build-ctrl-proxy-ios-ipa.yml

  update-sha256:
    name: "Update SHA256 Checksums"
    runs-on: ubuntu-latest
    needs: [build-control-proxy-apk, build-ctrl-proxy-ios-ipa]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Download APK artifact"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: /tmp

      - name: "Download IPA artifact"
        uses: actions/download-artifact@v7
        with:
          name: ctrl-proxy-ios-ipa
          path: /tmp

      - name: "Verify APK SHA256"
        run: bash scripts/ci/verify-transit-sha256.sh /tmp/control-proxy-debug.apk "${{ needs.build-control-proxy-apk.outputs.sha256 }}"

      - name: "Verify IPA SHA256"
        run: bash scripts/ci/verify-transit-sha256.sh /tmp/control-proxy.ipa "${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}"

      - name: "Get current SHA256 values from source"
        id: current
        run: |
          # Read each field from the dedicated NIGHTLY_CHECKSUM_ENTRY (the block
          # anchored on `version: "nightly"`) via the shared helper — the single
          # source of truth also used by verify-artifact-sha256.sh +
          # verify-release-integrity.sh (which read registry[0]). Nightly must
          # compare against — and later overwrite — the nightly slot, NEVER a
          # tagged registry entry: writing main-built shas onto a tagged entry
          # makes "latest" verify the immutable published asset against a
          # main-built sha (#3784). Anchoring on the quoted `version: "nightly"`
          # line also skips the `ReleaseChecksumEntry` interface declarations
          # (`apkSha256: string;`) that precede the registry (#3784).
          source scripts/lib/read-registry-field.sh
          RELEASE_TS="src/constants/release.ts"
          APK_CURRENT=$(read_registry_field apkSha256 "$RELEASE_TS" nightly)
          IPA_CURRENT=$(read_registry_field ipaSha256 "$RELEASE_TS" nightly)
          RUNNER_CURRENT=$(read_registry_field runnerSha256 "$RELEASE_TS" nightly)
          echo "apk_sha256=$APK_CURRENT" >> $GITHUB_OUTPUT
          echo "ipa_sha256=$IPA_CURRENT" >> $GITHUB_OUTPUT
          echo "runner_sha256=$RUNNER_CURRENT" >> $GITHUB_OUTPUT
          echo "Current APK SHA256: ${APK_CURRENT:-(empty)}"
          echo "Current IPA SHA256: ${IPA_CURRENT:-(empty)}"
          echo "Current iOS runner SHA256: ${RUNNER_CURRENT:-(empty)}"

      - name: "Check if updates needed"
        id: check
        run: |
          NEW_APK="${{ needs.build-control-proxy-apk.outputs.sha256 }}"
          OLD_APK="${{ steps.current.outputs.apk_sha256 }}"
          NEW_IPA="${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}"
          OLD_IPA="${{ steps.current.outputs.ipa_sha256 }}"
          NEW_RUNNER="${{ needs.build-ctrl-proxy-ios-ipa.outputs.runner_sha256 }}"
          OLD_RUNNER="${{ steps.current.outputs.runner_sha256 }}"

          APK_CHANGED="false"
          IPA_CHANGED="false"
          RUNNER_CHANGED="false"

          if [ "$NEW_APK" != "$OLD_APK" ]; then
            APK_CHANGED="true"
            echo "APK SHA256 changed"
            echo "  Previous: ${OLD_APK:-(empty)}"
            echo "  New:      $NEW_APK"
          else
            echo "APK SHA256 unchanged"
          fi

          if [ "$NEW_IPA" != "$OLD_IPA" ]; then
            IPA_CHANGED="true"
            echo "IPA SHA256 changed"
            echo "  Previous: ${OLD_IPA:-(empty)}"
            echo "  New:      $NEW_IPA"
          else
            echo "IPA SHA256 unchanged"
          fi

          # The runner binary lives inside the IPA, so a runner change usually
          # also changes the IPA sha — but detect it independently so an empty
          # or stale runner sha (e.g. a registry entry cut before the runner-sha
          # wiring) is backfilled even when the IPA is byte-identical.
          if [ "$NEW_RUNNER" != "$OLD_RUNNER" ]; then
            RUNNER_CHANGED="true"
            echo "iOS runner SHA256 changed"
            echo "  Previous: ${OLD_RUNNER:-(empty)}"
            echo "  New:      $NEW_RUNNER"
          else
            echo "iOS runner SHA256 unchanged"
          fi

          echo "apk_changed=$APK_CHANGED" >> $GITHUB_OUTPUT
          echo "ipa_changed=$IPA_CHANGED" >> $GITHUB_OUTPUT
          echo "runner_changed=$RUNNER_CHANGED" >> $GITHUB_OUTPUT

          if [ "$APK_CHANGED" = "true" ] || [ "$IPA_CHANGED" = "true" ] || [ "$RUNNER_CHANGED" = "true" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
          fi

      - name: "Update release constants"
        if: steps.check.outputs.needed == 'true'
        env:
          APK_SHA256_CHECKSUM: ${{ needs.build-control-proxy-apk.outputs.sha256 }}
          IOS_CTRL_PROXY_SHA256_CHECKSUM: ${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}
          IOS_CTRL_PROXY_RUNNER_SHA256: ${{ needs.build-ctrl-proxy-ios-ipa.outputs.runner_sha256 }}
        run: bash scripts/generate-release-constants.sh

      - name: "Build PR title"
        if: steps.check.outputs.needed == 'true'
        id: pr-title
        run: |
          APK_CHANGED="${{ steps.check.outputs.apk_changed }}"
          IPA_CHANGED="${{ steps.check.outputs.ipa_changed }}"
          RUNNER_CHANGED="${{ steps.check.outputs.runner_changed }}"

          if [ "$APK_CHANGED" = "true" ] && [ "$IPA_CHANGED" = "true" ] && [ "$RUNNER_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy APK, iOS IPA, and iOS runner SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$APK_CHANGED" = "true" ] && [ "$IPA_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy APK and CtrlProxy iOS IPA SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$APK_CHANGED" = "true" ] && [ "$RUNNER_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy APK and CtrlProxy iOS runner SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$IPA_CHANGED" = "true" ] && [ "$RUNNER_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy iOS IPA and iOS runner SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$APK_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy APK SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_CHANGED" = "true" ]; then
            echo "title=chore: update CtrlProxy iOS runner SHA256" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore: update CtrlProxy iOS IPA SHA256" >> "$GITHUB_OUTPUT"
          fi

      - name: "Create PR for SHA256 update"
        if: steps.check.outputs.needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_MOBILE_PR_TOKEN }}
          commit-message: |
            ${{ steps.pr-title.outputs.title }}

            APK: ${{ steps.current.outputs.apk_sha256 || '(empty)' }} -> ${{ needs.build-control-proxy-apk.outputs.sha256 }}${{ steps.check.outputs.apk_changed == 'true' && ' (changed)' || ' (unchanged)' }}
            IPA: ${{ steps.current.outputs.ipa_sha256 || '(empty)' }} -> ${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}${{ steps.check.outputs.ipa_changed == 'true' && ' (changed)' || ' (unchanged)' }}
            iOS Runner: ${{ steps.current.outputs.runner_sha256 || '(empty)' }} -> ${{ needs.build-ctrl-proxy-ios-ipa.outputs.runner_sha256 }}${{ steps.check.outputs.runner_changed == 'true' && ' (changed)' || ' (unchanged)' }}
          title: ${{ steps.pr-title.outputs.title }}
          body: |
            ## Automated Checksum Update

            The nightly build produced artifacts with updated SHA256 checksums.

            | Artifact | Previous | New | Changed |
            |----------|----------|-----|---------|
            | **APK** | `${{ steps.current.outputs.apk_sha256 || '(empty)' }}` | `${{ needs.build-control-proxy-apk.outputs.sha256 }}` | ${{ steps.check.outputs.apk_changed == 'true' && '✅ Yes' || 'No' }} |
            | **IPA** | `${{ steps.current.outputs.ipa_sha256 || '(empty)' }}` | `${{ needs.build-ctrl-proxy-ios-ipa.outputs.sha256 }}` | ${{ steps.check.outputs.ipa_changed == 'true' && '✅ Yes' || 'No' }} |
            | **iOS Runner** | `${{ steps.current.outputs.runner_sha256 || '(empty)' }}` | `${{ needs.build-ctrl-proxy-ios-ipa.outputs.runner_sha256 }}` | ${{ steps.check.outputs.runner_changed == 'true' && '✅ Yes' || 'No' }} |

            ### Why did this happen?

            SHA256 checksums change when any of these change:
            - Source code in `android/control-proxy/src/` or `ios/control-proxy/`
            - Build configuration (`build.gradle.kts` or `project.yml`)
            - Dependencies or SDK versions

            ### What to do

            1. Review this PR to ensure the changes are expected
            2. Merge when ready
            3. Future releases will use these checksums for artifact verification

            ---
            Auto-generated by the `nightly` workflow
          branch: auto-update/nightly-sha256
          delete-branch: true
          labels: |
            automated
            release engineering

      - name: "Enable auto-merge on PR"
        if: steps.check.outputs.needed == 'true' && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTO_MOBILE_PR_TOKEN }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash

  # =============================================================================
  # Full iOS Xcode-version sweep
  # =============================================================================
  # Pull requests build only the primary Xcode toolchain (26.5) to conserve the
  # scarce macOS runner pool. The full version matrix runs here nightly to catch
  # slow-moving Xcode-toolchain drift within a day.
  ios-swift-packages-sweep:
    name: "Swift Packages Sweep (${{ matrix.config.name }})"
    runs-on: ${{ matrix.config.runner }}
    env:
      IOS_SIGNING_ENABLED: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 15", runner: "macos-14", xcode: "15.4" }
          - { name: "Xcode 26", runner: "macos-26", xcode: "26.0" }
          - { name: "Xcode 26.5", runner: "macos-26", xcode: "26.5" }
          - { name: "Xcode 26.6", runner: "macos-26", xcode: "26.6" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Install macOS Developer ID certificate"
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-macos-signing-keychain.sh

      - name: "Install iOS signing certificate"
        if: ${{ env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-signing-keychain.sh

      - name: "Build Swift Packages"
        env:
          MACOS_SIGNING_ENABLED: ${{ env.MACOS_SIGNING_ENABLED }}
          MACOS_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
          MACOS_DEVELOPER_ID_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_ID_TEAM_ID }}
          MACOS_SIGNING_STRICT: ${{ env.MACOS_SIGNING_ENABLED }}
          IOS_SIGNING_ENABLED: ${{ env.IOS_SIGNING_ENABLED }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_SIGNING_TEAM_ID: ${{ secrets.IOS_SIGNING_TEAM_ID }}
          IOS_SIGNING_STRICT: ${{ env.IOS_SIGNING_ENABLED }}
        run: ./scripts/ios/swift-build.sh

      - name: "Test Swift Packages"
        run: ./scripts/ios/swift-test.sh

  ios-xcode-build-sweep:
    name: "Build Xcode Projects Sweep (${{ matrix.config.name }})"
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 15", runner: "macos-14", xcode: "15.4" }
          - { name: "Xcode 26.5", runner: "macos-26", xcode: "26.5" }
          - { name: "Xcode 26.6", runner: "macos-26", xcode: "26.6" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Install XcodeGen"
        run: brew install xcodegen

      - name: "Generate Xcode Projects"
        run: ./scripts/ios/xcodegen-generate.sh

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Build Xcode Projects"
        run: ./scripts/ios/xcode-build.sh

  # =============================================================================
  # Android emulator integration tests
  # =============================================================================
  # Moved off PR and merge (low signal, runner-heavy). The APK is reused from the
  # build-control-proxy-apk job above.
  junit-runner-emulator-tests:
    name: "Run JUnit Runner Emulator Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-control-proxy-apk
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      - uses: ./.github/actions/android-emulator
        with:
          script: "./gradlew :junit-runner:test"
          working-directory: './android/'
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-emulator-test-results
          path: android/junit-runner/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "JUnit Runner Emulator Test Report"
          report_paths: '**/build/test-results/**/*.xml'

  playground-automobile-emulator-tests:
    name: "Run Playground Automobile Emulator Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-control-proxy-apk
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      - uses: ./.github/actions/android-emulator
        with:
          script: "./gradlew :playground:app:test --stacktrace"
          working-directory: './android/'
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playground-automobile-emulator-test-results
          path: android/playground/app/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "Playground Automobile Emulator Test Report"
          report_paths: '**/build/test-results/**/*.xml'

  # =============================================================================
  # iOS simulator integration test (comprehensive daily run)
  # =============================================================================
  # Also runs on PRs that touch the native-integration surface (pull_request.yml).
  # This nightly run covers it for every other day's drift regardless of paths.
  ios-xctest-runner-simulator-tests:
    name: "XCTestRunner Simulator Tests"
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Install xcpretty"
        run: gem install xcpretty

      - name: "Build CtrlProxy iOS for Testing"
        run: ./scripts/ios/ctrl-proxy-build-for-testing.sh

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Verify CtrlProxy iOS Artifacts"
        run: |
          echo "Checking CtrlProxy iOS artifacts..."
          ls -la /tmp/automobile-ctrl-proxy/Build/Products/
          ls -la /tmp/automobile-ctrl-proxy/Build/Products/Debug-iphonesimulator/ || true
          XCTESTRUN=$(find /tmp/automobile-ctrl-proxy/Build/Products -name "*.xctestrun" | head -1)
          echo "xctestrun file: ${XCTESTRUN}"

      - name: "Select Xcode 26.2"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: "Ensure iOS Simulator runtime (Xcode 26.2)"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Boot iOS Simulator (Xcode 26.2)"
        run: ./scripts/ios/boot-simulator.sh

      - name: "Ensure AutoMobile daemon ready"
        run: ./scripts/ci/ensure-daemon-ready.sh

      - name: "Warm up iOS CtrlProxy"
        timeout-minutes: 12
        run: ./scripts/ci/ensure-ctrl-proxy-ready.sh

      - name: "Warm up Reminders target app (Xcode 26.2)"
        timeout-minutes: 5
        run: ./scripts/ci/warm-reminders-target-app.sh

      - name: "Run Reminders integration tests (Xcode 26.2)"
        timeout-minutes: 10
        env:
          AUTOMOBILE_TEST_PLAN: "Plans/launch-reminders-app.yaml"
          AUTOMOBILE_TEST_RETRY_COUNT: "1"
        run: ./scripts/ci/run-reminders-launch-plan-tests.sh

      - name: "Shutdown iOS Simulators"
        if: always()
        run: xcrun simctl shutdown all || true

      - name: "Select Xcode 26.5"
        if: ${{ !cancelled() }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Ensure iOS Simulator runtime (Xcode 26.5)"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Boot iOS Simulator (Xcode 26.5)"
        if: ${{ !cancelled() }}
        run: ./scripts/ios/boot-simulator.sh

      - name: "Ensure AutoMobile daemon ready (Xcode 26.5)"
        if: ${{ !cancelled() }}
        run: ./scripts/ci/ensure-daemon-ready.sh

      - name: "Warm up iOS CtrlProxy (Xcode 26.5)"
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: ./scripts/ci/ensure-ctrl-proxy-ready.sh

      - name: "Warm up Reminders target app (Xcode 26.5)"
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: ./scripts/ci/warm-reminders-target-app.sh

      - name: "Run Reminders integration tests (Xcode 26.5)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUTOMOBILE_TEST_PLAN: "Plans/launch-reminders-app.yaml"
          AUTOMOBILE_TEST_RETRY_COUNT: "1"
        run: ./scripts/ci/run-reminders-launch-plan-tests.sh
