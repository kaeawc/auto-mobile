name: "Overlay Agent Simulator Smoke"

# Advisory per-runtime smoke test for the iOS overlay agent (#10569). Injection depends on
# simulator dyld behaviour and each runtime's Swift runtime, so a new Xcode or runtime can break
# it silently. Each matrix leg boots ONE fresh simulator used serially and reports pass or fail
# separately. Run locally on a Mac: bash scripts/ios/overlay-agent-smoke.sh 26
on:
  pull_request:
    paths:
      - "ios/overlay-agent/**"
      - "scripts/ios/overlay-agent-*"
      - "test/bats/overlay-agent-smoke.bats"
      - ".github/workflows/overlay-agent-smoke.yml"
  workflow_dispatch:

concurrency:
  group: overlay-agent-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overlay-agent-smoke:
    name: "Overlay agent smoke (iOS ${{ matrix.runtime }})"
    runs-on: macos-26
    timeout-minutes: 30
    # Advisory until it has a stable history; never gates a merge.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # "26" is the runtime Xcode 26.5 ships; older runtimes run only where the image has them.
        runtime: ["26", "18", "17"]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run overlay agent smoke test"
        id: smoke
        shell: bash
        run: |
          status=0
          bash scripts/ios/overlay-agent-smoke.sh "${{ matrix.runtime }}" || status=$?
          if [[ "${status}" -eq 3 ]]; then
            echo "::notice::iOS ${{ matrix.runtime }} runtime is not installed on this runner; skipped."
            exit 0
          fi
          exit "${status}"

      - name: "Upload smoke artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: overlay-agent-smoke-ios-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: scratch/overlay-agent-smoke/
          if-no-files-found: ignore
          retention-days: 7
