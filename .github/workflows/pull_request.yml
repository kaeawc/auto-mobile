name: "Pull Request"

on:
  pull_request:
    branches:
      - "**"
    # Include `labeled` so applying run-native / run-ios / run-android to an
    # existing PR actually starts a run (the default opened/synchronize/reopened
    # set does not fire on label changes).
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  security-events: write
  pull-requests: write
  contents: read
  packages: write

jobs:
  # =============================================================================
  # Change Detection
  # =============================================================================
  # Detect if only documentation files were changed to skip long-running jobs
  # Detect if only SHA256 checksum was changed to skip long-running jobs
  detect-changes:
    timeout-minutes: 10
    name: "Detect Documentation-Only or SHA256-Only Changes"
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      sha256_only: ${{ steps.check-sha256.outputs.sha256_only }}
      auto_chore: ${{ steps.check-auto-chore.outputs.auto_chore }}
      desktop_core_changed: ${{ steps.filter-desktop-core.outputs.desktop_core }}
      ide_plugin_changed: ${{ steps.filter-ide-plugin.outputs.ide_plugin }}
      desktop_app_changed: ${{ steps.filter-desktop-app.outputs.desktop_app }}
      android_changed: ${{ steps.filter-android.outputs.android }}
      kotlin_changed: ${{ steps.filter-kotlin.outputs.kotlin }}
      ios_changed: ${{ steps.filter-ios.outputs.ios }}
      native_integration_changed: ${{ steps.filter-native-integration.outputs.native_integration }}
      ts_changed: ${{ steps.filter-ts.outputs.ts }}
      android_should_run: ${{ steps.android_should_run.outputs.should_run }}
      ios_should_run: ${{ steps.ios_should_run.outputs.should_run }}
      ios_integration_should_run: ${{ steps.ios_integration_should_run.outputs.should_run }}
      webrtc_should_run: ${{ steps.webrtc_should_run.outputs.should_run }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Check for documentation-only changes"
        id: filter
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const prNumber = context.issue.number;

            // Get list of changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Documentation file patterns
            const docPatterns = [
              /\.md$/,                    // **/*.md
              /^docs\//,                  // docs/**
              /^docs\/.*\.(gif|png|webp)$/i, // docs/**/*.{gif,png,webp}
              /^mkdocs\.yml$/,            // mkdocs.yml
              /^\.lychee\.toml$/          // .lychee.toml
            ];

            // Check if a file matches any documentation pattern
            const isDocFile = (filename) => {
              return docPatterns.some(pattern => pattern.test(filename));
            };

            // Check if ALL files are documentation files
            const allFilesAreDocs = files.length > 0 && files.every(file => isDocFile(file.filename));

            console.log('Files changed:', files.map(f => f.filename).join(', '));
            console.log('Total files:', files.length);
            console.log('All files are docs:', allFilesAreDocs);
            files.forEach(file => {
              console.log(`  ${file.filename}: ${isDocFile(file.filename) ? 'doc' : 'code'}`);
            });

            core.setOutput('docs_only', allFilesAreDocs.toString());
            return allFilesAreDocs;

      - name: "Check for SHA256-only changes"
        id: check-sha256
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const prNumber = context.issue.number;

            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Check if title matches the automated SHA256 update pattern
            const titleMatches = pr.title === 'chore: update CtrlProxy APK SHA256' ||
                                 pr.title === 'chore: update CtrlProxy iOS IPA SHA256' ||
                                 pr.title === 'chore: update CtrlProxy iOS runner SHA256' ||
                                 pr.title === 'chore: update video-server jar SHA256' ||
                                 pr.title === 'chore: update CtrlProxy APK and CtrlProxy iOS IPA SHA256' ||
                                 pr.title === 'chore: update CtrlProxy APK and CtrlProxy iOS runner SHA256' ||
                                 pr.title === 'chore: update CtrlProxy iOS IPA and iOS runner SHA256' ||
                                 pr.title === 'chore: update CtrlProxy APK, iOS IPA, and iOS runner SHA256';

            // Get list of changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Check if only src/constants/release.ts was changed
            const onlyReleaseFileChanged = files.length === 1 &&
                                          files[0].filename === 'src/constants/release.ts';

            // Skip only if BOTH conditions are met
            const sha256Only = titleMatches && onlyReleaseFileChanged;

            console.log('PR Title:', pr.title);
            console.log('Title matches:', titleMatches);
            console.log('Files changed:', files.map(f => f.filename).join(', '));
            console.log('Only release.ts changed:', onlyReleaseFileChanged);
            console.log('Result - SHA256 only:', sha256Only);

            core.setOutput('sha256_only', sha256Only.toString());
            return sha256Only;

      - name: "Check for auto chore changes"
        id: check-auto-chore
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const prNumber = context.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // The pull_request event already carries the complete label
            // snapshot. Reusing it avoids an extra API request in the required
            // change-detection job.
            const labels = context.payload.pull_request.labels ?? [];

            const docPatterns = [
              /\.md$/,
              /^docs\//,
              /^docs\/.*\.(gif|png|webp)$/i,
              /^mkdocs\.yml$/,
              /^\.lychee\.toml$/
            ];
            const isDocFile = (filename) => docPatterns.some(pattern => pattern.test(filename));

            const labelNames = labels.map(label => label.name);
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const automated = labelNames.includes('automated');
            const documentation = labelNames.includes('documentation');
            const titleMatches = pr.title.startsWith('chore:');
            const branchMatches = pr.head.ref.startsWith('auto-update/');
            const allFilesAreDocs = files.length > 0 && files.every(file => isDocFile(file.filename));
            const autoChore = sameRepo && automated && documentation && titleMatches && branchMatches && allFilesAreDocs;

            console.log('PR Title:', pr.title);
            console.log('Head branch:', pr.head.ref);
            console.log('Same repository:', sameRepo);
            console.log('Automated label:', automated);
            console.log('Documentation label:', documentation);
            console.log('Files changed:', files.map(f => f.filename).join(', '));
            console.log('All files are docs:', allFilesAreDocs);
            console.log('Result - auto chore:', autoChore);

            core.setOutput('auto_chore', autoChore.toString());
            return autoChore;

      - name: "Check for Desktop Core module changes"
        id: filter-desktop-core
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop_core:
              - 'android/desktop-core/**'
              # desktop-core depends on desktop-domain (api(project(":desktop-domain"))),
              # and the desktop-domain mapper's golden/unit tests LIVE in desktop-core
              # (e.g. CoordinateMappingGoldenVectorTest for issue #4547). Without this
              # entry a desktop-domain-only change skipped desktop-core-unit-tests and
              # the drift guard never executed (pre-existing gap; #4547 made it
              # load-bearing). ide-plugin and desktop-app jobs OR on this output, so
              # they pick up desktop-domain changes through it as well.
              - 'android/desktop-domain/**'
              - 'android/protocol/**'
              - 'android/test-plan-validation/**'
              - 'android/gradle.properties'
              - 'android/build.gradle.kts'
              - 'android/gradle/libs.versions.toml'

      - name: "Check for IDE Plugin changes"
        id: filter-ide-plugin
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ide_plugin:
              - 'android/ide-plugin/**'

      - name: "Check for Desktop App changes"
        id: filter-desktop-app
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop_app:
              - 'android/desktop-app/**'
              - 'android/desktop-core/**'

      # Native (Kotlin/Swift) build+test jobs gate on the native source trees ONLY.
      # src/** is intentionally NOT here: a pure-TypeScript change cannot break the
      # Kotlin/Swift compile. The TS<->native runtime contract is covered separately
      # by the `native_integration` filter below (iOS simulator integration test on
      # PR) and the Android emulator backstop on merge.yml. Authors can force a full
      # native run with the `run-native` / `run-ios` / `run-android` labels.
      - name: "Check for Android-related changes"
        id: filter-android
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'android/**'
              - 'scripts/android/**'
              # The emulator jobs are exactly what this composite action drives,
              # so an edit to it must exercise them rather than skip them. #4199
              # rewired this action and only ran the emulator jobs incidentally,
              # because it also touched scripts/android/** (see #4237).
              - '.github/actions/android-emulator/**'
              - 'scripts/local-dev/hot-reload.sh'
              - '.github/workflows/android*.yml'
              # This workflow controls Android-job gating, so changes to it
              # must exercise the gate rather than being silently skipped.
              - '.github/workflows/pull_request.yml'

      # Narrower than `android` above: detekt analyzes Kotlin only, so an XML
      # resource or a doc under android/ has nothing for it to look at. The
      # .kts glob covers module build files, which change a module's classpath
      # and so must re-analyze it. The non-Kotlin entries are the inputs that
      # change what detekt *reports* on unchanged sources -- rule config,
      # dependency versions, and the Gradle/toolchain version -- so they have to
      # re-run it even though no .kt moved.
      - name: "Check for Kotlin source changes"
        id: filter-kotlin
        uses: dorny/paths-filter@v3
        with:
          filters: |
            kotlin:
              - 'android/**/*.kt'
              - 'android/**/*.kts'
              - 'android/gradle.properties'
              - 'android/gradle/libs.versions.toml'
              - 'android/gradle/wrapper/**'
              - 'android/gradle/gradle-daemon-jvm.properties'
              - 'android/config/detekt/**'
              - '.github/actions/gradle-task-run/**'

      - name: "Check for iOS-related changes"
        id: filter-ios
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'scripts/ios/**'
              - '.swiftformat'
              - '.swiftlint.yml'

      # The MCP server (src/**) is what drives real devices end-to-end. A change to
      # the device discovery / observe / gesture-action / iOS-runner / schema surface
      # — or to package.json/bun.lock, which setup-auto-mobile-npm-package installs —
      # CAN break the iOS XCUITest integration test even though it is pure TypeScript,
      # so wire that ONE macOS integration job (ios-xctest-runner-simulator-tests) to
      # these paths. Kept narrower than all of src/** so internal-only TS edits skip.
      - name: "Check for native-integration-affecting changes"
        id: filter-native-integration
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native_integration:
              - 'src/index.ts'
              - 'src/processLifecycle.ts'
              - 'src/server/**'
              - 'src/daemon/**'
              - 'src/features/observe/**'
              - 'src/features/action/**'
              # Navigation replays share the iOS CtrlProxy interaction path, so
              # these changes need the Simulator workflow rather than only fast
              # TypeScript validation.
              - 'src/features/navigation/**'
              - 'src/features/**/ios/**'
              - 'src/utils/IOSCtrlProxy*'
              - 'src/utils/Ios*'
              - 'src/utils/ios-*/**'
              - 'src/utils/CtrlProxyManager.ts'
              - 'src/utils/Device*'
              - 'src/utils/device*'
              - 'src/utils/requireBootedDevice.ts'
              - 'src/utils/plan/**'
              - 'src/utils/planUtils.ts'
              - 'src/models/**'
              - 'schemas/**'
              - 'ios/**'
              - 'scripts/ios/**'
              # The XCTestRunner job runs these readiness scripts directly, so
              # changes to them must exercise the job (they were skipped before).
              - 'scripts/ci/**'
              # The XCTestRunner job composes its simulator bring-up (select Xcode,
              # ensure runtime, boot, daemon-ready) from this composite action, so a
              # change to it must exercise the job — otherwise a bring-up refactor
              # would land unvalidated and only surface on nightly / the next
              # native_integration PR.
              - '.github/actions/ios-simulator-bring-up/**'
              # This workflow owns the Simulator workflow's command and gating.
              - '.github/workflows/pull_request.yml'
              # This job runs a bun-side integration test (iosVideoRecordingStartStop),
              # so the bun test config and any test-setup preload affect it. bunfig.toml
              # wires a [test].preload that runs before EVERY bun test the job invokes,
              # and test/setup/** holds those preloaded modules; a change to either can
              # break the integration test deterministically (issue #3109), so they
              # must exercise this job pre-merge instead of landing latent.
              - 'bunfig.toml'
              - 'test/setup/**'
              - 'test/integration/iosVideoRecordingStartStop.integration.test.ts'
              - 'test/features/navigation/iosNavigationGraphWorkflow.test.ts'
              - 'package.json'
              - 'bun.lock'

      # TypeScript-only concerns (CodeQL/JS, memory-leak harness, benchmarks).
      # scripts/** is required: the memory-leak harness and benchmark scripts live
      # there and import from src/**.
      - name: "Check for TypeScript-related changes"
        id: filter-ts
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ts:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'benchmark/**'
              - 'schemas/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'build.ts'
              - 'knip.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'oxlint-plugins/**'

      - name: "Decide if Android jobs should run"
        id: android_should_run
        env:
          FORCE_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') || contains(github.event.pull_request.labels.*.name, 'run-android') }}
        run: |
          if [[ ( "${{ steps.filter-android.outputs.android }}" == "true" || "$FORCE_NATIVE" == "true" ) && "${{ steps.filter.outputs.docs_only }}" != "true" && "${{ steps.check-sha256.outputs.sha256_only }}" != "true" && "${{ steps.check-auto-chore.outputs.auto_chore }}" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Decide if iOS jobs should run"
        id: ios_should_run
        env:
          FORCE_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') || contains(github.event.pull_request.labels.*.name, 'run-ios') }}
        run: |
          if [[ ( "${{ steps.filter-ios.outputs.ios }}" == "true" || "$FORCE_NATIVE" == "true" ) && "${{ steps.filter.outputs.docs_only }}" != "true" && "${{ steps.check-sha256.outputs.sha256_only }}" != "true" && "${{ steps.check-auto-chore.outputs.auto_chore }}" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      # The iOS simulator integration test is the one macOS job wired to src/** (via
      # the native_integration filter) so TS changes that drive iOS devices are still
      # caught on PR. It also runs whenever ios/** changes (native_integration
      # includes ios/**) and on the run-native / run-ios labels.
      - name: "Decide if iOS integration test should run"
        id: ios_integration_should_run
        env:
          FORCE_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') || contains(github.event.pull_request.labels.*.name, 'run-ios') }}
        run: |
          if [[ ( "${{ steps.filter-native-integration.outputs.native_integration }}" == "true" || "$FORCE_NATIVE" == "true" ) && "${{ steps.filter.outputs.docs_only }}" != "true" && "${{ steps.check-sha256.outputs.sha256_only }}" != "true" && "${{ steps.check-auto-chore.outputs.auto_chore }}" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      # The MediaMTX-backed WebRTC publisher integration test (#4290) exercises
      # the real WHIP publisher contract. It is heavy (browser + SFU + FFmpeg),
      # so it runs only when WebRTC is actually in play — see webrtc_should_run.
      - name: "Check for WebRTC publisher changes"
        id: filter-webrtc
        uses: dorny/paths-filter@v3
        with:
          filters: |
            webrtc:
              - 'src/features/webrtc/**'
              - 'src/server/webrtcStreamManager.ts'
              - 'src/daemon/webrtc*'
              - 'examples/mediamtx/**'
              - 'test/integration/mediamtxWebRtcPublisher.integration.test.ts'
              - 'test/bats/mediamtx-webrtc-integration.bats'
              - 'scripts/webrtc/**'
              # Native encoder sources decide the on-the-wire H.264 profile the
              # publisher must accept. A profile change here (e.g. Baseline ->
              # Main) is exactly the #4877 class of regression this job guards, so
              # exercise it when the native encoders change (issue #4884).
              - 'android/video-server/**/VideoEncoder.kt'
              - 'ios/screen-capture/**'
              # This workflow controls WebRTC-job gating, so a change to it must
              # exercise the job rather than being silently skipped.
              - '.github/workflows/pull_request.yml'

      # Run the WebRTC integration test when the publisher surface is touched, OR
      # when a human explicitly opts in by labelling the PR `webrtc` or mentioning
      # `webrtc` in the title/body (case-insensitive). The explicit signals are an
      # intentional override, so unlike the native gates this deliberately does NOT
      # exclude docs_only — a docs PR that says `webrtc` opts in on purpose. Title
      # and body are passed via env, never interpolated into the script, so a
      # crafted PR title cannot inject shell.
      - name: "Decide if the WebRTC integration test should run"
        id: webrtc_should_run
        env:
          PATH_MATCH: ${{ steps.filter-webrtc.outputs.webrtc }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'webrtc') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SHA256_ONLY: ${{ steps.check-sha256.outputs.sha256_only }}
          AUTO_CHORE: ${{ steps.check-auto-chore.outputs.auto_chore }}
        run: |
          mention=false
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | tr '[:upper:]' '[:lower:]' | grep -q 'webrtc'; then
            mention=true
          fi
          if [[ ( "$PATH_MATCH" == "true" || "$HAS_LABEL" == "true" || "$mention" == "true" ) && "$SHA256_ONLY" != "true" && "$AUTO_CHORE" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # =============================================================================
  # Fast Validation Jobs (Always Run)
  # =============================================================================

  build-desktop-core:
    timeout-minutes: 20
    name: "Build Desktop Core Module"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop_core_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-core:build -x test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  desktop-core-unit-tests:
    timeout-minutes: 30
    name: "Run Desktop Core Unit Tests"
    runs-on: ubuntu-latest
    needs: [detect-changes, build-desktop-core]
    if: needs.detect-changes.outputs.desktop_core_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-core:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-core-test-results
          path: android/desktop-core/build/reports/tests/test/

      # Screenshot comparisons fail with pixel diffs that are only inspectable
      # as images -- the HTML test report above carries the stack trace but not
      # the rendering. See issue #3913.
      - name: "Upload Screenshot Diffs"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-core-screenshot-diffs
          path: android/desktop-core/build/reports/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  build-ide-plugin:
    timeout-minutes: 20
    name: "Build IDE Plugin"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: (needs.detect-changes.outputs.ide_plugin_changed == 'true' || needs.detect-changes.outputs.desktop_core_changed == 'true') && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android/ide-plugin
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "build -x test"
          gradle-project-directory: "android/ide-plugin"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Build Plugin ZIP"
        shell: bash
        working-directory: android/ide-plugin
        run: |
          ./gradlew buildPlugin --stacktrace --continue

      - name: "Verify Plugin"
        shell: bash
        working-directory: android/ide-plugin
        run: |
          ./gradlew verifyPlugin --stacktrace --continue

      - name: "Upload IDE Plugin ZIP"
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: ide-plugin-zip
          path: android/ide-plugin/build/distributions/*.zip

  ide-plugin-unit-tests:
    timeout-minutes: 20
    name: "Run IDE Plugin Unit Tests"
    runs-on: ubuntu-latest
    needs: [detect-changes, build-ide-plugin]
    if: (needs.detect-changes.outputs.ide_plugin_changed == 'true' || needs.detect-changes.outputs.desktop_core_changed == 'true') && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android/ide-plugin
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "test"
          gradle-project-directory: "android/ide-plugin"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ide-plugin-test-results
          path: android/ide-plugin/build/reports/tests/test/

  build-desktop-app:
    timeout-minutes: 20
    name: "Build Desktop App (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    if: (needs.detect-changes.outputs.desktop_app_changed == 'true' || needs.detect-changes.outputs.desktop_core_changed == 'true') && needs.detect-changes.outputs.sha256_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-app:build -x test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}-${{ matrix.os }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          malloc-replacement: ${{ runner.os == 'Linux' && 'jemalloc' || 'none' }}

  desktop-app-unit-tests:
    timeout-minutes: 30
    name: "Run Desktop App Unit Tests"
    runs-on: ubuntu-latest
    needs: [detect-changes, build-desktop-app]
    if: (needs.detect-changes.outputs.desktop_app_changed == 'true' || needs.detect-changes.outputs.desktop_core_changed == 'true') && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-app:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-app-test-results
          path: android/desktop-app/build/reports/tests/test/

  fast-validation:
    # Workflow-wiring changes deliberately wait for their forced XCTestRunner
    # result below. Ordinary PRs retain the usual short fast-validation path.
    timeout-minutes: 50
    name: "Fast Validation"
    runs-on: ubuntu-latest
    needs: detect-changes
    # This required check must always report a result, including auto-chore
    # changes and a failed change-detection job.
    if: always()
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          # Full history so the ktfmt check can diff the PR head against its base
          # SHA (git diff <base>...HEAD). The default shallow clone would not
          # contain the base commit and the diff would fail.
          fetch-depth: 0

      # The documentation build consumes scripts/github/uv.lock after merge.
      # Start its independent toolchain setup now so the required Fast Validation
      # job can validate that lockfile before a PR lands.
      - name: "Setup Python for documentation lock validation"
        uses: actions/setup-python@v6
        background: true
        id: setup-python-lock
        with:
          python-version: "3.11"

      - name: "Install uv for documentation lock validation"
        uses: astral-sh/setup-uv@v7
        background: true
        id: setup-uv-lock
        with:
          enable-cache: true

      # Pulls a Docker image and consumes nothing this job produces, so start
      # it up front and let the whole job overlap the pull. It has no consumer,
      # so the barrier sits at the end -- a hadolint failure surfaces there
      # rather than vanishing.
      - name: "Run hadolint"
        uses: hadolint/hadolint-action@v3.1.0
        background: true
        id: hadolint
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      # Pure network/disk and independent of everything below, so background it
      # here and let the JDK download and the npm-package setup (Bun + ripgrep +
      # `bun install` + build, ~60-120s) overlap it. The `wait` barrier re-syncs
      # before the first consumer: the aggregator's `xml` check shells out to
      # xmlstarlet, and the BATS step needs bats. No dpkg-lock contention — this
      # is the only apt user in the job (setup-java unpacks a tarball and
      # setup-ripgrep installs a pre-built binary). Mechanism per #3779.
      #
      # Each network call inside the helper is bounded by a per-command timeout
      # and retried with backoff so a stalled apt mirror or GitHub clone fails
      # fast instead of hanging silently — a `background` failure surfaces at the
      # `- wait:` below, and without this an indefinite hang ate the whole
      # 50-minute job budget. `timeout-minutes` is the hard backstop.
      - name: "Install fast validation dependencies"
        shell: bash
        background: true
        id: install-fast-validation-deps
        timeout-minutes: 10
        run: scripts/ci/install-fast-validation-deps.sh

      # Pin the JDK so the ktfmt check formats deterministically (project targets
      # Java 21) instead of relying on the runner image's default JDK.
      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - wait: install-fast-validation-deps

      # Keep edits to the XCTestRunner job's own wiring from landing without the
      # job being exercised. This is intentionally an always-run Ubuntu guard,
      # rather than adding pull_request.yml to native_integration: the latter
      # would spend roughly 20-25 macOS minutes on every unrelated workflow edit.
      # A relevant change must carry run-ios (or run-native), which starts a new
      # run and lets the existing force-label logic execute the macOS job.
      - name: "Require an iOS run for XCTestRunner workflow wiring changes"
        id: validate-ios-workflow-change
        shell: bash
        env:
          IOS_INTEGRATION_WORKFLOW_BASE_REF: ${{ github.event.pull_request.base.sha }}
          IOS_INTEGRATION_WORKFLOW_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bun scripts/ci/validate-ios-integration-workflow-changes.ts

      # Fast Validation remains parallel to XCTestRunner for every ordinary PR.
      # Only a labeled workflow-wiring change waits for that job to finish, so
      # this required check cannot pass before the exact macOS validation passes.
      - name: "Wait for forced XCTestRunner workflow validation"
        if: steps.validate-ios-workflow-change.outputs.requires_xctest_result == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const deadline = Date.now() + 45 * 60 * 1000;
            while (Date.now() < deadline) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                filter: 'latest',
                per_page: 100,
              });
              const xctest = jobs.find(job => job.name === 'XCTestRunner Simulator Tests');
              if (xctest?.status === 'completed') {
                if (xctest.conclusion !== 'success') {
                  core.setFailed(`Forced XCTestRunner job concluded ${xctest.conclusion}.`);
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            core.setFailed('Timed out waiting for the forced XCTestRunner job.');

      - wait: [setup-python-lock, setup-uv-lock]

      - name: "Run fast validation checks"
        shell: bash
        env:
          INSTALL_KTFMT_WHEN_MISSING: "true"
          # ktfmt validates the complete Kotlin tree in pre-merge Fast Validation.
          # The batched validator starts one JVM for all files, keeping the
          # full-tree backstop fast enough to catch formatting drift before merge.
          KTFMT_ONLY_TOUCHED_FILES: "false"
        run: |
          scripts/all_fast_validate_checks.sh \
            --only yaml,xml,bun-version-coherence,shellcheck,shell-portability,shell-sete,stdlib-first,dependency-decisions,sharp-matrix,shell-quote-boundary,security-boundary,app-bundle-metadata-boundary,ios-ctrl-proxy-process-boundary,mkdocs-nav,ktfmt,claude-plugin,codex-skills,github-python-lock \
            --max-parallel 4

      - name: "Run BATS Tests (Ubuntu)"
        shell: bash
        run: bats test/bats/

      # Drift gate for the generated iOS runner version constant (#2814). Pure
      # bash + python3, so it runs on this Ubuntu job rather than the macOS Swift
      # lane — the committed AutoMobileVersion.swift must match package.json.
      - name: "Check iOS version constant is in sync with package.json"
        shell: bash
        run: bash scripts/versioning/generate-ios-version.sh --check

      - wait: hadolint

      - name: "Upload Fast Validation Logs"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: fast-validation-logs
          path: scratch/fast-validate-*/
          retention-days: 7

  # Detekt used to be a step inside Fast Validation, where its ~7 minutes of
  # cold Gradle work dominated an otherwise ~1 minute job. It is its own job so
  # it runs concurrently instead of serially, and so it can go through
  # gradle-task-run for build/configuration cache reuse -- the raw `./gradlew`
  # call it replaced had no Gradle caching at all and recompiled every module
  # from scratch on every PR.
  detekt:
    timeout-minutes: 30
    name: "Detekt"
    runs-on: ubuntu-latest
    needs: detect-changes
    # detekt analyzes Kotlin only, so a PR touching none of the inputs in the
    # `kotlin` filter cannot change what it reports. This gates whether the job
    # runs at all; when it does run it analyzes the whole tree, so it is not a
    # narrowing of what gets checked. merge.yml re-runs it unconditionally.
    if: needs.detect-changes.outputs.kotlin_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true' && needs.detect-changes.outputs.auto_chore != 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Deliberately the FULL task list, not a per-module subset. An earlier
      # revision scoped this to the modules a PR changed; that is unsafe with
      # this project's detekt config, which disables every file-local rule set
      # and leaves `potential-bugs` -- whose rules are cross-module type
      # resolution -- as the only active one. A change in one module can move a
      # finding in a consumer, so scoping would land it on main and redden the
      # next unrelated PR. The Gradle build cache, not a shorter task list, is
      # what makes this fast.
      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "detektMain detektTest"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Detekt Reports"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports
          path: android/**/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

  bats-tests:
    # The BATS suite runs right at the old 5-minute ceiling on macos-latest
    # (a 4m48s pass left only 12s of headroom), so the job flaked to a timeout
    # cancellation whenever the runner was slightly slow. Setup is only ~16s of
    # the budget; the rest is `bats test/bats/` itself, which keeps growing as
    # tests are added. Give the suite comfortable headroom instead of relying on
    # reruns against a boundary it now straddles.
    timeout-minutes: 10
    name: "BATS Shell Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    if: needs.detect-changes.outputs.sha256_only != 'true' && needs.detect-changes.outputs.auto_chore != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Pure network/disk (`brew install bats-core` on macOS, a source install on
      # Linux) and independent of the Bun setup below, which only writes
      # node_modules. Background it so the two overlap, then re-sync at the
      # barrier before `bats test/bats/`, the sole consumer of both. Mechanism
      # per #3779. shellcheck is installed here too: the markdown-bash gate
      # (validate-markdown-bash.bats, #4118) is the first bats-tested script that
      # shells out to the real shellcheck binary — every other shell validator
      # scans with grep — and the macOS runner image does not ship shellcheck, so
      # without this the whole suite mysteriously failed (#4801). The step name is
      # pinned to "Install BATS" by test/scripts/batsInstallHoist.test.ts (#4126).
      - name: "Install BATS"
        shell: bash
        background: true
        id: install-bats
        run: |
          if command -v bats &>/dev/null; then
            echo "bats already installed: $(bats --version)"
          elif command -v brew &>/dev/null; then
            brew install bats-core
          else
            # Ubuntu apt 'bats' is the old sstephenson/bats which doesn't
            # capture stderr in run output. Install bats-core from source.
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
            sudo /tmp/bats-core/install.sh /usr/local
          fi
          if command -v shellcheck &>/dev/null; then
            echo "shellcheck already installed: $(shellcheck --version | awk '/^version:/{print $2}')"
          elif command -v brew &>/dev/null; then
            brew install shellcheck
          else
            echo "shellcheck missing and no package manager to install it" >&2
            exit 1
          fi

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Stays in the foreground: it appends node_modules/.bin to $GITHUB_PATH.
      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - wait: install-bats

      - name: "Run BATS Tests"
        run: bats test/bats/

  installer-minimal:
    timeout-minutes: 20
    name: "Installer Minimal (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    env:
      RUN_INSTALLER: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
      # ffmpeg is a large, slow install (it has timed out this job) and video
      # recording is not exercised here — skip it.
      AUTOMOBILE_INSTALL_SKIP_FFMPEG: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Skip installer validation"
        if: env.RUN_INSTALLER != 'true'
        run: echo "Skipping installer validation for documentation-only changes"

      - name: "Git Checkout"
        if: env.RUN_INSTALLER == 'true'
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Run Installer (minimal)"
        if: env.RUN_INSTALLER == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          set +e
          bash ./scripts/install.sh --preset minimal --non-interactive 2>&1 | tee ci-logs/installer.log
          install_status=${PIPESTATUS[0]}
          set -e
          echo "INSTALL_EXIT_CODE=${install_status}" >> "$GITHUB_ENV"
          exit 0

      - name: "Run Uninstaller"
        if: env.RUN_INSTALLER == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          bash ./scripts/uninstall.sh --all --force 2>&1 | tee ci-logs/uninstaller.log
          uninstall_status=${PIPESTATUS[0]}
          set -e
          echo "UNINSTALL_EXIT_CODE=${uninstall_status}" >> "$GITHUB_ENV"
          exit 0

      - name: "Upload Logs"
        if: env.RUN_INSTALLER == 'true' && (env.INSTALL_EXIT_CODE != '0' || env.UNINSTALL_EXIT_CODE != '0' || failure())
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: installer-minimal-${{ matrix.os }}-logs
          path: ci-logs/
          retention-days: 7

      - name: "Fail on error"
        if: env.RUN_INSTALLER == 'true' && (env.INSTALL_EXIT_CODE != '0' || env.UNINSTALL_EXIT_CODE != '0')
        shell: bash
        run: |
          echo "Installer exit code: ${INSTALL_EXIT_CODE:-0}"
          echo "Uninstaller exit code: ${UNINSTALL_EXIT_CODE:-0}"
          exit 1

  installer-development:
    timeout-minutes: 30
    name: "Installer Development (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    env:
      RUN_INSTALLER: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
      # ffmpeg is a large, slow install (it has timed out this job) and video
      # recording is not exercised here — skip it.
      AUTOMOBILE_INSTALL_SKIP_FFMPEG: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Skip installer validation"
        if: env.RUN_INSTALLER != 'true'
        run: echo "Skipping installer validation for documentation-only changes"

      - name: "Git Checkout"
        if: env.RUN_INSTALLER == 'true'
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Build source CLI for installer diagnostics"
        if: env.RUN_INSTALLER == 'true'
        uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Run Installer (development)"
        id: run-installer-development
        if: env.RUN_INSTALLER == 'true'
        shell: bash
        continue-on-error: true
        env:
          # The default 10s daemon budget is lower than cold hosted macOS
          # startup variance. Keep this aligned with ensure-daemon-ready.sh.
          AUTOMOBILE_DAEMON_STARTUP_TIMEOUT_MS: "30000"
          AUTOMOBILE_STARTUP_BENCHMARK: "1"
          AUTOMOBILE_STARTUP_BENCHMARK_OUTPUT: "${{ github.workspace }}/ci-logs/installer-daemon-startup.json"
          AUTOMOBILE_STARTUP_BENCHMARK_LABEL: "installer-development-${{ matrix.os }}"
          AUTOMOBILE_CLI_PATH: "${{ github.workspace }}/dist/src/index.js"
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          set +e
          bash ./scripts/install.sh --contributor --preset development --non-interactive 2>&1 | tee ci-logs/installer.log
          install_status=${PIPESTATUS[0]}
          set -e
          mkdir -p ci-logs/daemon-logs
          if [[ -d "${HOME}/.auto-mobile/logs" ]]; then
            cp -R "${HOME}/.auto-mobile/logs/." ci-logs/daemon-logs/ || true
          else
            echo "No daemon logs directory was created" > ci-logs/daemon-logs/README.txt
          fi
          : > ci-logs/ctrl-proxy-cache-state.txt
          for cache_path in "${TMPDIR:-/tmp}"/auto-mobile-prefetch-* "${HOME}/.automobile/ctrl-proxy-ios"; do
            [[ -e "${cache_path}" ]] || continue
            printf '%s\n' "=== ${cache_path} ===" >> ci-logs/ctrl-proxy-cache-state.txt
            find "${cache_path}" -maxdepth 2 -mindepth 0 -print >> ci-logs/ctrl-proxy-cache-state.txt 2>&1 || true
          done
          echo "INSTALL_EXIT_CODE=${install_status}" >> "$GITHUB_ENV"
          echo "install_exit_code=${install_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "Verify runtime dependencies"
        if: env.RUN_INSTALLER == 'true' && steps.run-installer-development.outputs.install_exit_code == '0'
        run: ./scripts/ci/verify-runtime-deps.sh

      - name: "Build from source"
        if: env.RUN_INSTALLER == 'true' && steps.run-installer-development.outputs.install_exit_code == '0'
        shell: bash
        run: |
          export PATH="${HOME}/.bun/bin:${PATH}"
          bun install --frozen-lockfile
          bunx turbo run build --output-logs=errors-only

      - name: "Daemon lifecycle (start → health → doctor → stop)"
        if: env.RUN_INSTALLER == 'true' && steps.run-installer-development.outputs.install_exit_code == '0'
        run: ./scripts/ci/daemon-lifecycle.sh

      - name: "Upload Logs"
        if: env.RUN_INSTALLER == 'true' && (steps.run-installer-development.outputs.install_exit_code != '0' || failure())
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: installer-development-${{ matrix.os }}-logs
          path: ci-logs/
          retention-days: 7

      - name: "Fail on error"
        if: env.RUN_INSTALLER == 'true' && steps.run-installer-development.outputs.install_exit_code != '0'
        shell: bash
        run: |
          echo "Installer exit code: ${{ steps.run-installer-development.outputs.install_exit_code }}"
          exit 1

  # =============================================================================
  # Security Analysis (Skip for docs-only changes)
  # =============================================================================

  codeql-node:
    name: "CodeQL Analysis - Node.js/TypeScript"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ts_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'typescript' ]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Build TypeScript"
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run build --output-logs=errors-only

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  bun-audit:
    timeout-minutes: 20
    name: "Bun Security Audit"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.sha256_only != 'true' && needs.detect-changes.outputs.auto_chore != 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Bun Audit"
        run: |
          bun pm audit --json > bun-audit-results.json || true
        continue-on-error: true

      - name: "Upload Bun Audit Results"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bun-audit-results
          path: bun-audit-results.json

  # =============================================================================
  # Node TypeScript Build and Test (Skip for docs-only changes)
  # =============================================================================

  mcp-build-and-test:
    name: "Node TypeScript Build and Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    # The full isolated Bun suite can approach fifteen minutes on a contended
    # hosted macOS runner. Keep the cross-platform lane intact while allowing
    # enough headroom to finish after setup, lint, and build (issue #5328).
    timeout-minutes: 25
    env:
      RUN_MCP_BUILD_TEST: ${{ needs.detect-changes.outputs.docs_only != 'true' && needs.detect-changes.outputs.sha256_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: "Skip Node TypeScript build and test"
        if: env.RUN_MCP_BUILD_TEST != 'true'
        run: echo "Skipping Node TypeScript build and test for documentation-only or SHA256-only changes"

      - name: "Git Checkout"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        uses: actions/checkout@v6
        with:
          lfs: false
          # Lint runs boundary guards that compare the working tree with
          # origin/main. Keep that ref available on every matrix platform.
          fetch-depth: 0

      # Disjoint cache paths, so the two restores overlap each other. The
      # barrier must precede "Setup Auto Mobile": that composite runs
      # `turbo run build` against the same .turbo directory being restored.
      - name: "Cache Bun dependencies"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        uses: actions/cache@v5
        background: true
        id: cache-bun
        with:
          # Restoring node_modules is notably expensive on Windows because the
          # archive contains thousands of small files. Bun can materialize it
          # from its package store with platform-native links, so cache only
          # that smaller store.
          path: ~/.bun/install/cache
          key: bun-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ matrix.os }}-

      - name: "Cache Turborepo"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        uses: actions/cache@v5
        background: true
        id: cache-turbo
        with:
          path: .turbo
          key: turbo-${{ matrix.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ matrix.os }}-

      # No `if:` here -- a `wait` step always runs and does not accept a
      # condition; adding one fails whole-workflow validation. When the job's
      # RUN_MCP_BUILD_TEST guard skips the cache steps there is simply nothing
      # outstanding for the barrier to join.
      - wait: [cache-bun, cache-turbo]

      - name: "Setup Auto Mobile"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Run Lint"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run lint --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-lint-${{ matrix.os }}.log"

      - name: "Check Android emulator execution boundary"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        run: bun run check:android-emulator-boundary

      - name: "Check iOS CtrlProxy process execution boundary"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        run: bun run check:ios-ctrl-proxy-process-boundary

      - name: "Run Build"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run build --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-build-${{ matrix.os }}.log"

      - name: "Run Tests"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        env:
          # Enable debug logging on Windows to trace what's starting the adb daemon
          DEBUG_ADB_EXEC: ${{ matrix.os == 'windows-latest' && 'true' || '' }}
          # Force AdbClient into test mode on Windows to prevent adb daemon startup
          AUTOMOBILE_TEST_MODE: ${{ matrix.os == 'windows-latest' && 'true' || '' }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          # Bun 1.3.14 regresses per-file isolation on Windows; keep that
          # platform's suite in one global while other platforms stay isolated.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bun run test:windows 2>&1 | tee "ci-logs/bun-test-${{ matrix.os }}.log"
          else
            # macOS-only (this job's matrix is macos + windows; the ubuntu Node TS
            # suite is a SEPARATE job that keeps the tight 5s ceiling). The hosted
            # macos runner is markedly slower / more contended than the Linux lane,
            # so this ~13k-test --isolate suite intermittently trips bun's default
            # 5s per-test / 10s hook ceiling by a hair (observed 5002/5004ms on
            # fully-faked tests; a 10052ms beforeEach/afterEach hook) — a pure
            # runner-contention flake, macos-only (ubuntu + windows had zero). Raise
            # bun's timeout to give that headroom; --timeout covers BOTH the test and
            # hook budgets (verified). Bypass turbo like the Windows branch so the
            # flag applies directly (macos then always runs, which also keeps the
            # native-source-scan guard tests from ever replaying a cached result).
            #
            # bun's --timeout ONLY bounds individual test()/hook bodies. It cannot
            # bound a hang OUTSIDE that scope: module-level/describe-body evaluation,
            # a leaked real socket/child that keeps the process alive at teardown, or
            # a real-timer/real-socket poll that never settles. Several files in this
            # suite do real I/O (unix-socket daemon servers, a werift WebRTC loopback,
            # real child spawns) rather than injected fakes, so one of them can wedge
            # the whole run. Before this bound such a wedge rode the 25-minute JOB
            # timeout to a silent CANCELLED (run 32156898919: bun hung mid-suite for
            # ~24m, GitHub dropped the streamed log, no actionable signal). Wrap the
            # invocation in a portable wall-clock watchdog (macos has no GNU
            # `timeout`; this helper kills the whole process group and returns 124 on
            # expiry) sized well above a healthy run (~6m observed) but far below the
            # job timeout, so a hang fails FAST and RED with the tee'd log preserved
            # for the "Upload Build/Test Logs" step to capture (issue: macos test hang).
            # shellcheck source=scripts/ios/run_with_timeout.sh
            source scripts/ios/run_with_timeout.sh
            test_status=0
            run_with_timeout 720 bun test --isolate --timeout 20000 2>&1 \
              | tee "ci-logs/bun-test-${{ matrix.os }}.log" || test_status=$?
            if [[ "$test_status" -eq 124 ]]; then
              echo "::error::macOS bun test suite exceeded the 12-minute wall-clock ceiling and was aborted (a test is hanging on real I/O — a real socket/child/timer, not an injected fake). Inspect the last ::group:: in the uploaded ci-logs/bun-test-macos-latest.log to find the file that ran last."
            fi
            exit "$test_status"
          fi

      - name: "Run Bun image runtime smoke"
        if: env.RUN_MCP_BUILD_TEST == 'true' && (matrix.os == 'macos-latest' || matrix.os == 'windows-latest')
        run: bun run test:image:bun

      - name: "Upload Build/Test Logs"
        if: env.RUN_MCP_BUILD_TEST == 'true' && (failure() || cancelled() || matrix.os == 'windows-latest')
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: mcp-build-test-logs-${{ matrix.os }}
          path: ci-logs/*.log
          retention-days: 7

  memory-leak-detection:
    name: "Memory Leak Detection"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ts_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    timeout-minutes: 30
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Memory Leak Detection"
        run: bun run test:memory-leaks

      - name: "Upload Heap Snapshots"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: heap-snapshots
          path: "*.heapsnapshot"

  # =============================================================================
  # TypeScript Code Coverage
  # =============================================================================

  ts-code-coverage:
    name: "Node TypeScript Build and Test (ubuntu-latest)"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    timeout-minutes: 10
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          # The stdlib-first gate compares package.json with the PR base SHA.
          # Keep that commit locally available instead of relying on checkout's
          # default one-commit shallow clone.
          fetch-depth: 0

      # Disjoint cache paths, so the two restores overlap each other. The
      # barrier must precede "Setup Auto Mobile": that composite runs
      # `turbo run build` against the same .turbo directory being restored.
      - name: "Cache Bun dependencies"
        uses: actions/cache@v5
        background: true
        id: cache-bun
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-ubuntu-latest-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-ubuntu-latest-

      - name: "Cache Turborepo"
        uses: actions/cache@v5
        background: true
        id: cache-turbo
        with:
          path: .turbo
          key: turbo-ubuntu-latest-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-ubuntu-latest-${{ hashFiles('bun.lock') }}-
            turbo-ubuntu-latest-

      - wait: [cache-bun, cache-turbo]

      - name: "Setup Auto Mobile"
        uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Lint"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run lint --output-logs=errors-only --log-order=grouped

      - name: "Check stdlib-first dependency decisions"
        if: needs.detect-changes.outputs.ts_changed == 'true'
        env:
          STDLIB_FIRST_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bun run check:stdlib-first

      # Scoped `tsc --noEmit` gate (issue #3001). Bun's bundler skips type
      # checking, so the build/test steps cannot catch type errors. A repo-wide
      # gate is infeasible (~550 pre-existing errors), so this compares against a
      # committed baseline and fails only on NEW type errors. Runs on this single
      # ubuntu job with the pinned tsc so the baseline is reproducible.
      # Gated on ts_changed: the baseline only references src/, so a diff that
      # touches no TypeScript cannot introduce a local error -- skipping it avoids
      # blocking native-only PRs on base-branch drift. See
      # scripts/typecheck-baseline.sh.
      - name: "Run Typecheck Gate"
        if: needs.detect-changes.outputs.ts_changed == 'true'
        run: bun run typecheck

      - name: "Run Build"
        shell: bash
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run build --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-build-ubuntu-latest.log"

      - name: "Run Bun MCP startup smoke"
        run: bun run test:startup:bun

      # Linux uses the sharp backend here; Windows covers the jimp+cwebp path in
      # the matrix smoke above.
      - name: "Run Bun image runtime smoke"
        run: bun run test:image:bun

      - name: "Run Tests with Coverage"
        run: bash scripts/ci/run-ts-coverage.sh

      - name: "Verify Coverage Output"
        run: bash scripts/ci/verify-ts-coverage-output.sh

      - name: "Upload Build/Test Logs"
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: mcp-build-test-logs-ubuntu-latest
          path: ci-logs/*.log
          retention-days: 7

      - name: "Upload Coverage"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ts-code-coverage
          path: coverage/
          retention-days: 7

  # =============================================================================
  # Kotlin Code Coverage
  # =============================================================================

  kotlin-code-coverage:
    timeout-minutes: 30
    name: "Run CtrlProxy Unit Tests"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.android_should_run == 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junit-runner:test :junit-runner:jacocoTestReport :control-proxy:testDebugUnitTest :control-proxy:createDebugUnitTestCoverageReport :auto-mobile-sdk:testDebugUnitTest :auto-mobile-sdk:createDebugUnitTestCoverageReport :test-plan-validation:test :test-plan-validation:jacocoTestReport :protocol:test :protocol:jacocoTestReport :video-server:test :video-server:d8Dex"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Generate Kotlin Coverage Badge"
        run: bash scripts/coverage/generate-kotlin-badge.sh

      - name: "Upload Kotlin Coverage Badge"
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-coverage-badge
          path: coverage/kotlin-coverage-badge.json
          retention-days: 7

  # =============================================================================
  # SwiftLint
  # =============================================================================

  swiftlint:
    timeout-minutes: 20
    name: "SwiftLint"
    runs-on: macos-14
    needs: detect-changes
    if: needs.detect-changes.outputs.ios_should_run == 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Full-tree lint (validate_swiftlint.sh defaults: ONLY_TOUCHED_FILES=false,
      # STRICT_MODE=false), so the whole ios/ tree must stay error-clean on every
      # iOS-affecting PR. The script exits non-zero only on error-severity rules
      # (force_unwrapping/force_try are configured as errors — the fail-fast crash
      # class we burned down in 2026-07); warnings remain non-blocking. SwiftLint is
      # installed on demand at the version pinned in install_swiftlint.sh.
      - name: "Run SwiftLint (fail on error-severity rules)"
        shell: bash
        env:
          INSTALL_SWIFTLINT_WHEN_MISSING: "true"
        run: bash scripts/swiftlint/validate_swiftlint.sh

  # =============================================================================
  # Swift Code Coverage
  # =============================================================================

  swift-code-coverage:
    timeout-minutes: 20
    name: "Swift Code Coverage"
    runs-on: macos-14
    needs: detect-changes
    if: needs.detect-changes.outputs.ios_should_run == 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode 15.4"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: "Generate Swift Coverage Badge"
        run: bash scripts/coverage/generate-swift-coverage.sh

      - name: "Upload Swift Coverage Badge"
        uses: actions/upload-artifact@v6
        with:
          name: swift-coverage-badge
          path: coverage/swift-coverage-badge.json
          retention-days: 7

  # =============================================================================
  # iOS Build and Test Jobs (Skip for docs-only changes)
  # =============================================================================

  ios-swift-packages:
    name: "Swift Packages (${{ matrix.config.name }})"
    runs-on: ${{ matrix.config.runner }}
    needs: detect-changes
    if: needs.detect-changes.outputs.ios_should_run == 'true'
    # Fail fast on a hung/evicted macOS runner instead of sitting until GHA
    # infra-cancels the job (a cancelled terminal run blocks the required
    # "iOS Build" gate). Generous backstop, not a tight bound.
    timeout-minutes: 45
    env:
      IOS_SIGNING_ENABLED: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        # PR runs only the primary Xcode toolchain. The full version sweep
        # (15.4 / 26.0 / 26.5) runs on nightly.yml — Xcode-toolchain drift is
        # slow-moving and does not need per-PR macOS minutes.
        config:
          - { name: "Xcode 26.5", runner: "macos-26", xcode: "26.5" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Install macOS Developer ID certificate"
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-macos-signing-keychain.sh

      - name: "Install iOS signing certificate"
        if: ${{ env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-signing-keychain.sh

      - name: "Build Swift Packages"
        env:
          MACOS_SIGNING_ENABLED: ${{ env.MACOS_SIGNING_ENABLED }}
          MACOS_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
          MACOS_DEVELOPER_ID_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_ID_TEAM_ID }}
          MACOS_SIGNING_STRICT: ${{ env.MACOS_SIGNING_ENABLED }}
          IOS_SIGNING_ENABLED: ${{ env.IOS_SIGNING_ENABLED }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_SIGNING_TEAM_ID: ${{ secrets.IOS_SIGNING_TEAM_ID }}
          IOS_SIGNING_STRICT: ${{ env.IOS_SIGNING_ENABLED }}
        run: ./scripts/ios/swift-build.sh

      - name: "Test Swift Packages"
        run: ./scripts/ios/swift-test.sh

  ios-xcode-build:
    name: "Build Xcode Projects (${{ matrix.config.name }})"
    runs-on: ${{ matrix.config.runner }}
    needs: detect-changes
    if: needs.detect-changes.outputs.ios_should_run == 'true'
    # Fail fast on a hung/evicted macOS runner instead of sitting until GHA
    # infra-cancels the job (a cancelled terminal run blocks the required
    # "iOS Build" gate). Generous backstop, not a tight bound.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # PR runs only the primary Xcode toolchain; full sweep runs on nightly.yml.
        config:
          - { name: "Xcode 26.5", runner: "macos-26", xcode: "26.5" }
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Check XcodeGen Project Drift"
        run: ./scripts/ios/xcodegen-drift-check.sh --all

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Build Xcode Projects"
        run: ./scripts/ios/xcode-build.sh

  ios-xctest-runner-simulator-tests:
    name: "XCTestRunner Simulator Tests"
    runs-on: macos-26
    needs: detect-changes
    # Wired to native_integration (src/** device surface + ios/**), NOT ios_should_run,
    # so this TS<->runner integration test still runs on the TypeScript PRs that can
    # break it while the pure-Swift build jobs skip on src-only changes.
    if: needs.detect-changes.outputs.ios_integration_should_run == 'true'
    timeout-minutes: 45
    # CI's XCUITest cold-start routinely exceeds the defaults; give the daemon a
    # generous health-poll window (240 × 500ms = 120s) so it doesn't give up (and
    # then kill+respawn) a runner still coming up, and let an `observe` request wait
    # (150s > 120s) for that cold start instead of aborting at the 30s default (#2834).
    #
    # The daemon's own readiness budget (DAEMON_STARTUP_TIMEOUT_MS, default 10s) must
    # cover the entire serial bring-up: Bun cold start + from-scratch migrations +
    # `initializeDevicePoolWithTimeout(5s)` + `initializeIosServices(5s)`. On a cold
    # macOS runner the two 5s device probes alone can exhaust 10s before Bun start and
    # migrations are even counted, hard-failing the Swift tests' daemon start. Raise it
    # to 60s here, consistent with the sibling budgets above (#3110). The env var name
    # must match src/daemon/constants.ts exactly — a typo silently falls back to 10000.
    env:
      AUTOMOBILE_CTRL_PROXY_HEALTH_MAX_ATTEMPTS: "240"
      AUTOMOBILE_OBSERVE_MCP_TIMEOUT_MS: "150000"
      AUTOMOBILE_DAEMON_STARTUP_TIMEOUT_MS: "60000"
      # This job builds CtrlProxy into /tmp/automobile-ctrl-proxy before daemon
      # startup. Pin both the build script and every restarted daemon to that
      # path, and make the local build authoritative so PR runs do not depend on
      # a published release IPA existing for package.json's current version.
      AUTOMOBILE_CTRL_PROXY_IOS_DERIVED_DATA: "/tmp/automobile-ctrl-proxy"
      AUTOMOBILE_SKIP_CTRL_PROXY_DOWNLOAD: "true"
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      # These installs are independent, network/I/O-bound, and neither the Bun
      # setup nor the npm-package install below consumes them — so background
      # them and let the Bun pair overlap. Each `wait` barrier re-syncs before
      # that install's first consumer (the drift check needs xcodegen; the build
      # needs xcodegen + xcpretty; the videoRecording test needs ffmpeg).
      # Validated by the #3779 spike: outputs unused here, `- wait: [ids]` list
      # barrier works, and an install failure surfaces loudly at the wait.
      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh
        background: true
        id: install-xcodegen

      - name: "Install xcpretty"
        run: gem install xcpretty
        background: true
        id: install-xcpretty

      # ffmpeg is consumed only by the videoRecording test far below, so it gets
      # the widest possible window: it overlaps the drift check, the CtrlProxy
      # build, the UI test, and the Xcode 26.5 simulator boot. Previously this
      # ran inline in that test step, charging a cold multi-minute brew install
      # against the step's own 10-minute cap and the test's 180s budget — a known
      # intermittent timeout (#4124). No brew-lock contention: install-xcodegen.sh
      # deliberately avoids Homebrew (#3975) and nothing else here shells to brew.
      - name: "Install ffmpeg"
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
        background: true
        id: install-ffmpeg

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - wait: [install-xcodegen, install-xcpretty]

      - name: "Check CtrlProxy XcodeGen Project Drift"
        run: ./scripts/ios/xcodegen-drift-check.sh --ctrl-proxy

      # Simulator boot is minutes of otherwise-idle wall-clock and needs neither
      # xcodegen nor the build, so start it in the background here and let the
      # CtrlProxy build (below) run concurrently. Boot is wait/I/O-bound, so it
      # overlaps the CPU-bound xcodebuild cleanly (mild contention, per #3779).
      # The #3779 spike confirmed a backgrounded step's outputs survive `wait`,
      # so the UI test can still read steps.ctrlproxy-simulator.outputs.simulator_udid
      # after the barrier — no file fallback needed.
      - name: "Boot iOS Simulator for CtrlProxy UI tests (Xcode 26.5)"
        id: ctrlproxy-simulator
        run: |
          ios_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          # 600000ms matches the Android emulator product-boot budget
          # (scripts/android/boot-emulator.sh). The whole boot draws from ONE
          # shared deadline, including the in-process CiIosBootRecovery
          # shutdown+erase+reboot. At 300000ms a slow first cold `bootstatus -b`
          # on a loaded runner left the recovery's second boot with
          # remainingBudgetMs=0 (`startDevice timeout exhausted while starting
          # the device`), so the CLI returned no deviceId and this step, its
          # `wait` barrier, and the nav-graph step (which reuses this UDID) all
          # failed as a cascade. Healthy boots finish far inside either budget.
          result="$(bun run src/index.ts --boot-device --platform ios --create-if-missing --timeout-ms 600000 --min-os-version "${ios_version}" --max-os-version "${ios_version}")"
          simulator_udid="$(printf '%s' "${result}" | jq -r '.deviceId')"
          if [[ -z "${simulator_udid}" || "${simulator_udid}" == "null" ]]; then
            echo "::error::AutoMobile product boot returned no deviceId." >&2
            exit 1
          fi
          echo "simulator_udid=${simulator_udid}" >> "${GITHUB_OUTPUT}"
        background: true

      - name: "Build CtrlProxy iOS for Testing"
        id: build-ctrlproxy
        run: ./scripts/ios/ctrl-proxy-build-for-testing.sh

      - name: "Verify CtrlProxy iOS Artifacts"
        run: |
          echo "Checking CtrlProxy iOS artifacts..."
          ls -la /tmp/automobile-ctrl-proxy/Build/Products/
          ls -la /tmp/automobile-ctrl-proxy/Build/Products/Debug-iphonesimulator/ || true
          XCTESTRUN=$(find /tmp/automobile-ctrl-proxy/Build/Products -name "*.xctestrun" | head -1)
          echo "xctestrun file: ${XCTESTRUN}"

      # The source build intentionally differs from the published release whose
      # checksum is compiled into the daemon. Publish this job's exact xctest
      # executable hash so the pre-launch TOCTOU check remains enabled and every
      # restarted daemon verifies the artifact it is actually about to execute.
      - name: "Pin Source-Built CtrlProxy Runner Integrity"
        shell: bash
        run: |
          runner_binary="/tmp/automobile-ctrl-proxy/Build/Products/Debug-iphonesimulator/CtrlProxyUITests-Runner.app/PlugIns/CtrlProxyUITests.xctest/CtrlProxyUITests"
          if [[ ! -f "${runner_binary}" ]]; then
            echo "::error::Source-built CtrlProxy xctest executable not found: ${runner_binary}" >&2
            exit 1
          fi
          runner_sha256="$(shasum -a 256 "${runner_binary}" | awk '{print $1}')"
          if [[ ! "${runner_sha256}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Unable to compute a valid CtrlProxy xctest SHA256" >&2
            exit 1
          fi
          {
            echo "AUTOMOBILE_CTRL_PROXY_IOS_RUNNER_SHA256=${runner_sha256}"
            echo "AUTOMOBILE_CTRL_PROXY_IOS_RUNNER_SHA256_TARGET=xctest"
          } >> "${GITHUB_ENV}"

      # Re-sync before the test, which needs both the build artifacts and the
      # booted sim's UDID.
      - wait: ctrlproxy-simulator

      - name: "Run selected CtrlProxy iOS tests (Xcode 26.5)"
        timeout-minutes: 5
        env:
          SIMULATOR_UDID: ${{ steps.ctrlproxy-simulator.outputs.simulator_udid }}
        run: |
          if [[ ! "${SIMULATOR_UDID}" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]]; then
            echo "::error::Invalid simulator UDID" >&2
            exit 1
          fi
          XCTESTRUN=$(find /tmp/automobile-ctrl-proxy/Build/Products -name "*.xctestrun" | head -1)
          xcodebuild test-without-building \
            -xctestrun "${XCTESTRUN}" \
            -destination "id=${SIMULATOR_UDID}" \
            -only-testing:CtrlProxyUITests/PrivacyResourceMappingTests \
            -only-testing:CtrlProxyTests/RotationChangeGenerationTests/testGestureOrientationKeepsLandscapeSceneWhenDeviceIsFaceUp \
            -only-testing:CtrlProxyUITests/CtrlProxyUITests/testHierarchyIncludesTypedTextInputsMissingFromSnapshotTree

      # Bring the daemon to ready and warm CtrlProxy on the freshly-booted sim
      # BEFORE any simulator workflow that opens an in-process session — including
      # the videoRecording test below. When videoRecording ran first (issue #5376),
      # its in-process session auto-start had to cold-launch CtrlProxy
      # (xcodebuild test-without-building, ~85s) inside the bounded runner-readiness
      # budget (30s since #5362) and flaked; with CtrlProxy already warm here, that
      # auto-start short-circuits to the readiness fast path. Keep these two warm-up
      # steps ahead of the videoRecording test — do NOT move videoRecording above
      # them. Pre-starting the daemon and waiting for readiness also makes a startup
      # failure surface loudly here instead of silently skipping the test (#2730);
      # `auto-mobile` (installed to ~/.bun/bin by `bun add -g .`) is thereby on PATH
      # for the swift-test steps.
      - name: "Ensure AutoMobile daemon ready (Xcode 26.5)"
        if: ${{ !cancelled() && steps.build-ctrlproxy.outcome == 'success' }}
        env:
          AUTOMOBILE_DAEMON_DEBUG: "1"
          AUTOMOBILE_DAEMON_EMBEDDED_SDK: "1"
          # These integration workflows exercise advanced tools deliberately;
          # keep the daemon's ordinary session surface core-only.
          AUTOMOBILE_TOOLSET_NAVIGATION_MODELING: "1"
        run: ./scripts/ci/ensure-daemon-ready.sh

      # Launch CtrlProxy on the booted sim now (a slow, one-time xcodebuild launch)
      # so the first `observe` from any downstream step (videoRecording, then the
      # navigation-graph workflow) doesn't pay that cost inside its short waitFor
      # window and time out (#2730 follow-up). Worst case ≈ 3 × (observe floor 150s
      # + delay); bound the step so a pathological hang points here instead of at
      # the 45-min job cap.
      - name: "Warm up iOS CtrlProxy (Xcode 26.5)"
        if: ${{ !cancelled() && steps.build-ctrlproxy.outcome == 'success' }}
        timeout-minutes: 12
        run: ./scripts/ci/ensure-ctrl-proxy-ready.sh

      # Re-sync the backgrounded ffmpeg install before its only consumer. With the
      # install hoisted out, this step's 10-minute cap now covers the test alone.
      # (The warm-up steps above don't need ffmpeg, so its background install gets
      # extra time to finish before this wait.)
      - wait: install-ffmpeg

      - name: "Run videoRecording MP4 integration test"
        timeout-minutes: 10
        env:
          AUTOMOBILE_TOOLSET_SCREEN_ARTIFACTS: "1"
        run: ./scripts/ios/video-recording-start-stop-integration.sh

      - name: "Run iOS navigation graph Simulator workflow"
        if: ${{ !cancelled() && steps.build-ctrlproxy.outcome == 'success' }}
        timeout-minutes: 5
        env:
          # Also supply this on the client in case it restarts the daemon.
          AUTOMOBILE_TOOLSET_NAVIGATION_MODELING: "1"
        run: |
          ./scripts/ios/navigation-graph-sdk-event-integration.sh "${{ steps.ctrlproxy-simulator.outputs.simulator_udid }}"

      # Daemon-internal logs (CtrlProxy startup/health/observe timing) are the only
      # way to diagnose iOS observe failures — the swift-test stdout doesn't include
      # them. Upload on failure only (they aren't needed on green runs, and this
      # avoids publishing env/path details from passing runs). `include-hidden-files`
      # is required because the logs live under the dot-dir ~/.auto-mobile.
      - name: "Upload AutoMobile daemon logs"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: automobile-daemon-logs-xctestrunner
          path: ~/.auto-mobile/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  ios-spm-root-package-build:
