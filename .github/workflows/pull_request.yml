name: "Pull Request"

on:
  pull_request:
    branches:
      - "**"
    # Include `labeled` so applying run-native / run-ios / run-android to an
    # existing PR actually starts a run (the default opened/synchronize/reopened
    # set does not fire on label changes).
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  pull-requests: write
  contents: read
  packages: write

jobs:
  # =============================================================================
  # Change Detection
  # =============================================================================
  # Detect if only documentation files were changed to skip long-running jobs
  # Detect if only SHA256 checksum was changed to skip long-running jobs
  detect-changes:
    timeout-minutes: 10
    name: "Detect Documentation-Only or SHA256-Only Changes"
    runs-on: ${{ vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile-small' || 'ubuntu-latest' }}
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      sha256_only: ${{ steps.check-sha256.outputs.sha256_only }}
      auto_chore: ${{ steps.check-auto-chore.outputs.auto_chore }}
      desktop_core_changed: ${{ steps.filter-desktop-core.outputs.desktop_core }}
      ide_plugin_changed: ${{ steps.filter-ide-plugin.outputs.ide_plugin }}
      desktop_app_changed: ${{ steps.filter-desktop-app.outputs.desktop_app }}
      android_changed: ${{ steps.filter-android.outputs.android }}
      kotlin_changed: ${{ steps.filter-kotlin.outputs.kotlin }}
      ios_changed: ${{ steps.filter-ios.outputs.ios }}
      ts_changed: ${{ steps.filter-ts.outputs.ts }}
      format_changed: ${{ steps.filter-format.outputs.format }}
      shell_changed: ${{ steps.filter-shell.outputs.shell }}
      android_should_run: ${{ steps.android_should_run.outputs.should_run }}
      ios_should_run: ${{ steps.ios_should_run.outputs.should_run }}
      ios_sim_tests_should_run: ${{ steps.ios_sim_tests_should_run.outputs.should_run }}
      webrtc_should_run: ${{ steps.webrtc_should_run.outputs.should_run }}
      prototype_simulator_should_run: ${{ steps.prototype_simulator_should_run.outputs.should_run }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Check for documentation-only changes"
        id: filter
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const prNumber = context.issue.number;

            // Get list of changed files
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // listFiles is capped at 3000 files. Only skip with a complete list.
            let expectedFileCount = context.payload.pull_request.changed_files;
            if (!Number.isInteger(expectedFileCount) || expectedFileCount < 0) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                });
                expectedFileCount = pr.changed_files;
              } catch (error) {
                console.log('Unable to determine changed file count:', error);
              }
            }
            const fileListComplete = Number.isInteger(expectedFileCount) &&
              expectedFileCount >= 0 && files.length === expectedFileCount;

            // Documentation file patterns
            const docPatterns = [
              /\.md$/,                    // **/*.md
              /^docs\//,                  // docs/**
              /^docs-assets\//,           // docs-assets/** — browser asset TS sources; generated JS lands under docs/
              /^docs\/.*\.(gif|png|webp)$/i, // docs/**/*.{gif,png,webp}
              /^mkdocs\.yml$/,            // mkdocs.yml
              /^\.lycherc\.toml$/         // .lycherc.toml
            ];

            // Tests under test/lint read these contracts.
            // Doc-only edits must still run Node tests.
            const testGuardedDocs = ["docs/using/screen-control.md"];

            // Check if a file matches any documentation pattern
            const isDocFile = (filename) => {
              return !testGuardedDocs.includes(filename) &&
                docPatterns.some(pattern => pattern.test(filename));
            };

            // Check if ALL files are documentation files
            const allFilesAreDocs = fileListComplete && files.length > 0 && files.every(file => isDocFile(file.filename));

            console.log('Files changed:', files.map(f => f.filename).join(', '));
            console.log('Total files:', files.length);
            console.log('Expected files:', expectedFileCount);
            console.log('File list complete:', fileListComplete);
            console.log('All files are docs:', allFilesAreDocs);
            files.forEach(file => {
              console.log(`  ${file.filename}: ${isDocFile(file.filename) ? 'doc' : 'code'}`);
            });

            core.setOutput('docs_only', allFilesAreDocs.toString());
            return allFilesAreDocs;

      - name: "Check for SHA256-only changes"
        id: check-sha256
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const prNumber = context.issue.number;

            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Check if title matches the automated SHA256 update pattern
            const titleMatches = pr.title === 'chore: update CtrlProxy APK SHA256' ||
                                 pr.title === 'chore: update CtrlProxy iOS IPA SHA256' ||
                                 pr.title === 'chore: update CtrlProxy iOS runner SHA256' ||
                                 pr.title === 'chore: update video-server jar SHA256' ||
                                 pr.title === 'chore: update CtrlProxy APK and CtrlProxy iOS IPA SHA256' ||
                                 pr.title === 'chore: update CtrlProxy APK and CtrlProxy iOS runner SHA256' ||
                                 pr.title === 'chore: update CtrlProxy iOS IPA and iOS runner SHA256' ||
                                 pr.title === 'chore: update CtrlProxy APK, iOS IPA, and iOS runner SHA256';

            // Get list of changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Check if only src/constants/release.ts was changed
            const onlyReleaseFileChanged = files.length === 1 &&
                                          files[0].filename === 'src/constants/release.ts';

            // Skip only if BOTH conditions are met
            const sha256Only = titleMatches && onlyReleaseFileChanged;

            console.log('PR Title:', pr.title);
            console.log('Title matches:', titleMatches);
            console.log('Files changed:', files.map(f => f.filename).join(', '));
            console.log('Only release.ts changed:', onlyReleaseFileChanged);
            console.log('Result - SHA256 only:', sha256Only);

            core.setOutput('sha256_only', sha256Only.toString());
            return sha256Only;

      - name: "Check for auto chore changes"
        id: check-auto-chore
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const prNumber = context.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // listFiles is capped at 3000 files. Only skip with a complete list.
            const payloadFileCount = context.payload.pull_request.changed_files;
            const expectedFileCount = Number.isInteger(payloadFileCount) && payloadFileCount >= 0
              ? payloadFileCount : pr.changed_files;
            const fileListComplete = Number.isInteger(expectedFileCount) &&
              expectedFileCount >= 0 && files.length === expectedFileCount;

            // The pull_request event already carries the complete label
            // snapshot. Reusing it avoids an extra API request in the required
            // change-detection job.
            const labels = context.payload.pull_request.labels ?? [];

            const docPatterns = [
              /\.md$/,
              /^docs\//,
              /^docs-assets\//,           // browser asset TS sources; generated JS lands under docs/
              /^docs\/.*\.(gif|png|webp)$/i,
              /^mkdocs\.yml$/,
              /^\.lycherc\.toml$/
            ];
            // Keep auto-chore consistent with docs_only for test-guarded docs.
            const testGuardedDocs = ["docs/using/screen-control.md"];
            const isDocFile = (filename) =>
              !testGuardedDocs.includes(filename) &&
              docPatterns.some(pattern => pattern.test(filename));

            const labelNames = labels.map(label => label.name);
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const automated = labelNames.includes('automated');
            const documentation = labelNames.includes('documentation');
            const titleMatches = pr.title.startsWith('chore:');
            const branchMatches = pr.head.ref.startsWith('auto-update/');
            const allFilesAreDocs = fileListComplete && files.length > 0 && files.every(file => isDocFile(file.filename));
            const autoChore = sameRepo && automated && documentation && titleMatches && branchMatches && allFilesAreDocs;

            console.log('PR Title:', pr.title);
            console.log('Head branch:', pr.head.ref);
            console.log('Same repository:', sameRepo);
            console.log('Automated label:', automated);
            console.log('Documentation label:', documentation);
            console.log('Files changed:', files.map(f => f.filename).join(', '));
            console.log('Expected files:', expectedFileCount);
            console.log('File list complete:', fileListComplete);
            console.log('All files are docs:', allFilesAreDocs);
            console.log('Result - auto chore:', autoChore);

            core.setOutput('auto_chore', autoChore.toString());
            return autoChore;

      - name: "Check for Desktop Core module changes"
        id: filter-desktop-core
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop_core:
              - 'android/desktop-core/**'
              # desktop-core depends on desktop-domain (api(project(":desktop-domain"))),
              # and the desktop-domain mapper's golden/unit tests LIVE in desktop-core
              # (e.g. CoordinateMappingGoldenVectorTest for issue #4547). Without this
              # entry a desktop-domain-only change skipped desktop-core-unit-tests and
              # the drift guard never executed (pre-existing gap; #4547 made it
              # load-bearing). ide-plugin and desktop-app jobs OR on this output, so
              # they pick up desktop-domain changes through it as well.
              - 'android/desktop-domain/**'
              - 'android/protocol/**'
              - 'android/test-plan-validation/**'
              - 'android/gradle.properties'
              - 'android/build.gradle.kts'
              - 'android/gradle/libs.versions.toml'
              # The desktop wire-contract fixtures are written by the daemon-side TS test and
              # replayed by DesktopWireFixtureCompositionTest in desktop-core. A daemon-only
              # PR that regenerates them must run that Kotlin replay (#10838).
              - 'test/fixtures/desktop-wire/**'
              - 'test/daemon/desktopWireContract.test.ts'

      - name: "Check for IDE Plugin changes"
        id: filter-ide-plugin
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ide_plugin:
              - 'android/ide-plugin/**'

      - name: "Check for Desktop App changes"
        id: filter-desktop-app
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop_app:
              - 'android/desktop-app/**'
              - 'android/desktop-core/**'

      # Native (Kotlin/Swift) build+test jobs gate on the native source trees ONLY.
      # src/** is intentionally NOT here: a pure-TypeScript change cannot break the
      # Kotlin/Swift compile. The TS<->native runtime contract is covered by the
      # nightly iOS simulator and Android emulator suites; a PR opts into the iOS
      # simulator lane with the `run-ios-sim` label (#10895). Authors can force a
      # full native run with the `run-native` / `run-ios` / `run-android` labels.
      - name: "Check for Android-related changes"
        id: filter-android
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'android/**'
              - 'scripts/android/**'
              # Shared with the daemon's TS test and read by the Kotlin
              # CoordinationParamsParityTest, so a fixture-only edit must run it.
              - 'test/fixtures/plan-coordination-params/**'
              # Generated by the daemon's desktopWireContract test and replayed by
              # the Kotlin DesktopWireFixtureCompositionTest (#10669), so a
              # regenerated fixture must re-run the client side of the contract.
              - 'test/fixtures/desktop-wire/**'
              # The emulator jobs are exactly what this composite action drives,
              # so an edit to it must exercise them rather than skip them. #4199
              # rewired this action and only ran the emulator jobs incidentally,
              # because it also touched scripts/android/** (see #4237).
              - '.github/actions/android-emulator/**'
              # Same reasoning for the Gradle-run composite: Android jobs (the
              # SDK Debug Inspector Consumer publication guard in Build
              # JUnitRunner Library among them) drive
              # it, so an edit to it must exercise them rather than be skipped.
              - '.github/actions/gradle-task-run/**'
              - 'scripts/local-dev/hot-reload.sh'
              - '.github/workflows/android*.yml'
              # This workflow controls Android-job gating, so changes to it
              # must exercise the gate rather than being silently skipped.
              - '.github/workflows/pull_request.yml'

      # Narrower than `android` above: detekt analyzes Kotlin only, so an XML
      # resource or a doc under android/ has nothing for it to look at. The
      # .kts glob covers module build files, which change a module's classpath
      # and so must re-analyze it. The non-Kotlin entries are the inputs that
      # change what detekt *reports* on unchanged sources -- rule config,
      # dependency versions, and the Gradle/toolchain version -- so they have to
      # re-run it even though no .kt moved.
      - name: "Check for Kotlin source changes"
        id: filter-kotlin
        uses: dorny/paths-filter@v3
        with:
          filters: |
            kotlin:
              - 'android/**/*.kt'
              - 'android/**/*.kts'
              - 'android/gradle.properties'
              - 'android/gradle/libs.versions.toml'
              - 'android/gradle/wrapper/**'
              - 'android/gradle/gradle-daemon-jvm.properties'
              - 'android/config/detekt/**'
              - '.github/actions/gradle-task-run/**'

      - name: "Check for iOS-related changes"
        id: filter-ios
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'scripts/ios/**'
              - '.swiftformat'
              - '.swiftlint.yml'

      # TypeScript-only concerns (memory-leak harness, benchmarks). CodeQL runs
      # from codeql.yml on push to main and weekly (#10888), not per PR.
      # scripts/** is required: the memory-leak harness and benchmark scripts live
      # there and import from src/**.
      - name: "Check for TypeScript-related changes"
        id: filter-ts
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ts:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'benchmark/**'
              - 'schemas/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'build.ts'
              - 'knip.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'oxlint-plugins/**'
              # These files define and prepare the runtime-graph verification.
              # Keep the clean-room check from being skipped when its own
              # workflow wiring changes.
              - '.github/workflows/pull_request.yml'
              - '.github/actions/setup-auto-mobile-npm-package/**'

      # oxfmt formats more than TypeScript (notably Markdown, YAML, JSON, and
      # TOML), so this intentionally has a broader scope than `filter-ts`.
      # Keep its CI gate from allowing a docs/config-only formatting violation
      # to land and later block an unrelated TypeScript PR.
      - name: "Check for formatting-related changes"
        id: filter-format
        uses: dorny/paths-filter@v3
        with:
          filters: |
            format:
              - '**/*.ts'
              - '**/*.mts'
              - '**/*.cts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.json'
              - '**/*.jsonc'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
              - '**/*.toml'
              - '.oxfmtrc.json'
              - '.gitignore'

      # BATS Shell Tests run only when an input the suite exercises changes
      # (#10889). The BATS files mostly drive scripts/** against temp fixtures;
      # the entries outside scripts/ are the real repository files a .bats file
      # reads or asserts on (audited with a path-token scan of test/bats/). The
      # source-tree scans some .bats files exercise (check-*-boundary.sh,
      # check-stdlib-first, the datetime/debug-log validators) are also run
      # directly on every PR by lint and Fast Validation, so src/** itself is
      # deliberately absent. merge.yml still runs the full suite on every push.
      - name: "Check for shell-test-relevant changes"
        id: filter-shell
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shell:
              - 'scripts/**'
              - 'test/bats/**'
              - '.github/**'
              - '.githooks/**'
              - '.agents/**'
              - '.claude-plugin/**'
              - 'commands/**'
              - 'skills/**'
              - 'oxlint-plugins/**'
              - 'schemas/**'
              - 'ios/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'build.ts'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.npmignore'
              - '.gitattributes'
              - '.lycherc.toml'
              - '.swiftformat'
              - '.swiftlint.yml'
              - 'mkdocs.yml'
              - 'Dockerfile'
              - 'server.json'
              - 'firebender.json'
              - '*.md'
              - 'docs/index.md'
              - 'docs/using/ui-tests.md'
              - 'docs/webrtc-streaming.md'
              - 'docs/assets/mdm/**'
              - 'docs/decisions/**'
              - 'src/constants/release.ts'
              - 'src/devices/deviceBootService.ts'
              - 'test/setup/**'
              - 'test/shared-process-allowlist.txt'
              - 'test/fixtures/observe/**'
              - 'test/fixtures/desktop-wire/**'
              - 'android/build-logic/**'
              - 'android/**/*.gradle.kts'
              - 'android/gradle.properties'
              - 'android/gradlew'
              - 'android/gradle/**'
              - 'android/config/detekt/**'
              - 'android/auto-mobile-sdk/api/**'
              - 'android/desktop-core/src/test/resources/screenshots/**'

      - name: "Decide if Android jobs should run"
        id: android_should_run
        env:
          FORCE_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') || contains(github.event.pull_request.labels.*.name, 'run-android') }}
        run: |
          if [[ ( "${{ steps.filter-android.outputs.android }}" == "true" || "$FORCE_NATIVE" == "true" ) && "${{ steps.filter.outputs.docs_only }}" != "true" && "${{ steps.check-sha256.outputs.sha256_only }}" != "true" && "${{ steps.check-auto-chore.outputs.auto_chore }}" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Decide if iOS jobs should run"
        id: ios_should_run
        env:
          FORCE_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') || contains(github.event.pull_request.labels.*.name, 'run-ios') }}
        run: |
          if [[ ( "${{ steps.filter-ios.outputs.ios }}" == "true" || "$FORCE_NATIVE" == "true" ) && "${{ steps.filter.outputs.docs_only }}" != "true" && "${{ steps.check-sha256.outputs.sha256_only }}" != "true" && "${{ steps.check-auto-chore.outputs.auto_chore }}" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      # The advisory XCTestRunner simulator lane is label opt-in on PRs (#10895);
      # it runs every night on CircleCI (nightly-macos) regardless.
      - name: "Decide if XCTestRunner simulator tests should run"
        id: ios_sim_tests_should_run
        env:
          OPT_IN: ${{ contains(github.event.pull_request.labels.*.name, 'run-ios-sim') }}
        run: |
          if [[ "$OPT_IN" == "true" && "${{ steps.check-sha256.outputs.sha256_only }}" != "true" && "${{ steps.check-auto-chore.outputs.auto_chore }}" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      # Prototype Simulator (overlay agent per-runtime smoke, #10569) runs only when
      # its own inputs change: the overlay agent, its smoke script and driver, and
      # the TypeScript the driver imports. Moved here from CircleCI (#11011).
      - name: "Check for overlay agent smoke inputs"
        id: filter-prototype-simulator
        uses: dorny/paths-filter@v3
        with:
          filters: |
            prototype_simulator:
              - 'ios/overlay-agent/**'
              - 'scripts/ios/overlay-agent-*'
              - 'scripts/ios/run_with_timeout.sh'
              - 'src/features/overlay/overlaySpec.ts'
              - 'src/features/overlay/overlayValidation.ts'
              - 'src/features/overlay/ios/**'
              - 'src/utils/SystemTimer.ts'
              - 'test/bats/overlay-agent-smoke.bats'

      - name: "Decide if Prototype Simulator should run"
        id: prototype_simulator_should_run
        run: |
          if [[ "${{ steps.filter-prototype-simulator.outputs.prototype_simulator }}" == "true" && "${{ steps.check-sha256.outputs.sha256_only }}" != "true" && "${{ steps.check-auto-chore.outputs.auto_chore }}" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      # The MediaMTX publisher and real Android/iOS capture jobs are heavy
      # (devices + browser + SFU + FFmpeg), so they run only when WebRTC is
      # actually in play — see webrtc_should_run.
      - name: "Check for WebRTC publisher changes"
        id: filter-webrtc
        uses: dorny/paths-filter@v3
        with:
          filters: |
            webrtc:
              - 'src/features/webrtc/**'
              - 'src/features/screen-stream/**'
              - 'src/server/webrtcStreamManager.ts'
              - 'src/daemon/webrtc*'
              - 'src/daemon/videoStreamSocket*'
              - 'src/daemon/videoStreamFraming.ts'
              - 'src/daemon/daemonFiles.ts'
              - 'src/daemon/socketServer/**'
              - 'examples/mediamtx/**'
              - 'test/integration/mediamtxWebRtcPublisher.integration.test.ts'
              - 'test/integration/webrtcDeviceCapture.integration.test.ts'
              - 'test/helpers/captureStageTimeline.ts'
              - 'test/helpers/whepSubscriptionRecovery.ts'
              # Controls daemon-start retry and simulator selection for the
              # real-device WHEP test; a helper-only change must exercise both
              # device lanes rather than being silently skipped (issue #7001).
              - 'test/helpers/webrtcDeviceCaptureHelpers.ts'
              - 'test/bats/mediamtx-webrtc-integration.bats'
              - 'scripts/webrtc/**'
              # Native encoder sources decide the on-the-wire H.264 profile the
              # publisher must accept. A profile change here (e.g. Baseline ->
              # Main) is exactly the #4877 class of regression this job guards, so
              # exercise it when the native encoders change (issue #4884).
              - 'android/video-server/**'
              - 'ios/screen-capture/**'
              # This workflow controls WebRTC-job gating, so a change to it must
              # exercise the job rather than being silently skipped.
              - '.github/workflows/pull_request.yml'
              - '.github/workflows/merge.yml'

      # Run the WebRTC integration jobs when the streaming surface is touched, OR
      # when a human explicitly opts in by labelling the PR `webrtc` or mentioning
      # `webrtc` in the title/body (case-insensitive). The explicit signals are an
      # intentional override, so unlike the native gates this deliberately does NOT
      # exclude docs_only — a docs PR that says `webrtc` opts in on purpose. Title
      # and body are passed via env, never interpolated into the script, so a
      # crafted PR title cannot inject shell.
      - name: "Decide if WebRTC integration jobs should run"
        id: webrtc_should_run
        env:
          PATH_MATCH: ${{ steps.filter-webrtc.outputs.webrtc }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'webrtc') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SHA256_ONLY: ${{ steps.check-sha256.outputs.sha256_only }}
          AUTO_CHORE: ${{ steps.check-auto-chore.outputs.auto_chore }}
        run: |
          mention=false
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | tr '[:upper:]' '[:lower:]' | grep 'webrtc' >/dev/null; then
            mention=true
          fi
          if [[ ( "$PATH_MATCH" == "true" || "$HAS_LABEL" == "true" || "$mention" == "true" ) && "$SHA256_ONLY" != "true" && "$AUTO_CHORE" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # =============================================================================
  # Fast Validation Jobs (Always Run)
  # =============================================================================

  build-desktop-core:
    timeout-minutes: 20
    name: "Build Desktop Core Module"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop_core_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-core:build -x test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  desktop-core-unit-tests:
    timeout-minutes: 30
    name: "Run Desktop Core Unit Tests"
    runs-on: ubuntu-latest
    needs: [detect-changes, build-desktop-core]
    if: needs.detect-changes.outputs.desktop_core_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-core:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-core-test-results
          path: android/desktop-core/build/reports/tests/test/

      # Screenshot comparisons fail with pixel diffs that are only inspectable
      # as images -- the HTML test report above carries the stack trace but not
      # the rendering. See issue #3913.
      - name: "Upload Screenshot Diffs"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-core-screenshot-diffs
          path: android/desktop-core/build/reports/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  build-ide-plugin:
    timeout-minutes: 20
    name: "Build IDE Plugin"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: (needs.detect-changes.outputs.ide_plugin_changed == 'true' || needs.detect-changes.outputs.desktop_core_changed == 'true') && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android/ide-plugin
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "build -x test"
          gradle-project-directory: "android/ide-plugin"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Build Plugin ZIP"
        shell: bash
        working-directory: android/ide-plugin
        run: |
          ./gradlew buildPlugin --stacktrace --continue

      - name: "Verify Plugin"
        shell: bash
        working-directory: android/ide-plugin
        run: |
          ./gradlew verifyPlugin --stacktrace --continue

      - name: "Upload IDE Plugin ZIP"
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: ide-plugin-zip
          path: android/ide-plugin/build/distributions/*.zip

  ide-plugin-unit-tests:
    timeout-minutes: 20
    name: "Run IDE Plugin Unit Tests"
    runs-on: ubuntu-latest
    needs: [detect-changes, build-ide-plugin]
    if: (needs.detect-changes.outputs.ide_plugin_changed == 'true' || needs.detect-changes.outputs.desktop_core_changed == 'true') && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android/ide-plugin
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "test"
          gradle-project-directory: "android/ide-plugin"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ide-plugin-test-results
          path: android/ide-plugin/build/reports/tests/test/

  build-desktop-app:
    timeout-minutes: 20
    name: "Build Desktop App (${{ matrix.os }})"
    runs-on: ${{ (matrix.os == 'macos-latest' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","automobile-mac"]') || matrix.os }}
    needs: detect-changes
    if: (needs.detect-changes.outputs.desktop_app_changed == 'true' || needs.detect-changes.outputs.desktop_core_changed == 'true') && needs.detect-changes.outputs.sha256_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Select JDK 21"
        if: runner.environment == 'self-hosted'
        shell: bash
        working-directory: .
        run: |
          if ! jdk_home=$(/usr/libexec/java_home -v 21) || [[ -z "$jdk_home" ]]; then
            echo '::error::The self-hosted desktop build requires an installed JDK 21.' >&2
            exit 1
          fi
          if ! javac_version=$("$jdk_home/bin/javac" -version 2>&1) || ! grep -Eq '^javac 21([.]|$)' <<<"$javac_version"; then
            echo "::error::The selected JDK at $jdk_home does not provide javac 21." >&2
            exit 1
          fi
          echo "JAVA_HOME=$jdk_home" >> "$GITHUB_ENV"
          echo "$jdk_home/bin" >> "$GITHUB_PATH"

      - name: "Isolate self-hosted desktop build"
        if: runner.environment == 'self-hosted'
        shell: bash
        working-directory: .
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::The self-hosted desktop build requires an Android SDK directory at $sdk_root (set ANDROID_HOME or ANDROID_SDK_ROOT)." >&2
            exit 1
          fi
          isolated_home="$RUNNER_TEMP/desktop-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data" "$isolated_home/gradle" "$isolated_home/action-state"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "GRADLE_USER_HOME=$isolated_home/gradle"
            echo "GRADLE_STATE_DIR=$isolated_home/action-state"
            echo "GRADLE_RETRY_LOG_DIR=$isolated_home/gradle-retry"
            echo "JAVA_TOOL_OPTIONS=-Duser.home=$isolated_home"
          } >> "$GITHUB_ENV"

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-app:build -x test"
          gradle-flags: ${{ runner.environment == 'self-hosted' && '["-Dorg.gradle.java.installations.auto-download=false"]' || '[]' }}
          gradle-project-directory: "android"
          gradle-home-directory: ${{ runner.environment == 'self-hosted' && format('{0}/desktop-home-{1}-{2}/gradle', runner.temp, github.run_id, github.run_attempt) || format('~/.gradle/{0}-{1}', github.job, matrix.os) }}
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          malloc-replacement: ${{ runner.os == 'Linux' && 'jemalloc' || 'none' }}

      - name: "Stop isolated Gradle daemon and remove desktop home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        working-directory: .
        run: |
          if [[ -d "${GRADLE_USER_HOME:-}" ]]; then
            if ! (cd android && ./gradlew --stop); then
              echo '::warning::Failed to stop the isolated Gradle daemon before removing its home.' >&2
            fi
          fi
          rm -rf -- "$RUNNER_TEMP/desktop-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  desktop-app-unit-tests:
    timeout-minutes: 30
    name: "Run Desktop App Unit Tests"
    runs-on: ubuntu-latest
    needs: [detect-changes, build-desktop-app]
    if: (needs.detect-changes.outputs.desktop_app_changed == 'true' || needs.detect-changes.outputs.desktop_core_changed == 'true') && needs.detect-changes.outputs.sha256_only != 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":desktop-app:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Test Results"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-app-test-results
          path: android/desktop-app/build/reports/tests/test/

  fast-validation:
    timeout-minutes: 20
    name: "Fast Validation"
    runs-on: ${{ vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile' || 'ubuntu-latest' }}
    needs: [detect-changes]
    # This required check must always report a result, including auto-chore
    # changes and a failed change-detection job.
    if: always()
    steps:
      - name: "Require change detection result"
        shell: bash
        run: |
          detect_result="${{ needs.detect-changes.result }}"
          if [[ "$detect_result" != "success" ]]; then
            echo "Change detection concluded $detect_result; formatter gate cannot be trusted"
            exit 1
          fi

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          # Full history so the ktfmt check can diff the PR head against its base
          # SHA (git diff <base>...HEAD). The default shallow clone would not
          # contain the base commit and the diff would fail.
          fetch-depth: 0

      # The documentation build consumes scripts/github/uv.lock after merge.
      # Start its independent toolchain setup now so the required Fast Validation
      # job can validate that lockfile before a PR lands.
      - name: "Setup Python for documentation lock validation"
        uses: actions/setup-python@v6
        background: true
        id: setup-python-lock
        with:
          python-version: "3.11"

      - name: "Install uv for documentation lock validation"
        uses: astral-sh/setup-uv@v7
        background: true
        id: setup-uv-lock
        with:
          enable-cache: true

      # Pulls a Docker image and consumes nothing this job produces, so start
      # it up front and let the whole job overlap the pull. It has no consumer,
      # so the barrier sits at the end -- a hadolint failure surfaces there
      # rather than vanishing.
      - name: "Run hadolint"
        uses: hadolint/hadolint-action@v3.1.0
        background: true
        id: hadolint
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      # Pure network/disk and independent of everything below, so background it
      # here and let the JDK download and the npm-package setup (Bun + ripgrep +
      # `bun install` + build, ~60-120s) overlap it. The `wait` barrier re-syncs
      # before the first consumer: the aggregator's `xml` check shells out to
      # xmlstarlet, and the BATS step needs bats. No dpkg-lock contention — this
      # is the only apt user in the job (setup-java unpacks a tarball and
      # setup-ripgrep installs a pre-built binary). Mechanism per #3779.
      #
      # Each network call inside the helper is bounded by a per-command timeout
      # and retried with backoff so a stalled apt mirror or GitHub clone fails
      # fast instead of hanging silently — a `background` failure surfaces at the
      # `- wait:` below, and without this an indefinite hang ate the whole
      # 50-minute job budget. `timeout-minutes` is the hard backstop.
      - name: "Install fast validation dependencies"
        shell: bash
        background: true
        id: install-fast-validation-deps
        timeout-minutes: 15
        run: scripts/ci/install-fast-validation-deps.sh

      # Pin the JDK so the ktfmt check formats deterministically (project targets
      # Java 21) instead of relying on the runner image's default JDK.
      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      # Formatting used to be its own "Check Formatting" job that this job
      # waited on: a whole runner slot (plus queue wait and a serial hop on
      # the required path) for a ~10 s check. It runs here first, right after
      # bun is installed, so a formatting failure still fails this required
      # check before the slower validators start.
      - name: "Check formatting"
        if: needs.detect-changes.outputs.format_changed == 'true'
        shell: bash
        run: |
          if ! bun run format:check; then
            echo "::error::Formatting check failed — run 'bun run format' and push again"
            exit 1
          fi

      - wait: install-fast-validation-deps

      - wait: [setup-python-lock, setup-uv-lock]

      - name: "Run fast validation checks"
        shell: bash
        env:
          INSTALL_KTFMT_WHEN_MISSING: "true"
          # ktfmt validates the complete Kotlin tree in pre-merge Fast Validation.
          # The batched validator starts one JVM for all files, keeping the
          # full-tree backstop fast enough to catch formatting drift before merge.
          KTFMT_ONLY_TOUCHED_FILES: "false"
        run: |
          scripts/all_fast_validate_checks.sh \
            --only yaml,lfs-pointers,schema-copy-drift,tool-definitions,ctrl-proxy-project-sources,xml,bun-version-coherence,shellcheck,shell-portability,shell-sete,pipefail-grep-q,stdlib-first,dependency-decisions,sharp-matrix,runtime-pins,shell-quote-boundary,security-boundary,app-bundle-metadata-boundary,ios-ctrl-proxy-process-boundary,element-resolution-ratchet,test-as-any-ratchet,shared-process-allowlist,dependabot,desktop-core-unified,workflow-assertion-triggers,mkdocs-nav,docs-github-markdown,docs-assets,env-var-docs,ktfmt,claude-plugin,codex-skills,github-python-lock,debug-tags,datetime-now-literal,markdown-bash \
            --max-parallel 4

      - name: "Run offline lychee link check"
        shell: bash
        run: scripts/all_fast_validate_checks.sh --only lychee-offline

      # The BATS suite (913 tests, ~3.5min serially) is NOT run here. It ran a
      # full Ubuntu pass inline and dominated this required gate's wall-clock; the
      # Ubuntu coverage now lives in the `bats-tests` matrix job (mirroring
      # merge.yml), gated by the required "Shell Tests" roll-up and running in
      # parallel instead of on this job's critical path.

      # Drift gate for the generated iOS runner version constant (#2814). Pure
      # bash + python3, so it runs on this Ubuntu job rather than the macOS Swift
      # lane — the committed AutoMobileVersion.swift must match package.json.
      - name: "Check iOS version constant is in sync with package.json"
        shell: bash
        run: bash scripts/versioning/generate-ios-version.sh --check

      - wait: hadolint

      - name: "Upload Fast Validation Logs"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: fast-validation-logs
          path: scratch/fast-validate-*/
          retention-days: 7

  # Detekt used to be a step inside Fast Validation, where its ~7 minutes of
  # cold Gradle work dominated an otherwise ~1 minute job. It is its own job so
  # it runs concurrently instead of serially, and so it can go through
  # gradle-task-run for build/configuration cache reuse -- the raw `./gradlew`
  # call it replaced had no Gradle caching at all and recompiled every module
  # from scratch on every PR.
  detekt:
    timeout-minutes: 30
    name: "Detekt"
    runs-on: ubuntu-latest
    needs: detect-changes
    # detekt analyzes Kotlin only, so a PR touching none of the inputs in the
    # `kotlin` filter cannot change what it reports. This gates whether the job
    # runs at all; when it does run it analyzes the whole tree, so it is not a
    # narrowing of what gets checked. merge.yml re-runs it unconditionally.
    if: needs.detect-changes.outputs.kotlin_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true' && needs.detect-changes.outputs.auto_chore != 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Deliberately the FULL task list, not a per-module subset. An earlier
      # revision scoped this to the modules a PR changed; that is unsafe with
      # this project's detekt config, which disables every file-local rule set
      # and leaves `potential-bugs` -- whose rules are cross-module type
      # resolution -- as the only active one. A change in one module can move a
      # finding in a consumer, so scoping would land it on main and redden the
      # next unrelated PR. The Gradle build cache, not a shorter task list, is
      # what makes this fast.
      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "detektMain detektTest"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          # Configuration-cache reuse is deliberately OFF here (#5332). A restored
          # config-cache entry intermittently evaluated the Metro Gradle plugin
          # classpath under a stale JVM context, failing ~2min with a generic
          # exit 1 and NO `.kt` annotations ("Dependency requires at least JVM
          # runtime version 21. This build uses a Java 17 JVM.") even though the
          # action pins JDK 21 and local `--rerun-tasks` runs are green. Disabling
          # reuse removes that flake deterministically; the Gradle BUILD cache
          # (the real speed win) stays on, so the cost is only the configuration
          # phase, not a full recompile. Do not flip this back to true without
          # first fixing the underlying config-cache/JVM interaction -- the guard
          # in test/bats/detekt-config-cache-disabled.bats pins it.
          reuse-configuration-cache: false
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Upload Detekt Reports"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports
          path: android/**/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

  bats-tests:
    # The BATS suite runs right at the old 5-minute ceiling on macos-latest
    # (a 4m48s pass left only 12s of headroom), so the job flaked to a timeout
    # cancellation whenever the runner was slightly slow. Setup is only ~16s of
    # the budget; the rest is `bats test/bats/` itself, which keeps growing as
    # tests are added. Give the suite comfortable headroom instead of relying on
    # reruns against a boundary it now straddles.
    timeout-minutes: 15
    name: "BATS Shell Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile' || matrix.os }}
    needs: detect-changes
    # Path-filtered (#10889): a skipped run still lets the required "Shell
    # Tests" roll-up pass, and merge.yml runs the full sweep on every push.
    if: needs.detect-changes.outputs.shell_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true' && needs.detect-changes.outputs.auto_chore != 'true'
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu was folded in here (#5643-era Fast Validation split): the Ubuntu
        # BATS pass used to run inline inside the required Fast Validation job and
        # dominated its wall-clock. It now runs as a parallel matrix leg, matching
        # merge.yml, and is gated by the required "Shell Tests" roll-up.
        # Keep the portable PR lane on Linux. The equivalent macOS lane runs
        # nightly on CircleCI (nightly-macos) so macOS capacity is off the merge path.
        os: [ubuntu-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # Pure network/disk (`brew install bats-core` on macOS, a source install on
      # Linux) and independent of the Bun setup below, which only writes
      # node_modules. Background it so the two overlap, then re-sync at the
      # barrier before `bats test/bats/`, the sole consumer of both. Mechanism
      # per #3779. shellcheck is installed here too: the markdown-bash gate
      # (validate-markdown-bash.bats, #4118) is the first bats-tested script that
      # shells out to the real shellcheck binary — every other shell validator
      # scans with grep — and the macOS runner image does not ship shellcheck, so
      # without this the whole suite mysteriously failed (#4801). The step name is
      # pinned to "Install BATS" by test/scripts/batsInstallHoist.test.ts (#4126).
      - name: "Install BATS"
        shell: bash
        background: true
        id: install-bats
        run: |
          if command -v bats &>/dev/null; then
            echo "bats already installed: $(bats --version)"
          elif command -v brew &>/dev/null; then
            brew install bats-core
          else
            # Ubuntu apt 'bats' is the old sstephenson/bats which doesn't
            # capture stderr in run output. Install bats-core from source.
            # Pin the runner: newer development snapshots can miscount this
            # suite after executing every test, which makes a green run fail.
            git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
            sudo /tmp/bats-core/install.sh /usr/local
          fi
          if command -v shellcheck &>/dev/null; then
            echo "shellcheck already installed: $(shellcheck --version | awk '/^version:/{print $2}')"
          elif command -v brew &>/dev/null; then
            brew install shellcheck
          else
            echo "shellcheck missing and no package manager to install it" >&2
            exit 1
          fi

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Stays in the foreground: it appends node_modules/.bin to $GITHUB_PATH.
      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - wait: install-bats

      - name: "Run BATS Unit Tests"
        shell: bash
        env:
          # The macOS runner has three shared cores; shell-heavy files can be
          # descheduled behind their parallel peers despite no real I/O.
          AUTOMOBILE_BATS_MAX_FILE_SECONDS: "240"
          AUTOMOBILE_BATS_UNIT_BUDGET_SECONDS: "420"
        run: scripts/ci/run-bats.sh unit

      # Folded in from the former bats-integration-tests job (~40s of work that
      # paid a whole runner slot plus ~1 min of setup per PR). It must stay
      # sequential after the unit lane: two bats sweeps never share a machine
      # concurrently.
      - name: "Run BATS Integration Tests"
        shell: bash
        run: scripts/ci/run-bats.sh integration

  installer-minimal:
    timeout-minutes: 20
    name: "Installer Minimal (${{ matrix.os }})"
    runs-on: ${{ (matrix.os == 'macos-latest' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","automobile-mac"]') || (matrix.os == 'ubuntu-latest' && vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository) && 'namespace-profile-auto-mobile-small' || matrix.os }}
    needs: detect-changes
    env:
      RUN_INSTALLER: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
      # Keep this job from touching any daemon on the runner. The product default
      # remains to migrate stale daemons for users.
      AUTOMOBILE_SKIP_STALE_DAEMON_MIGRATION: "true"
      # ffmpeg is a large, slow install (it has timed out this job) and video
      # recording is not exercised here — skip it.
      AUTOMOBILE_INSTALL_SKIP_FFMPEG: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Skip installer validation"
        if: env.RUN_INSTALLER != 'true'
        run: echo "Skipping installer validation for documentation-only changes"

      - name: "Isolate self-hosted installer home"
        if: env.RUN_INSTALLER == 'true' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/installer-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
          } >> "$GITHUB_ENV"

      - name: "Git Checkout"
        if: env.RUN_INSTALLER == 'true'
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      - name: "Confirm clean installer fixture"
        if: env.RUN_INSTALLER == 'true'
        shell: bash
        run: |
          # Refuse pre-existing files or symlinked parents before allowing cleanup
          # of any project target supported by the minimal installer.
          for directory in .codex .cursor .vscode; do
            test ! -L "$directory"
          done
          for config in .mcp.json .codex/config.toml .cursor/mcp.json .vscode/mcp.json; do
            test ! -e "$config"
            test ! -L "$config"
          done

      - name: "Run Installer (minimal)"
        if: env.RUN_INSTALLER == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          set +e
          bash ./scripts/install.sh --preset minimal --non-interactive 2>&1 | tee ci-logs/installer.log
          install_status=${PIPESTATUS[0]}
          set -e
          echo "INSTALL_EXIT_CODE=${install_status}" >> "$GITHUB_ENV"
          exit 0

      - name: "Remove generated project MCP configuration"
        if: env.RUN_INSTALLER == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          # No client installed is a valid installer outcome. Each target was
          # absent before this run, so remove only files this run could create.
          cleanup_status=0
          for directory in .codex .cursor .vscode; do
            if [[ -L "$directory" ]]; then
              echo "Refusing cleanup through symlink: $directory" >&2
              cleanup_status=1
            fi
          done
          if [[ "$cleanup_status" -eq 0 ]]; then
            for config in .mcp.json .codex/config.toml .cursor/mcp.json .vscode/mcp.json; do
              rm -f -- "$config" || cleanup_status=1
            done
          fi
          set -e
          echo "UNINSTALL_EXIT_CODE=${cleanup_status}" >> "$GITHUB_ENV"
          exit 0

      - name: "Upload Logs"
        if: env.RUN_INSTALLER == 'true' && (env.INSTALL_EXIT_CODE != '0' || env.UNINSTALL_EXIT_CODE != '0' || failure())
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: installer-minimal-${{ matrix.os }}-logs
          path: ci-logs/
          retention-days: 7

      - name: "Fail on error"
        if: env.RUN_INSTALLER == 'true' && (env.INSTALL_EXIT_CODE != '0' || env.UNINSTALL_EXIT_CODE != '0')
        shell: bash
        run: |
          echo "Installer exit code: ${INSTALL_EXIT_CODE:-0}"
          echo "Uninstaller exit code: ${UNINSTALL_EXIT_CODE:-0}"
          exit 1

      - name: "Remove isolated installer home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/installer-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # =============================================================================
  # Node Checks (#10894)
  # =============================================================================
  # One runner slot for the small Node checks that each paid a checkout and an
  # AutoMobile package setup: Bun Security Audit (every non-chore PR), and, when
  # TypeScript changed, the clean-room Pinned Runtime Graph check (#5421),
  # Memory Leak Detection and the MCP Benchmarks. Each check runs even when an
  # earlier one failed, and any failure fails the job.
  node-checks:
    name: "Node Checks"
    runs-on: ${{ vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile' || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.sha256_only != 'true' && needs.detect-changes.outputs.auto_chore != 'true'
    # Sum of the former per-job caps (20 + 30 + 20 + 20) less three setups.
    timeout-minutes: 60
    env:
      TS_CHANGED: ${{ needs.detect-changes.outputs.ts_changed }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Bun Audit"
        run: |
          bun pm audit --json > bun-audit-results.json || true
        continue-on-error: true

      - name: "Upload Bun Audit Results"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bun-audit-results
          path: bun-audit-results.json

      - name: "Verify pinned runtime dependency graph (#5421)"
        if: ${{ !cancelled() && env.TS_CHANGED == 'true' }}
        shell: bash
        run: bash scripts/ci/verify-pinned-runtime-graph.sh

      - name: "Upload Pinned Runtime Graph Report"
        uses: actions/upload-artifact@v6
        if: ${{ always() && env.TS_CHANGED == 'true' }}
        with:
          name: pinned-runtime-graph-report
          path: ci-logs/pinned-runtime-graph.log
          retention-days: 90

      - name: "Run Memory Leak Detection"
        if: ${{ !cancelled() && env.TS_CHANGED == 'true' }}
        run: bun run test:memory-leaks

      - name: "Upload Heap Snapshots"
        if: ${{ failure() && env.TS_CHANGED == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: heap-snapshots
          path: "*.heapsnapshot"

      - name: "Run MCP Benchmarks"
        if: ${{ !cancelled() && env.TS_CHANGED == 'true' }}
        shell: bash
        run: |
          mkdir -p reports

          if ! bun run benchmark-context --output reports/context-benchmark.json; then
            echo "CONTEXT_BENCHMARK_FAILED=true" >> "$GITHUB_ENV"
          fi

          if ! bun run benchmark-tools --output reports/tool-benchmark.json; then
            echo "TOOL_BENCHMARK_FAILED=true" >> "$GITHUB_ENV"
          fi

          if ! timeout 60s bun run benchmark-startup --compare benchmark/startup-baseline.json --output reports/startup-benchmark.json; then
            echo "STARTUP_BENCHMARK_FAILED=true" >> "$GITHUB_ENV"
          fi

          if ! bun run benchmark-npm-unpacked-size --output reports/npm-unpacked-size.json; then
            echo "NPM_UNPACKED_SIZE_BENCHMARK_FAILED=true" >> "$GITHUB_ENV"
          fi

      - name: "Upload Context Benchmark Report"
        uses: actions/upload-artifact@v6
        if: ${{ always() && env.TS_CHANGED == 'true' }}
        with:
          name: context-benchmark-report
          path: reports/context-benchmark.json
          retention-days: 90

      - name: "Upload Tool Benchmark Report"
        uses: actions/upload-artifact@v6
        if: ${{ always() && env.TS_CHANGED == 'true' }}
        with:
          name: tool-benchmark-report
          path: reports/tool-benchmark.json
          retention-days: 90

      - name: "Upload Startup Benchmark Report"
        uses: actions/upload-artifact@v6
        if: ${{ always() && env.TS_CHANGED == 'true' }}
        with:
          name: startup-benchmark-report
          path: reports/startup-benchmark.json
          retention-days: 90

      - name: "Upload NPM Unpacked Size Benchmark Report"
        uses: actions/upload-artifact@v6
        if: ${{ always() && env.TS_CHANGED == 'true' }}
        with:
          name: npm-unpacked-size-report
          path: reports/npm-unpacked-size.json
          retention-days: 90

      - name: "Post Consolidated Comment"
        if: ${{ !cancelled() && env.TS_CHANGED == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            const contextPath = 'reports/context-benchmark.json';
            const toolPath = 'reports/tool-benchmark.json';
            const startupPath = 'reports/startup-benchmark.json';
            const npmPath = 'reports/npm-unpacked-size.json';

            const readReport = (reportPath, label) => {
              if (!fs.existsSync(reportPath)) {
                return { label, report: null };
              }
              try {
                const raw = fs.readFileSync(reportPath, 'utf8');
                return { label, report: JSON.parse(raw) };
              } catch (error) {
                console.log(`Failed to read ${label} report: ${error.message}`);
                return { label, report: null };
              }
            };

            const contextReport = readReport(contextPath, 'Context Baselines');
            const toolReport = readReport(toolPath, 'Tool Call Throughput');
            const startupReport = readReport(startupPath, 'Startup Performance');
            const npmReport = readReport(npmPath, 'NPM Unpacked Size');

            if (!contextReport.report && !toolReport.report && !startupReport.report && !npmReport.report) {
              console.log('No benchmark reports found. Skipping PR comment.');
              return;
            }

            let body = '## MCP Benchmarks\n\n';

            const statuses = [];
            let hasFailures = false;
            let hasMissing = false;
            let hasBaselineOnly = false;

            const trackStatus = (label, report) => {
              if (!report) {
                statuses.push(`${label}: ⚠️ missing`);
                hasMissing = true;
                return;
              }
              if (report.enforcement?.enabled === false) {
                statuses.push(`${label}: 📏`);
                hasBaselineOnly = true;
                return;
              }
              const passed = report.passed !== false;
              const icon = passed ? '✅' : '❌';
              statuses.push(`${label}: ${icon}`);
              if (!passed) {
                hasFailures = true;
              }
            };

            trackStatus('Context Baselines', contextReport.report);
            trackStatus('Tool Call Throughput', toolReport.report);
            trackStatus('Startup', startupReport.report);
            trackStatus('NPM Unpacked Size', npmReport.report);

            let overallStatus = '⚠️ PARTIAL';
            if (!hasFailures && !hasMissing) {
              overallStatus = hasBaselineOnly ? '📏 BASELINES RECORDED' : '✅ PASSED';
            } else if (hasFailures) {
              overallStatus = '❌ FAILED';
            }

            body += `**Overall Status:** ${overallStatus}\n`;
            body += `**Status by Benchmark:** ${statuses.join(' | ')}\n\n`;

            if (contextReport.report) {
              const report = contextReport.report;
              const formatRow = (label, result) => {
                if (!result) {
                  return `| ${label} | n/a | n/a | n/a | ⚠️ |`;
                }
                const status = report.enforcement?.enabled === false
                  ? '📏'
                  : result.passed ? '✅' : '❌';
                const actual = typeof result.actual === 'number' ? result.actual.toLocaleString() : 'n/a';
                const baseline = typeof result.baseline === 'number' ? result.baseline.toLocaleString() : 'n/a';
                const delta = typeof result.delta === 'number'
                  ? `${result.delta >= 0 ? '+' : ''}${result.delta.toLocaleString()}`
                  : 'n/a';
                return `| ${label} | ${actual} | ${baseline} | ${delta} | ${status} |`;
              };

              body += '### Context Baselines\n\n';
              body += '| Category | Actual | Baseline | Delta | Status |\n';
              body += '|----------|--------|----------|-------|--------|\n';
              body += formatRow('Core Tools', report.results?.coreTools) + '\n';
              body += formatRow('All Tools', report.results?.allTools) + '\n';
              body += formatRow('Resources', report.results?.resources) + '\n';
              body += formatRow('Resource Templates', report.results?.resourceTemplates) + '\n';
              body += formatRow('**Core Total**', report.results?.coreTotal) + '\n';
              body += formatRow('**All Total**', report.results?.allTotal) + '\n';

              if (Array.isArray(report.violations) && report.violations.length > 0) {
                body += '\n### ⚠️ Threshold Violations\n\n';
                for (const violation of report.violations) {
                  body += `- ${violation}\n`;
                }
              }

              const contextStatus = report.enforcement?.enabled === false
                ? '📏 BASELINES RECORDED (threshold enforcement pending)'
                : report.passed ? '✅ PASSED' : '❌ FAILED';
              body += `\n**Overall Status:** ${contextStatus}`;
              if (report.timestamp) {
                body += `\n\n_Generated at ${report.timestamp}_`;
              }
              body += '\n\n';
            }

            if (toolReport.report) {
              const report = toolReport.report;
              const summary = report.summary ?? {};
              const sampleSize = report.sampleSize ?? 'n/a';
              const totalDuration = typeof report.totalDuration === 'number'
                ? `${(report.totalDuration / 1000).toFixed(2)}s`
                : 'n/a';
              const averageThroughput = typeof summary.averageThroughput === 'number'
                ? `${summary.averageThroughput.toFixed(2)} ops/second`
                : 'n/a';

              body += '### Tool Call Throughput\n\n';
              body += `**Sample Size:** ${sampleSize} iterations per tool\n`;
              body += `**Total Duration:** ${totalDuration}\n`;
              body += `**Average Throughput:** ${averageThroughput}\n\n`;

              const categories = [
                { name: 'Fast Operations', expectedLatency: '<100ms', tools: ['listDevices', 'getForegroundApp', 'pressButton'] },
                { name: 'Medium Operations', expectedLatency: '100ms-1s', tools: ['observe', 'tapOn', 'inputText', 'swipe'] },
                { name: 'Slow Operations', expectedLatency: '1s+', tools: ['launchApp', 'installApp'] }
              ];

              const results = Array.isArray(report.results) ? report.results : [];
              let renderedAnyCategory = false;

              for (const category of categories) {
                const categoryResults = results.filter(r => category.tools.includes(r.toolName));
                if (categoryResults.length === 0) continue;
                renderedAnyCategory = true;

                body += `#### ${category.name} (${category.expectedLatency})\n\n`;
                body += '| Tool | P50 | P95 | Mean | Success | Status |\n';
                body += '|------|-----|-----|------|---------|--------|\n';

                for (const result of categoryResults) {
                  const status = result.overallPassed === false ? '❌' : '✅';
                  const p50 = typeof result.p50 === 'number' ? `${result.p50.toFixed(1)}ms` : 'n/a';
                  const p95 = typeof result.p95 === 'number' ? `${result.p95.toFixed(1)}ms` : 'n/a';
                  const mean = typeof result.mean === 'number' ? `${result.mean.toFixed(1)}ms` : 'n/a';
                  const success = typeof result.successRate === 'number' ? `${result.successRate.toFixed(0)}%` : 'n/a';
                  body += `| ${result.toolName} | ${p50} | ${p95} | ${mean} | ${success} | ${status} |\n`;

                  if (Array.isArray(result.thresholdChecks) && result.overallPassed === false) {
                    for (const check of result.thresholdChecks.filter(c => !c.passed)) {
                      const metric = check.metric ? check.metric.toUpperCase() : 'METRIC';
                      const actual = typeof check.actual === 'number' ? `${check.actual.toFixed(2)}ms` : 'n/a';
                      const threshold = typeof check.threshold === 'number' ? `${check.threshold.toFixed(2)}ms` : 'n/a';
                      const regression = typeof check.regression === 'number' ? `+${check.regression.toFixed(1)}%` : 'n/a';
                      body += `| └─ ${metric} regression | ${actual} | | | ${threshold} | ${regression} | |\n`;
                    }
                  }
                }
                body += '\n';
              }

              if (!renderedAnyCategory) {
                body += '_No tool results found._\n\n';
              }

              if (Array.isArray(report.violations) && report.violations.length > 0) {
                body += '#### ⚠️ Performance Regressions\n\n';
                for (const violation of report.violations) {
                  body += `- ${violation}\n`;
                }
                body += '\n';
              }

              const passedTools = typeof summary.passedTools === 'number' ? summary.passedTools : 'n/a';
              const totalTools = typeof summary.totalTools === 'number' ? summary.totalTools : 'n/a';
              body += `**Summary:** ${passedTools}/${totalTools} tools passed\n`;
              body += `**Overall Status:** ${report.passed ? '✅ PASSED' : '❌ FAILED'}\n\n`;
              if (report.timestamp) {
                body += `_Generated at ${report.timestamp}_\n\n`;
              }
            }

            if (startupReport.report) {
              const report = startupReport.report;
              const formatMs = value => (typeof value === 'number' ? `${value.toFixed(1)}ms` : 'n/a');
              const formatBytes = value => (typeof value === 'number' ? `${(value / (1024 * 1024)).toFixed(1)}MB` : 'n/a');
              const formatNumber = value => (typeof value === 'number' ? value.toLocaleString() : 'n/a');

              body += '### Startup Performance\n\n';

              if (report.results?.mcpServer) {
                body += '#### MCP Server (stdio)\n\n';
                body += '| Mode | Ready | First Tool Call | Heap Used |\n';
                body += '|------|-------|-----------------|-----------|\n';
                for (const run of report.results.mcpServer.runs || []) {
                  const heap = run.memoryUsage?.heapUsed ? formatBytes(run.memoryUsage.heapUsed) : 'n/a';
                  body += `| ${run.mode} | ${formatMs(run.timeToReadyMs)} | ${formatMs(run.timeToFirstToolCallMs)} | ${heap} |\n`;
                }
                body += '\n';

                const discovery = report.results.mcpServer.deviceDiscovery;
                if (discovery) {
                  if (discovery.skipped) {
                    body += `Device discovery: skipped (${discovery.reason || 'no reason provided'})\n\n`;
                  } else if (discovery.scenarios?.length) {
                    body += 'Device discovery scenarios:\n';
                    for (const scenario of discovery.scenarios) {
                      body += `- ${scenario.name}: ${formatMs(scenario.durationMs)} (${scenario.deviceCount} device(s))\n`;
                    }
                    body += '\n';
                  }
                }
              }

              if (report.results?.daemon) {
                body += '#### Daemon\n\n';
                body += '| Mode | Spawn | Ready | Responsive | Heap Used |\n';
                body += '|------|-------|-------|------------|-----------|\n';
                for (const run of report.results.daemon.runs || []) {
                  const heap = run.memoryUsage?.heapUsed ? formatBytes(run.memoryUsage.heapUsed) : 'n/a';
                  body += `| ${run.mode} | ${formatMs(run.spawnMs)} | ${formatMs(run.timeToReadyMs)} | ${formatMs(run.timeToResponsiveMs)} | ${heap} |\n`;
                }
                body += '\n';
              }

              if (report.comparisons?.regressions?.length) {
                body += '#### Startup Thresholds\n\n';
                body += '| Metric | Actual | Threshold | Regression | Status |\n';
                body += '|--------|--------|-----------|------------|--------|\n';
                for (const regression of report.comparisons.regressions) {
                  const actual = formatNumber(regression.actual);
                  const threshold = formatNumber(regression.threshold);
                  const regressionPct = typeof regression.regression === 'number'
                    ? `${regression.regression >= 0 ? '+' : ''}${regression.regression.toFixed(1)}%`
                    : 'n/a';
                  const status = regression.passed ? '✅' : '❌';
                  body += `| ${regression.metric} | ${actual} | ${threshold} | ${regressionPct} | ${status} |\n`;
                }
                body += '\n';
              }

              if (report.comparisons?.regressions?.length) {
                const failures = report.comparisons.regressions.filter(r => !r.passed);
                if (failures.length > 0) {
                  body += '#### ⚠️ Regressions\n\n';
                  for (const regression of failures) {
                    body += `- ${regression.metric}: ${regression.actual.toFixed(2)} > ${regression.threshold.toFixed(2)} (+${regression.regression.toFixed(1)}%)\n`;
                  }
                  body += '\n';
                }
              }

              if (report.skips?.length) {
                body += '#### Skipped Checks\n\n';
                for (const skip of report.skips) {
                  body += `- ${skip}\n`;
                }
                body += '\n';
              }

              body += `**Overall Status:** ${report.passed ? '✅ PASSED' : '❌ FAILED'}\n`;
              if (report.timestamp) {
                body += `\n_Generated at ${report.timestamp}_`;
              }
              body += '\n\n';
            }

            if (npmReport.report) {
              const report = npmReport.report;
              const formatBytes = value => (typeof value === 'number' ? `${(value / (1024 * 1024)).toFixed(1)}MB` : 'n/a');
              const result = report.results?.unpackedSize;
              const actual = result && typeof result.actual === 'number' ? formatBytes(result.actual) : 'n/a';
              const threshold = result && typeof result.threshold === 'number' ? formatBytes(result.threshold) : 'n/a';
              const usage = result && typeof result.usage === 'number' ? `${result.usage}%` : 'n/a';
              const status = result ? (result.passed ? '✅' : '❌') : '⚠️';
              const packageName = report.package?.name ?? 'unknown';
              const packageVersion = report.package?.version ?? 'unknown';
              const tarballSize = typeof report.package?.tarballBytes === 'number'
                ? formatBytes(report.package.tarballBytes)
                : 'n/a';

              body += '### NPM Unpacked Size\n\n';
              body += '| Metric | Actual | Threshold | Usage | Status |\n';
              body += '|--------|--------|-----------|-------|--------|\n';
              body += `| Unpacked Size | ${actual} | ${threshold} | ${usage} | ${status} |\n`;
              body += `\n**Package:** ${packageName}@${packageVersion}\n`;
              body += `**Tarball Size:** ${tarballSize}\n`;
              if (typeof result?.headroomBytes === 'number' && typeof result?.headroomPercent === 'number') {
                body += `**Headroom:** ${result.headroomBytes} bytes (${result.headroomPercent}%)\n`;
              }

              if (Array.isArray(report.warnings) && report.warnings.length > 0) {
                body += '\n#### ⚠️ Size Warning\n\n';
                for (const warning of report.warnings) {
                  body += `- ${warning}\n`;
                }
              }

              if (report.package?.largestFiles?.length) {
                body += '\n#### Largest Packed Files\n\n';
                body += '| File | Bytes |\n|------|-------|\n';
                for (const file of report.package.largestFiles) {
                  body += `| ${file.path} | ${file.size} |\n`;
                }
              }

              if (Array.isArray(report.violations) && report.violations.length > 0) {
                body += '\n#### ⚠️ Size Violations\n\n';
                for (const violation of report.violations) {
                  body += `- ${violation}\n`;
                }
              }

              body += `\n**Overall Status:** ${report.passed ? '✅ PASSED' : '❌ FAILED'}`;
              if (report.timestamp) {
                body += `\n\n_Generated at ${report.timestamp}_`;
              }
              body += '\n\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## MCP Benchmarks')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: "Check Benchmark Results"
        if: ${{ always() && env.TS_CHANGED == 'true' }}
        shell: bash
        run: |
          failed=false

          if [ "${CONTEXT_BENCHMARK_FAILED:-false}" = "true" ]; then
            echo "::error::MCP context threshold benchmark failed - one or more thresholds were exceeded"
            cat reports/context-benchmark.json || true
            failed=true
          else
            echo "::notice::MCP context threshold benchmark passed - all thresholds satisfied"
          fi

          if [ "${TOOL_BENCHMARK_FAILED:-false}" = "true" ]; then
            echo "::error::MCP tool throughput benchmark failed - performance regressions detected"
            cat reports/tool-benchmark.json || true
            failed=true
          else
            echo "::notice::MCP tool throughput benchmark passed - no regressions"
          fi

          if [ "${STARTUP_BENCHMARK_FAILED:-false}" = "true" ]; then
            echo "::error::MCP startup benchmark failed - regressions detected"
            cat reports/startup-benchmark.json || true
            failed=true
          else
            echo "::notice::MCP startup benchmark passed - no regressions"
          fi

          if [ "${NPM_UNPACKED_SIZE_BENCHMARK_FAILED:-false}" = "true" ]; then
            echo "::error::NPM unpacked size benchmark failed - threshold exceeded"
            cat reports/npm-unpacked-size.json || true
            failed=true
          else
            echo "::notice::NPM unpacked size benchmark passed - within threshold"
            if [ -f reports/npm-unpacked-size.json ] && jq -e '(.warnings // []) | length > 0' reports/npm-unpacked-size.json >/dev/null; then
              echo "::warning::NPM unpacked size headroom is low - see the benchmark report and PR size summary"
            fi
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi

  # =============================================================================
  # Node TypeScript Build and Test (Skip for docs-only changes)
  # =============================================================================

  node-host-integration-tests:
    timeout-minutes: 20
    name: "Node Host Integration Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile' || matrix.os }}
    # Do not consume real-I/O runner capacity after the cheap required gate has
    # already established that this revision cannot pass.
    needs: [detect-changes, fast-validation]
    if: >-
      always() && !cancelled() && needs.detect-changes.result == 'success' && needs.fast-validation.result == 'success' &&
      needs.detect-changes.outputs.docs_only != 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        # The Windows leg runs inside Node TypeScript Build and Test
        # (windows-latest) so it shares that job's checkout and install (#10894).
        os: [ubuntu-latest]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - name: "Run host integration lane"
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
          AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS: "900"
        run: bash scripts/test-ts.sh integration

      - name: "Run stress lane"
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
          AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS: "300"
        run: bash scripts/test-ts.sh stress

  mcp-build-and-test:
    name: "Node TypeScript Build and Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    # macOS coverage runs after merge, where a scarce hosted macOS runner cannot
    # block PRs. Keep this required PR lane on Windows alongside the separate
    # Ubuntu build-and-test job below. It also runs the Windows unit, host
    # integration and stress lanes (#10894): they were separate Windows jobs,
    # each paying a slow Windows checkout + bun install. Budget: lint/build
    # (~25) + unit lane cap (26) + integration and stress (~20).
    timeout-minutes: 70
    env:
      RUN_MCP_BUILD_TEST: ${{ needs.detect-changes.outputs.docs_only != 'true' && needs.detect-changes.outputs.sha256_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
    steps:
      - name: "Skip Node TypeScript build and test"
        if: env.RUN_MCP_BUILD_TEST != 'true'
        run: echo "Skipping Node TypeScript build and test for documentation-only or SHA256-only changes"

      - name: "Git Checkout"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        uses: actions/checkout@v6
        with:
          lfs: false
          # Lint runs boundary guards that compare the working tree with
          # origin/main. Keep that ref available on every matrix platform.
          fetch-depth: 0

      # Disjoint cache paths, so the two restores overlap each other. The
      # barrier must precede "Setup Auto Mobile": that composite runs
      # `turbo run build` against the same .turbo directory being restored.
      # Restore-only: prime-bun-cache.yml saves this key on main (on bun.lock
      # changes and daily, since repo-wide LRU eviction drops it), and every PR
      # can read a main-ref cache. A PR-side save only produced a ~100 MB
      # PR-scoped entry no other PR could read, plus a post-job upload, and
      # churned the 10 GB repo cache that also holds the Gradle caches.
      - name: "Cache Bun dependencies"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        uses: actions/cache/restore@v5
        background: true
        id: cache-bun
        with:
          # Restoring node_modules is notably expensive on Windows because the
          # archive contains thousands of small files. Bun can materialize it
          # from its package store with platform-native links, so cache only
          # that smaller store.
          path: ~/.bun/install/cache
          key: bun-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ matrix.os }}-

      - name: "Cache Turborepo"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        uses: actions/cache@v5
        background: true
        id: cache-turbo
        with:
          path: .turbo
          key: turbo-${{ matrix.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ matrix.os }}-

      # No `if:` here -- a `wait` step always runs and does not accept a
      # condition; adding one fails whole-workflow validation. When the job's
      # RUN_MCP_BUILD_TEST guard skips the cache steps there is simply nothing
      # outstanding for the barrier to join.
      - wait: [cache-bun, cache-turbo]

      - name: "Setup Auto Mobile"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Run Lint"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run lint --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-lint-${{ matrix.os }}.log"

      - name: "Check Android emulator execution boundary"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        run: bun run check:android-emulator-boundary

      - name: "Check iOS CtrlProxy process execution boundary"
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        run: bun run check:ios-ctrl-proxy-process-boundary

      - name: "Run Build"
        id: mcp-build
        if: env.RUN_MCP_BUILD_TEST == 'true'
        shell: bash
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run build --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-build-${{ matrix.os }}.log"

      - name: "Run Bun image runtime smoke"
        if: env.RUN_MCP_BUILD_TEST == 'true' && matrix.os == 'windows-latest'
        run: bun run test:image:bun

      # The test lanes below each run when the build succeeded, even if an
      # earlier lane failed, so one red lane cannot hide another.
      - name: "Run complete unit lane"
        if: env.RUN_MCP_BUILD_TEST == 'true' && !cancelled() && steps.mcp-build.outcome == 'success'
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
          # 2 x (720s shard budget + 60s attempt overhead): a shard that times
          # out or is killed by a signal is retried once (#10583). The per-file
          # wall timeout stays off on Windows.
          AUTOMOBILE_UNIT_LANE_WALL_TIMEOUT_SECONDS: "1560"
        run: bash scripts/test-ts.sh unit

      - name: "Run host integration lane"
        if: env.RUN_MCP_BUILD_TEST == 'true' && !cancelled() && steps.mcp-build.outcome == 'success'
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
        run: bash scripts/test-ts.sh integration

      - name: "Run stress lane"
        if: env.RUN_MCP_BUILD_TEST == 'true' && !cancelled() && steps.mcp-build.outcome == 'success'
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
        run: bash scripts/test-ts.sh stress

      - name: "Upload Windows netstat capture (#10717)"
        if: always() && !cancelled() && env.RUN_MCP_BUILD_TEST == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-netstat-capture
          path: scratch/netstat-capture/
          if-no-files-found: ignore
          retention-days: 14

      - name: "Upload Build/Test Logs"
        if: env.RUN_MCP_BUILD_TEST == 'true' && (failure() || cancelled() || matrix.os == 'windows-latest')
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: mcp-build-test-logs-${{ matrix.os }}
          path: ci-logs/*.log
          retention-days: 7

  # =============================================================================
  # Node TypeScript Lint, Typecheck, Build and Unit Tests (Ubuntu)
  # =============================================================================

  # Reports the required "Node TypeScript Build and Test (ubuntu-latest)" check.
  # It is the one Linux unit-suite execution per PR (#10893): it used to run the
  # suite under coverage while a separate Node Unit Tests (ubuntu-latest) leg ran
  # it again for the 100ms timing budget. The plain unit lane and the timing
  # budget now run here, so a unit failure still blocks merge through this
  # required check; coverage and the README badge come from merge.yml's
  # ts-code-coverage job on every push to main.
  ts-build-and-test:
    name: "Node TypeScript Build and Test (ubuntu-latest)"
    runs-on: ${{ vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile' || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    # 1560s unit lane cap (720s shard budget, one infra retry: see
    # scripts/test-ts.sh) + 360s timing rechecks + lint, typecheck, build,
    # smokes, cold-import probe and uploads < 2700s.
    timeout-minutes: 45
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          # The stdlib-first gate compares package.json with the PR base SHA.
          # Keep that commit locally available instead of relying on checkout's
          # default one-commit shallow clone.
          fetch-depth: 0

      # No Bun dependency cache here: a frozen install takes ~1 s on Linux
      # runners, while the ~130 MB PR-scoped cache it replaced was never
      # restored by another PR (nothing saves it on main) and its post-job
      # upload churned the 10 GB repo cache that also holds the Gradle caches.
      # The barrier must precede "Setup Auto Mobile": that composite runs
      # `turbo run build` against the same .turbo directory being restored.
      - name: "Cache Turborepo"
        uses: actions/cache@v5
        background: true
        id: cache-turbo
        with:
          path: .turbo
          key: turbo-ubuntu-latest-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-ubuntu-latest-${{ hashFiles('bun.lock') }}-
            turbo-ubuntu-latest-

      - wait: cache-turbo

      - name: "Setup Auto Mobile"
        uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run Lint"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run lint --output-logs=errors-only --log-order=grouped

      - name: "Check stdlib-first dependency decisions"
        if: needs.detect-changes.outputs.ts_changed == 'true'
        env:
          STDLIB_FIRST_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bun run check:stdlib-first

      # Scoped `tsc --noEmit` gate (issue #3001). Bun's bundler skips type
      # checking, so the build/test steps cannot catch type errors. A repo-wide
      # gate is infeasible (~550 pre-existing errors), so this compares against a
      # committed baseline and fails only on NEW type errors. Runs on this single
      # ubuntu job with the pinned tsc so the baseline is reproducible.
      # Gated on ts_changed: the baseline only references src/, so a diff that
      # touches no TypeScript cannot introduce a local error -- skipping it avoids
      # blocking native-only PRs on base-branch drift. See
      # scripts/typecheck-baseline.sh.
      - name: "Run Typecheck Gate"
        if: needs.detect-changes.outputs.ts_changed == 'true'
        run: bun run typecheck

      - name: "Run Build"
        shell: bash
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          turbo run build --output-logs=errors-only --log-order=grouped 2>&1 | tee "ci-logs/bun-build-ubuntu-latest.log"

      - name: "Run Bun MCP startup smoke"
        run: bun run test:startup:bun

      # Linux uses the sharp backend here; Windows covers the jimp+cwebp path in
      # the matrix smoke above.
      - name: "Run Bun image runtime smoke"
        run: bun run test:image:bun

      - name: "Run complete unit lane"
        shell: bash
        env:
          AUTOMOBILE_TEST_MODE: "true"
          AUTOMOBILE_TEST_WALL_TIMEOUT_SECONDS: "720"
          # 2 x (720s budget + 60s attempt overhead): a shard that times out or
          # is killed by a signal is retried once (#10583).
          AUTOMOBILE_UNIT_LANE_WALL_TIMEOUT_SECONDS: "1560"
          AUTOMOBILE_UNIT_JUNIT_DIR: scratch/timing-unit-reports
        run: bash scripts/test-ts.sh unit

      # Runs on the leg that produced these JUnit reports (same validator, same
      # isolated median recheck, same base ref as merge.yml).
      - name: "Enforce 100ms budget for changed unit tests"
        shell: bash
        env:
          BUN_TEST_TIMING_BASE_REF: ${{ github.event.pull_request.base.sha }}
          BUN_TEST_TIMING_REPORT_DIR: scratch/timing-unit-reports
          BUN_TEST_TIMING_RECHECK_BUDGET_SECONDS: "360"
        run: bash scripts/validate-bun-test-timings.sh

      - name: "Upload Node Unit Timing Budget Summary"
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: node-unit-timing-budget-summary
          path: scratch/timing-unit-reports/unit-timing-budget-summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: "Measure cold module imports (advisory, #10429)"
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p scratch
          bash scripts/measure-cold-imports.sh | tee scratch/cold-imports.md
          {
            echo "### Cold module import (Linux)"
            cat scratch/cold-imports.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload Build/Test Logs"
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: mcp-build-test-logs-ubuntu-latest
          path: ci-logs/*.log
          retention-days: 7

  # =============================================================================
  # Kotlin Code Coverage
  # =============================================================================

  kotlin-code-coverage:
    timeout-minutes: 30
    name: "Run CtrlProxy Unit Tests"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.android_should_run == 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # :junit-runner:test runs once per PR, in Run JUnit Runner Unit Tests
      # (#10892); both are required checks, and that job also installs the
      # AutoMobile package the runner's daemon tests can use. The README Kotlin
      # coverage badge comes from merge.yml's kotlin-code-coverage, which still
      # includes junit-runner; this PR-side badge artifact covers the modules
      # tested here.
      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":control-proxy:testDebugUnitTest :control-proxy:createDebugUnitTestCoverageReport :auto-mobile-sdk:testDebugUnitTest :auto-mobile-sdk:createDebugUnitTestCoverageReport :test-plan-validation:test :test-plan-validation:jacocoTestReport :protocol:test :protocol:jacocoTestReport :video-server:test :video-server:d8Dex"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Generate Kotlin Coverage Badge"
        run: bash scripts/coverage/generate-kotlin-badge.sh

      - name: "Upload Kotlin Coverage Badge"
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-coverage-badge
          path: coverage/kotlin-coverage-badge.json
          retention-days: 7

  # =============================================================================
  # SwiftLint
  # =============================================================================

  swiftlint:
    timeout-minutes: 20
    name: "SwiftLint"
    runs-on: ${{ (github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","automobile-mac"]') || 'macos-26' }}
    # Do not spend a macOS slot when the inexpensive Ubuntu validation has
    # already proved this revision cannot merge.
    needs: [detect-changes, fast-validation]
    if: needs.detect-changes.outputs.ios_should_run == 'true' && needs.fast-validation.result == 'success'
    steps:
      - name: "Isolate self-hosted SwiftLint home"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/swiftlint-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
          } >> "$GITHUB_ENV"

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      - name: "Require ambient SwiftLint"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          if ! command -v swiftlint >/dev/null; then
            echo '::error::The self-hosted SwiftLint job requires the pinned SwiftLint binary on PATH.' >&2
            exit 1
          fi

      # Full-tree lint (validate_swiftlint.sh defaults: ONLY_TOUCHED_FILES=false,
      # STRICT_MODE=false), so the whole ios/ tree must stay error-clean on every
      # iOS-affecting PR. The script exits non-zero only on error-severity rules
      # (force_unwrapping/force_try are configured as errors — the fail-fast crash
      # class we burned down in 2026-07); warnings remain non-blocking. SwiftLint is
      # installed on demand on hosted runners; the self-hosted runner must
      # already have the pinned binary.
      - name: "Run SwiftLint (fail on error-severity rules)"
        shell: bash
        env:
          INSTALL_SWIFTLINT_WHEN_MISSING: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
        run: bash scripts/swiftlint/validate_swiftlint.sh

      - name: "Remove isolated SwiftLint home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/swiftlint-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # =============================================================================
  # Swift Code Coverage
  # =============================================================================

  swift-code-coverage:
    timeout-minutes: 20
    name: "Swift Code Coverage"
    # macos-26 + Xcode 26.5 (Swift 6.3): the sole coverage package, control-proxy,
    # declares swift-tools-version 6.3 (its strict-concurrency floor, matching the
    # repo-wide iOS 6.3 migration), which the Swift 5.10 toolchain on macos-14 /
    # Xcode 15.4 cannot even parse. Mirrors the other Swift-6.3 jobs' toolchain.
    runs-on: ${{ (github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","automobile-mac"]') || 'macos-26' }}
    # Keep costly hosted macOS work behind the inexpensive Fast Validation gate.
    needs: [detect-changes, fast-validation]
    if: needs.detect-changes.outputs.ios_should_run == 'true' && needs.fast-validation.result == 'success'
    steps:
      - name: "Isolate self-hosted Swift coverage home"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/swift-coverage-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
          } >> "$GITHUB_ENV"

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      - name: "Select Xcode 26.5"
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Record Xcode version"
        id: coverage-xcode-version
        shell: bash
        run: echo "version=$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')" >> "$GITHUB_OUTPUT"

      - name: "Cache Swift coverage dependencies"
        uses: actions/cache@v5
        id: cache-swift-coverage
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm/cache
          key: ${{ runner.os }}-${{ runner.environment }}-spm-swift-coverage-${{ steps.coverage-xcode-version.outputs.version }}-${{ hashFiles('Package.swift', 'ios/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-spm-swift-coverage-${{ steps.coverage-xcode-version.outputs.version }}-

      - name: "Resolve Swift coverage dependencies"
        run: (cd ios/control-proxy && swift package resolve)

      - name: "Generate Swift Coverage Badge"
        run: |
          echo "Swift cache hit: ${{ steps.cache-swift-coverage.outputs.cache-hit }}"
          SECONDS=0
          bash scripts/coverage/generate-swift-coverage.sh
          echo "build took ${SECONDS}s"

      - name: "Upload Swift Coverage Badge"
        uses: actions/upload-artifact@v6
        with:
          name: swift-coverage-badge
          path: coverage/swift-coverage-badge.json
          retention-days: 7

      - name: "Remove isolated Swift coverage home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/swift-coverage-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # =============================================================================
  # iOS Build and Test Jobs (Skip for docs-only changes)
  # =============================================================================

  ios-swift-packages:
    name: "Swift Packages (${{ matrix.config.name }})"
    # Small self-hosted Mac pool for owner-authored same-repository PRs once the
    # pools are registered (vars.AUTOMOBILE_MAC_POOLS_ENABLED, #11011); forks and
    # the pre-rollout state use the hosted runner from the matrix.
    runs-on: ${{ (github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && vars.AUTOMOBILE_MAC_POOLS_ENABLED == 'true') && fromJSON('["self-hosted","automobile-mac"]') || matrix.config.runner }}
    # Keep costly hosted macOS work behind the inexpensive Fast Validation gate.
    needs: [detect-changes, fast-validation]
    if: needs.detect-changes.outputs.ios_should_run == 'true' && needs.fast-validation.result == 'success'
    # Fail fast on a hung/evicted macOS runner instead of sitting until GHA
    # infra-cancels the job (a cancelled terminal run blocks the required
    # "iOS Build" gate). Generous backstop, not a tight bound.
    timeout-minutes: 45
    env:
      # Never import signing certificates into the self-hosted Mac's keychains:
      # the self-hosted leg always builds unsigned.
      IOS_SIGNING_ENABLED: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && !(github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && vars.AUTOMOBILE_MAC_POOLS_ENABLED == 'true') }}
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 != '' && !(github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && vars.AUTOMOBILE_MAC_POOLS_ENABLED == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # PR runs only the primary Xcode toolchain. The full version sweep
        # (26.5 / 26.6) runs nightly on CircleCI — Xcode-toolchain drift is
        # slow-moving and does not need per-PR macOS minutes.
        config:
          - { name: "Xcode 26.5", runner: "macos-26", xcode: "26.5" }
    steps:
      - name: "Isolate self-hosted Swift Packages home"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/swift-packages-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
          } >> "$GITHUB_ENV"

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      # Pin every package build to the matrix toolchain. This is the supported
      # compiler floor, not an ambient-runner compatibility check.
      - name: "Select Xcode ${{ matrix.config.xcode }}"
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Select self-hosted Xcode ${{ matrix.config.xcode }}"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: bash scripts/ci/select-self-hosted-xcode.sh "${{ matrix.config.xcode }}"

      - name: "Cache Swift package dependencies"
        uses: actions/cache@v5
        id: cache-swift-packages
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm/cache
          key: ${{ runner.os }}-${{ runner.environment }}-spm-swift-packages-${{ matrix.config.xcode }}-${{ hashFiles('Package.swift', 'ios/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-spm-swift-packages-${{ matrix.config.xcode }}-

      - name: "Install macOS Developer ID certificate"
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-macos-signing-keychain.sh

      - name: "Install iOS signing certificate"
        if: ${{ env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: ./scripts/ios/setup-signing-keychain.sh

      - name: "Resolve Swift package dependencies"
        shell: bash
        run: |
          for package in ios/screen-capture ios/network-filter ios/highlight-core ios/auto-mobile-sdk ios/control-proxy ios/XCTestRunner; do
            (cd "${package}" && swift package resolve)
          done

      - name: "Check iOS SDK public API baseline"
        shell: bash
        run: |
          if ! bash scripts/ios/api-dump.sh --check; then
            echo "::error::Update the iOS SDK API baseline: scripts/ios/api-dump.sh > ios/auto-mobile-sdk/api/auto-mobile-sdk.api"
            exit 1
          fi

      - name: "Build Swift Packages"
        env:
          MACOS_SIGNING_ENABLED: ${{ env.MACOS_SIGNING_ENABLED }}
          MACOS_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_SIGNING_IDENTITY }}
          MACOS_DEVELOPER_ID_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_ID_TEAM_ID }}
          MACOS_SIGNING_STRICT: ${{ env.MACOS_SIGNING_ENABLED }}
          IOS_SIGNING_ENABLED: ${{ env.IOS_SIGNING_ENABLED }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_SIGNING_TEAM_ID: ${{ secrets.IOS_SIGNING_TEAM_ID }}
          IOS_SIGNING_STRICT: ${{ env.IOS_SIGNING_ENABLED }}
        run: |
          echo "Swift cache hit: ${{ steps.cache-swift-packages.outputs.cache-hit }}"
          SECONDS=0
          ./scripts/ios/swift-build.sh
          echo "build took ${SECONDS}s"

      - name: "Test Swift Packages"
        run: ./scripts/ios/swift-test.sh

      - name: "Remove isolated Swift Packages home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/swift-packages-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  ios-xcode-build:
    name: "Build Xcode Projects (${{ matrix.config.name }}, ${{ matrix.project }})"
    # Heavy self-hosted lane (one runner process, so xcodebuild/simulator jobs
    # never overlap on the Mac) for owner-authored same-repository PRs once the
    # pools are registered (#11011); forks and pre-rollout use hosted macos-26.
    # The XcodeGen drift check below is the PR-time drift gate (#10939).
    runs-on: ${{ (github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && vars.AUTOMOBILE_MAC_POOLS_ENABLED == 'true') && fromJSON('["self-hosted","automobile-mac-heavy"]') || matrix.config.runner }}
    # Keep costly hosted macOS work behind the inexpensive Fast Validation gate.
    needs: [detect-changes, fast-validation]
    # Fast Validation runs through always(), so bypass the implicit success()
    # check on ancestors and require its result explicitly.
    if: always() && !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.ios_should_run == 'true' && needs.fast-validation.result == 'success'
    # Tight bound: a hung simulator or xcodebuild must not hold the single heavy
    # lane (and the required "iOS Build" gate) for long. Hosted runs take 2-4 min.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # PR runs only the primary Xcode toolchain; full sweep runs nightly on CircleCI.
        config:
          - { name: "Xcode 26.5", runner: "macos-26", xcode: "26.5" }
        # Shard the two Xcode projects across two runners so they build in
        # parallel on hosted runners (on the single heavy self-hosted lane they
        # run one after the other). The "iOS Build" gate reads
        # needs.ios-xcode-build.result, which aggregates the whole matrix (green
        # only if every shard is green), so the gate needs no change. Names must
        # match the generated <name>.xcodeproj basenames passed to xcode-build.sh.
        project:
          - Playground
          - CtrlProxy
    steps:
      - name: "Isolate self-hosted Xcode build home"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/xcode-build-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
            echo "XCODEGEN_PREFIX=$isolated_home/.local"
          } >> "$GITHUB_ENV"
          echo "$isolated_home/.local/bin" >> "$GITHUB_PATH"

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Select self-hosted Xcode ${{ matrix.config.xcode }}"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: bash scripts/ci/select-self-hosted-xcode.sh "${{ matrix.config.xcode }}"

      - name: "Cache Xcode Swift package dependencies"
        uses: actions/cache@v5
        id: cache-xcode-spm
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm/cache
          key: ${{ runner.os }}-${{ runner.environment }}-spm-xcode-build-${{ matrix.project }}-${{ matrix.config.xcode }}-${{ hashFiles('Package.swift', 'ios/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-spm-xcode-build-${{ matrix.project }}-${{ matrix.config.xcode }}-

      - name: "Cache Xcode DerivedData"
        uses: actions/cache@v5
        id: cache-xcode-derived-data
        with:
          path: |
            ${{ runner.temp }}/automobile-derived-data-${{ matrix.project }}/Build
            ${{ runner.temp }}/automobile-derived-data-${{ matrix.project }}/ModuleCache.noindex
          key: ${{ runner.os }}-${{ runner.environment }}-derived-xcode-build-${{ matrix.project }}-${{ matrix.config.xcode }}-${{ hashFiles('ios/**/*.swift', 'ios/**/*.m', 'ios/**/*.mm', 'ios/**/*.h', 'ios/**/*.c', 'ios/**/*.cpp', 'ios/**/*.xcconfig', 'ios/**/*.plist', 'ios/**/*.entitlements', 'ios/**/*.storyboard', 'ios/**/*.xib', 'ios/**/*.xcassets/**', 'ios/**/*.strings', 'ios/**/*.ttf', 'ios/**/*.otf', 'ios/**/*.xcprivacy', 'ios/**/*.pbxproj', 'ios/**/*.xcscheme', 'ios/**/project.yml', 'ios/**/Package.swift', 'ios/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-derived-xcode-build-${{ matrix.project }}-${{ matrix.config.xcode }}-

      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh

      - name: "Check XcodeGen Project Drift"
        run: ./scripts/ios/xcodegen-drift-check.sh --all

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Resolve Xcode project Swift package dependencies"
        shell: bash
        run: |
          for package in ios/highlight-core ios/auto-mobile-sdk ios/control-proxy; do
            (cd "${package}" && swift package resolve)
          done

      - name: "Build Xcode Projects"
        env:
          AUTOMOBILE_XCODE_DERIVED_DATA: "${{ runner.temp }}/automobile-derived-data-${{ matrix.project }}"
        run: |
          echo "Swift package cache hit: ${{ steps.cache-xcode-spm.outputs.cache-hit }}"
          echo "DerivedData cache hit: ${{ steps.cache-xcode-derived-data.outputs.cache-hit }}"
          SECONDS=0
          ./scripts/ios/xcode-build.sh ${{ matrix.project }}
          echo "build took ${SECONDS}s"

      - name: "Remove isolated Xcode build home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/xcode-build-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # The Playground design-system tests (colour/contrast/typography/shape, #5102)
  # normally run on CircleCI (.circleci/continue_config.yml → ios-playground-tests),
  # which frees a concurrent GitHub macOS slot for the sharded build lanes above.
  # CircleCI derives its run-ios parameter from changed PATHS only, so it cannot
  # see the run-ios / run-native LABEL force. This GHA job is the fallback for that
  # one case: a label-forced run whose diff touches no iOS path (ios_should_run is
  # true only via the label, ios_changed is false). On a normal iOS-path PR
  # ios_changed is true and this job is skipped — CircleCI runs Playground instead,
  # so there is no double-run. Advisory, like the other simulator tests.
  ios-playground-tests:
    name: "iOS Playground Tests (${{ matrix.config.name }})"
    # Simulator job: heavy self-hosted lane for same-repository PRs (#11011).
    runs-on: ${{ (github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && vars.AUTOMOBILE_MAC_POOLS_ENABLED == 'true') && fromJSON('["self-hosted","automobile-mac-heavy"]') || matrix.config.runner }}
    needs: [detect-changes, fast-validation]
    if: needs.detect-changes.outputs.ios_should_run == 'true' && needs.detect-changes.outputs.ios_changed != 'true' && needs.fast-validation.result == 'success'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Xcode 26.5", runner: "macos-26", xcode: "26.5" }
    steps:
      - name: "Isolate self-hosted Playground home"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/playground-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
          } >> "$GITHUB_ENV"

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      - name: "Select Xcode ${{ matrix.config.xcode }}"
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}

      - name: "Select self-hosted Xcode ${{ matrix.config.xcode }}"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: bash scripts/ci/select-self-hosted-xcode.sh "${{ matrix.config.xcode }}"

      - name: "Cache Playground Swift package dependencies"
        uses: actions/cache@v5
        id: cache-playground-spm
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm/cache
          key: ${{ runner.os }}-${{ runner.environment }}-spm-playground-tests-${{ matrix.config.xcode }}-${{ hashFiles('Package.swift', 'ios/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-spm-playground-tests-${{ matrix.config.xcode }}-

      - name: "Cache Playground DerivedData"
        uses: actions/cache@v5
        id: cache-playground-derived-data
        with:
          path: |
            ${{ runner.temp }}/automobile-derived-data-Playground/Build
            ${{ runner.temp }}/automobile-derived-data-Playground/ModuleCache.noindex
          key: ${{ runner.os }}-${{ runner.environment }}-derived-playground-tests-${{ matrix.config.xcode }}-${{ hashFiles('ios/Playground/**/*.swift', 'ios/Playground/**/*.m', 'ios/Playground/**/*.mm', 'ios/Playground/**/*.h', 'ios/Playground/**/*.c', 'ios/Playground/**/*.cpp', 'ios/Playground/**/*.xcconfig', 'ios/Playground/**/*.plist', 'ios/Playground/**/*.entitlements', 'ios/Playground/**/*.storyboard', 'ios/Playground/**/*.xib', 'ios/Playground/**/*.xcassets/**', 'ios/Playground/**/*.strings', 'ios/Playground/**/*.ttf', 'ios/Playground/**/*.otf', 'ios/Playground/**/*.xcprivacy', 'ios/Playground/**/*.pbxproj', 'ios/Playground/**/*.xcscheme', 'ios/Playground/**/project.yml', 'ios/Playground/**/Package.swift', 'ios/Playground/**/Package.resolved', 'ios/highlight-core/**/*.swift', 'ios/highlight-core/**/*.m', 'ios/highlight-core/**/*.mm', 'ios/highlight-core/**/*.h', 'ios/highlight-core/**/*.c', 'ios/highlight-core/**/*.cpp', 'ios/highlight-core/**/*.xcconfig', 'ios/highlight-core/**/*.plist', 'ios/highlight-core/**/*.entitlements', 'ios/highlight-core/**/*.storyboard', 'ios/highlight-core/**/*.xib', 'ios/highlight-core/**/*.xcassets/**', 'ios/highlight-core/**/*.strings', 'ios/highlight-core/**/*.ttf', 'ios/highlight-core/**/*.otf', 'ios/highlight-core/**/*.xcprivacy', 'ios/highlight-core/**/*.pbxproj', 'ios/highlight-core/**/*.xcscheme', 'ios/highlight-core/**/project.yml', 'ios/highlight-core/**/Package.swift', 'ios/highlight-core/**/Package.resolved', 'ios/auto-mobile-sdk/**/*.swift', 'ios/auto-mobile-sdk/**/*.m', 'ios/auto-mobile-sdk/**/*.mm', 'ios/auto-mobile-sdk/**/*.h', 'ios/auto-mobile-sdk/**/*.c', 'ios/auto-mobile-sdk/**/*.cpp', 'ios/auto-mobile-sdk/**/*.xcconfig', 'ios/auto-mobile-sdk/**/*.plist', 'ios/auto-mobile-sdk/**/*.entitlements', 'ios/auto-mobile-sdk/**/*.storyboard', 'ios/auto-mobile-sdk/**/*.xib', 'ios/auto-mobile-sdk/**/*.xcassets/**', 'ios/auto-mobile-sdk/**/*.strings', 'ios/auto-mobile-sdk/**/*.ttf', 'ios/auto-mobile-sdk/**/*.otf', 'ios/auto-mobile-sdk/**/*.xcprivacy', 'ios/auto-mobile-sdk/**/*.pbxproj', 'ios/auto-mobile-sdk/**/*.xcscheme', 'ios/auto-mobile-sdk/**/project.yml', 'ios/auto-mobile-sdk/**/Package.swift', 'ios/auto-mobile-sdk/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-derived-playground-tests-${{ matrix.config.xcode }}-

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Resolve Playground Swift package dependencies"
        shell: bash
        run: |
          (cd ios/highlight-core && swift package resolve)
          (cd ios/auto-mobile-sdk && swift package resolve)

      - name: "Run Playground Tests"
        env:
          AUTOMOBILE_XCODE_DERIVED_DATA: "${{ runner.temp }}/automobile-derived-data-Playground"
        run: |
          echo "Swift package cache hit: ${{ steps.cache-playground-spm.outputs.cache-hit }}"
          echo "DerivedData cache hit: ${{ steps.cache-playground-derived-data.outputs.cache-hit }}"
          SECONDS=0
          ./scripts/ios/xcode-test.sh Playground
          echo "build took ${SECONDS}s"

      - name: "Remove isolated Playground home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/playground-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # Advisory iOS simulator integration lane, off the default PR path (#10895):
  # it runs nightly on CircleCI (nightly-macos, #11010) and on a PR only when the
  # `run-ios-sim` label is applied (the `labeled` trigger above starts a fresh
  # run). The PR job body lives in xctestrunner-simulator-tests.yml; a policy test
  # keeps the CircleCI nightly copy's selected tests and daemon budget identical.
  ios-xctest-runner-simulator-tests:
    name: "XCTestRunner Simulator Tests"
    # The advisory simulator lane should not consume a scarce macOS runner for
    # a revision already rejected by inexpensive Ubuntu validation.
    needs: [detect-changes, fast-validation]
    if: needs.detect-changes.outputs.ios_sim_tests_should_run == 'true' && needs.fast-validation.result == 'success'
    uses: ./.github/workflows/xctestrunner-simulator-tests.yml

  ios-spm-root-package-build:
    timeout-minutes: 20
    name: "Build Root SPM Package"
    # Small self-hosted Mac pool for owner-authored same-repository PRs once the
    # pools are registered (#11011); forks use hosted macos-26. The root manifest
    # needs the Swift 6.3 toolchain from Xcode 26.5.
    runs-on: ${{ (github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && vars.AUTOMOBILE_MAC_POOLS_ENABLED == 'true') && fromJSON('["self-hosted","automobile-mac"]') || 'macos-26' }}
    needs: [detect-changes, fast-validation]
    if: needs.detect-changes.outputs.ios_should_run == 'true' && needs.fast-validation.result == 'success'
    steps:
      - name: "Isolate self-hosted root SPM home"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/root-spm-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
          } >> "$GITHUB_ENV"

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      # The root manifest declares swift-tools-version 6.3 (XCTestRunner's
      # strict-concurrency floor), which requires the Swift 6.3 toolchain that
      # ships with Xcode 26.5. Xcode 26.0 ships Swift 6.2 and cannot even parse
      # a 6.3 manifest, so this floor-guarantee job builds on 26.5 to match the
      # published SDK's toolchain floor and every other Swift-package job here.
      # Select it explicitly so this job verifies the published compiler floor.
      - name: "Select Xcode 26.5"
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Select self-hosted Xcode 26.5"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: bash scripts/ci/select-self-hosted-xcode.sh "26.5"

      - name: "Cache root Swift package dependencies"
        uses: actions/cache@v5
        id: cache-root-spm
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm/cache
          key: ${{ runner.os }}-${{ runner.environment }}-spm-root-package-26.5-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-spm-root-package-26.5-

      - name: "Resolve root Swift package dependencies"
        run: swift package resolve

      - name: "Build root Package.swift"
        run: |
          echo "Swift cache hit: ${{ steps.cache-root-spm.outputs.cache-hit }}"
          SECONDS=0
          swift build -c release 2>&1
          echo "build took ${SECONDS}s"

      - name: "Remove isolated root SPM home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/root-spm-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # "Prototype Simulator": per-runtime smoke test for the iOS overlay agent (#10569),
  # moved from CircleCI to the heavy self-hosted lane (#11011). Injection depends
  # on simulator dyld behaviour and each runtime's Swift runtime, so a new Xcode or
  # runtime can break it silently. Each leg creates ONE fresh simulator, uses it
  # serially and deletes it. Advisory: simulator tests must not gate merges, so
  # this check stays OFF the required list.
  # Run locally on a Mac: bash scripts/ios/overlay-agent-smoke.sh 26
  prototype-simulator:
    name: "Prototype Simulator iOS ${{ matrix.ios }}"
    runs-on: ${{ (github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && vars.AUTOMOBILE_MAC_POOLS_ENABLED == 'true') && fromJSON('["self-hosted","automobile-mac-heavy"]') || 'macos-26' }}
    needs: [detect-changes, fast-validation]
    if: needs.detect-changes.outputs.prototype_simulator_should_run == 'true' && needs.fast-validation.result == 'success'
    # Tight bound for the single heavy lane; the smoke boots one simulator.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # One leg per iOS runtime. Add a version (e.g. "27") once the runners
        # ship that runtime.
        ios: ["26"]
    steps:
      - name: "Isolate self-hosted Prototype Simulator home"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/prototype-simulator-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$isolated_home/tmp" "$isolated_home/config" "$isolated_home/data"
          {
            echo "HOME=$isolated_home"
            echo "TMPDIR=$isolated_home/tmp"
            echo "XDG_CONFIG_HOME=$isolated_home/config"
            echo "XDG_DATA_HOME=$isolated_home/data"
            echo "CFFIXED_USER_HOME=$isolated_home"
          } >> "$GITHUB_ENV"

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true

      - name: "Select Xcode 26.5"
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: "Select self-hosted Xcode 26.5"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: bash scripts/ci/select-self-hosted-xcode.sh "26.5"

      - name: "Report toolchain"
        run: xcodebuild -version && xcrun simctl list runtimes iOS

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      # Exit 3 (runtime missing) fails the leg: the runner is expected to ship the
      # runtime, so a vanished runtime is an image change worth seeing.
      - name: "Run overlay agent smoke test (iOS ${{ matrix.ios }})"
        timeout-minutes: 20
        run: bash scripts/ios/overlay-agent-smoke.sh "${{ matrix.ios }}"

      - name: "Upload overlay agent smoke artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: overlay-agent-smoke-ios-${{ matrix.ios }}
          path: scratch/overlay-agent-smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: "Remove isolated Prototype Simulator home"
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/prototype-simulator-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # =============================================================================
  # Android Build and Test Jobs (Android-related changes only)
  # =============================================================================

  junit-runner-unit-tests:
    timeout-minutes: 20
    name: "Run JUnit Runner Unit Tests"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.android_should_run == 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      # Only run unit tests without Emulator
      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junit-runner:test"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: "Upload Heap Dumps"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-heap-dumps-unit
          path: heap-dump
          if-no-files-found: ignore

  # Test isolation issue resolved in #107 and #109
  # Re-enabled in #110
  # The JUnit Runner and Playground Automobile emulator suites share one booted
  # emulator (#10891): each used to pay its own emulator boot and Gradle setup
  # (~9-10 min). scripts/android/run-emulator-suites.sh runs both, resets the
  # daemon between them, and fails if either fails. Their JUnit reports stay
  # separate check runs so a failure remains attributable to its suite.
  android-emulator-tests:
    name: "Run Android Emulator Tests"
    runs-on: ubuntu-latest
    # One boot (~10 min incl. Gradle setup) + both suites, inside the action's
    # one bounded retry.
    timeout-minutes: 30
    # Compile failures stop this lane before it boots a device through the build
    # jobs that already compile its modules (#10890): Build CtrlProxy APK,
    # Build Playground App (incl. :playground:app unit-test sources) and Run
    # JUnit Runner Unit Tests (:junit-runner main + test sources).
    needs:
      [detect-changes, build-android-control-proxy, build-playground-app, junit-runner-unit-tests]
    if: needs.detect-changes.outputs.android_should_run == 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      # Run AutoMobile tests that require emulator
      - uses: ./.github/actions/android-emulator
        with:
          script: "../scripts/android/run-emulator-suites.sh control-proxy/build/outputs/apk/debug/control-proxy-debug.apk"
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload Heap Dumps"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-heap-dumps-emulator
          path: heap-dump
          if-no-files-found: ignore

      - name: "Upload JUnit Runner Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-emulator-test-results
          path: android/junit-runner/build/reports/tests/test/

      - name: "Upload Playground Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playground-automobile-emulator-test-results
          path: android/playground/app/build/reports/tests/test/

      - name: "Publish JUnit Runner Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "JUnit Runner Emulator Test Report"
          report_paths: "android/junit-runner/build/test-results/**/*.xml"

      - name: "Publish Playground Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "Playground Automobile Emulator Test Report"
          report_paths: "android/playground/**/build/test-results/**/*.xml"

  # Emulator.wtf session-based tests (see #94 for investigation context)
  # Requires EMULATOR_WTF_ENABLED=true variable and EMULATOR_WTF_API_KEY secret
  junit-runner-emulator-wtf-tests:
    name: "Run JUnit Runner Emulator.wtf Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, build-android-control-proxy]
    if: needs.detect-changes.outputs.android_should_run == 'true' && vars.EMULATOR_WTF_ENABLED == 'true'
    env:
      HAS_API_KEY: ${{ secrets.EMULATOR_WTF_API_KEY != '' }}
    steps:
      - name: "Check API Key"
        if: env.HAS_API_KEY != 'true'
        run: |
          echo "::error::EMULATOR_WTF_ENABLED is set but EMULATOR_WTF_API_KEY secret is not configured"
          exit 1

      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Compile JUnit Runner Test Classes"
        uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junit-runner:testClasses"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      - name: "Run AutoMobile tests on emulator.wtf"
        uses: ./.github/actions/android-emulator-wtf
        env:
          EW_API_TOKEN: ${{ secrets.EMULATOR_WTF_API_KEY }}
        with:
          script: "./gradlew :junit-runner:test --stacktrace --info"
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
          device: "model=Pixel7,version=35,gpu=auto"
          max-time-limit: "2m"

      - name: "Upload Heap Dumps"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-emulator-wtf-heap-dumps
          path: heap-dump
          if-no-files-found: ignore

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-emulator-wtf-test-results
          path: android/junit-runner/build/reports/tests/test/

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "JUnit Runner Emulator.wtf Test Report"
          report_paths: "**/build/test-results/**/*.xml"

  # JVM Consumer Checks (#10894): one Gradle runner slot for the JUnitRunner
  # library build, the SDK Debug Inspector Consumer publication + apiCheck guard
  # and the JUnit Runner Kotlin 2.2 consumer compatibility check, which used to
  # be three jobs each paying checkout + Gradle setup. Each check runs even when
  # an earlier one failed.
  jvm-consumer-checks:
    timeout-minutes: 40
    name: "JVM Consumer Checks"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.android_should_run == 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":junitRunner:assemble"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Store AAR"
        uses: actions/upload-artifact@v6
        with:
          name: aar
          path: core/build/outputs/aar/core-debug.aar

      # SDK Debug Inspector Consumer, moved here from the removed Android
      # Emulator Compile Smoke (#10890): same Gradle setup, no extra runner slot.
      # Publish both SDK variants to the local Maven repo. The storage-inspection
      # ContentProviders ship in the debug variant only (#5714); this proves a
      # Maven consumer -- not an in-repo project() dependency -- can obtain them.
      # Check the public API here because publishing already compiles SDK
      # release classes.
      # Update the baseline with: cd android && ./gradlew :auto-mobile-sdk:apiDump
      - name: "Publish SDK and check its public API"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":auto-mobile-sdk:publishToMavenLocal :auto-mobile-sdk:apiCheck"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Verify published debug inspection providers"
        if: ${{ !cancelled() }}
        working-directory: .
        run: bash scripts/android/validate-sdk-debug-inspector-consumer.sh --skip-publish

      # JUnit Runner Kotlin Consumer Compatibility (folded in by #10894).
      - name: "Install JDK"
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: "Validate Kotlin 2.2 consumer compatibility"
        if: ${{ !cancelled() }}
        working-directory: .
        run: bash scripts/android/validate-junit-runner-kotlin-consumer.sh

      - name: "Upload Compatibility Logs"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: junit-runner-kotlin-consumer-compatibility-logs
          path: scratch/junit-runner-kotlin-consumer/logs/
          if-no-files-found: ignore

  build-android-control-proxy:
    timeout-minutes: 20
    name: "Build CtrlProxy APK"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.android_should_run == 'true' || needs.detect-changes.outputs.webrtc_should_run == 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":control-proxy:assembleDebug :control-proxy:assembleRelease :video-server:d8Dex"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Upload CtrlProxy APK"
        uses: actions/upload-artifact@v6
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug/control-proxy-debug.apk

      - name: "Upload video-server jar"
        uses: actions/upload-artifact@v6
        with:
          name: video-server-jar
          path: android/video-server/build/libs/automobile-video.jar

  build-playground-app:
    timeout-minutes: 20
    name: "Build Playground App"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.android_should_run == 'true'
    defaults:
      run:
        working-directory: android
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - uses: ./.github/actions/gradle-task-run
        with:
          # Also runs the design-system library's host unit tests (#5102): the
          # colour/contrast/typography/shape/asset tests live in
          # :playground:design:system, which :playground:app:assembleDebug does
          # not exercise, so without this they never gate.
          # Discover host unit tests (including Long Press Drag reorder) also gate here.
          # :playground:app:compileDebugUnitTestKotlin keeps the app's unit-test
          # sources compiling before the emulator lane runs them (#10890; it
          # moved here from the removed Android Emulator Compile Smoke).
          gradle-tasks: ":playground:app:assembleDebug :playground:app:compileDebugUnitTestKotlin :playground:design:system:testDebugUnitTest :playground:discover:testDebugUnitTest"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          release-keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: "Store Sample APK"
        uses: actions/upload-artifact@v6
        if: success() # Only upload if build succeeded
        with:
          name: playground-app-apk
          path: android/playground/app/build/outputs/apk/debug/playground-app-debug.apk

  # =============================================================================
  # WebRTC integration coverage (#4290 / #4328)
  # The publisher contract and Android/iOS capture-to-WHEP paths run only when
  # WebRTC is in play (webrtc_should_run). They are non-required and report
  # directly; there is no roll-up gate (it cost a runner slot per PR).
  # =============================================================================
  webrtc-integration-test:
    name: "WebRTC Publisher Integration (MediaMTX)"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.webrtc_should_run == 'true'
    timeout-minutes: 20
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      # FFmpeg generates the synthetic H.264 the publisher ingests. Chrome
      # (google-chrome) is preinstalled on ubuntu-latest and resolved by the test;
      # fail early with a clear message if the image ever drops it.
      - name: "Install FFmpeg and verify a browser is present"
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          if ! command -v google-chrome >/dev/null 2>&1 \
            && ! command -v chromium >/dev/null 2>&1 \
            && ! command -v chromium-browser >/dev/null 2>&1; then
            echo "::error::No Chrome/Chromium found on the runner; the WHEP decode step needs one"
            exit 1
          fi

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Stays in the foreground: it appends node_modules/.bin to $GITHUB_PATH.
      - name: "Install Bun dependencies"
        shell: bash
        run: scripts/ci/install-bun-deps.sh

      # Cache the checksum-pinned MediaMTX release so only the first run downloads
      # it. Keyed on the runner script, so a version bump there invalidates it.
      - name: "Cache MediaMTX binary"
        uses: actions/cache@v4
        with:
          path: scratch/mediamtx
          key: mediamtx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/webrtc/run-mediamtx-publisher-integration.sh') }}

      - name: "Run MediaMTX WebRTC publisher integration test"
        shell: bash
        run: bun run test:integration:webrtc-mediamtx

  android-device-webrtc:
    name: "Android Device Capture to WHEP"
    needs: [detect-changes, build-android-control-proxy]
    if: needs.detect-changes.outputs.webrtc_should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: android/control-proxy/build/outputs/apk/debug

      - name: "Download video-server jar"
        uses: actions/download-artifact@v7
        with:
          name: video-server-jar
          path: android/video-server/build/libs

      - name: "Install Chrome for WHEP decoding"
        run: |
          sudo apt-get update
          sudo apt-get install --yes google-chrome-stable || sudo apt-get install --yes chromium-browser

      - uses: ./.github/actions/android-emulator
        with:
          script: |
            cd "$GITHUB_WORKSPACE"
            AUTOMOBILE_WEBRTC_DEVICE_INTEGRATION=1 \
            AUTOMOBILE_WEBRTC_DEVICE_PLATFORM=android \
            AUTOMOBILE_ANDROID_H264_DEVICE_ID=emulator-5554 \
            AUTOMOBILE_VIDEO_SERVER_JAR="$GITHUB_WORKSPACE/android/video-server/build/libs/automobile-video.jar" \
            AUTOMOBILE_REQUIRE_VIDEO_SERVER=1 \
              bun run test:integration:webrtc-device
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk

      - name: "Explain WebRTC device results"
        if: always()
        continue-on-error: true
        run: bash scripts/webrtc/explain-device-results.sh android

      - name: "Upload WebRTC device artifacts"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: android-webrtc-device-artifacts-${{ github.run_attempt }}
          path: scratch/webrtc-device-integration/
          if-no-files-found: ignore
          retention-days: 7

  ios-device-webrtc:
    name: "iOS Device Capture to WHEP"
    needs: [detect-changes, fast-validation]
    if: needs.detect-changes.outputs.webrtc_should_run == 'true' && needs.fast-validation.result == 'success'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Record Xcode version"
        id: webrtc-xcode-version
        shell: bash
        run: echo "version=$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')" >> "$GITHUB_OUTPUT"

      - name: "Cache iOS capture Swift package dependencies"
        uses: actions/cache@v5
        id: cache-webrtc-spm
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm/cache
          key: ${{ runner.os }}-spm-screen-capture-${{ steps.webrtc-xcode-version.outputs.version }}-${{ hashFiles('ios/screen-capture/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-screen-capture-${{ steps.webrtc-xcode-version.outputs.version }}-

      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - name: "Build iOS capture prerequisites"
        run: |
          echo "Swift cache hit: ${{ steps.cache-webrtc-spm.outputs.cache-hit }}"
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" || brew install --cask google-chrome
          (cd ios/screen-capture && swift package resolve)
          SECONDS=0
          (cd ios/screen-capture && swift build)
          echo "build took ${SECONDS}s"

      - name: "Boot and activate iOS Simulator"
        run: |
          result="$(bun run src/index.ts --boot-device --platform ios --create-if-missing --timeout-ms 600000)"
          simulator_udid="$(printf '%s' "${result}" | jq -r '.deviceId')"
          if [[ -z "${simulator_udid}" || "${simulator_udid}" == "null" ]]; then
            echo "::error::AutoMobile product boot returned no deviceId." >&2
            exit 1
          fi
          echo "AUTOMOBILE_IOS_SIMULATOR_UDID=${simulator_udid}" >> "${GITHUB_ENV}"
          if pgrep -x Simulator >/dev/null; then
            killall Simulator
            for _ in {1..30}; do
              pgrep -x Simulator >/dev/null || break
              sleep 1
            done
            if pgrep -x Simulator >/dev/null; then
              echo "::error::Simulator.app did not exit before activation." >&2
              exit 1
            fi
          fi
          open -a Simulator --args -CurrentDeviceUDID "${simulator_udid}"
          helper_path="${GITHUB_WORKSPACE}/ios/screen-capture/.build/debug/screen-capture-helper"
          simulator_name="$(xcrun simctl list devices --json | jq -r --arg udid "${simulator_udid}" \
            '[.devices[][] | select(.udid == $udid) | .name] | first // empty')"
          if [[ -z "${simulator_name}" ]]; then
            echo "::error::Could not resolve the selected Simulator name." >&2
            exit 1
          fi
          simulator_window_ready=0
          for _ in {1..30}; do
            simulator_windows="$("${helper_path}" --list-simulators 2>/dev/null || true)"
            if printf '%s' "${simulator_windows}" | jq -e --arg name "${simulator_name}" \
              '.windows | map(select((.title // "") | ascii_downcase | contains($name | ascii_downcase))) | length == 1' \
              >/dev/null; then
              simulator_window_ready=1
              break
            fi
            sleep 1
          done
          if [[ "${simulator_window_ready}" != "1" ]]; then
            echo "::error::Selected Simulator window did not become discoverable by ScreenCaptureKit." >&2
            exit 1
          fi

      - name: "Run iOS device capture integration"
        env:
          AUTOMOBILE_WEBRTC_DEVICE_INTEGRATION: "1"
          AUTOMOBILE_WEBRTC_DEVICE_PLATFORM: ios
          AUTOMOBILE_IOS_SCREEN_CAPTURE_HELPER: ${{ github.workspace }}/ios/screen-capture/.build/debug/screen-capture-helper
          AUTOMOBILE_IOS_SIMULATOR_WINDOW_TIMEOUT_MS: "15000"
        run: |
          set -uo pipefail
          source ./scripts/ios/run_with_timeout.sh

          reap_before_retry() {
            pkill -f "index.js --daemon-mode" 2>/dev/null || true
            pkill -x mediamtx 2>/dev/null || true
            pkill -f "remote-debugging-port=9222" 2>/dev/null || true
            sleep 2
            pkill -KILL -x mediamtx 2>/dev/null || true
            pkill -KILL -f "index.js --daemon-mode" 2>/dev/null || true
            if [ -n "${AUTOMOBILE_IOS_SIMULATOR_UDID:-}" ]; then
              if ! run_with_timeout 10 xcrun simctl bootstatus "${AUTOMOBILE_IOS_SIMULATOR_UDID}" -b >/dev/null 2>&1; then
                echo "Simulator did not report booted within 10s after cleanup; skipping reboot (best-effort re-verify only, #7605)." >&2
              fi
            fi
            for _ in $(seq 1 15); do
              lsof -nP -iTCP:8889 -sTCP:LISTEN >/dev/null 2>&1 || return 0
              sleep 1
            done
            echo "::error::Port 8889 still bound after cleanup; skipping retry to avoid a guaranteed conflict." >&2
            return 1
          }

          attempts=2
          for attempt in $(seq 1 "${attempts}"); do
            echo "::group::iOS device capture integration (attempt ${attempt}/${attempts})"
            if [ "${attempt}" -gt 1 ]; then
              echo "Starting emulator retry attempt 2."
            fi
            bun run test:integration:webrtc-device && rc=0 || rc=$?
            echo "::endgroup::"
            if [ "${rc}" -eq 0 ]; then
              if [ "${attempt}" -gt 1 ]; then
                echo "iOS device capture passed on retry (transient macos-26 ScreenCaptureKit flake)."
              fi
              exit 0
            fi
            echo "iOS device capture attempt ${attempt} failed (exit ${rc})."
            if [ "${attempt}" -lt "${attempts}" ]; then
              echo "Reaping MediaMTX / daemon / Chrome before one retry."
              reap_before_retry || exit 1
            fi
          done
          echo "iOS device capture failed after ${attempts} attempts."
          exit 1

      - name: "Explain WebRTC device results"
        if: always()
        continue-on-error: true
        run: bash scripts/webrtc/explain-device-results.sh ios

      # A helper that dies mid-stream (SIGTRAP, #7604) leaves its faulting frame
      # only in a macOS crash report; ship it with the device artifacts.
      - name: "Collect screen-capture-helper crash reports"
        if: always()
        continue-on-error: true
        run: bash scripts/webrtc/collect-helper-crash-reports.sh scratch/webrtc-device-integration

      - name: "Upload WebRTC device artifacts"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ios-webrtc-device-artifacts-${{ github.run_attempt }}
          path: scratch/webrtc-device-integration/
          if-no-files-found: ignore
          retention-days: 7

  # =============================================================================
  # Gate Jobs for Branch Protection
  # =============================================================================
  # These jobs always run and aggregate pass/skip/fail status of their group.
  # Branch protection required checks should point to these gate jobs instead
  # of the individual conditional jobs, avoiding the GitHub Actions issue where
  # skipped matrix jobs produce uninterpolated check names that block merges.
  # Only the gates whose names are required checks in the green-main ruleset
  # ("IDE Plugin", "iOS Build", "Shell Tests") exist: non-required roll-ups each
  # cost a runner slot per PR without blocking anything, so their underlying
  # jobs report directly instead.

  ide-plugin-gate:
    timeout-minutes: 10
    name: "IDE Plugin"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - build-ide-plugin
      - ide-plugin-unit-tests
    runs-on: ${{ vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile-small' || 'ubuntu-latest' }}
    steps:
      - name: "Check results"
        run: |
          results=( \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.build-ide-plugin.result }}" \
            "${{ needs.ide-plugin-unit-tests.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more jobs failed or were cancelled"
              exit 1
            fi
          done

  # Deterministic-only roll-up of the iOS *build* legs (Swift packages + Xcode
  # projects). Reports a stable context name so it can be a required status
  # check without the matrix-skip footgun (a gated-out matrix job reports its
  # literal "(${{ ... }})" name instead of the expanded one). Deliberately
  # excludes ios-xctest-runner-simulator-tests, which is simulator-flaky and
  # must not gate merges — it remains a standalone advisory lane outside both gates.
  ios-build-gate:
    timeout-minutes: 10
    name: "iOS Build"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - ios-swift-packages
      - ios-xcode-build
    # Roll-up only reads needs.*.result — it needs no token scopes.
    permissions: {}
    runs-on: ${{ vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile-small' || 'ubuntu-latest' }}
    steps:
      - name: "Check results"
        run: |
          declare -A results=(
            [detect-changes]="${{ needs.detect-changes.result }}"
            [ios-swift-packages]="${{ needs.ios-swift-packages.result }}"
            [ios-xcode-build]="${{ needs.ios-xcode-build.result }}"
          )
          fail=
          for name in "${!results[@]}"; do
            r="${results[$name]}"
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::iOS Build gate dependency ${name} = ${r}"
              fail=1
            fi
          done
          if [[ -n "${fail}" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi

  shell-tests-gate:
    timeout-minutes: 10
    name: "Shell Tests"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - bats-tests
    # Roll-up only reads needs.*.result — it needs no token scopes.
    permissions: {}
    runs-on: ${{ vars.NAMESPACE_RUNNERS_DISABLED != 'true' && github.event.pull_request.user.login == 'kaeawc' && github.event.pull_request.head.repo.full_name == github.repository && 'namespace-profile-auto-mobile-small' || 'ubuntu-latest' }}
    steps:
      - name: "Check results"
        run: |
          declare -A results=(
            [detect-changes]="${{ needs.detect-changes.result }}"
            [bats-tests]="${{ needs.bats-tests.result }}"
          )
          fail=
          for name in "${!results[@]}"; do
            r="${results[$name]}"
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Shell Tests gate dependency ${name} = ${r}"
              fail=1
            fi
          done
          if [[ -n "${fail}" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
