  # =============================================================================
  # MCP Benchmarks
  # =============================================================================

  benchmarks:
    name: "MCP Benchmarks"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ts_changed == 'true' && needs.detect-changes.outputs.sha256_only != 'true'
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Run MCP Benchmarks"
        shell: bash
        run: |
          mkdir -p reports

          if ! bun run benchmark-context --output reports/context-benchmark.json; then
            echo "CONTEXT_BENCHMARK_FAILED=true" >> "$GITHUB_ENV"
          fi

          if ! bun run benchmark-tools --output reports/tool-benchmark.json; then
            echo "TOOL_BENCHMARK_FAILED=true" >> "$GITHUB_ENV"
          fi

          if ! timeout 60s bun run benchmark-startup --compare benchmark/startup-baseline.json --output reports/startup-benchmark.json; then
            echo "STARTUP_BENCHMARK_FAILED=true" >> "$GITHUB_ENV"
          fi

          if ! bun run benchmark-npm-unpacked-size --output reports/npm-unpacked-size.json; then
            echo "NPM_UNPACKED_SIZE_BENCHMARK_FAILED=true" >> "$GITHUB_ENV"
          fi

      - name: "Upload Context Benchmark Report"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: context-benchmark-report
          path: reports/context-benchmark.json
          retention-days: 90

      - name: "Upload Tool Benchmark Report"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tool-benchmark-report
          path: reports/tool-benchmark.json
          retention-days: 90

      - name: "Upload Startup Benchmark Report"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: startup-benchmark-report
          path: reports/startup-benchmark.json
          retention-days: 90

      - name: "Upload NPM Unpacked Size Benchmark Report"
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-unpacked-size-report
          path: reports/npm-unpacked-size.json
          retention-days: 90

      - name: "Post Consolidated Comment"
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            const contextPath = 'reports/context-benchmark.json';
            const toolPath = 'reports/tool-benchmark.json';
            const startupPath = 'reports/startup-benchmark.json';
            const npmPath = 'reports/npm-unpacked-size.json';

            const readReport = (reportPath, label) => {
              if (!fs.existsSync(reportPath)) {
                return { label, report: null };
              }
              try {
                const raw = fs.readFileSync(reportPath, 'utf8');
                return { label, report: JSON.parse(raw) };
              } catch (error) {
                console.log(`Failed to read ${label} report: ${error.message}`);
                return { label, report: null };
              }
            };

            const contextReport = readReport(contextPath, 'Context Thresholds');
            const toolReport = readReport(toolPath, 'Tool Call Throughput');
            const startupReport = readReport(startupPath, 'Startup Performance');
            const npmReport = readReport(npmPath, 'NPM Unpacked Size');

            if (!contextReport.report && !toolReport.report && !startupReport.report && !npmReport.report) {
              console.log('No benchmark reports found. Skipping PR comment.');
              return;
            }

            let body = '## MCP Benchmarks\n\n';

            const statuses = [];
            let hasFailures = false;
            let hasMissing = false;

            const trackStatus = (label, report) => {
              if (!report) {
                statuses.push(`${label}: ⚠️ missing`);
                hasMissing = true;
                return;
              }
              const passed = report.passed !== false;
              const icon = passed ? '✅' : '❌';
              statuses.push(`${label}: ${icon}`);
              if (!passed) {
                hasFailures = true;
              }
            };

            trackStatus('Context Thresholds', contextReport.report);
            trackStatus('Tool Call Throughput', toolReport.report);
            trackStatus('Startup', startupReport.report);
            trackStatus('NPM Unpacked Size', npmReport.report);

            let overallStatus = '⚠️ PARTIAL';
            if (!hasFailures && !hasMissing) {
              overallStatus = '✅ PASSED';
            } else if (hasFailures) {
              overallStatus = '❌ FAILED';
            }

            body += `**Overall Status:** ${overallStatus}\n`;
            body += `**Status by Benchmark:** ${statuses.join(' | ')}\n\n`;

            if (contextReport.report) {
              const report = contextReport.report;
              const formatRow = (label, result) => {
                if (!result) {
                  return `| ${label} | n/a | n/a | n/a | ⚠️ |`;
                }
                const status = result.passed ? '✅' : '❌';
                const actual = typeof result.actual === 'number' ? result.actual.toLocaleString() : 'n/a';
                const threshold = typeof result.threshold === 'number' ? result.threshold.toLocaleString() : 'n/a';
                const usage = typeof result.usage === 'number' ? `${result.usage}%` : 'n/a';
                return `| ${label} | ${actual} | ${threshold} | ${usage} | ${status} |`;
              };

              body += '### Context Thresholds\n\n';
              body += '| Category | Actual | Threshold | Usage | Status |\n';
              body += '|----------|--------|-----------|-------|--------|\n';
              body += formatRow('Tools', report.results?.tools) + '\n';
              body += formatRow('Resources', report.results?.resources) + '\n';
              body += formatRow('Resource Templates', report.results?.resourceTemplates) + '\n';
              body += formatRow('**Total**', report.results?.total) + '\n';

              if (Array.isArray(report.violations) && report.violations.length > 0) {
                body += '\n### ⚠️ Threshold Violations\n\n';
                for (const violation of report.violations) {
                  body += `- ${violation}\n`;
                }
              }

              body += `\n**Overall Status:** ${report.passed ? '✅ PASSED' : '❌ FAILED'}`;
              if (report.timestamp) {
                body += `\n\n_Generated at ${report.timestamp}_`;
              }
              body += '\n\n';
            }

            if (toolReport.report) {
              const report = toolReport.report;
              const summary = report.summary ?? {};
              const sampleSize = report.sampleSize ?? 'n/a';
              const totalDuration = typeof report.totalDuration === 'number'
                ? `${(report.totalDuration / 1000).toFixed(2)}s`
                : 'n/a';
              const averageThroughput = typeof summary.averageThroughput === 'number'
                ? `${summary.averageThroughput.toFixed(2)} ops/second`
                : 'n/a';

              body += '### Tool Call Throughput\n\n';
              body += `**Sample Size:** ${sampleSize} iterations per tool\n`;
              body += `**Total Duration:** ${totalDuration}\n`;
              body += `**Average Throughput:** ${averageThroughput}\n\n`;

              const categories = [
                { name: 'Fast Operations', expectedLatency: '<100ms', tools: ['listDevices', 'getForegroundApp', 'pressButton'] },
                { name: 'Medium Operations', expectedLatency: '100ms-1s', tools: ['observe', 'tapOn', 'inputText', 'swipe'] },
                { name: 'Slow Operations', expectedLatency: '1s+', tools: ['launchApp', 'installApp'] }
              ];

              const results = Array.isArray(report.results) ? report.results : [];
              let renderedAnyCategory = false;

              for (const category of categories) {
                const categoryResults = results.filter(r => category.tools.includes(r.toolName));
                if (categoryResults.length === 0) continue;
                renderedAnyCategory = true;

                body += `#### ${category.name} (${category.expectedLatency})\n\n`;
                body += '| Tool | P50 | P95 | Mean | Success | Status |\n';
                body += '|------|-----|-----|------|---------|--------|\n';

                for (const result of categoryResults) {
                  const status = result.overallPassed === false ? '❌' : '✅';
                  const p50 = typeof result.p50 === 'number' ? `${result.p50.toFixed(1)}ms` : 'n/a';
                  const p95 = typeof result.p95 === 'number' ? `${result.p95.toFixed(1)}ms` : 'n/a';
                  const mean = typeof result.mean === 'number' ? `${result.mean.toFixed(1)}ms` : 'n/a';
                  const success = typeof result.successRate === 'number' ? `${result.successRate.toFixed(0)}%` : 'n/a';
                  body += `| ${result.toolName} | ${p50} | ${p95} | ${mean} | ${success} | ${status} |\n`;

                  if (Array.isArray(result.thresholdChecks) && result.overallPassed === false) {
                    for (const check of result.thresholdChecks.filter(c => !c.passed)) {
                      const metric = check.metric ? check.metric.toUpperCase() : 'METRIC';
                      const actual = typeof check.actual === 'number' ? `${check.actual.toFixed(2)}ms` : 'n/a';
                      const threshold = typeof check.threshold === 'number' ? `${check.threshold.toFixed(2)}ms` : 'n/a';
                      const regression = typeof check.regression === 'number' ? `+${check.regression.toFixed(1)}%` : 'n/a';
                      body += `| └─ ${metric} regression | ${actual} | | | ${threshold} | ${regression} | |\n`;
                    }
                  }
                }
                body += '\n';
              }

              if (!renderedAnyCategory) {
                body += '_No tool results found._\n\n';
              }

              if (Array.isArray(report.violations) && report.violations.length > 0) {
                body += '#### ⚠️ Performance Regressions\n\n';
                for (const violation of report.violations) {
                  body += `- ${violation}\n`;
                }
                body += '\n';
              }

              const passedTools = typeof summary.passedTools === 'number' ? summary.passedTools : 'n/a';
              const totalTools = typeof summary.totalTools === 'number' ? summary.totalTools : 'n/a';
              body += `**Summary:** ${passedTools}/${totalTools} tools passed\n`;
              body += `**Overall Status:** ${report.passed ? '✅ PASSED' : '❌ FAILED'}\n\n`;
              if (report.timestamp) {
                body += `_Generated at ${report.timestamp}_\n\n`;
              }
            }

            if (startupReport.report) {
              const report = startupReport.report;
              const formatMs = value => (typeof value === 'number' ? `${value.toFixed(1)}ms` : 'n/a');
              const formatBytes = value => (typeof value === 'number' ? `${(value / (1024 * 1024)).toFixed(1)}MB` : 'n/a');
              const formatNumber = value => (typeof value === 'number' ? value.toLocaleString() : 'n/a');

              body += '### Startup Performance\n\n';

              if (report.results?.mcpServer) {
                body += '#### MCP Server (stdio)\n\n';
                body += '| Mode | Ready | First Tool Call | Heap Used |\n';
                body += '|------|-------|-----------------|-----------|\n';
                for (const run of report.results.mcpServer.runs || []) {
                  const heap = run.memoryUsage?.heapUsed ? formatBytes(run.memoryUsage.heapUsed) : 'n/a';
                  body += `| ${run.mode} | ${formatMs(run.timeToReadyMs)} | ${formatMs(run.timeToFirstToolCallMs)} | ${heap} |\n`;
                }
                body += '\n';

                const discovery = report.results.mcpServer.deviceDiscovery;
                if (discovery) {
                  if (discovery.skipped) {
                    body += `Device discovery: skipped (${discovery.reason || 'no reason provided'})\n\n`;
                  } else if (discovery.scenarios?.length) {
                    body += 'Device discovery scenarios:\n';
                    for (const scenario of discovery.scenarios) {
                      body += `- ${scenario.name}: ${formatMs(scenario.durationMs)} (${scenario.deviceCount} device(s))\n`;
                    }
                    body += '\n';
                  }
                }
              }

              if (report.results?.daemon) {
                body += '#### Daemon\n\n';
                body += '| Mode | Spawn | Ready | Responsive | Heap Used |\n';
                body += '|------|-------|-------|------------|-----------|\n';
                for (const run of report.results.daemon.runs || []) {
                  const heap = run.memoryUsage?.heapUsed ? formatBytes(run.memoryUsage.heapUsed) : 'n/a';
                  body += `| ${run.mode} | ${formatMs(run.spawnMs)} | ${formatMs(run.timeToReadyMs)} | ${formatMs(run.timeToResponsiveMs)} | ${heap} |\n`;
                }
                body += '\n';
              }

              if (report.comparisons?.regressions?.length) {
                body += '#### Startup Thresholds\n\n';
                body += '| Metric | Actual | Threshold | Regression | Status |\n';
                body += '|--------|--------|-----------|------------|--------|\n';
                for (const regression of report.comparisons.regressions) {
                  const actual = formatNumber(regression.actual);
                  const threshold = formatNumber(regression.threshold);
                  const regressionPct = typeof regression.regression === 'number'
                    ? `${regression.regression >= 0 ? '+' : ''}${regression.regression.toFixed(1)}%`
                    : 'n/a';
                  const status = regression.passed ? '✅' : '❌';
                  body += `| ${regression.metric} | ${actual} | ${threshold} | ${regressionPct} | ${status} |\n`;
                }
                body += '\n';
              }

              if (report.comparisons?.regressions?.length) {
                const failures = report.comparisons.regressions.filter(r => !r.passed);
                if (failures.length > 0) {
                  body += '#### ⚠️ Regressions\n\n';
                  for (const regression of failures) {
                    body += `- ${regression.metric}: ${regression.actual.toFixed(2)} > ${regression.threshold.toFixed(2)} (+${regression.regression.toFixed(1)}%)\n`;
                  }
                  body += '\n';
                }
              }

              if (report.skips?.length) {
                body += '#### Skipped Checks\n\n';
                for (const skip of report.skips) {
                  body += `- ${skip}\n`;
                }
                body += '\n';
              }

              body += `**Overall Status:** ${report.passed ? '✅ PASSED' : '❌ FAILED'}\n`;
              if (report.timestamp) {
                body += `\n_Generated at ${report.timestamp}_`;
              }
              body += '\n\n';
            }

            if (npmReport.report) {
              const report = npmReport.report;
              const formatBytes = value => (typeof value === 'number' ? `${(value / (1024 * 1024)).toFixed(1)}MB` : 'n/a');
              const result = report.results?.unpackedSize;
              const actual = result && typeof result.actual === 'number' ? formatBytes(result.actual) : 'n/a';
              const threshold = result && typeof result.threshold === 'number' ? formatBytes(result.threshold) : 'n/a';
              const usage = result && typeof result.usage === 'number' ? `${result.usage}%` : 'n/a';
              const status = result ? (result.passed ? '✅' : '❌') : '⚠️';
              const packageName = report.package?.name ?? 'unknown';
              const packageVersion = report.package?.version ?? 'unknown';
              const tarballSize = typeof report.package?.tarballBytes === 'number'
                ? formatBytes(report.package.tarballBytes)
                : 'n/a';

              body += '### NPM Unpacked Size\n\n';
              body += '| Metric | Actual | Threshold | Usage | Status |\n';
              body += '|--------|--------|-----------|-------|--------|\n';
              body += `| Unpacked Size | ${actual} | ${threshold} | ${usage} | ${status} |\n`;
              body += `\n**Package:** ${packageName}@${packageVersion}\n`;
              body += `**Tarball Size:** ${tarballSize}\n`;

              if (Array.isArray(report.violations) && report.violations.length > 0) {
                body += '\n#### ⚠️ Size Violations\n\n';
                for (const violation of report.violations) {
                  body += `- ${violation}\n`;
                }
              }

              body += `\n**Overall Status:** ${report.passed ? '✅ PASSED' : '❌ FAILED'}`;
              if (report.timestamp) {
                body += `\n\n_Generated at ${report.timestamp}_`;
              }
              body += '\n\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## MCP Benchmarks')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: "Check Benchmark Results"
        if: always()
        shell: bash
        run: |
          failed=false

          if [ "${CONTEXT_BENCHMARK_FAILED:-false}" = "true" ]; then
            echo "::error::MCP context threshold benchmark failed - one or more thresholds were exceeded"
            cat reports/context-benchmark.json || true
            failed=true
          else
            echo "::notice::MCP context threshold benchmark passed - all thresholds satisfied"
          fi

          if [ "${TOOL_BENCHMARK_FAILED:-false}" = "true" ]; then
            echo "::error::MCP tool throughput benchmark failed - performance regressions detected"
            cat reports/tool-benchmark.json || true
            failed=true
          else
            echo "::notice::MCP tool throughput benchmark passed - no regressions"
          fi

          if [ "${STARTUP_BENCHMARK_FAILED:-false}" = "true" ]; then
            echo "::error::MCP startup benchmark failed - regressions detected"
            cat reports/startup-benchmark.json || true
            failed=true
          else
            echo "::notice::MCP startup benchmark passed - no regressions"
          fi

          if [ "${NPM_UNPACKED_SIZE_BENCHMARK_FAILED:-false}" = "true" ]; then
            echo "::error::NPM unpacked size benchmark failed - threshold exceeded"
            cat reports/npm-unpacked-size.json || true
            failed=true
          else
            echo "::notice::NPM unpacked size benchmark passed - within threshold"
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi


  # =============================================================================
  # Gate Jobs for Branch Protection
  # =============================================================================
  # These jobs always run and aggregate pass/skip/fail status of their group.
  # Branch protection required checks should point to these gate jobs instead
  # of the individual conditional jobs, avoiding the GitHub Actions issue where
  # skipped matrix jobs produce uninterpolated check names that block merges.

  # Full iOS roll-up (superset). This is the broad, NON-required signal: it
  # includes the simulator-flaky ios-xctest-runner-simulator-tests, so it must
  # not gate merges. The required, deterministic subset lives in ios-build-gate
  # below ("iOS Build"), which this gate reuses so the build-leg membership is
  # declared in exactly one place (add a new iOS *build* job to ios-build-gate,
  # not here).
  ios-gate:
    name: "iOS"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - ios-build-gate
      - ios-xctest-runner-simulator-tests
      - ios-spm-root-package-build
    runs-on: ubuntu-latest
    steps:
      - name: "Check results"
        run: |
          results=( \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.ios-build-gate.result }}" \
            "${{ needs.ios-xctest-runner-simulator-tests.result }}" \
            "${{ needs.ios-spm-root-package-build.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more jobs failed or were cancelled"
              exit 1
            fi
          done

  android-gate:
    name: "Android"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - build-android-control-proxy
      - build-junit-runner-library
      - build-playground-app
      - junit-runner-kotlin-consumer-compatibility
      - junit-runner-unit-tests
      - junit-runner-emulator-tests
      - junit-runner-emulator-wtf-tests
      - playground-automobile-emulator-tests
      - kotlin-code-coverage
    runs-on: ubuntu-latest
    steps:
      - name: "Check results"
        run: |
          results=( \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.build-android-control-proxy.result }}" \
            "${{ needs.build-junit-runner-library.result }}" \
            "${{ needs.build-playground-app.result }}" \
            "${{ needs.junit-runner-kotlin-consumer-compatibility.result }}" \
            "${{ needs.junit-runner-unit-tests.result }}" \
            "${{ needs.junit-runner-emulator-tests.result }}" \
            "${{ needs.junit-runner-emulator-wtf-tests.result }}" \
            "${{ needs.playground-automobile-emulator-tests.result }}" \
            "${{ needs.kotlin-code-coverage.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more jobs failed or were cancelled"
              exit 1
            fi
          done

  ide-plugin-gate:
    name: "IDE Plugin"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - build-ide-plugin
      - ide-plugin-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: "Check results"
        run: |
          results=( \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.build-ide-plugin.result }}" \
            "${{ needs.ide-plugin-unit-tests.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more jobs failed or were cancelled"
              exit 1
            fi
          done

  # Deterministic-only roll-up of the iOS *build* legs (Swift packages + Xcode
  # projects). Reports a stable context name so it can be a required status
  # check without the matrix-skip footgun (a gated-out matrix job reports its
  # literal "(${{ ... }})" name instead of the expanded one). Deliberately
  # excludes ios-xctest-runner-simulator-tests, which is simulator-flaky and
  # must not gate merges — that stays covered by the non-required "iOS" gate.
  ios-build-gate:
    name: "iOS Build"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - ios-swift-packages
      - ios-xcode-build
    # Roll-up only reads needs.*.result — it needs no token scopes.
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: "Check results"
        run: |
          declare -A results=(
            [detect-changes]="${{ needs.detect-changes.result }}"
            [ios-swift-packages]="${{ needs.ios-swift-packages.result }}"
            [ios-xcode-build]="${{ needs.ios-xcode-build.result }}"
          )
          fail=
          for name in "${!results[@]}"; do
            r="${results[$name]}"
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::iOS Build gate dependency ${name} = ${r}"
              fail=1
            fi
          done
          if [[ -n "${fail}" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi

  # Stable roll-up of the CodeQL matrix so it can be required. codeql-node is a
  # per-language matrix; when it is gated out (non-TypeScript PRs) the matrix
  # never expands and reports its literal name, so the expanded
  # "... (typescript)" context would hang as a required check.
  codeql-gate:
    name: "CodeQL"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - codeql-node
    # Roll-up only reads needs.*.result — it needs no token scopes.
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: "Check results"
        run: |
          declare -A results=(
            [detect-changes]="${{ needs.detect-changes.result }}"
            [codeql-node]="${{ needs.codeql-node.result }}"
          )
          fail=
          for name in "${!results[@]}"; do
            r="${results[$name]}"
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::CodeQL gate dependency ${name} = ${r}"
              fail=1
            fi
          done
          if [[ -n "${fail}" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi

  # Stable roll-up of the BATS shell tests so they can be required. bats-tests
  # is an OS matrix; when it is gated out (sha256-only / auto-chore PRs) it
  # reports its literal "(${{ matrix.os }})" name, so requiring the expanded
  # "(macos-latest)" context would hang those PRs.
  shell-tests-gate:
    name: "Shell Tests"
    if: always() && needs.detect-changes.outputs.auto_chore != 'true'
    needs:
      - detect-changes
      - bats-tests
    # Roll-up only reads needs.*.result — it needs no token scopes.
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: "Check results"
        run: |
          declare -A results=(
            [detect-changes]="${{ needs.detect-changes.result }}"
            [bats-tests]="${{ needs.bats-tests.result }}"
          )
          fail=
          for name in "${!results[@]}"; do
            r="${results[$name]}"
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Shell Tests gate dependency ${name} = ${r}"
              fail=1
            fi
          done
          if [[ -n "${fail}" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
