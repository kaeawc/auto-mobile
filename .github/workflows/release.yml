---
name: Release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, with no leading v (e.g. 0.0.45)"
        required: true
        type: string
      prepare_run_id:
        description: "Successful Prepare Release workflow run that built the artifacts"
        required: true
        type: string

# Prepare Release dispatches this workflow only after it has built, hashed, and
# integrity-checked every GitHub Release asset. The release consumes those exact
# artifacts rather than starting a second, potentially different build.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  validate-release-tag:
    name: "Validate Release Tag"
    runs-on: ubuntu-latest
    outputs:
      is_release_tag: ${{ steps.validate.outputs.is_release_tag }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: "Validate tag format"
        id: validate
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Prepare Release must dispatch this workflow on the tag, not merely
          # name it. docker/metadata-action derives semver tags from github.ref.
          if { [[ "$REF_TYPE" != "tag" ]] || [[ "$REF_NAME" != "$TAG" ]]; }; then
            echo "Release must be dispatched on tag '$TAG', but this run is on" >&2
            echo "${REF_TYPE} '${REF_NAME}'. Re-run it and pick the tag in the" >&2
            echo "ref dropdown, or let prepare-release dispatch it." >&2
            exit 1
          fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Refusing to release malformed tag: $TAG (expected 0.0.45, no leading v)" >&2
          exit 1

  verify-and-release:
    if: needs.validate-release-tag.outputs.is_release_tag == 'true'
    runs-on: ubuntu-latest
    needs:
      - validate-release-tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0
          ref: refs/tags/${{ needs.validate-release-tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Ensure npm CLI is 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          VERSION="$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for successful Prepare Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 12); do
            run="$(gh api "repos/$REPO/actions/runs/$PREPARE_RUN_ID")"
            status="$(jq -r '.status' <<<"$run")"
            if [[ "$status" != completed ]]; then
              sleep 5
              continue
            fi

            conclusion="$(jq -r '.conclusion' <<<"$run")"
            workflow_path="$(jq -r '.path' <<<"$run")"
            if [[ "$conclusion" != success ]] \
              || [[ "$workflow_path" != ".github/workflows/prepare-release.yml" ]]; then
              echo "prepare_run_id must identify a successful Prepare Release run" >&2
              exit 1
            fi
            exit 0
          done

          echo "Prepare Release run $PREPARE_RUN_ID did not complete within 60 seconds" >&2
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "Download release artifact provenance"
        uses: actions/download-artifact@v7
        with:
          name: release-artifact-provenance
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}

      - name: Validate prepared release provenance
        env:
          TAG: ${{ needs.validate-release-tag.outputs.tag }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail

          tag_sha="$(git rev-parse HEAD)"
          jq -e \
            --arg tag "$TAG" \
            --arg tag_sha "$tag_sha" \
            --arg prepare_run_id "$PREPARE_RUN_ID" \
            '.tag == $tag
              and .tag_sha == $tag_sha
              and .prepare_run_id == $prepare_run_id
              and .artifacts == ["control-proxy-apk", "ctrl-proxy-ios-ipa", "video-server-jar", "screen-capture-helper", "automobile-desktop-macos", "automobile-desktop-windows", "automobile-desktop-linux"]' \
            /tmp/release-artifact-provenance.json >/dev/null

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}

      - name: "Download CtrlProxy iOS IPA"
        uses: actions/download-artifact@v7
        with:
          name: ctrl-proxy-ios-ipa
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}

      - name: "Download video-server jar"
        uses: actions/download-artifact@v7
        with:
          name: video-server-jar
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}

      - name: "Download screen-capture-helper"
        uses: actions/download-artifact@v7
        with:
          name: screen-capture-helper
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}

      # Desktop installers are direct user downloads, not runtime-fetched
      # dependencies, so they carry no source-checksum entry in the release
      # constants; they are attached to the GitHub release as-is.
      - name: "Download desktop macOS DMG"
        uses: actions/download-artifact@v7
        with:
          name: automobile-desktop-macos
          path: /tmp/desktop
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}

      - name: "Download desktop Windows MSI"
        uses: actions/download-artifact@v7
        with:
          name: automobile-desktop-windows
          path: /tmp/desktop
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}

      - name: "Download desktop Linux Deb"
        uses: actions/download-artifact@v7
        with:
          name: automobile-desktop-linux
          path: /tmp/desktop
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}

      - name: Verify prepared desktop installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/ci/verify-desktop-installer-assets.sh "$VERSION" /tmp/desktop

      - name: Read checksums prepared for this release
        id: prepared_checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun -e '
            import { appendFileSync } from "node:fs";
            import { RELEASE_CHECKSUM_REGISTRY } from "./src/constants/release";
            const entry = RELEASE_CHECKSUM_REGISTRY.find(({ version }) => version === process.env.VERSION);
            if (!entry) {
              throw new Error(`No prepared checksum registry entry for ${process.env.VERSION}`);
            }
            const checksums = {
              apk: entry.apkSha256,
              ipa: entry.ipaSha256,
              video_jar: entry.videoJarSha256,
              screen_capture_helper: entry.screenCaptureHelperSha256,
            };
            const missing = Object.entries(checksums)
              .filter(([, value]) => !value)
              .map(([name]) => name);
            if (missing.length > 0) {
              throw new Error(`Missing prepared checksums for ${process.env.VERSION}: ${missing.join(", ")}`);
            }
            const output = process.env.GITHUB_OUTPUT;
            for (const [key, value] of Object.entries(checksums)) {
              appendFileSync(output, `${key}=${value}\n`);
            }
          '

      - name: Create release notes
        id: release_notes
        env:
          APK_CHECKSUM: ${{ steps.prepared_checksums.outputs.apk }}
          IPA_CHECKSUM: ${{ steps.prepared_checksums.outputs.ipa }}
          VIDEO_JAR_CHECKSUM: ${{ steps.prepared_checksums.outputs.video_jar }}
          SCREEN_CAPTURE_HELPER_CHECKSUM: ${{ steps.prepared_checksums.outputs.screen_capture_helper }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract changelog for this version if it exists
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v version="$VERSION" '
              $0 ~ "^## \\[v?"version"\\]" {in_section=1; next}
              in_section && $0 ~ "^## \\[" {exit}
              in_section {print}
            ' CHANGELOG.md | sed '/^$/d')
            if [ -z "$NOTES" ]; then
              NOTES="Release v${VERSION}"
            fi
          else
            NOTES="Release v${VERSION}"
          fi

          # Add checksum to notes. Each section is a single-line concatenation of
          # adjacent quoted strings ("..."$'\n\n'"..."). Do NOT split these across
          # backslash-continued lines: the continuation indentation inserts an
          # unquoted space between tokens, which ends the NOTES= assignment early
          # and makes bash try to run the remainder as a command (exit 127). The
          # Desktop App line below is the canonical form to match.
          NOTES="${NOTES}"$'\n\n'"## CtrlProxy APK"$'\n\n'"**SHA256 Checksum:** \`${APK_CHECKSUM}\`"$'\n\n'"Download the APK from the release assets below."
          NOTES="${NOTES}"$'\n\n'"## CtrlProxy iOS IPA"$'\n\n'"**SHA256 Checksum:** \`${IPA_CHECKSUM}\`"$'\n\n'"Download the IPA from the release assets below."
          NOTES="${NOTES}"$'\n\n'"## video-server jar"$'\n\n'"**SHA256 Checksum:** \`${VIDEO_JAR_CHECKSUM}\`"$'\n\n'"Download automobile-video.jar from the release assets below."
          NOTES="${NOTES}"$'\n\n'"## macOS screen-capture-helper"$'\n\n'"**SHA256 Checksum:** \`${SCREEN_CAPTURE_HELPER_CHECKSUM}\`"$'\n\n'"Download screen-capture-helper-macos-universal.zip from the release assets below."
          NOTES="${NOTES}"$'\n\n'"## Desktop App"$'\n\n'"Native installers are attached below: macOS \`.dmg\` (signed & notarized), Windows \`.msi\`, and Linux \`.deb\`."

          # Save to file for GitHub release
          echo "$NOTES" > release_notes.txt

          # Also output for later steps
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build TypeScript package
        run: bun run build

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # npm publish is not idempotent: without this, a failure anywhere later
          # in the job makes the whole release unrerunnable.
          #
          # Assign first, then test. Under set -e a failing command substitution
          # inside an `if` condition does NOT abort, so testing it inline would
          # turn the guard's fail-closed error into a silent "not published".
          state=$(scripts/release/already-published.sh npm "$VERSION")
          if [ "$state" = published ]; then
            echo "npm already has $VERSION; skipping publish"
            exit 0
          fi
          npm publish --provenance --access public

      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/update-brew-formula.sh

      # MCP Registry, Maven Central, and the Docker image are best-effort
      # distribution channels: a failure in any of them must not block the
      # canonical GitHub Release (and its artifacts) that runs after them.
      # continue-on-error neutralizes their failures so `success()` stays true
      # for the GitHub Release step, while the failed step still shows red in the
      # UI so the drift is visible and fixable.
      - name: Install mcp-publisher
        continue-on-error: true
        run: |
          URL="https://github.com/modelcontextprotocol/registry"
          URL="$URL/releases/latest/download"
          URL="$URL/mcp-publisher_linux_amd64.tar.gz"
          curl -L "$URL" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Assign first, then test — see the npm step for why.
          state=$(scripts/release/already-published.sh mcp "$VERSION")
          if [ "$state" = published ]; then
            echo "MCP Registry already has $VERSION; skipping publish"
            exit 0
          fi
          ./mcp-publisher login dns --domain jasonpearson.dev \
            --private-key "${{ secrets.MCP_DNS_PRIVATE_KEY }}"
          ./mcp-publisher publish

      - name: Set up Java
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        continue-on-error: true
        run: chmod +x android/gradlew

      - name: Setup Release Keystore
        continue-on-error: true
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | \
            base64 -d > android/keystore/release.keystore

      # Preflight: stage every publishable file to a local Maven file repository
      # (no credentials, no remote upload) and record a deterministic manifest of
      # exactly what the release would send to Maven Central, with per-coordinate
      # and release totals. The budget check is advisory -- a breach warns but
      # never blocks, so a security release always ships (#4853). This also gives
      # the artifact-reduction work (#4851, #4852) a before/after regression
      # oracle.
      - name: Maven Central publication manifest preflight
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MANIFEST_OUT: ${{ runner.temp }}/maven-publication-manifest.txt
          ORG_GRADLE_PROJECT_signingInMemoryKey:
            ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:
            ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId:
            ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
        run: scripts/release/maven-publication-manifest-preflight.sh

      - name: Upload Maven publication manifest
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: maven-publication-manifest
          path: ${{ runner.temp }}/maven-publication-manifest.txt
          if-no-files-found: warn

      - name: Publish Android Libraries to Maven Central
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername:
            ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword:
            ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey:
            ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:
            ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId:
            ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          RELEASE_KEYSTORE_PATH: keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD:
            ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A duplicate GAV is rejected, so a rerun would die here. The guard
          # fails closed on a partial publish rather than choosing for us.
          # Assign first, then test — see the npm step for why.
          state=$(scripts/release/already-published.sh maven "$VERSION")
          if [ "$state" = published ]; then
            echo "Maven Central already has $VERSION; skipping publish"
            exit 0
          fi
          cd android
          # Override VERSION_NAME with release version from git tag
          # (not SNAPSHOT in gradle.properties)
          # Publish dependency modules first — separate invocation
          # guarantees completion before consumer modules
          ./gradlew :protocol:publish :test-plan-validation:publish \
            -PVERSION_NAME=${{ steps.version.outputs.version }} \
            --no-configuration-cache
          ./gradlew :junit-runner:publish :auto-mobile-sdk:publish \
            -PVERSION_NAME=${{ steps.version.outputs.version }} \
            --no-configuration-cache

      - name: Free Disk Space
        continue-on-error: true
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true      # ~14 GB
          remove_dotnet: true       # ~2.7 GB
          remove_haskell: true      # Minimal
          remove_tool_cache: false  # Keep Node.js, need it
          remove_swap: true         # ~4 GB
          remove_codeql: true       # ~5.9 GB CodeQL separate
          use_rmz: true            # 3x faster deletion

      - name: Clean up Docker
        continue-on-error: true
        run: docker system prune -af --volumes

      - name: Set up QEMU
        continue-on-error: true
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        continue-on-error: true
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: kaeawc/auto-mobile
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.validate-release-tag.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          files=(
            /tmp/control-proxy-debug.apk
            /tmp/control-proxy.ipa
            /tmp/automobile-video.jar
            /tmp/screen-capture-helper-macos-universal.zip
            /tmp/desktop/AutoMobile-${VERSION}-macos.dmg
            /tmp/desktop/AutoMobile-${VERSION}-windows.msi
            /tmp/desktop/AutoMobile-${VERSION}-linux.deb
          )

          # Use the GitHub Release API directly through gh. `gh release create`
          # uploads through a draft before publishing, so a failed first attempt
          # can leave a mutable draft. Only that draft is safe to repair with
          # --clobber; never delete assets from an already-published release.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            release_json="$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets)"
            if [ "$(jq -r '.isDraft' <<<"$release_json")" = "true" ]; then
              gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
              gh release edit "$TAG" --repo "$REPO" --title "$VERSION" \
                --notes-file release_notes.txt --draft=false
            else
              missing=0
              for file in "${files[@]}"; do
                asset_name="${file##*/}"
                if ! jq -e --arg name "$asset_name" \
                  '.assets[] | select(.name == $name)' <<<"$release_json" >/dev/null; then
                  echo "Published release $TAG is missing expected asset: $asset_name" >&2
                  missing=1
                fi
              done
              if [ "$missing" -ne 0 ]; then
                echo "Refusing to overwrite assets on a published release." >&2
                exit 1
              fi
              gh release edit "$TAG" --repo "$REPO" --title "$VERSION" --notes-file release_notes.txt
            fi
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" \
              --title "$VERSION" --notes-file release_notes.txt --verify-tag
          fi

      - name: Summary
        env:
          VER: ${{ steps.version.outputs.version }}
          APK_CHECKSUM: ${{ steps.prepared_checksums.outputs.apk }}
          IPA_CHECKSUM: ${{ steps.prepared_checksums.outputs.ipa }}
          VIDEO_JAR_CHECKSUM: ${{ steps.prepared_checksums.outputs.video_jar }}
          SCREEN_CAPTURE_HELPER_CHECKSUM: ${{ steps.prepared_checksums.outputs.screen_capture_helper }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          S="$GITHUB_STEP_SUMMARY"
          echo "## Release Summary" >> "$S"
          echo "" >> "$S"
          echo "**Version:** v$VER" >> "$S"
          echo "**APK Built:** control-proxy-debug.apk" >> "$S"
          echo "**APK SHA256:** \`$APK_CHECKSUM\`" >> "$S"
          echo "**IPA Built:** control-proxy.ipa" >> "$S"
          echo "**IPA SHA256:** \`$IPA_CHECKSUM\`" >> "$S"
          echo "**video-server jar Built:** automobile-video.jar" >> "$S"
          echo "**video-server jar SHA256:** \`$VIDEO_JAR_CHECKSUM\`" >> "$S"
          echo "**screen-capture-helper Built:** screen-capture-helper-macos-universal.zip" >> "$S"
          echo "**screen-capture-helper SHA256:** \`$SCREEN_CAPTURE_HELPER_CHECKSUM\`" >> "$S"
          echo "" >> "$S"
          echo "### Published Artifacts" >> "$S"
          N="https://www.npmjs.com/package"
          echo "- **npm:** $N/@kaeawc/auto-mobile/v/$VER" >> "$S"
          D="https://hub.docker.com/r/kaeawc"
          echo "- **Docker Hub:** $D/auto-mobile/tags" >> "$S"
          G="https://github.com/$REPO/releases/tag/$TAG"
          echo "- **GitHub Release:** $G" >> "$S"
          M="https://central.sonatype.com/artifact"
          M="$M/dev.jasonpearson.auto-mobile"
          P="auto-mobile-protocol"
          echo "- **Maven Central:** [$P]($M/$P)" >> "$S"
          A="auto-mobile-test-plan-validation"
          echo "- **Maven Central:** [$A]($M/$A)" >> "$S"
          A="auto-mobile-junit-runner"
          echo "- **Maven Central:** [$A]($M/$A)" >> "$S"
          A="auto-mobile-sdk"
          echo "- **Maven Central:** [$A]($M/$A)" >> "$S"
          MCP="https://registry.modelcontextprotocol.io/"
          L="dev.jasonpearson/auto-mobile"
          echo "- **MCP Registry:** [$L]($MCP)" >> "$S"
          echo "" >> "$S"
          echo "### Docker Images" >> "$S"
          echo "\`\`\`" >> "$S"
          echo "docker pull kaeawc/auto-mobile:$VER" >> "$S"
          echo "docker pull kaeawc/auto-mobile:latest" >> "$S"
          echo "\`\`\`" >> "$S"
          echo "" >> "$S"
          echo "### Maven Central" >> "$S"
          echo "\`\`\`kotlin" >> "$S"
          JR="dev.jasonpearson.auto-mobile"
          T="testImplementation(\"$JR:auto-mobile-junit-runner:$VER\")"
          echo "$T" >> "$S"
          I="implementation(\"$JR:auto-mobile-sdk:$VER\")"
          echo "$I" >> "$S"
          echo "\`\`\`" >> "$S"
          echo "" >> "$S"
          echo "### Swift Package Manager" >> "$S"
          echo "\`\`\`swift" >> "$S"
          PKG=".package(url: \"https://github.com/$REPO\", from: \"$VER\")"
          echo "$PKG" >> "$S"
          echo "\`\`\`" >> "$S"
          echo "" >> "$S"
          echo "### Checksums Baked Into Package" >> "$S"
          MSG="The npm package includes APK and IPA checksums at"
          MSG="$MSG build time, ensuring integrity verification."
          echo "$MSG" >> "$S"
