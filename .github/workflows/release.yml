---
name: Release

"on":
  create:
  # prepare-release dispatches this explicitly after pushing the tag. The `create`
  # event above did not fire for CI-pushed tags (see v0.0.42/v0.0.44: the tag push
  # succeeded and no Release run was ever queued), so the tag event alone cannot be
  # relied on to start a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, with no leading v (e.g. 0.0.45)"
        required: true
        type: string

# `create:` is retained as a fallback for a hand-pushed tag, so one tag could in
# principle arrive by both routes. This serializes them; it does NOT dedupe them
# -- with cancel-in-progress false the second run queues and then starts once the
# first finishes. What makes that second run harmless is the already-published.sh
# guard on each non-idempotent publish step, not this block. Both are required.
concurrency:
  group: release-${{ inputs.tag || github.event.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  validate-release-tag:
    name: "Validate Release Tag"
    runs-on: ubuntu-latest
    # workflow_dispatch carries no ref_type; only the create path needs the tag gate.
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'tag'
    outputs:
      is_release_tag: ${{ steps.validate.outputs.is_release_tag }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: "Validate tag format"
        id: validate
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The dispatch must run ON the tag, not merely name it. The Actions UI
          # ref picker defaults to a branch, and prepare-release is not the only
          # caller. docker/metadata-action derives its semver tags from
          # github.ref, so a dispatch from main checks out the right tree and
          # still pushes an image with no version tag -- green, and wrong.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] \
            && { [[ "$REF_TYPE" != "tag" ]] || [[ "$REF_NAME" != "$TAG" ]]; }; then
            echo "Release must be dispatched on tag '$TAG', but this run is on" >&2
            echo "${REF_TYPE} '${REF_NAME}'. Re-run it and pick the tag in the" >&2
            echo "ref dropdown, or let prepare-release dispatch it." >&2
            exit 1
          fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # An explicit dispatch names the tag it wants released, so a format
            # miss is a caller error. Failing beats skipping every publish step
            # and still reporting the run green.
            echo "Refusing to release malformed tag: $TAG (expected 0.0.45, no leading v)" >&2
            exit 1
          fi
          echo "Ignoring non-release tag: $TAG"

  build-ctrl-proxy-ios-ipa:
    needs: validate-release-tag
    if: needs.validate-release-tag.outputs.is_release_tag == 'true'
    uses: ./.github/workflows/build-ctrl-proxy-ios-ipa.yml

  build-control-proxy-apk:
    needs: validate-release-tag
    if: needs.validate-release-tag.outputs.is_release_tag == 'true'
    uses: ./.github/workflows/build-control-proxy-apk.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

  build-video-server-jar:
    needs: validate-release-tag
    if: needs.validate-release-tag.outputs.is_release_tag == 'true'
    # No verify-reproducible here: the verify-and-release job already re-verifies
    # the release-built jar against the registry sha minted by prepare-release on a
    # different runner — a stronger cross-run reproducibility check than an in-job
    # double-build. The double-build runs once, at mint time (prepare-release).
    uses: ./.github/workflows/build-video-server-jar.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  verify-and-release:
    if: needs.validate-release-tag.outputs.is_release_tag == 'true'
    runs-on: ubuntu-latest
    needs:
      - validate-release-tag
      - build-ctrl-proxy-ios-ipa
      - build-control-proxy-apk
      - build-video-server-jar

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0
          ref: refs/tags/${{ needs.validate-release-tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Ensure npm CLI is 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          VERSION="$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "Download CtrlProxy APK"
        uses: actions/download-artifact@v7
        with:
          name: control-proxy-apk
          path: /tmp

      - name: "Download CtrlProxy iOS IPA"
        uses: actions/download-artifact@v7
        with:
          name: ctrl-proxy-ios-ipa
          path: /tmp

      - name: "Download video-server jar"
        uses: actions/download-artifact@v7
        with:
          name: video-server-jar
          path: /tmp

      - name: "Verify APK SHA256 matches source"
        id: verify_checksum
        run: |
          bash scripts/ci/verify-artifact-sha256.sh \
            /tmp/control-proxy-debug.apk android | tee /tmp/apk-verify.log
          CHECKSUM=$(grep '^checksum=' /tmp/apk-verify.log | cut -d= -f2)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: "Verify CtrlProxy iOS IPA SHA256 matches source"
        id: verify_ipa_checksum
        run: |
          bash scripts/ci/verify-artifact-sha256.sh \
            /tmp/control-proxy.ipa ios | tee /tmp/ipa-verify.log
          CHECKSUM=$(grep '^checksum=' /tmp/ipa-verify.log | cut -d= -f2)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: "Verify video-server jar SHA256 matches source"
        id: verify_video_jar_checksum
        run: |
          bash scripts/ci/verify-artifact-sha256.sh \
            /tmp/automobile-video.jar videojar | tee /tmp/videojar-verify.log
          CHECKSUM=$(grep '^checksum=' /tmp/videojar-verify.log | cut -d= -f2)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Generate release constants
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          APK_SHA256_CHECKSUM: ${{ steps.verify_checksum.outputs.checksum }}
          IOS_CTRL_PROXY_SHA256_CHECKSUM:
            ${{ steps.verify_ipa_checksum.outputs.checksum }}
          IOS_CTRL_PROXY_RUNNER_SHA256:
            ${{ needs.build-ctrl-proxy-ios-ipa.outputs.runner_sha256 }}
          VIDEO_JAR_SHA256:
            ${{ steps.verify_video_jar_checksum.outputs.checksum }}
        run: bash scripts/generate-release-constants.sh

      - name: Verify release integrity
        run: >
          bash scripts/ci/verify-release-integrity.sh
          "${{ steps.version.outputs.version }}"
          /tmp/control-proxy.ipa

      - name: Run tests
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run test --output-logs=errors-only

      - name: Run lint
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run lint --output-logs=errors-only

      - name: Build TypeScript with injected checksum
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run build --force --output-logs=errors-only

      - name: Run Bun MCP startup smoke
        run: bun run test:startup:bun

      - name: Run Bun image runtime smoke
        run: bun run test:image:bun

      - name: Create release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract changelog for this version if it exists
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v version="$VERSION" '
              $0 ~ "^## \\[v?"version"\\]" {in_section=1; next}
              in_section && $0 ~ "^## \\[" {exit}
              in_section {print}
            ' CHANGELOG.md | sed '/^$/d')
            if [ -z "$NOTES" ]; then
              NOTES="Release v${VERSION}"
            fi
          else
            NOTES="Release v${VERSION}"
          fi

          # Add checksum to notes
          APK_CHECKSUM="${{ steps.verify_checksum.outputs.checksum }}"
          IPA_CHECKSUM="${{ steps.verify_ipa_checksum.outputs.checksum }}"
          VIDEO_JAR_CHECKSUM="${{ steps.verify_video_jar_checksum.outputs.checksum }}"
          NOTES="${NOTES}"$'\n\n'"## CtrlProxy APK"$'\n\n'\
            '"**SHA256 Checksum:** \`${APK_CHECKSUM}\`"$'\n\n'\
            '"Download the APK from the release assets below."
          NOTES="${NOTES}"$'\n\n'"## CtrlProxy iOS IPA"$'\n\n'\
            '"**SHA256 Checksum:** \`${IPA_CHECKSUM}\`"$'\n\n'\
            '"Download the IPA from the release assets below."
          NOTES="${NOTES}"$'\n\n'"## video-server jar"$'\n\n'\
            '"**SHA256 Checksum:** \`${VIDEO_JAR_CHECKSUM}\`"$'\n\n'\
            '"Download automobile-video.jar from the release assets below."

          # Save to file for GitHub release
          echo "$NOTES" > release_notes.txt

          # Also output for later steps
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # npm publish is not idempotent: without this, a failure anywhere later
          # in the job makes the whole release unrerunnable.
          #
          # Assign first, then test. Under set -e a failing command substitution
          # inside an `if` condition does NOT abort, so testing it inline would
          # turn the guard's fail-closed error into a silent "not published".
          state=$(scripts/release/already-published.sh npm "$VERSION")
          if [ "$state" = published ]; then
            echo "npm already has $VERSION; skipping publish"
            exit 0
          fi
          npm publish --provenance --access public

      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/update-brew-formula.sh

      - name: Install mcp-publisher
        run: |
          URL="https://github.com/modelcontextprotocol/registry"
          URL="$URL/releases/latest/download"
          URL="$URL/mcp-publisher_linux_amd64.tar.gz"
          curl -L "$URL" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Assign first, then test — see the npm step for why.
          state=$(scripts/release/already-published.sh mcp "$VERSION")
          if [ "$state" = published ]; then
            echo "MCP Registry already has $VERSION; skipping publish"
            exit 0
          fi
          ./mcp-publisher login dns --domain jasonpearson.dev \
            --private-key "${{ secrets.MCP_DNS_PRIVATE_KEY }}"
          ./mcp-publisher publish

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup Release Keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | \
            base64 -d > android/keystore/release.keystore

      - name: Publish Android Libraries to Maven Central
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername:
            ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword:
            ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey:
            ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:
            ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId:
            ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          RELEASE_KEYSTORE_PATH: keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD:
            ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A duplicate GAV is rejected, so a rerun would die here. The guard
          # fails closed on a partial publish rather than choosing for us.
          # Assign first, then test — see the npm step for why.
          state=$(scripts/release/already-published.sh maven "$VERSION")
          if [ "$state" = published ]; then
            echo "Maven Central already has $VERSION; skipping publish"
            exit 0
          fi
          cd android
          # Override VERSION_NAME with release version from git tag
          # (not SNAPSHOT in gradle.properties)
          # Publish dependency modules first — separate invocation
          # guarantees completion before consumer modules
          ./gradlew :protocol:publish :test-plan-validation:publish \
            -PVERSION_NAME=${{ steps.version.outputs.version }} \
            --no-configuration-cache
          ./gradlew :junit-runner:publish :auto-mobile-sdk:publish \
            -PVERSION_NAME=${{ steps.version.outputs.version }} \
            --no-configuration-cache

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true      # ~14 GB
          remove_dotnet: true       # ~2.7 GB
          remove_haskell: true      # Minimal
          remove_tool_cache: false  # Keep Node.js, need it
          remove_swap: true         # ~4 GB
          remove_codeql: true       # ~5.9 GB CodeQL separate
          use_rmz: true            # 3x faster deletion

      - name: Clean up Docker
        run: docker system prune -af --volumes

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: kaeawc/auto-mobile
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit, not derived from github.ref. The action throws "GitHub
          # Releases requires a tag" on a non-tag ref, and this step runs after
          # npm/Homebrew/MCP/Maven/Docker have already published irreversibly.
          tag_name: ${{ needs.validate-release-tag.outputs.tag }}
          name: AutoMobile v${{ steps.version.outputs.version }}
          body_path: release_notes.txt
          files: |
            /tmp/control-proxy-debug.apk
            /tmp/control-proxy.ipa
            /tmp/automobile-video.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          VER: ${{ steps.version.outputs.version }}
          APK_CHECKSUM: ${{ steps.verify_checksum.outputs.checksum }}
          IPA_CHECKSUM: ${{ steps.verify_ipa_checksum.outputs.checksum }}
          VIDEO_JAR_CHECKSUM: ${{ steps.verify_video_jar_checksum.outputs.checksum }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          S="$GITHUB_STEP_SUMMARY"
          echo "## Release Summary" >> "$S"
          echo "" >> "$S"
          echo "**Version:** v$VER" >> "$S"
          echo "**APK Built:** control-proxy-debug.apk" >> "$S"
          echo "**APK SHA256:** \`$APK_CHECKSUM\`" >> "$S"
          echo "**IPA Built:** control-proxy.ipa" >> "$S"
          echo "**IPA SHA256:** \`$IPA_CHECKSUM\`" >> "$S"
          echo "**video-server jar Built:** automobile-video.jar" >> "$S"
          echo "**video-server jar SHA256:** \`$VIDEO_JAR_CHECKSUM\`" >> "$S"
          echo "" >> "$S"
          echo "### Published Artifacts" >> "$S"
          N="https://www.npmjs.com/package"
          echo "- **npm:** $N/@kaeawc/auto-mobile/v/$VER" >> "$S"
          D="https://hub.docker.com/r/kaeawc"
          echo "- **Docker Hub:** $D/auto-mobile/tags" >> "$S"
          G="https://github.com/$REPO/releases/tag/$TAG"
          echo "- **GitHub Release:** $G" >> "$S"
          M="https://central.sonatype.com/artifact"
          M="$M/dev.jasonpearson.auto-mobile"
          P="auto-mobile-protocol"
          echo "- **Maven Central:** [$P]($M/$P)" >> "$S"
          A="auto-mobile-test-plan-validation"
          echo "- **Maven Central:** [$A]($M/$A)" >> "$S"
          A="auto-mobile-junit-runner"
          echo "- **Maven Central:** [$A]($M/$A)" >> "$S"
          A="auto-mobile-sdk"
          echo "- **Maven Central:** [$A]($M/$A)" >> "$S"
          MCP="https://registry.modelcontextprotocol.io/"
          L="dev.jasonpearson/auto-mobile"
          echo "- **MCP Registry:** [$L]($MCP)" >> "$S"
          echo "" >> "$S"
          echo "### Docker Images" >> "$S"
          echo "\`\`\`" >> "$S"
          echo "docker pull kaeawc/auto-mobile:$VER" >> "$S"
          echo "docker pull kaeawc/auto-mobile:latest" >> "$S"
          echo "\`\`\`" >> "$S"
          echo "" >> "$S"
          echo "### Maven Central" >> "$S"
          echo "\`\`\`kotlin" >> "$S"
          JR="dev.jasonpearson.auto-mobile"
          T="testImplementation(\"$JR:auto-mobile-junit-runner:$VER\")"
          echo "$T" >> "$S"
          I="implementation(\"$JR:auto-mobile-sdk:$VER\")"
          echo "$I" >> "$S"
          echo "\`\`\`" >> "$S"
          echo "" >> "$S"
          echo "### Swift Package Manager" >> "$S"
          echo "\`\`\`swift" >> "$S"
          PKG=".package(url: \"https://github.com/$REPO\", from: \"$VER\")"
          echo "$PKG" >> "$S"
          echo "\`\`\`" >> "$S"
          echo "" >> "$S"
          echo "### Checksums Baked Into Package" >> "$S"
          MSG="The npm package includes APK and IPA checksums at"
          MSG="$MSG build time, ensuring integrity verification."
          echo "$MSG" >> "$S"
