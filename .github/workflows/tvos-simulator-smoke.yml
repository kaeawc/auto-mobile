name: "tvOS Simulator Smoke (Advisory)"

# Advisory, never required, and not in the green-main ruleset.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  tvos-smoke-advisory:
    name: "tvOS Router Smoke (Advisory)"
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-tvos-sim'
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
      - name: "Select Xcode 27.2"
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "27.2"
      # The smoke picks the newest installed tvOS runtime; fetch the one matching the
      # selected SDK when the image does not carry it.
      - name: "Ensure tvOS runtime"
        run: |
          sdk_version="$(xcrun --sdk appletvsimulator --show-sdk-version)"
          has_runtime() {
            xcrun simctl list runtimes available tvOS --json |
              jq -e --arg version "${sdk_version}" \
                'any(.runtimes[]; .isAvailable != false and .version == $version)'
          }
          if ! has_runtime; then
            xcodebuild -downloadPlatform tvOS
          fi
          has_runtime
      - name: "Run advisory tvOS smoke"
        env:
          TVOS_SMOKE_LOG_DIR: "${{ github.workspace }}/scratch/tvos-smoke"
        run: bash scripts/ios/tvos-smoke-advisory.sh
      - name: "Upload tvOS smoke logs"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tvos-smoke-logs
          path: scratch/tvos-smoke/
          if-no-files-found: ignore
