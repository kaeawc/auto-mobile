name: "tvOS Simulator Smoke (Advisory)"

# Advisory, never required, and not in the green-main ruleset.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  tvos-smoke-advisory:
    name: "tvOS Router Smoke (Advisory)"
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-tvos-sim'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"
      - name: "Run advisory tvOS smoke"
        env:
          TVOS_SMOKE_LOG_DIR: "${{ github.workspace }}/scratch/tvos-smoke"
        run: bash scripts/ios/tvos-smoke-advisory.sh
      - name: "Upload tvOS smoke logs"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tvos-smoke-logs
          path: scratch/tvos-smoke/
          if-no-files-found: ignore
