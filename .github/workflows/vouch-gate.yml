name: "Vouch Gate"

# Gates issues/PRs from non-contributors using the vouch web-of-trust.
#
# Opt-in: this workflow is inert until the repository variable
# VOUCH_GATE_ENABLED is set to "true" (Settings → Secrets and variables →
# Actions → Variables). It defaults to ADVISORY mode (label + guidance comment,
# never closes). Set the VOUCH_ENFORCE variable to "true" to close gated
# issues/PRs. Seed the trust graph first (see docs/design-docs/vouch-system.md),
# starting with the repo owner as a `founder`.
#
# `pull_request_target` runs in the context of the base repo so forked PRs can be
# gated and the trust graph (a base-repo file) can be read/written. It does NOT
# check out or run untrusted PR code — only the event payload is read.

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write

concurrency:
  # Serialize graph mutations so concurrent events don't clobber the committed file.
  group: vouch-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    name: "Evaluate vouch gate"
    runs-on: ubuntu-latest
    if: ${{ vars.VOUCH_GATE_ENABLED == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          # Persist credentials so the graph commit-back can push.
          persist-credentials: true

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: "Install dependencies"
        run: bun install --frozen-lockfile

      - name: "Run vouch gate"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOUCH_ENFORCE: ${{ vars.VOUCH_ENFORCE }}
        run: bun run scripts/github/vouch-gate.ts

      - name: "Commit trust graph changes"
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain .github/vouch/graph.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/vouch/graph.json
            git commit -m "chore(vouch): update trust graph [skip ci]"
            git push
          fi
