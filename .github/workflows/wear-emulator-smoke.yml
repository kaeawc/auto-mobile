name: "Wear OS Emulator Smoke (Advisory)"

# Advisory nightly Wear OS emulator lane (#16829). Not in the green-main ruleset and nothing
# depends on it. Runs nightly, on dispatch, and on a pull request only when labelled `run-wear`.
# Uses the x86_64 API 37 `android-wear-signed` image on the round `wearos_small_round` profile.
# startDevice createIfMissing creates the round watch AVD (#16823); WEAR_SMOKE_CREATE_VIA=avdmanager
# is the fallback. The plan drives the Wear fixture app at android/wear-fixture (#16828), including
# a notification action through watch systemTray (#16826).

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      break-assertion:
        description: "Swap in an impossible assertion to check the failure summary"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'run-wear') && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  wear-emulator-smoke:
    name: "Wear OS Emulator Smoke (Advisory)"
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'kaeawc/auto-mobile') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-wear') && (github.event.action != 'labeled' || github.event.label.name == 'run-wear'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Free disk space for emulator"
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: "Enable KVM group perms"
        uses: ./.github/actions/enable-kvm

      # The fixture app builds with the project's Java 21 toolchain.
      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: "Ensure Android emulator SDK"
        run: bash scripts/android/ensure-emulator-sdk.sh

      - name: "Install emulator runtime libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64 libgl1 libnss3 libxkbfile1 libx11-xcb1

      - uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Run Wear OS smoke"
        env:
          WEAR_SMOKE_OUT_DIR: "${{ github.workspace }}/scratch/wear-smoke"
          WEAR_SMOKE_BREAK_ASSERTION: "${{ inputs.break-assertion && '1' || '0' }}"
        run: bash scripts/ci/wear-smoke/run-wear-smoke.sh

      - name: "Upload Wear OS smoke artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wear-emulator-smoke
          path: |
            scratch/wear-smoke/
            !scratch/wear-smoke/db/
          if-no-files-found: warn
          retention-days: 14
