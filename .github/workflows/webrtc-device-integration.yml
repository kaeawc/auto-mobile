name: "WebRTC Device Integration"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      platform:
        description: "Device lane to run for diagnosis"
        required: true
        default: "all"
        type: choice
        options: [all, android, ios]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-webrtc-changes:
    name: "Detect WebRTC Device-Coverage Changes"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.webrtc }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            webrtc:
              - 'src/features/webrtc/**'
              - 'src/features/screen-stream/**'
              - 'android/video-server/**'
              - 'ios/screen-capture/**'
              - 'src/server/webrtcStreamManager.ts'
              - 'src/daemon/webrtcStream*'
              - 'src/daemon/videoStreamSocket*'
              - 'src/daemon/videoStreamFraming.ts'
              - 'src/daemon/daemonFiles.ts'
              - 'src/daemon/socketServer/**'
              - 'examples/mediamtx/**'
              - 'scripts/webrtc/**'
              - 'test/integration/webrtcDeviceCapture.integration.test.ts'
              - 'test/helpers/captureStageTimeline.ts'
              - '.github/workflows/webrtc-device-integration.yml'

  android-device-webrtc:
    name: "Android Device Capture to WHEP"
    needs: detect-webrtc-changes
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android')) ||
      (github.event_name != 'workflow_dispatch' && (needs.detect-webrtc-changes.outputs.should_run == 'true' || contains(github.event.pull_request.labels.*.name, 'webrtc')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: ./.github/actions/setup-auto-mobile-npm-package
      - name: "Build CtrlProxy APK"
        uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":control-proxy:assembleDebug"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: "Build video-server jar"
        uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":video-server:d8Dex"
          gradle-project-directory: "android"
          gradle-home-directory: "~/.gradle/${{ github.job }}"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: "Install Chrome for WHEP decoding"
        run: |
          sudo apt-get update
          sudo apt-get install --yes google-chrome-stable || sudo apt-get install --yes chromium-browser
      - uses: ./.github/actions/android-emulator
        with:
          script: |
            cd "$GITHUB_WORKSPACE"
            AUTOMOBILE_WEBRTC_DEVICE_INTEGRATION=1 \
            AUTOMOBILE_WEBRTC_DEVICE_PLATFORM=android \
            AUTOMOBILE_ANDROID_H264_DEVICE_ID=emulator-5554 \
            AUTOMOBILE_VIDEO_SERVER_JAR="$GITHUB_WORKSPACE/android/video-server/build/libs/automobile-video.jar" \
            AUTOMOBILE_REQUIRE_VIDEO_SERVER=1 \
              bun run test:integration:webrtc-device
          working-directory: "./android/"
          accessibility-apk-path: control-proxy/build/outputs/apk/debug/control-proxy-debug.apk
      # Print the legend for reading result.txt / stage-latency.json and the
      # benign chrome.log/mediamtx.log ERROR lines (#4308). if: always() so it
      # is there for failed runs too, when it is most needed.
      - name: "Explain WebRTC device results"
        if: always()
        # Diagnostic-only: a failure here must never redden a green capture lane,
        # same as the upload step below.
        continue-on-error: true
        run: bash scripts/webrtc/explain-device-results.sh android
      # Always keep the stage-latency record (#4343): p50/p95 baselines need the
      # passing runs too. continue-on-error keeps a missing or failed upload from
      # turning a green capture lane red.
      - name: "Upload WebRTC device artifacts"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: android-webrtc-device-artifacts-${{ github.run_attempt }}
          path: scratch/webrtc-device-integration/
          if-no-files-found: ignore
          retention-days: 7

  ios-device-webrtc:
    name: "iOS Device Capture to WHEP"
    needs: detect-webrtc-changes
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios')) ||
      (github.event_name != 'workflow_dispatch' && (needs.detect-webrtc-changes.outputs.should_run == 'true' || contains(github.event.pull_request.labels.*.name, 'webrtc')))
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: ./.github/actions/setup-auto-mobile-npm-package
      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime
      - name: "Build iOS capture prerequisites"
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" || brew install --cask google-chrome
          (cd ios/screen-capture && swift build)
      - name: "Boot and activate iOS Simulator"
        run: |
          # 600000ms matches the Android product-boot budget and the sibling
          # CtrlProxy boot: the shared deadline must cover a cold `bootstatus -b`
          # plus the in-process erase-and-reboot recovery on a loaded runner.
          result="$(bun run src/index.ts --boot-device --platform ios --create-if-missing --timeout-ms 600000)"
          simulator_udid="$(printf '%s' "${result}" | jq -r '.deviceId')"
          if [[ -z "${simulator_udid}" || "${simulator_udid}" == "null" ]]; then
            echo "::error::AutoMobile product boot returned no deviceId." >&2
            exit 1
          fi
          # The capture source is a ScreenCaptureKit stream of Simulator.app's
          # window, not the booted runtime alone. Product boot intentionally
          # avoids opening the GUI; CI needs it visible before the first frame.
          if pgrep -x Simulator >/dev/null; then
            killall Simulator
            for _ in {1..30}; do
              pgrep -x Simulator >/dev/null || break
              sleep 1
            done
            if pgrep -x Simulator >/dev/null; then
              echo "::error::Simulator.app did not exit before activation." >&2
              exit 1
            fi
          fi
          open -a Simulator --args -CurrentDeviceUDID "${simulator_udid}"
          helper_path="${GITHUB_WORKSPACE}/ios/screen-capture/.build/debug/screen-capture-helper"
          simulator_name="$(xcrun simctl list devices --json | jq -r --arg udid "${simulator_udid}" \
            '[.devices[][] | select(.udid == $udid) | .name] | first // empty')"
          if [[ -z "${simulator_name}" ]]; then
            echo "::error::Could not resolve the selected Simulator name." >&2
            exit 1
          fi
          simulator_window_ready=0
          for _ in {1..30}; do
            simulator_windows="$("${helper_path}" --list-simulators 2>/dev/null || true)"
            if printf '%s' "${simulator_windows}" | jq -e --arg name "${simulator_name}" \
              '.windows | map(select((.title // "") | ascii_downcase | contains($name | ascii_downcase))) | length == 1' \
              >/dev/null; then
              simulator_window_ready=1
              break
            fi
            sleep 1
          done
          if [[ "${simulator_window_ready}" != "1" ]]; then
            echo "::error::Selected Simulator window did not become discoverable by ScreenCaptureKit." >&2
            exit 1
          fi
      - name: "Run iOS device capture integration"
        env:
          AUTOMOBILE_WEBRTC_DEVICE_INTEGRATION: "1"
          AUTOMOBILE_WEBRTC_DEVICE_PLATFORM: ios
          # The checked-out Swift package is a CI development fixture. Production
          # installs resolve only the signed helper from GitHub Releases.
          AUTOMOBILE_IOS_SCREEN_CAPTURE_HELPER: ${{ github.workspace }}/ios/screen-capture/.build/debug/screen-capture-helper
          # ScreenCaptureKit window enumeration on this hosted macos-26 runner
          # intermittently exceeds the 2s production default even though the boot
          # step already confirmed the window is discoverable, so give the daemon
          # (spawned by the test) a generous resolution budget. Well under the 45s
          # stream-request timeout; the fast path is unaffected.
          AUTOMOBILE_IOS_SIMULATOR_WINDOW_TIMEOUT_MS: "15000"
        # Belt-and-suspenders lane retry (2 attempts) layered on top of #5245's
        # fixes. The one remaining GENUINE flake is intermittent: at capture start
        # the daemon resolves the Simulator window via ScreenCaptureKit, which under
        # macos-26 runner load can occasionally exceed even the 15s budget above and
        # time out. A single transient miss should not redden the lane, so a second
        # attempt runs before failing.
        #
        # The env block above is on the step, so it applies to BOTH attempts. The
        # booted+activated Simulator from the prior "Boot and activate" step stays up
        # across attempts and is deliberately NOT touched here.
        #
        # Attempt 2 runs ONLY after reaping attempt 1's processes. The test's own
        # finally-block teardown stops MediaMTX and the daemon, but bun SKIPS that
        # finally when a test-body deadline fires (exactly this timeout flake), which
        # would leave MediaMTX bound to 8889 and the daemon subprocess alive and make
        # a naive retry fail deterministically on a port/socket conflict.
        run: |
          set -uo pipefail

          reap_before_retry() {
            # AutoMobile daemon subprocess: DaemonLauncher spawns it as
            # `<bun> dist/src/index.js --daemon-mode`; nothing else carries that flag.
            pkill -f "index.js --daemon-mode" 2>/dev/null || true
            # MediaMTX SFU — binds the WHIP/WHEP port 8889 the next attempt needs free.
            pkill -x mediamtx 2>/dev/null || true
            # Headless Chrome WHEP reader — binds the fixed CDP debug port 9222.
            pkill -f "remote-debugging-port=9222" 2>/dev/null || true
            # Give SIGTERM a moment, then hard-kill any straggler still holding a port.
            sleep 2
            pkill -KILL -x mediamtx 2>/dev/null || true
            pkill -KILL -f "index.js --daemon-mode" 2>/dev/null || true
            # Confirm 8889 is actually free before retrying; wait for the kernel to
            # release the listener. A retry into a still-bound port is worse than no
            # retry, so abort the retry (fail the step) rather than guarantee a
            # second failure.
            for _ in $(seq 1 15); do
              lsof -nP -iTCP:8889 -sTCP:LISTEN >/dev/null 2>&1 || return 0
              sleep 1
            done
            echo "::error::Port 8889 still bound after cleanup; skipping retry to avoid a guaranteed conflict." >&2
            return 1
          }

          attempts=2
          for attempt in $(seq 1 "${attempts}"); do
            echo "::group::iOS device capture integration (attempt ${attempt}/${attempts})"
            bun run test:integration:webrtc-device && rc=0 || rc=$?
            echo "::endgroup::"
            if [ "${rc}" -eq 0 ]; then
              if [ "${attempt}" -gt 1 ]; then
                echo "iOS device capture passed on retry (transient macos-26 ScreenCaptureKit flake)."
              fi
              exit 0
            fi
            echo "iOS device capture attempt ${attempt} failed (exit ${rc})."
            if [ "${attempt}" -lt "${attempts}" ]; then
              echo "Reaping MediaMTX / daemon / Chrome before one retry."
              reap_before_retry || exit 1
            fi
          done
          echo "iOS device capture failed after ${attempts} attempts."
          exit 1
      # Print the legend for reading result.txt / stage-latency.json and the
      # benign chrome.log/mediamtx.log ERROR lines (#4308). if: always() so it
      # is there for failed runs too, when it is most needed.
      - name: "Explain WebRTC device results"
        if: always()
        # Diagnostic-only: a failure here must never redden a green capture lane,
        # same as the upload step below.
        continue-on-error: true
        run: bash scripts/webrtc/explain-device-results.sh ios
      # Always keep the stage-latency record (#4343): p50/p95 baselines need the
      # passing runs too. continue-on-error keeps a missing or failed upload from
      # turning a green capture lane red.
      - name: "Upload WebRTC device artifacts"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ios-webrtc-device-artifacts-${{ github.run_attempt }}
          path: scratch/webrtc-device-integration/
          if-no-files-found: ignore
          retention-days: 7
