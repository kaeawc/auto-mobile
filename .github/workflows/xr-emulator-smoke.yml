name: "Android XR Emulator Smoke (Advisory)"

# Advisory nightly Android XR headset emulator smoke. It is not a required check. Runs nightly,
# on dispatch, and on a pull request only when labelled `run-xr`; it uses startDevice
# createIfMissing to exercise headset AVD provisioning.

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      break-assertion:
        description: "Swap in an impossible assertion to check the failure summary"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'run-xr') && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  xr-emulator-smoke:
    name: "Android XR Emulator Smoke (Advisory)"
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'kaeawc/auto-mobile') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-xr') && (github.event.action != 'labeled' || github.event.label.name == 'run-xr'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: "Free disk space for emulator"
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: "Enable KVM group perms"
        uses: ./.github/actions/enable-kvm

      # The smoke builds a debug CtrlProxy APK with the project's Java 21 toolchain.
      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: "Ensure Android emulator SDK"
        run: bash scripts/android/ensure-emulator-sdk.sh

      - name: "Install emulator runtime libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64 libgl1 libnss3 libxkbfile1 libx11-xcb1

      - uses: ./.github/actions/setup-auto-mobile-npm-package
        with:
          install-global: "false"

      - name: "Run XR smoke"
        env:
          XR_SMOKE_OUT_DIR: "${{ github.workspace }}/scratch/xr-smoke"
          XR_SMOKE_BREAK_ASSERTION: "${{ inputs.break-assertion && '1' || '0' }}"
        run: bash scripts/ci/xr-smoke/run-xr-smoke.sh

      - name: "Upload XR smoke artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xr-emulator-smoke
          path: |
            scratch/xr-smoke/
            !scratch/xr-smoke/db/
            !scratch/xr-smoke/daemon/
          if-no-files-found: warn
          retention-days: 14
