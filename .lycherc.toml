# Lychee link checker configuration
# https://lychee.cli.rs/

# Maximum number of concurrent network requests
max_concurrency = 10

# Exclude URL patterns (regex)
exclude = [
  # Ignore common localhost URLs
  "^http://localhost",
  "^http://127\\.0\\.0\\.1",
  # Ignore example domains
  "^https?://example\\.com",
  # Ignore links to private fork repos (issues may not be publicly accessible)
  "^https://github\\.com/jasonpearson/",
  # Docker Hub returns transient 500s that fail link checks
  "^https://hub\\.docker\\.com/",
  # WebAIM contrast checker has unreliable uptime / timeouts in CI
  "^https://webaim\\.org/",
  # Contributor Covenant intermittently resets CI connections; exclude every
  # path under the host (the /faq page reset On Merge run 32703978446, #5622),
  # not just the root and /translations pages that the old narrow patterns
  # covered.
  "^https://www\\.contributor-covenant\\.org/",
  # Self-referential github.com/kaeawc/auto-mobile issue and PR links (mostly
  # cited in CHANGELOG.md, in the hundreds) are internal references we fully
  # control — the issue/PR number only ever exists because we created it.
  # #5622 recurred TWICE after retry/backoff (max_retries + retry_wait_time,
  # below) were already in effect: runs 33010560252 and 33032939183, both on
  # commits after the first hardening pass merged, each still exited 2 with
  # 20 [TIMEOUT]s (0 real errors), all against this exact URL shape — GitHub's
  # API/HTTP rate limit under bulk lookups is not something client-side
  # retries can outrun. Treat these as guaranteed-valid instead of
  # round-tripping the network for them. Real (non-self-referential) links,
  # including links to other repos' issues/PRs, are unaffected and still
  # checked.
  "^https://github\\.com/kaeawc/auto-mobile/(issues|pull)/[0-9]+([#?].*)?$",
]

# Exclude specific input paths. These are regexes matched against each input
# file path exactly as lychee walks it (e.g. `docs/index.md`, `./README.md`), so
# anchor every pattern: an unanchored `site/` also matched any directory whose
# name merely ends in "site" and silently dropped the whole built-site pass.
exclude_path = [
  # Build artifacts
  "^(\\./)?(site|build|dist)/",
  # Dependencies and VCS metadata at any depth
  "(^|/)node_modules/",
  "(^|/)\\.git/",
  # Redirect shims target MkDocs' generated directory URLs (`../foo/`), which do
  # not exist in the source tree. validate_lychee.sh checks the built copies of
  # these pages (targets and fragments) in its offline built-site pass instead.
  "^docs/design-docs/mcp/tool-registration/index\\.html$",
  "^docs/install/index\\.html$",
  "^docs/metrics/downloads/index\\.html$",
  "^docs/using/a11y/index\\.html$",
  "^docs/using/talkback/index\\.html$",
  "^docs/using/tool-capabilities/index\\.html$",
  "^docs/using/voiceover/index\\.html$",
]

# `#fragment` anchors are verified too, but via the bare `--include-fragments`
# CLI flag in scripts/lychee/validate_lychee.sh rather than a key here: the key
# is a bool in lychee 0.22 (the CI pin) and an enum string in 0.24+, so no single
# value loads in both, while the bare flag means "check anchors" in each.

# Check links inside code/verbatim blocks too. MkDocs content tabs (`=== "..."`)
# and admonitions indent their bodies four spaces, which CommonMark parses as an
# indented code block, so without this every link inside a tab (the install GIF,
# desktop download buttons, agent-example GIFs, ui-tests source links) is
# skipped. Placeholder hosts in real code samples are covered by `exclude`.
include_verbatim = true

# Accept status codes
accept = [
  "200..=299", # 2xx success
  "403", # Forbidden (auth-protected URLs like console.anthropic.com)
  "429", # Too Many Requests (common for rate-limited APIs)
  "500", # Internal Server Error (transient GitHub/CDN errors)
  "502", # Bad Gateway (transient GitHub/CDN errors)
  "503", # Service Unavailable (temporary for Anthropic URLs under load)
]

# Timeout for each request in seconds. Raised from 20 to give slow, rate-limited
# responses (e.g. github.com's own issue URLs) headroom before they time out and
# redden the merge workflow (#5622).
timeout = 30

# Number of retries per link
max_retries = 3

# Minimum wait (seconds) between retries. Without a backoff, max_retries fires
# immediately against a rate-limited/slow endpoint and still fails; the wait lets
# a transient timeout or connection reset recover before the final verdict
# (#5622).
retry_wait_time = 2

# HTTP method to use for checking links
method = "get"

# User agent string
user_agent = "Mozilla/5.0 (compatible; lychee/AutoMobile)"

# Cache results to speed up repeated checks
cache = true

# Verbose output level: "error", "warn", "info", "debug", or "trace"
# verbose = "warn"

# Base URL for relative links (useful for local docs)
# base = "https://kaeawc.github.io/auto-mobile/"
