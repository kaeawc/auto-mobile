# SwiftLint Configuration
# https://github.com/realm/SwiftLint

# Paths to lint
included:
  - ios

# Paths to exclude
excluded:
  - ios/**/build
  - ios/**/DerivedData
  - ios/**/.build
  - ios/**/Pods
  - ios/**/Carthage
  - ios/**/.swiftpm

# Disable rules that overlap with SwiftFormat (formatting is handled by SwiftFormat)
disabled_rules:
  # Formatting rules (handled by SwiftFormat)
  - opening_brace
  - closing_brace
  - colon
  - comma
  - leading_whitespace
  - trailing_whitespace
  - trailing_newline
  - trailing_semicolon
  - statement_position
  - return_arrow_whitespace
  - vertical_whitespace
  - void_return
  - sorted_imports
  - closure_spacing
  - trailing_comma # SwiftFormat uses --commas always

  # Optional rules we don't want to enforce
  - line_length # SwiftFormat handles line wrapping
  - file_length # Can be overly restrictive for valid large files
  - type_body_length # Can be overly restrictive
  - function_body_length # Can be overly restrictive
  - function_parameter_count # Some APIs legitimately need many parameters

# Opt-in rules (not enabled by default)
# Only enable rules that add clear value without being too noisy
opt_in_rules:
  - array_init
  - closure_end_indentation
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_none_name
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - overridden_super_call
  - override_in_extension
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

# Rule configurations

# Force-unwrap (`!`) on a possibly-nil value is a whole bug class we burned down in
# 2026-07 (e.g. the Kotlin `mcpResponse.result!!` NPE, #3607). CI runs SwiftLint
# non-strict, so a default `warning` would be ignored — make it an error so a new
# force-unwrap fails the SwiftLint job at author time. The handful of provably-safe
# pre-existing unwraps (hardcoded URLs, ASCII UTF-8, just-inserted dictionary keys,
# non-empty-buffer base addresses) carry a `// swiftlint:disable:this force_unwrapping`
# with a one-line justification; test targets disable it file-wide (fail-fast on bad
# fixtures is idiomatic there).
force_unwrapping:
  severity: error

# Declarative-style semantic rules. These are already opt-in above and each has a
# single obvious functional rewrite (map/Array(seq)/reduce(into:)/first(where:)/
# for-where/isEmpty). CI runs SwiftLint non-strict, so a default `warning` is
# ignored — promote them to `error` so a new imperative accumulator fails the
# SwiftLint job at author time. The whole existing tree was already clean of these
# (the four pre-existing hits were fixed in the same change that added this block).
# The noisier `contains_over_*` family is deliberately left at `warning`: it false-
# positives on `Data.range(of:)` (Data has no subsequence `contains(_:)`).
for_where:
  severity: error
array_init:
  severity: error
reduce_into:
  severity: error
first_where:
  severity: error
empty_count:
  severity: error
empty_string:
  severity: error
empty_collection_literal:
  severity: error

identifier_name:
  min_length:
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - n
    - ip
    - fd
    - ws
    - lhs
    - rhs
    - x1
    - y1
    - x2
    - y2

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID

nesting:
  type_level: 2
  function_level: 3

# Readability signal, enabled warning-only for now. The goal (per the imperative-
# patterns exploration) is to *measure* the complexity baseline before deciding
# whether to tighten — not to force-refactor legitimate dispatch switches. CI runs
# SwiftLint non-strict so warnings never block; the `error` threshold is set out of
# reach (highest current function is 43, in CommandHandler/Models dispatch) so this
# rule can never fail the build on its own. A follow-up can lower `error` and drive
# down the ~5 functions above 20 once there's appetite for those rewrites.
cyclomatic_complexity:
  warning: 10
  error: 200
  ignores_case_statements: false

large_tuple:
  warning: 3
  error: 4

# Reporter type (xcode, json, csv, checkstyle, codeclimate, junit, html, emoji, sonarqube, markdown, github-actions-logging)
reporter: "xcode"

# A logical query value must be passed to URLComponents/URLQueryItem. The
# urlQueryAllowed character set permits query delimiters such as `&` and `=`,
# allowing manual encoding to split one value into multiple fields.
custom_rules:
  no_manual_url_query_value_encoding:
    regex: 'addingPercentEncoding\s*\(\s*withAllowedCharacters\s*:\s*(?:\.|CharacterSet\s*\.)urlQueryAllowed\s*\)'
    message: "Use URLComponents and URLQueryItem for query values instead of .urlQueryAllowed."
    severity: error

# Test targets file-disable the fail-fast crash rules (force-unwrap/force-try are
# idiomatic in fixtures). Allow those rules to be blanket-disabled without tripping
# blanket_disable_command; every other rule still requires scoped this/next/previous.
blanket_disable_command:
  allowed_rules:
    - force_unwrapping
    - force_try
