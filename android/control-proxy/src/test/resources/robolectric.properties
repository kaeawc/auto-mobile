# Default SDK for Robolectric tests without @Config(sdk = ...). The prototype screenshot tests need
# merged resources (isIncludeAndroidResources), which hand Robolectric the merged manifest: without
# this pin every unconfigured test would move from the no-manifest default (23) to targetSdk 36.
# 23 is below minSdk, which the merged manifest rejects, so pin the nearest level, minSdk 24.
sdk=24
