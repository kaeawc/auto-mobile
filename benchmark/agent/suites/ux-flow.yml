# Navigate the Playground's three-screen UX exploration flow from the Demo Index.
# Exercises finding an entry point on a list screen and multi-step navigation.
name: ux-flow
platform: android
prompt: ../prompts/ux-flow.md
app:
  packageName: dev.jasonpearson.automobile.playground
preflight:
  clearAppData: true
  sharedPreferences:
    onboarding_prefs:
      onboarding_completed: true
    auth_prefs:
      is_authenticated: true
      user_id: agent-benchmark
      display_name: Agent Benchmark
  launchUri: automobile:playground/demos
claude:
  maxBudgetUsd: 2
  timeoutSeconds: 600
verify:
  answerIncludes:
    - "SUMMARY_STEP: Step 3: Summary and completion"
  screenIncludes:
    - "UX Flow: Summary"
    - "Step 3: Summary and completion."
