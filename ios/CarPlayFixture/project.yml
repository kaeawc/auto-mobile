name: CarPlayFixture
options:
  bundleIdPrefix: dev.jasonpearson.automobile
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5"
    CODE_SIGNING_ALLOWED: NO
packages:
  AutoMobileHighlightCore:
    path: ../highlight-core
  AutoMobileSDK:
    path: ../auto-mobile-sdk
  AutoMobileSdkWire:
    path: ../sdk-wire
targets:
  CarPlayFixture:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: AutoMobileSDK
      - package: AutoMobileSdkWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.CarPlayFixture
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: CarPlayFixture.entitlements
        GENERATE_INFOPLIST_FILE: NO
schemes:
  CarPlayFixture:
    build:
      targets:
        CarPlayFixture: all
    run:
      config: Debug
