name: Playground
options:
  bundleIdPrefix: dev.jasonpearson.automobile
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5"

packages:
  AutoMobileSDK:
    path: ../auto-mobile-sdk

targets:
  Playground:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "*.xcassets"
      - path: Sources/Theme
      - path: Sources/Assets.xcassets
        type: folder
    dependencies:
      - package: AutoMobileSDK
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.Playground
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  PlaygroundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - FilesPickerProbeUITests
    dependencies:
      - target: Playground
      - package: AutoMobileSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.PlaygroundTests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Playground.app/Playground"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PlaygroundFilesPickerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FilesPickerProbeUITests
    dependencies:
      - target: Playground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.PlaygroundFilesPickerUITests
        TEST_TARGET_NAME: Playground
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Playground:
    build:
      targets:
        Playground: all
        PlaygroundTests: [test]
        PlaygroundFilesPickerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlaygroundTests
        - PlaygroundFilesPickerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
