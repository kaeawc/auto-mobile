---
name: dual-device-critical-section
description: Two-device test using criticalSection for inter-device coordination
devices:
  - A
  - B
steps:
  - tool: launchApp
    device: A
    params:
      appId: com.example.chat
    label: Launch chat app on device A

  - tool: launchApp
    device: B
    params:
      appId: com.example.chat
    label: Launch chat app on device B

  # Per-device criticalSection steps that share a lock name. The coordinator
  # synchronizes both devices at the barrier (deviceCount: 2) before either
  # executes its sub-steps.
  - tool: criticalSection
    device: A
    params:
      lock: chat-sync
      deviceCount: 2
      steps:
        - tool: inputText
          params:
            device: A
            text: Hello from Device A
    label: Device A sends message

  - tool: criticalSection
    device: B
    params:
      lock: chat-sync
      deviceCount: 2
      steps:
        - tool: observe
          params:
            device: B
    label: Device B observes incoming message

  - tool: terminateApp
    device: A
    params:
      appId: com.example.chat
    label: Terminate app on device A

  - tool: terminateApp
    device: B
    params:
      appId: com.example.chat
    label: Terminate app on device B
