---
name: redaction-plan
description: Plan carrying a sensitive parameter, used by the redaction unit tests
secretParameters:
  - SECRET_TOKEN
steps:
  - tool: launchApp
    appId: com.example.app
    label: Launch app
  - tool: inputText
    text: "${SECRET_TOKEN}"
    label: Enter the secret token
  - tool: tapOn
    text: "${ENVIRONMENT}"
    label: Tap the environment control
