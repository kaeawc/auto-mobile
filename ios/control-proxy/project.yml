name: CtrlProxy
options:
  bundleIdPrefix: dev.jasonpearson.automobile
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CtrlProxyApp:
    type: application
    platform: iOS
    sources:
      - path: CtrlProxyApp
        excludes:
          - "*.xcassets"
      - path: CtrlProxyApp/Assets.xcassets
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy
        INFOPLIST_FILE: CtrlProxyApp/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CtrlProxy
        embed: true
      - target: ObjCExceptionCatcher
        embed: true

  ObjCExceptionCatcher:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ObjCExceptionCatcher/ObjCExceptionCatcher.m
      - path: Sources/ObjCExceptionCatcher/include/ObjCExceptionCatcher.h
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.objcexceptioncatcher
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CtrlProxy:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CtrlProxy
    dependencies:
      - target: ObjCExceptionCatcher
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.framework
        DEFINES_MODULE: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CtrlProxyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CtrlProxyTests
    dependencies:
      - target: CtrlProxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  # The production XCUITest runner. As of Phase 7C it compiles the Swift-6 rewrite
  # (`Sources/CtrlProxyRewrite`) rather than the reference (`Sources/CtrlProxy`) — the
  # target name, runner app (`CtrlProxyUITests-Runner.app`), xctest bundle, and
  # `-only-testing:CtrlProxyUITests/CtrlProxyUITests/testRunService` identifier are kept
  # so the TS MCP integration + scripts drive it unchanged. The reference impl stays
  # buildable as the differential-parity oracle via the SwiftPM `CtrlProxy` library +
  # `CtrlProxyRewriteTests` (it just no longer backs an on-device runner).
  CtrlProxyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CtrlProxyUITests
      # Compile the rewrite sources directly so XCTest/XCUIApplication are available to
      # the `@MainActor` UI domain (the `#if canImport(XCTest) && os(iOS)` bodies).
      - path: Sources/CtrlProxyRewrite
    dependencies:
      - target: CtrlProxyApp
        # Note: We don't depend on a CtrlProxy framework - sources are compiled directly
        # into the UI tests to give XCTest access for XCUIApplication.
      # Must embed: the xctest bundle is loaded from CtrlProxyUITests-Runner.app, a
      # different bundle from CtrlProxyApp.app, so @rpath cannot reach the copy the
      # app embeds. Without this the runner dies at dlopen with
      # "Library not loaded: @rpath/ObjCExceptionCatcher.framework".
      - target: ObjCExceptionCatcher
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.uitests
        TEST_TARGET_NAME: CtrlProxyApp
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # Match the SPM CtrlProxyRewrite target's contract exactly: Swift 6 language
        # mode with complete strict-concurrency (the project base is Swift 5 /
        # `targeted`), and the iOS 17 platform floor the rewrite is built against
        # (`OSAllocatedUnfairLock` etc.) so `CLANG_WARN_UNGUARDED_AVAILABILITY`
        # doesn't flag 16/17-only APIs the project's 15.0 default would reject.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  CtrlProxyApp:
    build:
      targets:
        CtrlProxyApp: all
        CtrlProxy: all
        ObjCExceptionCatcher: all
        CtrlProxyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CtrlProxyTests
        - CtrlProxyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
