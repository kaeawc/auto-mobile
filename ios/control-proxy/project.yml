name: CtrlProxy
options:
  bundleIdPrefix: dev.jasonpearson.automobile
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

# The runner compiles Sources/CtrlProxy directly, so it takes the shared wire models as a local package
# (the same one the SwiftPM CtrlProxy target and the SDK depend on).
packages:
  AutoMobileSdkWire:
    path: ../sdk-wire

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SDKROOT: iphoneos

targets:
  AutoMobileTest:
    type: application
    platform: iOS
    sources:
      - path: AutoMobileTest
        excludes:
          - "*.xcassets"
      - path: AutoMobileTest/Assets.xcassets
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy
        INFOPLIST_FILE: AutoMobileTest/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      # The app is only the UI-test host and constructs nothing, so it needs no proxy framework embedded.
      - target: ObjCExceptionCatcher
        embed: true

  ObjCExceptionCatcher:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ObjCExceptionCatcher/ObjCExceptionCatcher.m
      - path: Sources/ObjCExceptionCatcher/include/ObjCExceptionCatcher.h
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.objcexceptioncatcher
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  # The production XCUITest runner. It compiles the Swift-6 implementation (`Sources/CtrlProxy`)
  # directly. The target name, runner app (`CtrlProxyUITests-Runner.app`), xctest bundle, and
  # `-only-testing:CtrlProxyUITests/CtrlProxyUITests/testRunService` identifier are the stable
  # contract the TS MCP integration + scripts drive. `CtrlProxy` is the sole implementation target.
  CtrlProxyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CtrlProxyUITests
      # Share the self-contained SwiftPM loopback suite with the UI-test bundle.
      - path: Tests/CtrlProxyTests/WebSocketServerLoopbackTests.swift
      - path: Tests/CtrlProxyTests/WebSocketLoopbackClient.swift
      # Share the pure caret-move classifier with the UI-test bundle.
      - path: Tests/CtrlProxyTests/CaretMovePressClassification.swift
      # Compile the implementation sources directly so XCTest/XCUIApplication are available to
      # the `@MainActor` UI domain (the `#if canImport(XCTest) && os(iOS)` bodies).
      - path: Sources/CtrlProxy
    dependencies:
      - target: AutoMobileTest
        # Note: We don't depend on a CtrlProxy framework - sources are compiled directly
        # into the UI tests to give XCTest access for XCUIApplication.
      # Must embed: the xctest bundle is loaded from CtrlProxyUITests-Runner.app, a
      # different bundle from AutoMobileTest.app, so @rpath cannot reach the copy the
      # app embeds. Without this the runner dies at dlopen with
      # "Library not loaded: @rpath/ObjCExceptionCatcher.framework".
      - target: ObjCExceptionCatcher
        embed: true
      - package: AutoMobileSdkWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.uitests
        TEST_TARGET_NAME: AutoMobileTest
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # Match the SPM CtrlProxy target's contract exactly: Swift 6 language
        # mode with complete strict-concurrency (the project base is Swift 5 /
        # `targeted`), and the iOS 17 platform floor the implementation is built against
        # (`OSAllocatedUnfairLock` etc.) so `CLANG_WARN_UNGUARDED_AVAILABILITY`
        # doesn't flag 16/17-only APIs.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  AutoMobileTVTest:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoMobileTVTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.tv
        INFOPLIST_FILE: AutoMobileTVTest/Info.plist
        CODE_SIGN_STYLE: Automatic

  CtrlProxyTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CtrlProxyTVUITests
      # Explicit transport and wire-model subset; never compile all of Sources/CtrlProxy.
      - path: Sources/CtrlProxy/ByteChannel.swift
      - path: Sources/CtrlProxy/ByteChannelState.swift
      - path: Sources/CtrlProxy/NWByteChannel.swift
      - path: Sources/CtrlProxy/ConnectionRegistry.swift
      - path: Sources/CtrlProxy/Data+SHA1.swift
      - path: Sources/CtrlProxy/WebSocketConnection.swift
      - path: Sources/CtrlProxy/WebSocketFraming.swift
      - path: Sources/CtrlProxy/WebSocketResponding.swift
      - path: Sources/CtrlProxy/SdkEventBuffer.swift
      - path: Sources/CtrlProxy/RangeReplaceableCollection+MaxSizeEnforcement.swift
      - path: Sources/CtrlProxy/CommandError.swift
      - path: Sources/CtrlProxy/Models/CommandPayload.swift
      - path: Sources/CtrlProxy/Models/RequestHierarchy.swift
      - path: Sources/CtrlProxy/Models/RequestPressButton.swift
      - path: Sources/CtrlProxy/Models/WebSocketResponse.swift
      - path: Sources/CtrlProxy/Models/HierarchyUpdateResponse.swift
      - path: Sources/CtrlProxy/Models/ViewHierarchy.swift
      - path: Sources/CtrlProxy/Models/UIElementInfo.swift
      - path: Sources/CtrlProxy/Models/ElementBounds.swift
      - path: Sources/CtrlProxy/Models/WindowInfo.swift
      - path: Sources/CtrlProxy/Models/SemanticLink.swift
      - path: Sources/CtrlProxy/Models/ObservationInsetsInfo.swift
      - path: Sources/CtrlProxy/Models/EdgeInsetsInfo.swift
      - path: Sources/CtrlProxy/Models/DisplayCutoutInfo.swift
      - path: Sources/CtrlProxy/Models/SystemChromeInfo.swift
      - path: Sources/CtrlProxy/Models/PerfTiming.swift
      - path: Sources/CtrlProxy/Models/TapDiagnostics.swift
    dependencies:
      - target: AutoMobileTVTest
      - package: AutoMobileSdkWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.tv.uitests
        TEST_TARGET_NAME: AutoMobileTVTest
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  CtrlProxyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CtrlProxyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.watch
        INFOPLIST_FILE: CtrlProxyWatch/Info.plist
        CODE_SIGN_STYLE: Automatic

  CtrlProxyWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/CtrlProxyWatch
      - path: Tests/CtrlProxyWatchUITests
    dependencies:
      - target: CtrlProxyWatch
      - package: AutoMobileSdkWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.watch.uitests
        TEST_TARGET_NAME: CtrlProxyWatch
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  AutoMobileTest:
    build:
      targets:
        AutoMobileTest: all
        ObjCExceptionCatcher: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CtrlProxyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  AutoMobileTVTest:
    build:
      targets:
        AutoMobileTVTest: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CtrlProxyTVUITests
  CtrlProxyWatch:
    build:
      targets:
        CtrlProxyWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CtrlProxyWatchUITests
