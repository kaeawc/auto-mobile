name: CtrlProxy
options:
  bundleIdPrefix: dev.jasonpearson.automobile
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CtrlProxyApp:
    type: application
    platform: iOS
    sources:
      - path: CtrlProxyApp
        excludes:
          - "*.xcassets"
      - path: CtrlProxyApp/Assets.xcassets
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy
        INFOPLIST_FILE: CtrlProxyApp/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CtrlProxy
        embed: true
      - target: ObjCExceptionCatcher
        embed: true

  ObjCExceptionCatcher:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ObjCExceptionCatcher/ObjCExceptionCatcher.m
      - path: Sources/ObjCExceptionCatcher/include/ObjCExceptionCatcher.h
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.objcexceptioncatcher
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CtrlProxy:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CtrlProxy
    dependencies:
      - target: ObjCExceptionCatcher
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.framework
        DEFINES_MODULE: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CtrlProxyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CtrlProxyTests
    dependencies:
      - target: CtrlProxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CtrlProxyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CtrlProxyUITests
      # Include CtrlProxy sources directly so XCTest is available during compilation
      - path: Sources/CtrlProxy
        excludes:
          - "Fakes.swift"  # Exclude test-only fakes
    dependencies:
      - target: CtrlProxyApp
        # Note: We don't depend on CtrlProxy framework - sources are compiled directly into UI tests
        # to give XCTest access for XCUIApplication
      # Must embed: the xctest bundle is loaded from CtrlProxyUITests-Runner.app, a
      # different bundle from CtrlProxyApp.app, so @rpath cannot reach the copy the
      # app embeds. Without this the runner dies at dlopen with
      # "Library not loaded: @rpath/ObjCExceptionCatcher.framework".
      - target: ObjCExceptionCatcher
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.uitests
        TEST_TARGET_NAME: CtrlProxyApp
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CtrlProxyApp:
    build:
      targets:
        CtrlProxyApp: all
        CtrlProxy: all
        ObjCExceptionCatcher: all
        CtrlProxyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CtrlProxyTests
        - CtrlProxyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
