name: CtrlProxy
options:
  bundleIdPrefix: dev.jasonpearson.automobile
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CtrlProxyApp:
    type: application
    platform: iOS
    sources:
      - path: CtrlProxyApp
        excludes:
          - "*.xcassets"
      - path: CtrlProxyApp/Assets.xcassets
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy
        INFOPLIST_FILE: CtrlProxyApp/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CtrlProxy
        embed: true
      - target: ObjCExceptionCatcher
        embed: true

  ObjCExceptionCatcher:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ObjCExceptionCatcher/ObjCExceptionCatcher.m
      - path: Sources/ObjCExceptionCatcher/include/ObjCExceptionCatcher.h
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.objcexceptioncatcher
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CtrlProxy:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CtrlProxy
    dependencies:
      - target: ObjCExceptionCatcher
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.framework
        DEFINES_MODULE: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CtrlProxyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CtrlProxyTests
    dependencies:
      - target: CtrlProxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CtrlProxyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CtrlProxyUITests
      # Include CtrlProxy sources directly so XCTest is available during compilation
      - path: Sources/CtrlProxy
        excludes:
          - "Fakes.swift"  # Exclude test-only fakes
    dependencies:
      - target: CtrlProxyApp
        # Note: We don't depend on CtrlProxy framework - sources are compiled directly into UI tests
        # to give XCTest access for XCUIApplication
      # Must embed: the xctest bundle is loaded from CtrlProxyUITests-Runner.app, a
      # different bundle from CtrlProxyApp.app, so @rpath cannot reach the copy the
      # app embeds. Without this the runner dies at dlopen with
      # "Library not loaded: @rpath/ObjCExceptionCatcher.framework".
      - target: ObjCExceptionCatcher
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.uitests
        TEST_TARGET_NAME: CtrlProxyApp
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  # Swift-6 concurrency-clean rewrite runner (Phase 7 cutover, additive).
  # Compiles Sources/CtrlProxyRewrite directly into a UI-test bundle — the first
  # target in which the `#if canImport(XCTest) && os(iOS)` `@MainActor` bodies build.
  # The reference `CtrlProxyUITests` target is left intact as the behavioral oracle
  # until the rewrite's UI-test smoke passes on a simulator (STATUS §9 step 3).
  CtrlProxyRewriteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CtrlProxyRewriteUITests
      - path: Sources/CtrlProxyRewrite
    dependencies:
      - target: CtrlProxyApp
      # Same @rpath reasoning as CtrlProxyUITests: the xctest bundle loads from a
      # separate Runner.app, so it must embed its own copy of ObjCExceptionCatcher.
      - target: ObjCExceptionCatcher
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jasonpearson.automobile.ctrlproxy.rewriteuitests
        TEST_TARGET_NAME: CtrlProxyApp
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # Match the SPM CtrlProxyRewrite target's contract exactly: Swift 6 language
        # mode with complete strict-concurrency (the project base is Swift 5 /
        # `targeted`), and the iOS 17 platform floor the rewrite is built against
        # (`OSAllocatedUnfairLock` etc.) so `CLANG_WARN_UNGUARDED_AVAILABILITY`
        # doesn't flag 16/17-only APIs the project's 15.0 default would reject.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  CtrlProxyApp:
    build:
      targets:
        CtrlProxyApp: all
        CtrlProxy: all
        ObjCExceptionCatcher: all
        CtrlProxyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CtrlProxyTests
        - CtrlProxyUITests
        - CtrlProxyRewriteUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
