# pip3 install mkdocs mkdocs-material
# mkdocs serve
# mkdocs gh-deploy

site_name: AutoMobile
repo_name: AutoMobile
repo_url: https://github.com/kaeawc/auto-mobile
site_description: "Mobile interaction automation"
site_author: Jason Pearson
remote_branch: gh-pages
use_directory_urls: true

copyright: "Copyright &copy; 2025-2026 Jason Pearson"

plugins:
  - search
  - mermaid2:
      version: 10.0.2

theme:
  name: "material"
  favicon: img/favicon.ico
  logo: img/auto_mobile_sticker_splash.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "white"
      accent: "green"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "black"
      accent: "green"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: "Shantell Sans"
    code: "Fira Code"
  features:
    - content.code.copy
    - content.code.select
    - content.tabs.link

extra_css:
  - assets/stylesheets/automobile-brand.css

extra_javascript:
  - assets/javascripts/prompt-form.js

markdown_extensions:
  - smarty
  - codehilite:
      guess_lang: false
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      # Auto-link bare `#NNNN` issue/PR references (and commit hashes) to this
      # repo in the rendered docs, so committed Markdown can keep the clean bare
      # form while readers still get clickable links. Pairs with the AGENTS.md /
      # CLAUDE.md rule that exempts Markdown files from explicit links.
      repo_url_shorthand: true
      user: kaeawc
      repo: auto-mobile
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.emoji
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

# Author/design docs kept in the repo but intentionally off the site nav. They
# are still built (so in-repo links resolve) but hidden from navigation.
not_in_nav: |
  /design-docs/mcp/daemon/screen-control-mapping.md
  /design-docs/plat/android/system-tray-lookfor.md
  /design-docs/plat/android/accessibility-data-sensitive-windows.md
  /release/ios-simulator-continuity.md
  /design-docs/plat/ios/xctestrunner/ci-integration.md
  /decisions/ios-user-files-provider.md

nav:
  - "Overview": index.md
  - "Tools": tools.md
  - "Using AutoMobile":
      - "Agent Examples": using/agent-examples.md
      - "UI tests": using/ui-tests.md
      - "Test prep tools": using/test-prep-tools.md
      - "Dynamic Tools": using/dynamic-tools.md
      - "Environment variables": using/environment-variables.md
      - "Screen control": using/screen-control.md
      - "WebRTC Streaming": webrtc-streaming.md
  - "How it Works":
      - "System design": design-docs/index.md
      - "Runtime dependency pinning": design-docs/release/runtime-dependency-pinning.md
      - "Interaction loop": design-docs/mcp/interaction-loop.md
      - "Daemon": design-docs/mcp/daemon.md
      - "Test runners": design-docs/plat/android/junit-runner/index.md
      - "Desktop App": design-docs/plat/android/desktop-app.md
  - "Contributing": contributing.md
  - "Usage Data": metrics/usage-data.md
  - "FAQ": faq.md
