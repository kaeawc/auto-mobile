  - mermaid2:
      version: 10.0.2

theme:
  name: "material"
  custom_dir: overrides
  favicon: img/favicon.ico
  logo: img/auto_mobile_sticker_splash.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "white"
      accent: "green"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "black"
      accent: "green"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: "Shantell Sans"
    code: "Fira Code"
  features:
    - content.code.copy
    - content.code.select
    - content.tabs.link

extra_css:
  - assets/stylesheets/automobile-brand.css
  - assets/stylesheets/usage-data.css

extra_javascript:
  - assets/javascripts/prompt-form.js
  - assets/javascripts/usage-data.js

markdown_extensions:
  - smarty
  - codehilite:
      guess_lang: false
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      # Auto-link bare `#NNNN` issue/PR references (and commit hashes) to this
      # repo in the rendered docs, so committed Markdown can keep the clean bare
      # form while readers still get clickable links. Pairs with the AGENTS.md /
      # CLAUDE.md rule that exempts Markdown files from explicit links.
      repo_url_shorthand: true
      user: kaeawc
      repo: auto-mobile
  - pymdownx.smartsymbols:
      # Fractions turned "1/2/4 concurrent" and "phase-1/2" into "½/4" and
      # "phase-½" on the site; GitHub shows the source as written.
      fractions: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.emoji
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

# Author/design docs kept in the repo but intentionally off the site nav. They
# are still built (so in-repo links resolve) but hidden from navigation.
