# pip3 install mkdocs mkdocs-material
# mkdocs serve
# mkdocs gh-deploy

site_name: AutoMobile
repo_name: AutoMobile
repo_url: https://github.com/kaeawc/auto-mobile
site_url: https://kaeawc.github.io/auto-mobile/
site_description: "Mobile interaction automation"
site_author: Jason Pearson
remote_branch: gh-pages
use_directory_urls: true

copyright: "Copyright &copy; 2025-2026 Jason Pearson"

# Pages under docs/ must also render on github.com, so they use GitHub syntax
# (e.g. `> [!NOTE]` alerts) that this hook turns into Material equivalents.
# scripts/validate_docs_github_markdown.sh rejects MkDocs-only syntax by
# rendering each page with and without the MkDocs-only extensions below.
hooks:
  - scripts/github/auto_mobile_docs/github_alerts.py
  # Keep headings readable on GitHub and restore Material tabs on the site.
  - scripts/github/auto_mobile_docs/content_tabs.py

